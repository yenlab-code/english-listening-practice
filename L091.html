<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>

.588},"C":{"text":"Oh, I want to learn to drive.","letterAudio":"9756927a5f3791737934.mp3","audio":"c12cd89fcc515a3301fa.mp3","zh":"噢，我想學開車。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"A沒有直接說 Yes，但說媽媽每天開車載自己上學，可知媽媽會開車。","zhCorrect":"bb2b966d5a74141195d2.mp3","enText":"The answer is A. Well, she drives me to school every day. Someone asks if your mom knows how to drive. The best reply is, Well, she drives me to school every day. This means your mom can drive.","enAudio":"701c146daa6445bb1bca.mp3","wrong":{"B":{"text":"B說媽媽的車是紅色的，只接著 mom，說的是車子的顏色，沒有回答媽媽會不會開車。","audio":"0456e4cdad6407532bf0.mp3"},"C":{"text":"C說自己想學開車，只接著 drive，談自己的事，沒有回答問題。","audio":"6e7befd506affe8d0291.mp3"}}},{"id":"L091-Q06","type":"基本問答","point":"鼓勵／回應消息","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號8 grandmother / grandma；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號54 learn、57 start；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號91 read、82 say；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號42 live；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號45 like；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號41 story","difficulty":"易","numberAudio":"b01412f85694bf7dd6b1.mp3","passage":[{"speaker":null,"text":"My grandma is learning to read. She started at seventy!","audio":"b27d4921553ec215496b.mp3","zh":"我奶奶（外婆）在學認字。她七十歲才開始學！"}],"question":null,"options":{"A":{"text":"My grandma lives in Hualien.","letterAudio":"93138ad65b3704914636.mp3","audio":"0cf8a50c1508c0f4acd7.mp3","zh":"我奶奶（外婆）住在花蓮。","letterEnd":0.537},"B":{"text":"Wow, that's amazing. Tell her I said good luck.","letterAudio":"609555d8760f27caf21b.mp3","audio":"1dce049a45fb889eb12c.mp3","zh":"哇，真了不起。幫我跟她說祝她好運。","letterEnd":0.588},"C":{"text":"I read a lot. I like stories.","letterAudio":"9756927a5f3791737934.mp3","audio":"25b262ac3c3a9cf254ce.mp3","zh":"我讀很多書。我喜歡故事。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"對方說奶奶（外婆）七十歲才開始學認字；B說真了不起，請對方替自己祝她好運，是回應好消息的說法。","zhCorrect":"b8ea6f685d3fd981e1be.mp3","enText":"The answer is B. Wow, that's amazing. Tell her I said good luck. Someone's grandma is learning to read, and she started at seventy. The best reply is, Wow, that's amazing. Tell her I said good luck. This reply shows you are happy for this person's grandma.","enAudio":"4f8dd1734be55a48b8cc.mp3","wrong":{"A":{"text":"A說自己的奶奶（外婆）住在花蓮，只接著 grandma，談自己的家人，沒有回應對方的消息。","audio":"eb7c2188fe69a1deee73.mp3"},"C":{"text":"C說自己讀很多書、喜歡故事，由 read 聯想到讀書，談自己的事，沒有回應對方的消息。","audio":"4a8fd677638f0c1cef2c.mp3"}}},{"id":"L091-Q07","type":"基本問答","point":"資訊詢問","unit":"U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號10 hand；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號48 write、58 cold；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號75 left；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family","difficulty":"易","numberAudio":"e0d26bc8f9a996557d6a.mp3","passage":[{"speaker":null,"text":"Which hand do you write with?","audio":"f7071f0e86b397ac203b.mp3","zh":"你用哪一隻手寫字？"}],"question":null,"options":{"A":{"text":"My left hand. I'm the only one in my family.","letterAudio":"93138ad65b3704914636.mp3","audio":"61adfbf86d6b17ce8261.mp3","zh":"左手。我是我們家唯一用左手的。","letterEnd":0.537},"B":{"text":"Well, I write in my diary every night.","letterAudio":"609555d8760f27caf21b.mp3","audio":"9f645ed96b24d6861ad5.mp3","zh":"嗯，我每天晚上都寫日記。","letterEnd":0.588},"C":{"text":"My hands are cold. It's winter.","letterAudio":"9756927a5f3791737934.mp3","audio":"7c46b90174fb05f6a1a3.mp3","zh":"我的手好冷。現在是冬天。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"對方問自己用哪一隻手寫字；A說用左手，還說自己是家裡唯一一個，回答了問題。","zhCorrect":"c3a68be9446a83ea0616.mp3","enText":"The answer is A. My left hand. I'm the only one in my family. Someone asks which hand you write with. The best reply is, My left hand. I'm the only one in my family. This reply names the hand.","enAudio":"4c432380c89a879af77c.mp3","wrong":{"B":{"text":"B說自己每天晚上寫日記，只接著 write，沒有說用哪一隻手寫字。","audio":"e9f95c41981140719f0e.mp3"},"C":{"text":"C說自己的手很冷、現在是冬天，只接著 hand，沒有說用哪一隻手寫字。","audio":"44efc33cb68785104c5f.mp3"}}},{"id":"L091-Q08","type":"基本問答","point":"接受／拒絕","unit":"U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號54 show；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號1 station、16 river；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號123 very；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號110 old；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號83 walk；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號45 like；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號77 along","difficulty":"中","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"Do you want me to show you a shortcut to the station? It's faster.","audio":"5c978ade04f4dc12d6a1.mp3","zh":"要不要我帶你走一條去車站的捷徑？比較快。"}],"question":null,"options":{"A":{"text":"The station is very old. It's a hundred years old.","letterAudio":"93138ad65b3704914636.mp3","audio":"9438ff75e13e52e63418.mp3","zh":"那個車站很舊。它有一百年了。","letterEnd":0.537},"B":{"text":"Well, my brother walks faster than me.","letterAudio":"609555d8760f27caf21b.mp3","audio":"dd27724d401edb03778a.mp3","zh":"嗯，我哥哥（弟弟）走得比我快。","letterEnd":0.588},"C":{"text":"Oh, no, thanks. I like walking along the river.","letterAudio":"9756927a5f3791737934.mp3","audio":"1c5334a77fe99bce04a0.mp3","zh":"噢，不用了，謝謝。我喜歡沿著河邊走。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"對方問要不要帶自己走去車站的捷徑；C說不用了，謝謝，自己喜歡沿著河邊走，是婉拒提議的說法。","zhCorrect":"26a9d02116422bcd1313.mp3","enText":"The answer is C. Oh, no, thanks. I like walking along the river. Someone offers to show you a shortcut to the station, because it's faster. The best reply is, Oh, no, thanks. I like walking along the river. This reply says no to the offer and gives a reason.","enAudio":"afc2fa6ca9e1cecaffb4.mp3","wrong":{"A":{"text":"A說車站很舊、有一百年了，只接著 station，沒有回應對方的提議。","audio":"d60c2bbd99f7be44888a.mp3"},"B":{"text":"B說自己的哥哥（弟弟）走得比自己快，只接著 faster，沒有回應對方的提議。","audio":"f55f780567f5fac727cd.mp3"}}},{"id":"L091-Q09","type":"言談理解","point":"明確訊息","unit":"U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號45 smell；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號22 cook；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號11 noodle；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號47 teach；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號32 dinner；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號8 grandmother / grandma；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take","difficulty":"易","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"It smells so good! What are you cooking?","audio":"76451cedfe871ab02f71.mp3","zh":"女孩：好香喔！你在煮什麼？"},{"speaker":"Boy","text":"Tomato and egg noodles. My dad taught me last week.","audio":"ba33c3d52e493656865a.mp3","zh":"男孩：番茄炒蛋麵。我爸爸上星期教我的。"},{"speaker":"Girl","text":"Is it for your dinner?","audio":"daace0a3e69d9634d92d.mp3","zh":"女孩：是你的晚餐嗎？"},{"speaker":"Boy","text":"No, it's for my grandma. She has a cold, so I'm taking it to her apartment upstairs.","audio":"823859a4097d7de89c0e.mp3","zh":"男孩：不是，是要給我奶奶（外婆）的。她感冒了，所以我要拿到她樓上的公寓。"}],"question":{"text":"Who is the boy cooking the noodles for?","audio":"c36ac0a8db4b67276439.mp3","zh":"男孩煮麵是要給誰吃的？"},"options":{"A":{"text":"His dad.","letterAudio":"93138ad65b3704914636.mp3","audio":"050a1c95f773b8ab8ae3.mp3","zh":"他爸爸。","letterEnd":0.537},"B":{"text":"His grandma.","letterAudio":"609555d8760f27caf21b.mp3","audio":"3fe6361b6e52fe7fd139.mp3","zh":"他奶奶（外婆）。","letterEnd":0.588},"C":{"text":"Himself.","letterAudio":"9756927a5f3791737934.mp3","audio":"ef323256b36579486a19.mp3","zh":"他自己。","letterEnd":0.713}},"answer":"B","keyLines":[3],"evidence":"男孩說「it's for my grandma」，因為奶奶（外婆）感冒了，所以他煮麵是要給奶奶（外婆）吃的。","zhCorrect":"ca9da9d543ac4d8b8355.mp3","enText":"The answer is B. His grandma. The boy's dad taught him to cook tomato and egg noodles last week. The noodles are not for the boy's dinner. The boy's grandma has a cold, so he is cooking the noodles for his grandma.","enAudio":"decd225313d41ff4ab4f.mp3","wrong":{"A":{"text":"A爸爸是上星期教男孩煮這道麵的人，不是吃麵的人。","audio":"b71e73b1ce30f169369c.mp3"},"C":{"text":"C女孩問是不是男孩自己的晚餐，男孩說不是。","audio":"a40242eda5b4ae021c83.mp3"}}},{"id":"L091-Q10","type":"言談理解","point":"明確訊息","unit":"U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get、51 eat；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號15 noon、21 group；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號17 student；U07｜核心單字「職業」｜教材印刷頁 p.134｜核心編號10 driver；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號84 wait","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good morning, everyone. We'll get to the Science Museum in about twenty minutes. Your lunch boxes are in the big box at the back of the bus, but please don't eat until noon. When we get there, each group leader will get the tickets from Ms. Chen and give one to every student in the group. Our driver, Mr. Lin, will wait for us in the parking lot. Please be back on the bus by three thirty.","audio":"bce3d2f2f05a6028df31.mp3","zh":"大家早安。我們大約二十分鐘後會到科學博物館。你們的午餐盒在車子後面的大箱子裡，不過中午以前請不要吃。到了以後，每一組的組長會向 Ms. Chen 拿票，再發一張給組裡的每個學生。我們的司機林先生會在停車場等我們。請在三點半以前回到車上。"}],"question":{"text":"Who will give the tickets to the students?","audio":"9d187144bddf6631628f.mp3","zh":"誰會把票發給學生？"},"options":{"A":{"text":"Ms. Chen.","letterAudio":"93138ad65b3704914636.mp3","audio":"466a22851cbed1663acb.mp3","zh":"Ms. Chen。","letterEnd":0.537},"B":{"text":"Mr. Lin.","letterAudio":"609555d8760f27caf21b.mp3","audio":"2b5efac150c706921983.mp3","zh":"林先生。","letterEnd":0.588},"C":{"text":"Each group leader.","letterAudio":"9756927a5f3791737934.mp3","audio":"d3d682c5b7b46d83f87e.mp3","zh":"每一組的組長。","letterEnd":0.713}},"answer":"C","keyLines":[0],"evidence":"廣播說「each group leader will get the tickets from Ms. Chen and give one to every student in the group」，所以把票發給學生的是每一組的組長。","zhCorrect":"3147ea8ef326b5e08763.mp3","enText":"The answer is C. Each group leader. When they get to the Science Museum, each group leader will get the tickets from Ms. Chen. Then each group leader will give one ticket to every student in the group. So each group leader will give the tickets to the students.","enAudio":"9deb2c92922a6eb2501b.mp3","wrong":{"A":{"text":"A Ms. Chen 是把票交給組長的人，不是直接發給學生的人。","audio":"96bd22f1496e9c7f3dc1.mp3"},"B":{"text":"B林先生是司機，他會在停車場等大家，沒有發票。","audio":"a1cd21e6d5dccbc8b4c1.mp3"}}},{"id":"L091-Q11","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號125 really、129 again；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號46 taste、47 feel；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號43 sick","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"Did you really eat a cricket at the science fair?","audio":"1a72f36ab1cbc882b6d2.mp3","zh":"女孩：你真的在科展吃了一隻蟋蟀？"},{"speaker":"Boy","text":"Two! They tasted like salty potato chips.","audio":"62967c3827b88aac9b3f.mp3","zh":"男孩：兩隻！吃起來像鹹鹹的洋芋片。"},{"speaker":"Girl","text":"Gross!","audio":"e227c489ca016b271e99.mp3","zh":"女孩：好噁心！"},{"speaker":"Boy","text":"I don't see why. They're good for you, and I'd eat them again.","audio":"4cf5bff22b1161ffd281.mp3","zh":"男孩：我不懂為什麼。牠們對身體好，我還會再吃。"}],"question":{"text":"What does the boy think about eating crickets?","audio":"077fa1ca924e9cb30dee.mp3","zh":"男孩覺得吃蟋蟀怎麼樣？"},"options":{"A":{"text":"It is gross to him.","letterAudio":"93138ad65b3704914636.mp3","audio":"a77a669124808b3d98e4.mp3","zh":"他覺得很噁心。","letterEnd":0.537},"B":{"text":"It made him feel sick.","letterAudio":"609555d8760f27caf21b.mp3","audio":"72a1a442580cd73196d3.mp3","zh":"吃了讓他不舒服。","letterEnd":0.588},"C":{"text":"It is not bad at all.","letterAudio":"9756927a5f3791737934.mp3","audio":"7287b853979e3413ef39.mp3","zh":"一點也不差。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說蟋蟀吃起來像鹹鹹的洋芋片、對身體好，還說會再吃，可見他覺得吃蟋蟀一點也不差。","zhCorrect":"7cc87e0539a9173e9d4e.mp3","enText":"The answer is C. It is not bad at all. The boy ate two crickets at the science fair. He says they tasted like salty potato chips. The girl thinks it is gross, but the boy says crickets are good for you, and he would eat them again. So the boy thinks eating crickets is not bad at all.","enAudio":"d630304bef6f7fb5412a.mp3","wrong":{"A":{"text":"A覺得噁心的是女孩，男孩說他不懂為什麼會噁心。","audio":"5cc018db4bb86dbbee9c.mp3"},"B":{"text":"B男孩沒有說吃了以後不舒服，還說會再吃。","audio":"0798c96af7a092be8ccb.mp3"}}},{"id":"L091-Q12","type":"言談理解","point":"明確訊息","unit":"U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take、61 ride、55 drive；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus、34 bicycle / bike；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號13 cousin；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號110 old；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號59 far；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Girl","text":"Are you still taking the bus to cram school?","audio":"e503f4b80a3fdea20ea1.mp3","zh":"女孩：你還是搭公車去補習班嗎？"},{"speaker":"Boy","text":"Not anymore. My cousin gave me his old bike, so I ride there now.","audio":"2545cf9499337530d1a6.mp3","zh":"男孩：不搭了。我表哥（堂哥）把他的舊腳踏車給我，所以我現在騎車去。"},{"speaker":"Girl","text":"Isn't it far?","audio":"c1f8aa2eb7da87811515.mp3","zh":"女孩：不會很遠嗎？"},{"speaker":"Boy","text":"Twenty minutes. It's faster than the bus in the evening because of the traffic. On rainy days, my mom drives me.","audio":"e5712ad2d9902f620639.mp3","zh":"男孩：二十分鐘。傍晚因為塞車，騎車比公車快。下雨天我媽媽會開車載我。"}],"question":{"text":"How does the boy usually get to cram school now?","audio":"2ccb87d4b7713e77aed9.mp3","zh":"男孩現在通常怎麼去補習班？"},"options":{"A":{"text":"By bike.","letterAudio":"93138ad65b3704914636.mp3","audio":"903dedfaa39693d580ab.mp3","zh":"騎腳踏車。","letterEnd":0.537},"B":{"text":"By bus.","letterAudio":"609555d8760f27caf21b.mp3","audio":"fd7c001be070171a6efc.mp3","zh":"搭公車。","letterEnd":0.588},"C":{"text":"By car.","letterAudio":"9756927a5f3791737934.mp3","audio":"dd8afdaf651906c4396a.mp3","zh":"坐車。","letterEnd":0.713}},"answer":"A","keyLines":[1],"evidence":"男孩說表哥（堂哥）把舊腳踏車給他，「so I ride there now」，所以他現在通常騎腳踏車去補習班。","zhCorrect":"ecf1679d126c8ed053a1.mp3","enText":"The answer is A. By bike. The boy doesn't take the bus to cram school anymore. His cousin gave him an old bike, so he rides there now. His mom drives him only on rainy days. So the boy usually gets to cram school by bike.","enAudio":"4512030561e3fc5ba1e7.mp3","wrong":{"B":{"text":"B搭公車是男孩以前的方式，他說現在不搭了。","audio":"66d65b38d3a0f4ceac3b.mp3"},"C":{"text":"C媽媽只有下雨天才開車載他，不是平常的方式。","audio":"ad91bef99fe972806766.mp3"}}},{"id":"L091-Q13","type":"言談理解","point":"情境／地點推論","unit":"U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號63 hot；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號100 some；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號7 pool；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號18 beach","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Woman","text":"Please take a shower first and put on a swimming cap.","audio":"dbb320268012566d03fb.mp3","zh":"女士：請先沖個澡，戴上泳帽。"},{"speaker":"Boy","text":"OK. Can I jump in?","audio":"f9b0174a86565965612f.mp3","zh":"男孩：好。我可以跳進去嗎？"},{"speaker":"Woman","text":"No. Get in slowly. The water is about forty degrees, so only stay in for fifteen minutes at a time.","audio":"20197cf7565df307ba4b.mp3","zh":"女士：不行。慢慢進去。水大約四十度，所以每次只能泡十五分鐘。"},{"speaker":"Boy","text":"That's hot!","audio":"f8e3ae3c64a4b1302db3.mp3","zh":"男孩：好燙！"},{"speaker":"Woman","text":"Yes. And drink some water when you come out.","audio":"7d8141ff48207c453982.mp3","zh":"女士：對。出來的時候要喝點水。"}],"question":{"text":"Where are they most likely?","audio":"c29fc0a63955a6b6afe5.mp3","zh":"他們最有可能在哪裡？"},"options":{"A":{"text":"At a swimming pool.","letterAudio":"93138ad65b3704914636.mp3","audio":"08d1ef36e6914d0eb60e.mp3","zh":"在游泳池。","letterEnd":0.537},"B":{"text":"At a hot spring.","letterAudio":"609555d8760f27caf21b.mp3","audio":"3484345e6faa3fd5ffb0.mp3","zh":"在溫泉。","letterEnd":0.588},"C":{"text":"At a beach.","letterAudio":"9756927a5f3791737934.mp3","audio":"f5995f1af3335d8831bb.mp3","zh":"在海邊。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女士說水大約四十度，每次只能泡十五分鐘，出來要喝水，男孩也說很燙，可知他們最有可能在溫泉。","zhCorrect":"21caafd89ae003dd0e21.mp3","enText":"The answer is B. At a hot spring. The woman asks the boy to take a shower first and put on a swimming cap. She says the water is about forty degrees, so he can only stay in for fifteen minutes at a time. The boy says the water is hot. So they are most likely at a hot spring.","enAudio":"da15825464f52005136a.mp3","wrong":{"A":{"text":"A由 swimming cap 聯想到游泳池，但水有四十度、每次只能泡十五分鐘，不是游泳池。","audio":"15ca2c030e6dd8041202.mp3"},"C":{"text":"C由 water 和 jump in 聯想到海邊，但女士要男孩先沖澡、戴泳帽，水又有四十度，不是海邊。","audio":"1b051b2d4d0e28ce2479.mp3"}}},{"id":"L091-Q14","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號95 go、82 say；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new、104 small；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號51 hear、40 order、48 write、47 teach；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號69 picture；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號113 also；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號26 way；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號22 cook；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號11 noodle；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Boy","text":"Did you go to the new noodle shop on Fifth Street?","audio":"ef78ecca5e04508b5049.mp3","zh":"男孩：你有去第五街那家新的麵店嗎？"},{"speaker":"Girl","text":"Yes! The servers there can't hear, so you order by pointing at pictures or writing on a small board.","audio":"32829f8785f9c012110f.mp3","zh":"女孩：有！那裡的服務生聽不到，所以要指著圖片或寫在小白板上點餐。"},{"speaker":"Boy","text":"Is it hard?","audio":"26a48a2f2af032022421.mp3","zh":"男孩：很難嗎？"},{"speaker":"Girl","text":"Not at all. They also taught us how to say thank you in sign language.","audio":"29185ec14d466861013c.mp3","zh":"女孩：一點也不。他們還教我們怎麼用手語說謝謝。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"A noodle shop with servers who can't hear.","letterAudio":"93138ad65b3704914636.mp3","audio":"002d0a689b87830b39fd.mp3","zh":"一家服務生聽不到的麵店。","letterEnd":0.537},"B":{"text":"The best way to cook noodles.","letterAudio":"609555d8760f27caf21b.mp3","audio":"06cbf606d399ff91ab01.mp3","zh":"煮麵的最好方法。","letterEnd":0.588},"C":{"text":"A sign language class at school.","letterAudio":"9756927a5f3791737934.mp3","audio":"3708e26457e607bddb24.mp3","zh":"學校的手語課。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"女孩說那家新麵店的服務生聽不到，客人要指圖片或寫字點餐，服務生還教她用手語說謝謝。整段在談一家服務生聽不到的麵店。","zhCorrect":"b8e31f35ed502567caee.mp3","enText":"The answer is A. A noodle shop with servers who can't hear. The girl went to the new noodle shop on Fifth Street. The servers there can't hear, so people order by pointing at pictures or writing on a small board. The servers also taught the girl how to say thank you in sign language. The girl and the boy are talking about a noodle shop with servers who can't hear.","enAudio":"30acbc7b923ef614518e.mp3","wrong":{"B":{"text":"B由 noodle 聯想到煮麵，但他們談的是在麵店點餐的方式。","audio":"d7575f66b240f3dd5af9.mp3"},"C":{"text":"C由 sign language 聯想到手語課，但教女孩手語的是麵店的服務生，不是學校的課。","audio":"45404b08125a2c61d1a6.mp3"}}},{"id":"L091-Q15","type":"言談理解","point":"語境猜義","unit":"U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號50 tonight；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號29 work、38 hour；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號60 until；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號62 late；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號24 money；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U06｜四、閱讀、註解與情境補充「情境題、創業故事與襪子種類」（教材頁118、120、125～單元末）｜overtime","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Boy","text":"Is your mom coming to the school play tonight?","audio":"8d48cf71f40a09600b32.mp3","zh":"男孩：你媽媽今晚會來看學校的話劇嗎？"},{"speaker":"Girl","text":"No. She has to work overtime this week. She doesn't get home until ten.","audio":"b48616a657b10a256c11.mp3","zh":"女孩：不會。她這個星期要 overtime（加班）。她十點才會到家。"},{"speaker":"Boy","text":"That's late. Does she get more money for it?","audio":"8e26ba6a2fa65d3ee518.mp3","zh":"男孩：好晚喔。她會因此拿到比較多錢嗎？"},{"speaker":"Girl","text":"Yes, a little more for each extra hour.","audio":"f5c2c5c31293f54964dc.mp3","zh":"女孩：會，每多做一個小時就多一點。"}],"question":{"text":"What does the girl mean by \"overtime\"?","audio":"1cb5aa8e8ea8a402a4c2.mp3","zh":"女孩說的 \"overtime\" 是什麼意思？"},"options":{"A":{"text":"Extra hours after the usual work time.","letterAudio":"93138ad65b3704914636.mp3","audio":"d84f126746d3b0b60ab7.mp3","zh":"超過平常工作時間的額外時數。","letterEnd":0.537},"B":{"text":"Work that is done at home.","letterAudio":"609555d8760f27caf21b.mp3","audio":"91d4d3f7c42376e25ded.mp3","zh":"在家裡做的工作。","letterEnd":0.588},"C":{"text":"Time off from work.","letterAudio":"9756927a5f3791737934.mp3","audio":"ef1b3f9b0a8fd9acf129.mp3","zh":"不用工作的休假時間。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"女孩說媽媽這星期要 work overtime，十點才到家，每多做一個小時就多拿一點錢，可知 overtime 是超過平常工作時間的額外時數，也就是加班。","zhCorrect":"bee8184bcc77b0265a43.mp3","enText":"The answer is A. Extra hours after the usual work time. The girl says her mom has to work overtime this week, and she doesn't get home until ten. She gets a little more money for each extra hour. So when the girl says overtime, she means extra hours after the usual work time.","enAudio":"0fb3849750c0bfaa18d0.mp3","wrong":{"B":{"text":"B媽媽十點才會到家，原文沒有說她在家工作。","audio":"59954b907e74f1f574ef.mp3"},"C":{"text":"C媽媽是工作到很晚，與「放假不用工作」相反。","audio":"89ff0f78c4c979830a84.mp3"}}},{"id":"L091-Q16","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號83 use、87 check；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號33 homework、29 work；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號48 write、54 learn；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號79 anything；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號16 teacher；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號113 also、114 only；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now、124 too；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號26 way；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small；U07｜核心單字「職業」｜教材印刷頁 p.134｜核心編號1 job；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Boy","text":"Do you use the AI app for your English homework?","audio":"bc4d6092e5bf4c5c701f.mp3","zh":"男孩：你寫英文作業的時候有用那個 AI app 嗎？"},{"speaker":"Girl","text":"I tried it. It writes nice sentences.","audio":"5815493c70738bace42d.mp3","zh":"女孩：我試過。它寫的句子很好。"},{"speaker":"Boy","text":"So it's great, right?","audio":"8d91b5514d98580bb9e9.mp3","zh":"男孩：所以它很棒，對吧？"},{"speaker":"Girl","text":"The problem is, I don't learn anything when it does the work. My teacher could also tell it wasn't my writing. Now I only use it to check my spelling.","audio":"fcb21025fc4a91f68de5.mp3","zh":"女孩：問題是，它幫我做的時候我什麼都沒學到。我的老師也看得出來那不是我寫的。現在我只用它來檢查拼字。"}],"question":{"text":"What does the girl think about the AI app?","audio":"4d566a97f70c96ea8ad0.mp3","zh":"女孩覺得那個 AI app 怎麼樣？"},"options":{"A":{"text":"It is the best way to do homework.","letterAudio":"93138ad65b3704914636.mp3","audio":"bd6f9097ae3d0216c136.mp3","zh":"它是寫作業最好的方法。","letterEnd":0.537},"B":{"text":"It is only good for small jobs.","letterAudio":"609555d8760f27caf21b.mp3","audio":"068d06ed2a3904f281e5.mp3","zh":"它只適合做小事情。","letterEnd":0.588},"C":{"text":"It is too hard for her to use.","letterAudio":"9756927a5f3791737934.mp3","audio":"84fae042ed07a10be9ba.mp3","zh":"它對她來說太難用了。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說 app 幫她做作業時她什麼都沒學到，老師也看得出來，現在只用它檢查拼字，可見她覺得這個 app 只適合做小事情。","zhCorrect":"958f62ba01cad4fc9c1f.mp3","enText":"The answer is B. It is only good for small jobs. The girl says the AI app writes nice sentences, but she doesn't learn anything when it does the work. Her teacher could also tell it wasn't her writing. Now the girl only uses it to check her spelling. So the girl thinks the app is only good for small jobs.","enAudio":"70011bf0ff05f67a9bcb.mp3","wrong":{"A":{"text":"A女孩說用 app 做作業時她什麼都沒學到，不是做作業最好的方法。","audio":"1951c9b6cf25d8ceaeb1.mp3"},"C":{"text":"C女孩沒有說 app 很難用。","audio":"b8e03410a9d0bdae192b.mp3"}}},{"id":"L091-Q17","type":"言談理解","point":"明確訊息","unit":"U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號93 ready、98 free；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號111 o'clock、114 only；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號37 leave；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號32 bag；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號30 breakfast；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號44 number；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Mr. Lin. This is Mrs. Lee from Seaside Homestay. Your room for this Saturday is ready. You can check in at three o'clock, but you can leave your bags with us any time after ten. Breakfast is from seven to nine. Parking is free, but we only have three spaces, so please tell me if you're coming by car. You can call me back at this number. Thank you.","audio":"5f185d4daa559ab1803a.mp3","zh":"嗨，林先生。我是海邊民宿的李太太。您這個星期六的房間準備好了。您可以三點入住，不過十點以後隨時都可以先把行李放在我們這裡。早餐是七點到九點。停車免費，可是我們只有三個車位，所以如果您要開車來，請告訴我。您可以打這個號碼回電給我。謝謝。"}],"question":{"text":"What should Mr. Lin tell Mrs. Lee?","audio":"afd6417a7fed480664f5.mp3","zh":"林先生應該告訴李太太什麼？"},"options":{"A":{"text":"When he wants breakfast.","letterAudio":"93138ad65b3704914636.mp3","audio":"e770070ed8a47cfea1a9.mp3","zh":"他想什麼時候吃早餐。","letterEnd":0.537},"B":{"text":"What time he will check in.","letterAudio":"609555d8760f27caf21b.mp3","audio":"9e489904faa063b5a2c2.mp3","zh":"他幾點要入住。","letterEnd":0.588},"C":{"text":"If he is coming by car.","letterAudio":"9756927a5f3791737934.mp3","audio":"cccaad01375bffa186e8.mp3","zh":"他是不是開車來。","letterEnd":0.713}},"answer":"C","keyLines":[0],"evidence":"李太太說「please tell me if you're coming by car」，所以林先生應該告訴李太太他會不會開車來。","zhCorrect":"5a252a7a1cbe45aa8dd8.mp3","enText":"The answer is C. If he is coming by car. Mrs. Lee says parking is free, but there are only three spaces. She asks Mr. Lin to tell her if he is coming by car. So Mr. Lin should tell Mrs. Lee if he is coming by car.","enAudio":"370e2c72680c5b7cf08e.mp3","wrong":{"A":{"text":"A早餐時間是李太太告訴林先生的，她沒有請林先生說什麼時候要吃早餐。","audio":"145850a056c4320faa4f.mp3"},"B":{"text":"B入住時間是三點，是李太太告訴林先生的，她沒有請林先生說幾點入住。","audio":"6113cbe8e6297dab3e53.mp3"}}},{"id":"L091-Q18","type":"言談理解","point":"整體訊息","unit":"U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號16 clothes；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號88 wash、81 open、82 say、87 check；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號112 together；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號10 sister；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new、116 favorite；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號49 red、51 white、57 pink、47 color；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號13 sweater、12 shirt；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號55 wear；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號45 classmate；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號47 laugh；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號100 some；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號44 look；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always；U02｜核心單字「介系詞」｜教材印刷頁 p.33｜核心編號118 before；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號79 anything；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號26 way","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last winter, my mom was away for a week, so I did the laundry for the first time. I put all the clothes in the washing machine together, and that included my sister's new red sweater. When I opened the machine, my white school shirts were all pink! My sister was angry, and I had to wear a pink shirt to school for two days. My classmates laughed, but some said it looked cool. Now I always check the colors before I wash anything, and I do the laundry every Sunday.","audio":"2ea036de9ef2749fbe91.mp3","zh":"去年冬天，我媽媽出門一個星期，所以我第一次洗衣服。我把所有的衣服一起放進洗衣機，裡面還有我姊姊（妹妹）新的紅毛衣。我打開洗衣機的時候，我的白色制服襯衫全都變成粉紅色了！我姊姊（妹妹）很生氣，我還得穿粉紅色的襯衫上學兩天。同學們都笑了，不過有些人說看起來很酷。現在我洗任何東西之前一定會先看顏色，而且我每個星期日都會洗衣服。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"The speaker's favorite pink shirt.","letterAudio":"93138ad65b3704914636.mp3","audio":"51a62e426ca4b800ed16.mp3","zh":"說話者最喜歡的粉紅色襯衫。","letterEnd":0.537},"B":{"text":"A laundry mistake and what the speaker learned.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b81563fc000e81923532.mp3","zh":"一次洗衣服的錯誤和說話者學到的事。","letterEnd":0.588},"C":{"text":"The best way to wash a red sweater.","letterAudio":"9756927a5f3791737934.mp3","audio":"93f344340ed63a86cbfb.mp3","zh":"洗紅毛衣的最好方法。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"說話者第一次洗衣服，把姊姊（妹妹）的紅毛衣和白襯衫一起洗，襯衫全變成粉紅色，之後每次洗衣服前都先看顏色。整段在談一次洗衣服的錯誤和說話者學到的事。","zhCorrect":"63976b577ba1ccf71f7c.mp3","enText":"The answer is B. A laundry mistake and what the speaker learned. The speaker did the laundry for the first time and put a new red sweater in with white school shirts. The shirts all turned pink, and the speaker had to wear a pink shirt to school. Now the speaker always checks the colors first. The talk is about a laundry mistake and what the speaker learned.","enAudio":"51c35836cf26b16d94da.mp3","wrong":{"A":{"text":"A說話者是不得不穿粉紅色襯衫上學，沒有說那是自己最喜歡的襯衫。","audio":"004b40ba11bfbaea8dae.mp3"},"C":{"text":"C說話者沒有說明怎麼洗紅毛衣，只說紅毛衣把白襯衫染成粉紅色。","audio":"8949191697653261ccf4.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L091/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
