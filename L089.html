<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>
  </section>

s，但說哥哥（弟弟）每天晚上都在房間裡練習，可知他還在拉小提琴。","zhCorrect":"89a3f403a7670314d836.mp3","enText":"The answer is C. Well, he practices in his room every night. Someone asks if your brother still plays the violin. The best reply is, Well, he practices in his room every night. This means your brother still plays.","enAudio":"230dab27d138062bf91c.mp3","wrong":{"A":{"text":"A說哥哥（弟弟）現在讀高中、個子很高，談的是哥哥（弟弟）的年紀和身高，沒有回答他是不是還在拉小提琴。","audio":"341ab561baa67065eb61.mp3"},"B":{"text":"B說自己不會拉小提琴、太難了，只接著 play the violin，談自己的事，沒有回答問題。","audio":"2d53bce9fb37246f7317.mp3"}}},{"id":"L089-Q08","type":"基本問答","point":"提醒／安撫／道歉","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry、108 close；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號83 use；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號50 swim；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think、32 fun；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號67 another；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號32 bag；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號7 pool；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號8 Monday","difficulty":"易","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"I'm sorry. I used your towel after swimming. I thought it was mine.","audio":"30331ce744f4bb98a81b.mp3","zh":"對不起。我游完泳用了你的毛巾。我以為那是我的。"}],"question":null,"options":{"A":{"text":"Oh, that's OK. I have another one in my bag.","letterAudio":"93138ad65b3704914636.mp3","audio":"8fb9001482df4783cac2.mp3","zh":"噢，沒關係。我包包裡還有另一條。","letterEnd":0.537},"B":{"text":"I go swimming twice a week. It's fun.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e2db1995aa50ed520a7b.mp3","zh":"我一個星期游泳兩次。很好玩。","letterEnd":0.588},"C":{"text":"Well, the pool is closed on Mondays.","letterAudio":"9756927a5f3791737934.mp3","audio":"2c7d23b1d24354be4d1f.mp3","zh":"嗯，游泳池星期一休息。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"對方為用了自己的毛巾道歉；A說沒關係，自己包包裡還有另一條，是接受道歉的說法。","zhCorrect":"7ef9a3d531f673aae8f2.mp3","enText":"The answer is A. Oh, that's OK. I have another one in my bag. Someone says sorry for using your towel after swimming. The best reply is, Oh, that's OK. I have another one in my bag. This reply accepts the apology.","enAudio":"fd47395ca780210cb871.mp3","wrong":{"B":{"text":"B說自己一星期游泳兩次、很好玩，只接著 swimming，沒有回應對方的道歉。","audio":"6129891c8a8ee50f9545.mp3"},"C":{"text":"C說游泳池星期一休息，由 swimming 聯想到游泳池，沒有回應對方的道歉。","audio":"6050546ecef7c6dd3ab8.mp3"}}},{"id":"L089-Q09","type":"言談理解","point":"明確訊息","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號72 everything；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號49 dog；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號8 hospital；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號57 play、43 hurt；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號31 lunch；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號25 sock；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號23 doctor；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號48 tomorrow；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號79 anything；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號50 tonight；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號12 leg；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號20 food","difficulty":"中","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"You weren't at basketball practice today. Is everything OK?","audio":"065c4f29804d2434ab5a.mp3","zh":"女孩：你今天沒來籃球練習。一切都還好嗎？"},{"speaker":"Boy","text":"I took my dog Lucky to the animal hospital. We played in the park all morning. Then after lunch, he ate one of my socks!","audio":"f82096519b985a613532.mp3","zh":"男孩：我帶我的狗 Lucky 去動物醫院。我們整個早上都在公園玩。然後午餐後，牠吃掉了我的一隻襪子！"},{"speaker":"Girl","text":"Oh no! Is he OK now?","audio":"05561aea80a6867aa11e.mp3","zh":"女孩：噢，不會吧！牠現在還好嗎？"},{"speaker":"Boy","text":"Yes. The doctor got the sock out. Lucky can come home tomorrow, but he can't eat anything tonight.","audio":"ee7afe21b089cb75f2a1.mp3","zh":"男孩：還好。醫生把襪子拿出來了。Lucky 明天可以回家，可是牠今晚不能吃任何東西。"}],"question":{"text":"Why did the boy take his dog to the animal hospital?","audio":"dfc6ba96f87e5c1bbc1a.mp3","zh":"男孩為什麼帶他的狗去動物醫院？"},"options":{"A":{"text":"It hurt its leg in the park.","letterAudio":"93138ad65b3704914636.mp3","audio":"0ecebf402b155ad0a88b.mp3","zh":"牠在公園傷到了腳。","letterEnd":0.537},"B":{"text":"It ate one of the boy's socks.","letterAudio":"609555d8760f27caf21b.mp3","audio":"28fcb6983012e555156c.mp3","zh":"牠吃了男孩的一隻襪子。","letterEnd":0.588},"C":{"text":"It couldn't eat its food.","letterAudio":"9756927a5f3791737934.mp3","audio":"daa96bf93bae23977f90.mp3","zh":"牠不肯吃牠的食物。","letterEnd":0.713}},"answer":"B","keyLines":[1],"evidence":"男孩說「after lunch, he ate one of my socks」，所以他帶狗去動物醫院是因為狗吃了他的一隻襪子。","zhCorrect":"e80c91338c5b37c04962.mp3","enText":"The answer is B. It ate one of the boy's socks. The boy and his dog Lucky played in the park all morning. After lunch, Lucky ate one of the boy's socks, so the boy took Lucky to the animal hospital. The doctor got the sock out.","enAudio":"2f05b6bfca11376e46bc.mp3","wrong":{"A":{"text":"A男孩說他們整個早上在公園玩，沒有說狗在公園傷到腳。","audio":"41cf37ee9cbf5968a1ab.mp3"},"C":{"text":"C今晚不能吃東西是醫生處理以後的安排，不是男孩帶狗去動物醫院的原因。","audio":"2a7026f8e5437f392d21.mp3"}}},{"id":"L089-Q10","type":"言談理解","point":"明確訊息","unit":"U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new、104 small、108 close；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號31 person；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號29 cup；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號45 like；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號61 early；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號50 tonight；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號6 bread","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good afternoon, shoppers. From two to four today, you can try our new mango ice cream for free. Just go to the fruit area at the back of the store. Each person can take one small cup. If you like it, a box of mango ice cream is twenty percent off today. Also, the bakery on the second floor will close early at six tonight. Thank you for shopping at Happy Mart.","audio":"b2863e1dceda8d7ce136.mp3","zh":"各位顧客午安。今天兩點到四點，您可以免費試吃我們新的芒果冰淇淋。請到本店後方的水果區。每個人可以拿一小杯。如果您喜歡，芒果冰淇淋今天一盒打八折。另外，二樓的麵包店今晚會提早在六點關門。謝謝您光臨 Happy Mart。"}],"question":{"text":"What can shoppers get for free this afternoon?","audio":"6d9920b0c0cf37f33bee.mp3","zh":"顧客今天下午可以免費得到什麼？"},"options":{"A":{"text":"A small cup of ice cream.","letterAudio":"93138ad65b3704914636.mp3","audio":"9d2b8d4dc1ef799d55af.mp3","zh":"一小杯冰淇淋。","letterEnd":0.537},"B":{"text":"A box of mango ice cream.","letterAudio":"609555d8760f27caf21b.mp3","audio":"14fd0a744227d9979614.mp3","zh":"一盒芒果冰淇淋。","letterEnd":0.588},"C":{"text":"Some bread from the bakery.","letterAudio":"9756927a5f3791737934.mp3","audio":"f0f3db8f40f19baab821.mp3","zh":"一些麵包店的麵包。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"廣播說「you can try our new mango ice cream for free」，而且「Each person can take one small cup」，所以顧客今天下午可以免費拿到一小杯冰淇淋。","zhCorrect":"506e99e162c7ebb16663.mp3","enText":"The answer is A. A small cup of ice cream. From two to four today, shoppers can try the new mango ice cream for free, and each person can take one small cup. A box of mango ice cream is twenty percent off. So shoppers can get a small cup of ice cream for free.","enAudio":"f9166597a7c1dcdf01b4.mp3","wrong":{"B":{"text":"B一盒芒果冰淇淋今天是打八折，不是免費。","audio":"0166bea27b279e67622d.mp3"},"C":{"text":"C廣播只說二樓的麵包店今晚提早關門，沒有說可以免費拿麵包。","audio":"35a57865d4afaa69b562.mp3"}}},{"id":"L089-Q11","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號7 grandfather / grandpa；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號110 old、103 big；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號45 send；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號17 button；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號66 easy；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see、83 use；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too、128 now；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"Is that your grandpa's phone? It looks really old.","audio":"8cacb69565a2f3f3e7d5.mp3","zh":"女孩：那是你爺爺（外公）的手機嗎？它看起來好舊。"},{"speaker":"Boy","text":"Yes. He can only make calls and send text messages with it.","audio":"d28cff2515a77eba6d3e.mp3","zh":"男孩：是啊。他只能用它打電話和傳簡訊。"},{"speaker":"Girl","text":"Doesn't he want a smartphone?","audio":"caaf38a76447c3a71d1e.mp3","zh":"女孩：他不想要智慧型手機嗎？"},{"speaker":"Boy","text":"No, and I understand why. The battery lasts a whole week, and the big buttons are easy for him to see.","audio":"c3485bba7b0d6ff09c3a.mp3","zh":"男孩：不想，而且我懂為什麼。電池可以用一整個星期，大大的按鍵他也很容易看清楚。"}],"question":{"text":"What does the boy think about his grandpa's old phone?","audio":"525434ea529af46aea86.mp3","zh":"男孩覺得他爺爺（外公）的舊手機怎麼樣？"},"options":{"A":{"text":"It works well for his grandpa.","letterAudio":"93138ad65b3704914636.mp3","audio":"88f3b2ab343a1451e4e5.mp3","zh":"很適合他爺爺（外公）用。","letterEnd":0.537},"B":{"text":"It is too old to use now.","letterAudio":"609555d8760f27caf21b.mp3","audio":"5beaac84083b060873a7.mp3","zh":"太舊了，現在不能用了。","letterEnd":0.588},"C":{"text":"It is hard for his grandpa to use.","letterAudio":"9756927a5f3791737934.mp3","audio":"ef10f5f6687c27d7f7ef.mp3","zh":"他爺爺（外公）用起來很困難。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男孩說他懂爺爺（外公）為什麼不想換智慧型手機，因為電池可以用一整個星期，大按鍵也很容易看清楚，可見他覺得那支舊手機很適合爺爺（外公）用。","zhCorrect":"fe7be10371fb4970a66d.mp3","enText":"The answer is A. It works well for his grandpa. The boy's grandpa has an old phone. It can only make calls and send text messages. The boy says the battery lasts a whole week, and the big buttons are easy for his grandpa to see. So the boy thinks the old phone works well for his grandpa.","enAudio":"f87f237cded4cc615b8e.mp3","wrong":{"B":{"text":"B女孩說手機看起來很舊，但男孩說明這支手機的好處，沒有說它太舊不能用。","audio":"cf55b68d054265847583.mp3"},"C":{"text":"C男孩說大按鍵很容易看清楚，與「很難用」相反。","audio":"110a02201d67cddfa098.mp3"}}},{"id":"L089-Q12","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號8 grandmother / grandma；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號45 send、3 summer、5 winter；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號13 sweater；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always、75 usually；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號13 tea；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Boy","text":"Look! My grandma in Tainan sent me this box. She made me a sweater, and there are some photos of my dad as a kid.","audio":"f132d97edbffd5b8debd.mp3","zh":"男孩：你看！我在臺南的奶奶（外婆）寄給我這個箱子。她幫我做了一件毛衣，還有一些我爸爸小時候的照片。"},{"speaker":"Girl","text":"How sweet! My grandma always sends us mangoes in summer.","audio":"09a4f8d05467276e2dc5.mp3","zh":"女孩：好貼心！我奶奶（外婆）夏天總是寄芒果給我們。"},{"speaker":"Boy","text":"Mine usually sends tea in winter. My dad drinks it every morning.","audio":"faa7ae5628d926b5fe1e.mp3","zh":"男孩：我奶奶（外婆）通常冬天會寄茶。我爸爸每天早上都喝。"}],"question":{"text":"What did the boy's grandma send him this time?","audio":"0d40c7217397ff644d3d.mp3","zh":"男孩的奶奶（外婆）這次寄了什麼給他？"},"options":{"A":{"text":"Some mangoes from Tainan.","letterAudio":"93138ad65b3704914636.mp3","audio":"7f50f1bd12639e196a86.mp3","zh":"一些從臺南來的芒果。","letterEnd":0.537},"B":{"text":"Some tea for his dad.","letterAudio":"609555d8760f27caf21b.mp3","audio":"eae7f9263e6dc0880805.mp3","zh":"一些給他爸爸的茶。","letterEnd":0.588},"C":{"text":"A sweater and some photos.","letterAudio":"9756927a5f3791737934.mp3","audio":"5dce91412fbd14700195.mp3","zh":"一件毛衣和一些照片。","letterEnd":0.713}},"answer":"C","keyLines":[0],"evidence":"男孩說奶奶（外婆）「made me a sweater, and there are some photos of my dad as a kid」，所以這次寄來的是一件毛衣和一些照片。","zhCorrect":"606de78d793432353ff3.mp3","enText":"The answer is C. A sweater and some photos. The boy's grandma in Tainan made him a sweater, and she sent some photos of his dad as a kid. She usually sends tea in winter. So this time, she sent a sweater and some photos.","enAudio":"7041f2714ceab9231736.mp3","wrong":{"A":{"text":"A芒果是女孩的奶奶（外婆）夏天寄給女孩家的東西。","audio":"22e890884355dd6b0a78.mp3"},"B":{"text":"B茶是男孩的奶奶（外婆）通常冬天會寄的東西，不是這次寄來的。","audio":"61d9abbf2a42303db7aa.mp3"}}},{"id":"L089-Q13","type":"言談理解","point":"情境推論","unit":"U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號50 pull；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see、88 wash；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號116 here；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號44 dry、34 fix；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號82 then；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號32 car","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Man","text":"First, take off the front wheel. Good. Now pull the tube out.","audio":"1f427624753acd8366e5.mp3","zh":"男士：首先，把前輪拆下來。很好。現在把內胎拉出來。"},{"speaker":"Girl","text":"OK. What do I do with it?","audio":"fbb42db406eee58ca3d4.mp3","zh":"女孩：好。我要拿它做什麼？"},{"speaker":"Man","text":"Put it in this bucket of water and look for bubbles.","audio":"d8cb48514127674aa025.mp3","zh":"男士：把它放進這桶水裡，找找看有沒有泡泡。"},{"speaker":"Girl","text":"I see bubbles here!","audio":"92bd02a1fbf734f4818b.mp3","zh":"女孩：這裡有泡泡！"},{"speaker":"Man","text":"Great. That's where the hole is. Dry it, and we'll put a patch on it. Then we'll pump in some air.","audio":"3d2d0f3676e1147383d2.mp3","zh":"男士：很好。那就是破洞的地方。把它擦乾，我們要在上面貼一塊補丁。然後我們再把空氣打進去。"}],"question":{"text":"What are they most likely doing?","audio":"3717af6b451e504a17cf.mp3","zh":"他們最有可能在做什麼？"},"options":{"A":{"text":"Washing a car.","letterAudio":"93138ad65b3704914636.mp3","audio":"2038f7e734c5b96bd20c.mp3","zh":"洗車。","letterEnd":0.537},"B":{"text":"Fixing a bike tire.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b8ff02755956ceef67ce.mp3","zh":"修腳踏車的輪胎。","letterEnd":0.588},"C":{"text":"Blowing up some balloons.","letterAudio":"9756927a5f3791737934.mp3","audio":"9e78c4ae0e723a81c1ce.mp3","zh":"吹一些氣球。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男士要女孩拆下前輪、拉出內胎，放進水裡找泡泡找出破洞，再貼補丁、打氣，可知他們最有可能在修腳踏車輪胎。","zhCorrect":"c1b8c0b96e87807f1940.mp3","enText":"The answer is B. Fixing a bike tire. The man asks the girl to take off the front wheel and pull the tube out. He wants her to put the tube in water and look for bubbles, because the bubbles show the hole. Then they will put a patch on it and pump in some air. So they are most likely fixing a bike tire.","enAudio":"c65c1878b29ab5885d62.mp3","wrong":{"A":{"text":"A由 wheel 和 bucket of water 聯想到洗車，但男士要女孩把內胎放進水裡是為了找破洞。","audio":"2fbd9f6799aa00ed44a0.mp3"},"C":{"text":"C由 pump in some air 聯想到吹氣球，但他們之後要打氣的是補好的內胎，不是氣球。","audio":"c942417a3f049ef07f0c.mp3"}}},{"id":"L089-Q14","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號48 black；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號83 use；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號61 rainy；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號13 half；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號75 usually；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號58 pay；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號122 maybe；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號33 garden；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號26 way","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Boy","text":"What are those black boards on your roof?","audio":"a52cc831ac4e3d7a3cda.mp3","zh":"男孩：你們家屋頂上那些黑色的板子是什麼？"},{"speaker":"Girl","text":"They're solar panels. They use sunlight to make electricity for our home.","audio":"3682e195697a0f6df305.mp3","zh":"女孩：那是太陽能板。它們用陽光為我們家發電。"},{"speaker":"Boy","text":"Cool. Do they work on rainy days?","audio":"381464ce5dc42e21db32.mp3","zh":"男孩：酷。下雨天它們有用嗎？"},{"speaker":"Girl","text":"A little, not much. Last month, our electricity bill was half of what we usually pay.","audio":"731b5b40a6bf75cd2620.mp3","zh":"女孩：有一點，不多。上個月，我們家的電費是平常的一半。"},{"speaker":"Boy","text":"Maybe my family should get some, too.","audio":"6242218afb8c6d2d9f4a.mp3","zh":"男孩：也許我家也應該裝一些。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"A new garden on the girl's roof.","letterAudio":"93138ad65b3704914636.mp3","audio":"fd6b8792b1a7b9aec8a4.mp3","zh":"女孩家屋頂上的新花園。","letterEnd":0.537},"B":{"text":"The way solar panels are made.","letterAudio":"609555d8760f27caf21b.mp3","audio":"404769ad3403cd2bc593.mp3","zh":"太陽能板的製作方法。","letterEnd":0.588},"C":{"text":"The solar panels at the girl's home.","letterAudio":"9756927a5f3791737934.mp3","audio":"2ea19d750965e3e372bb.mp3","zh":"女孩家的太陽能板。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩說屋頂上的黑色板子是太陽能板，可以用陽光為她家發電，上個月電費只有平常的一半，男孩也想讓家裡裝。整段在談女孩家的太陽能板。","zhCorrect":"15ed85aafe73d0e76257.mp3","enText":"The answer is C. The solar panels at the girl's home. The girl says the black boards on her roof are solar panels. They use sunlight to make electricity for her home, and last month, her family's electricity bill was half of what they usually pay. The girl and the boy are talking about the solar panels at the girl's home.","enAudio":"aae1083876e70bea4a04.mp3","wrong":{"A":{"text":"A由 roof 聯想到屋頂花園，但女孩家屋頂上的是太陽能板。","audio":"c2b6556ecd5ba7122144.mp3"},"B":{"text":"B對話談的是太陽能板的用處和電費，沒有說太陽能板是怎麼做的。","audio":"97d5e3a487fdf844bad9.mp3"}}},{"id":"L089-Q15","type":"言談理解","point":"語境猜義","unit":"U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號70 movie；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號47 laugh、52 become；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號58 almost；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號49 dog、48 animal；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號16 teacher；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號72 everything；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號48 kid；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號44 love；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號87 cry；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U09｜九、閱讀與題組補充單字（總表未逐項標頁；U09 教材頁 pp.183～203）｜comedy","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Boy","text":"How was the movie last night? Was it scary?","audio":"fbeead57482d1c58dcd9.mp3","zh":"男孩：昨晚的電影怎麼樣？可怕嗎？"},{"speaker":"Girl","text":"Not at all. It was a comedy. I laughed so hard that I almost fell off my seat.","audio":"b95e7c4a356ae6672ec2.mp3","zh":"女孩：一點也不。那是一部 comedy（喜劇）。我笑到差點從座位上掉下去。"},{"speaker":"Boy","text":"What was it about?","audio":"1b4dc460b809c4980579.mp3","zh":"男孩：它在講什麼？"},{"speaker":"Girl","text":"A dog that becomes a teacher for a day. Everything goes wrong, and the kids love it.","audio":"54581886f94544905cca.mp3","zh":"女孩：一隻狗當了一天的老師。每件事都出錯，孩子們都很喜歡。"}],"question":{"text":"What does the girl mean by \"comedy\"?","audio":"b734467a3241f5f63129.mp3","zh":"女孩說的 \"comedy\" 是什麼意思？"},"options":{"A":{"text":"A movie that makes people cry.","letterAudio":"93138ad65b3704914636.mp3","audio":"f40ce976775ffefd76fa.mp3","zh":"讓人哭的電影。","letterEnd":0.537},"B":{"text":"A movie about animals.","letterAudio":"609555d8760f27caf21b.mp3","audio":"8a1ff045a6a54cafebca.mp3","zh":"關於動物的電影。","letterEnd":0.588},"C":{"text":"A movie that makes people laugh.","letterAudio":"9756927a5f3791737934.mp3","audio":"ccb15ede375e1b861a46.mp3","zh":"讓人發笑的電影。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩說那部電影一點也不可怕，是一部 comedy，她笑到差點從座位上掉下去，可知 comedy 是讓人發笑的電影，也就是喜劇。","zhCorrect":"2c5d4a2d24ed1ab8586d.mp3","enText":"The answer is C. A movie that makes people laugh. The girl says the movie was not scary at all. She laughed so hard that she almost fell off her seat. So when the girl says comedy, she means a movie that makes people laugh.","enAudio":"63a80ec1e285e71c8467.mp3","wrong":{"A":{"text":"A女孩說自己笑到差點從座位上掉下去，與讓人哭的電影相反。","audio":"6c1510407b1534cde999.mp3"},"B":{"text":"B由電影裡的狗聯想到動物電影，但女孩用「笑到差點掉下去」說明 comedy。","audio":"b6bb04b807852bb496b5.mp3"}}},{"id":"L089-Q16","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say、87 check、83 use；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號54 miss；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號81 twice；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號44 love、47 save；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號122 maybe、124 too；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號1 time；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號44 useful；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Boy","text":"Do you use the new school bus app? It shows where the bus is.","audio":"cecab154bad3534f546a.mp3","zh":"男孩：你有用新的校車 app 嗎？它會顯示校車在哪裡。"},{"speaker":"Girl","text":"I tried it for two weeks. It said the bus was five minutes away, and then the bus came after one minute. I missed it twice.","audio":"d369d5368abed3662cb1.mp3","zh":"女孩：我用了兩個星期。它說校車還有五分鐘才到，結果一分鐘後校車就來了。我錯過了兩次。"},{"speaker":"Boy","text":"My mom loves it. She checks it every morning.","audio":"c40f10be2c02bd3dd193.mp3","zh":"男孩：我媽媽很喜歡。她每天早上都會看。"},{"speaker":"Girl","text":"Maybe it works on her phone. Now I just go to the bus stop ten minutes early.","audio":"c929f65845b408c766a6.mp3","zh":"女孩：也許在她的手機上很準。現在我都直接提早十分鐘到公車站。"}],"question":{"text":"What does the girl think about the bus app?","audio":"52b8688ace8f36713ee9.mp3","zh":"女孩覺得這個校車 app 怎麼樣？"},"options":{"A":{"text":"It saves her a lot of time.","letterAudio":"93138ad65b3704914636.mp3","audio":"2dae7f67d36e5c7990f0.mp3","zh":"它幫她省了很多時間。","letterEnd":0.537},"B":{"text":"It is not very useful for her.","letterAudio":"609555d8760f27caf21b.mp3","audio":"358728102de5f2bb9365.mp3","zh":"它對她來說不太有用。","letterEnd":0.588},"C":{"text":"It is too hard for her to use.","letterAudio":"9756927a5f3791737934.mp3","audio":"84fae042ed07a10be9ba.mp3","zh":"它對她來說太難用了。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說 app 顯示校車還有五分鐘，結果一分鐘後車就來了，她錯過了兩次，現在都提早十分鐘去公車站，可見她覺得這個 app 對她不太有用。","zhCorrect":"cce2416440773c5c4d6d.mp3","enText":"The answer is B. It is not very useful for her. The girl tried the school bus app for two weeks. The app said the bus was five minutes away, and then the bus came after one minute. The girl missed the bus twice, and now she goes to the bus stop ten minutes early. So the girl thinks the app is not very useful for her.","enAudio":"ff94499c0f5ac16265b1.mp3","wrong":{"A":{"text":"A女孩因為 app 錯過校車兩次，現在還要提早十分鐘去等車，沒有幫她省時間。","audio":"51ed5990f15a16964a56.mp3"},"C":{"text":"C女孩說的是 app 顯示的時間不準，沒有說它很難用。","audio":"9959ca6758d13dee2867.mp3"}}},{"id":"L089-Q17","type":"言談理解","point":"明確訊息","unit":"U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號35 break、34 fix；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號100 some；U04｜核心單字「副詞、介系詞、連接詞與助動詞」｜教材印刷頁 p.73｜核心編號78 may；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號87 check；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號89 clean","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Mr. Wang. This is Mrs. Lin from the sixth floor. I'm sorry. My washing machine broke this morning, and there was water all over my bathroom floor. I think some water may come through your kitchen ceiling. A worker is coming at three this afternoon to check. Could you let him into your home? He'll need about thirty minutes. Thank you so much.","audio":"aab6b61cbc8220261ba7.mp3","zh":"嗨，王先生。我是六樓的林太太。很抱歉。我的洗衣機今天早上壞了，我浴室的地上都是水。我想有些水可能會從您家廚房的天花板滲下來。今天下午三點會有一位工人來檢查。您可以讓他進您家嗎？他大約需要三十分鐘。非常謝謝您。"}],"question":{"text":"What does Mrs. Lin want Mr. Wang to do?","audio":"969aeafbaca5d301acc9.mp3","zh":"林太太希望王先生做什麼？"},"options":{"A":{"text":"Let a worker into his home.","letterAudio":"93138ad65b3704914636.mp3","audio":"a7f570f303ca1ce031fc.mp3","zh":"讓一位工人進他家。","letterEnd":0.537},"B":{"text":"Fix the washing machine for her.","letterAudio":"609555d8760f27caf21b.mp3","audio":"7dfe8d4039afee2454bd.mp3","zh":"幫她修理洗衣機。","letterEnd":0.588},"C":{"text":"Clean the floor of her bathroom.","letterAudio":"9756927a5f3791737934.mp3","audio":"528ed1ae91ddc85aa32f.mp3","zh":"打掃她浴室的地板。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"林太太說「Could you let him into your home?」，所以她希望王先生讓工人進他家。","zhCorrect":"2d6925ba625d71041f64.mp3","enText":"The answer is A. Let a worker into his home. Mrs. Lin's washing machine broke this morning, and some water may come through Mr. Wang's kitchen ceiling. A worker is coming at three to check, and Mrs. Lin asks Mr. Wang to let the worker into his home. So Mrs. Lin wants Mr. Wang to let a worker into his home.","enAudio":"fa8dfd2abe60f43e3cea.mp3","wrong":{"B":{"text":"B洗衣機壞了是林太太家發生的事，原文沒有請王先生修理。","audio":"22190a43759761ebe846.mp3"},"C":{"text":"C林太太家浴室地上都是水，但她沒有請王先生打掃她的浴室。","audio":"1a65493d1bbda01640e7.mp3"}}},{"id":"L089-Q18","type":"言談理解","point":"整體訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號3 summer、44 mean、51 hear；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號71 ago；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family、3 mother；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號111 o'clock；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號103 big、109 new、116 favorite；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號26 plate；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號32 dinner；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號127 sure；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號22 cook；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink；U09｜九、閱讀與題組補充單字「英式英文與美式英文的語意差異」（總表未逐項標頁；U09 教材頁 pp.183～203）｜tea（英式：晚餐）、flat（英式：公寓）","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Two summers ago, I stayed with a family in London for two weeks. On the first day, the mother asked me, \"Would you like some tea?\" It was six o'clock, so I said, \"Just a cup, please.\" She looked surprised. Then she put a big plate of fish and chips in front of me! Later, I learned that in some parts of Britain, \"tea\" can mean dinner. That week, I also learned that a \"flat\" is an apartment. Now I write down every new English word I hear, and I always ask when I'm not sure.","audio":"38a4637f0f64a121b189.mp3","zh":"兩年前的夏天，我在倫敦的一戶人家住了兩個星期。第一天，那家的媽媽問我：「你想要來點 tea 嗎？」那時是六點，所以我說：「一杯就好，謝謝。」她看起來很驚訝。接著她在我面前放了一大盤炸魚薯條！後來我才知道，在英國有些地方，tea 可以是晚餐的意思。那個星期，我也學到 flat 是公寓的意思。現在我會把聽到的每個新的英文字寫下來，不確定的時候我一定會問。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"A dinner the speaker cooked in London.","letterAudio":"93138ad65b3704914636.mp3","audio":"9106b0649eaaef03a0a2.mp3","zh":"說話者在倫敦煮的一頓晚餐。","letterEnd":0.537},"B":{"text":"English words with surprising meanings.","letterAudio":"609555d8760f27caf21b.mp3","audio":"7faa06a40136853fa8bc.mp3","zh":"意思出乎意料的英文字。","letterEnd":0.588},"C":{"text":"The speaker's favorite drink in London.","letterAudio":"9756927a5f3791737934.mp3","audio":"1b90406b9d98b3a13135.mp3","zh":"說話者在倫敦最喜歡的飲料。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"說話者在倫敦以為 tea 是茶，結果那家的媽媽端出晚餐，後來才知道 tea 可以是晚餐，也學到 flat 是公寓。整段在談意思出乎意料的英文字。","zhCorrect":"cc3bc4c14a85834c9284.mp3","enText":"The answer is B. English words with surprising meanings. The speaker stayed with a family in London. The mother asked about tea, and the speaker said, just a cup, please. Then she put a big plate of fish and chips in front of the speaker. In some parts of Britain, tea can mean dinner, and a flat is an apartment. The talk is about English words with surprising meanings.","enAudio":"6d00b3219bb44415fcb3.mp3","wrong":{"A":{"text":"A晚餐是那家的媽媽端給說話者的，說話者沒有說自己煮晚餐。","audio":"60c4dbdbfdcdd700c980.mp3"},"C":{"text":"C說話者只說自己回答「一杯就好」，沒有說最喜歡什麼飲料。","audio":"11055b11530de5fe5e5c.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L089/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
