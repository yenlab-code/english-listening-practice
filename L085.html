<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>
  </section>

","zh":"我爸爸在一棟大樓裡上班。","letterEnd":0.588},"C":{"text":"Smoking isn't allowed in our school.","letterAudio":"9756927a5f3791737934.mp3","audio":"de4e7aff415752429e1f.mp3","zh":"我們學校裡不可以抽菸。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"對方說爸爸終於戒菸、已經一年了；A說這是好消息，對方一定很以爸爸為榮，是回應好消息的說法。","zhCorrect":"15bdd4c146646f29940a.mp3","enText":"The answer is A. Oh, that's great news! You must be proud of him. Someone's dad finally stopped smoking, and it's been a whole year. The best reply is, Oh, that's great news! You must be proud of him. This reply shows you are happy about the news.","enAudio":"18b5a8b2dfdfa869aea6.mp3","wrong":{"B":{"text":"B說自己的爸爸在一棟大樓工作，只接著 dad，談自己的事，沒有回應對方的消息。","audio":"0bb009baba0b571bc848.mp3"},"C":{"text":"C說學校裡不能抽菸，只接著 smoking，沒有回應對方的消息。","audio":"d9b02d7d4f53ee7e877d.mp3"}}},{"id":"L085-Q08","type":"基本問答","point":"邀請／提議","unit":"U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take、42 live；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號32 car、40 bus；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號14 mountain；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號14 Sunday、17 today；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號43 sound；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號48 afraid；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號71 high；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號38 place","difficulty":"中","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"Let's take the new cable car up the mountain this Sunday. The view is great.","audio":"c860fa02c05653b1220d.mp3","zh":"我們這個星期日去搭新的纜車上山吧。風景很棒。"}],"question":null,"options":{"A":{"text":"I took a bus to school today.","letterAudio":"93138ad65b3704914636.mp3","audio":"9dfc65859e628912ca6c.mp3","zh":"我今天搭公車上學。","letterEnd":0.537},"B":{"text":"Well, I live near the mountain.","letterAudio":"609555d8760f27caf21b.mp3","audio":"f98804ca5fd52bdccdf1.mp3","zh":"嗯，我住在那座山附近。","letterEnd":0.588},"C":{"text":"Sounds great, but I'm afraid of high places.","letterAudio":"9756927a5f3791737934.mp3","audio":"9652babb4fd34dc2950c.mp3","zh":"聽起來很棒，可是我怕高。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"對方提議星期日一起搭纜車上山；C說聽起來很棒，但自己怕高，是婉拒提議的說法。","zhCorrect":"6954920a00e0e29d3383.mp3","enText":"The answer is C. Sounds great, but I'm afraid of high places. Someone wants to take the new cable car up the mountain with you this Sunday. The best reply is, Sounds great, but I'm afraid of high places. This reply says no to the idea and gives a reason.","enAudio":"96da19001705d0030d6f.mp3","wrong":{"A":{"text":"A說自己今天搭公車上學，由 take the cable car 聯想到搭車，沒有回應提議。","audio":"02d16afb9cf8ff867977.mp3"},"B":{"text":"B說自己住在山的附近，只接著 mountain，沒有回應提議。","audio":"b2b03f2c21d5b4de4ac6.mp3"}}},{"id":"L085-Q09","type":"言談理解","point":"明確訊息","unit":"U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號18 beach；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號13 Saturday、16 weekend、14 Sunday；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay、47 feel；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號23 doctor；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號30 museum","difficulty":"中","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"How was the beach on Saturday?","audio":"6ec5f69bbaf3433e49db.mp3","zh":"女孩：星期六的海邊怎麼樣？"},{"speaker":"Boy","text":"We didn't go. My little brother had a fever.","audio":"f61118244c0fe3574143.mp3","zh":"男孩：我們沒去。我弟弟發燒了。"},{"speaker":"Girl","text":"Oh, no. So you stayed home all weekend?","audio":"00446a02266167b69194.mp3","zh":"女孩：噢，不會吧。所以你們整個週末都待在家？"},{"speaker":"Boy","text":"Not really. On Saturday, we took him to the doctor. On Sunday, he felt much better, so we went to the science museum.","audio":"74670f327b5904c5b3c6.mp3","zh":"男孩：也不是。星期六我們帶他去看醫生。星期日他好多了，所以我們去了科學博物館。"}],"question":{"text":"Where did the boy go on Sunday?","audio":"5a5297610a3fe783c6da.mp3","zh":"男孩星期日去了哪裡？"},"options":{"A":{"text":"To the beach.","letterAudio":"93138ad65b3704914636.mp3","audio":"4016da2c67d0d3c9aed7.mp3","zh":"去海邊。","letterEnd":0.537},"B":{"text":"To the science museum.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e25731a1eea83a0a2f5e.mp3","zh":"去科學博物館。","letterEnd":0.588},"C":{"text":"To the doctor's office.","letterAudio":"9756927a5f3791737934.mp3","audio":"e26be863f71084553e95.mp3","zh":"去診所。","letterEnd":0.713}},"answer":"B","keyLines":[3],"evidence":"男孩說星期日弟弟好多了，「so we went to the science museum」，所以他星期日去了科學博物館。","zhCorrect":"509e16126dc6b14ae989.mp3","enText":"The answer is B. To the science museum. The boy didn't go to the beach, because his little brother had a fever. On Saturday, the boy's family took his brother to the doctor. On Sunday, the family went to the science museum. So the boy went to the science museum on Sunday.","enAudio":"22d720acb2832a0f2438.mp3","wrong":{"A":{"text":"A男孩說他們沒有去海邊。","audio":"15a7eaea5bee1d3b9175.mp3"},"C":{"text":"C他們是星期六帶弟弟去看醫生，不是星期日。","audio":"00b2c4579a3b9cc0cef1.mp3"}}},{"id":"L085-Q10","type":"言談理解","point":"明確訊息","unit":"U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號30 breakfast；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號6 second；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號7 pool；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號81 open；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號50 tonight；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號98 free；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號3 market；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號37 leave；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號61 door","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good morning, guests. Breakfast is served on the second floor from six thirty to ten. The swimming pool on the roof opens at eight. Tonight, there is a free bus to the night market. It leaves from the front door at six and comes back at nine. Have a nice day!","audio":"35e0cf3caab3013a4469.mp3","zh":"各位房客早安。早餐在二樓供應，時間是六點半到十點。屋頂的游泳池八點開放。今天晚上有一班開往夜市的免費巴士。它六點從大門口出發，九點回來。祝大家有美好的一天！"}],"question":{"text":"Where can guests get on the free bus?","audio":"65f67a0c903b2e07dbb8.mp3","zh":"房客可以在哪裡搭上免費巴士？"},"options":{"A":{"text":"On the second floor.","letterAudio":"93138ad65b3704914636.mp3","audio":"93bab8728c99a1df626f.mp3","zh":"在二樓。","letterEnd":0.537},"B":{"text":"On the roof.","letterAudio":"609555d8760f27caf21b.mp3","audio":"d71a910fa3a65c554532.mp3","zh":"在屋頂。","letterEnd":0.588},"C":{"text":"At the front door.","letterAudio":"9756927a5f3791737934.mp3","audio":"f95f90a4e16c951b5d13.mp3","zh":"在大門口。","letterEnd":0.713}},"answer":"C","keyLines":[0],"evidence":"廣播說免費巴士「leaves from the front door at six」，所以要在大門口上車。","zhCorrect":"95e6d30fda16669424a3.mp3","enText":"The answer is C. At the front door. Breakfast is on the second floor, and the swimming pool is on the roof. The free bus to the night market leaves from the front door at six. So guests can get on the bus at the front door.","enAudio":"b17f5f04fd9a21d8f6e1.mp3","wrong":{"A":{"text":"A二樓是吃早餐的地方。","audio":"ca4cf4bff9e95c6946f9.mp3"},"B":{"text":"B屋頂是游泳池的位置。","audio":"1b98cb93e9b58221889d.mp3"}}},{"id":"L085-Q11","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號45 like；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號44 useful；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號33 homework；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號39 news；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號32 fun、45 send；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號44 share；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號69 picture；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"Our class has a group chat now. Do you like it?","audio":"5028836c0619bd4256d8.mp3","zh":"女孩：我們班現在有一個群組聊天室。你喜歡嗎？"},{"speaker":"Boy","text":"It's useful for homework news.","audio":"92e1356659df89e25e45.mp3","zh":"男孩：要知道作業的消息很有用。"},{"speaker":"Girl","text":"And it's fun to share pictures.","audio":"12af95f93665659d69cb.mp3","zh":"女孩：而且分享照片很好玩。"},{"speaker":"Boy","text":"Sure, but people send messages at midnight, and my phone keeps waking me up. I turn it off at ten now.","audio":"3d52932a44d6dac190ac.mp3","zh":"男孩：是沒錯，可是有人半夜還在傳訊息，我的手機一直把我吵醒。我現在十點就關機。"}],"question":{"text":"What does the boy think about the group chat?","audio":"5963670030d715f495f8.mp3","zh":"男孩覺得班上的群組聊天室怎麼樣？"},"options":{"A":{"text":"It is only good for sharing pictures.","letterAudio":"93138ad65b3704914636.mp3","audio":"0020cf0329a23ba773d6.mp3","zh":"它只適合分享照片。","letterEnd":0.537},"B":{"text":"It doesn't help with homework.","letterAudio":"609555d8760f27caf21b.mp3","audio":"34812894ddf1e7710f0a.mp3","zh":"它對作業沒有幫助。","letterEnd":0.588},"C":{"text":"It is useful, but not at night.","letterAudio":"9756927a5f3791737934.mp3","audio":"269d7ef727f321e7c683.mp3","zh":"它很有用，但晚上就不是了。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說群組對作業消息很有用，但有人半夜傳訊息，手機一直把他吵醒，可見他覺得群組有用，但晚上就不是了。","zhCorrect":"6d22341a2601207049d6.mp3","enText":"The answer is C. It is useful, but not at night. The boy says the group chat is useful for homework news. But people send messages at midnight, and his phone keeps waking him up. So the boy thinks the group chat is useful, but not at night.","enAudio":"048e68f0d8ec41bb913c.mp3","wrong":{"A":{"text":"A說分享照片很好玩的是女孩，男孩也說群組對作業很有用。","audio":"86ddbb04456448c623aa.mp3"},"B":{"text":"B男孩說群組對作業消息很有用，與選項相反。","audio":"5f0bb5679cc1a00fbbdc.mp3"}}},{"id":"L085-Q12","type":"言談理解","point":"明確訊息","unit":"U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號53 sell；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號110 old；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號34 bicycle / bike；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think、57 start；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號13 cousin；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Boy","text":"Are you selling your old bike?","audio":"abe4b9dda11b26237f83.mp3","zh":"男孩：你要賣掉你的舊腳踏車嗎？"},{"speaker":"Girl","text":"I thought about it, but no.","audio":"d88377921294adfcca0f.mp3","zh":"女孩：我想過，可是沒有要賣。"},{"speaker":"Boy","text":"Then are you going to keep it?","audio":"9dd76fe0e31842475ec2.mp3","zh":"男孩：那你要留著它嗎？"},{"speaker":"Girl","text":"My mom wanted to keep it in the garage, but it takes up too much space. My cousin is starting junior high, so I'm giving it to her.","audio":"b130bf155cacb7230320.mp3","zh":"女孩：我媽媽想把它留在車庫，可是它太占空間了。我表妹要上國中了，所以我要把它送給她。"}],"question":{"text":"What will the girl do with her old bike?","audio":"f43f8e5f126b0a33b12b.mp3","zh":"女孩要怎麼處理她的舊腳踏車？"},"options":{"A":{"text":"Give it to her cousin.","letterAudio":"93138ad65b3704914636.mp3","audio":"b34abab2689ba82c055a.mp3","zh":"送給她表妹。","letterEnd":0.537},"B":{"text":"Sell it.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e1db32070a4f91ae03e7.mp3","zh":"賣掉。","letterEnd":0.588},"C":{"text":"Keep it in the garage.","letterAudio":"9756927a5f3791737934.mp3","audio":"852ad242d4d25481650e.mp3","zh":"留在車庫裡。","letterEnd":0.713}},"answer":"A","keyLines":[3],"evidence":"女孩說表妹（堂妹）要上國中了，「so I'm giving it to her」，所以她要把舊腳踏車送給表妹（堂妹）。","zhCorrect":"e4908df6657c899f1f5d.mp3","enText":"The answer is A. Give it to her cousin. The girl thought about selling her old bike, but she isn't selling it. Her mom wanted to keep the bike in the garage, but the bike takes up too much space. The girl's cousin is starting junior high, so the girl is giving the bike to her.","enAudio":"5e803c713a2cc981db1a.mp3","wrong":{"B":{"text":"B女孩說她想過要賣，但沒有要賣。","audio":"e70392bb20d3ed6acecd.mp3"},"C":{"text":"C想把腳踏車留在車庫的是媽媽，但女孩說它太占空間。","audio":"7f2a747f499388c1fbb1.mp3"}}},{"id":"L085-Q13","type":"言談理解","point":"情境／地點推論","unit":"U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號24 money；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號45 thousand、44 dollar；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號48 write；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號44 number、41 book；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號116 here；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號71 sign、59 name；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號78 thank；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號68 little；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號54 show；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號2 bank、5 bookstore、4 supermarket","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Boy","text":"Hi. I'd like to put this money in my account.","audio":"158e7f724b516c44915a.mp3","zh":"男孩：您好。我想把這些錢存進我的帳戶。"},{"speaker":"Woman","text":"Sure. How much is it?","audio":"69fc6f9f0c8ef58d1138.mp3","zh":"女士：好的。是多少錢？"},{"speaker":"Boy","text":"Three thousand dollars. It's my red envelope money.","audio":"354e57a3757081319c9e.mp3","zh":"男孩：三千元。這是我的紅包錢。"},{"speaker":"Woman","text":"Please write the number here and sign your name.","audio":"81ad1d6ff274ce0eb2a2.mp3","zh":"女士：請在這裡寫下金額，並簽上你的名字。"},{"speaker":"Boy","text":"OK. Here you are.","audio":"db6a2491456a541afea7.mp3","zh":"男孩：好。給您。"},{"speaker":"Woman","text":"Thank you. Here's your little book back. It shows three thousand more now.","audio":"40f60a8ab7e7bf449d49.mp3","zh":"女士：謝謝。這是你的小本子，還給你。上面現在多了三千元。"}],"question":{"text":"Where are they most likely?","audio":"c29fc0a63955a6b6afe5.mp3","zh":"他們最有可能在哪裡？"},"options":{"A":{"text":"At a supermarket.","letterAudio":"93138ad65b3704914636.mp3","audio":"8e17a5e9f17c1acfc239.mp3","zh":"在超市。","letterEnd":0.537},"B":{"text":"At a bank.","letterAudio":"609555d8760f27caf21b.mp3","audio":"7430568c8632ac500689.mp3","zh":"在銀行。","letterEnd":0.588},"C":{"text":"At a bookstore.","letterAudio":"9756927a5f3791737934.mp3","audio":"7767396168ec8f2643d2.mp3","zh":"在書店。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男孩說想把錢存進自己的帳戶，女士請他寫下金額、簽名，再把顯示多了三千元的小本子還給他，可知他們最有可能在銀行。","zhCorrect":"e186e6331a78bd15819c.mp3","enText":"The answer is B. At a bank. The boy wants to put his money in his account. The woman asks him to write the number and sign his name. Then the woman gives back his little book, and the book shows three thousand more. So they are most likely at a bank.","enAudio":"7ad298fcbefb280c8578.mp3","wrong":{"A":{"text":"A超市也會用到錢，但男孩是要把錢存進自己的帳戶，不是買東西。","audio":"94022a4a1b36dbd0c12c.mp3"},"C":{"text":"C由 little book 聯想到書店，但那個小本子是記錄錢的本子，男孩不是在買書。","audio":"cadbe40f5c9853896b74.mp3"}}},{"id":"L085-Q14","type":"言談理解","point":"整體訊息","unit":"U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號68 video；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號68 little、67 each；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號49 dog；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號46 move；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號15 week、7 minute；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號63 real；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Boy","text":"Was that your video on the class website?","audio":"363e34584c96471fe888.mp3","zh":"男孩：班級網站上的那支影片是你做的嗎？"},{"speaker":"Girl","text":"Yes! I made some little clay dogs, and I moved them a tiny bit for each photo.","audio":"26d3731053820a15a36e.mp3","zh":"女孩：對！我做了幾隻小小的黏土狗，每拍一張照片，就把牠們移動一點點。"},{"speaker":"Boy","text":"How many photos did you take?","audio":"5662ae5d148e6610460d.mp3","zh":"男孩：你拍了幾張照片？"},{"speaker":"Girl","text":"About six hundred. It took me two weeks, but the video is only one minute long.","audio":"bc51675f1d83f729282a.mp3","zh":"女孩：大約六百張。花了我兩個星期，可是影片只有一分鐘長。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"A clay video the girl made.","letterAudio":"93138ad65b3704914636.mp3","audio":"1e0d5c40f94b7837b06d.mp3","zh":"女孩做的一支黏土影片。","letterEnd":0.537},"B":{"text":"The class's new website.","letterAudio":"609555d8760f27caf21b.mp3","audio":"f0c2534e740b14aca358.mp3","zh":"班上的新網站。","letterEnd":0.588},"C":{"text":"Photos of real dogs in the park.","letterAudio":"9756927a5f3791737934.mp3","audio":"3c5e1513054e513589f5.mp3","zh":"公園裡真的狗的照片。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男孩問班級網站上的影片，女孩說是她用黏土狗一張一張拍出來的，拍了大約六百張、花了兩個星期，影片只有一分鐘。整段在談女孩做的黏土影片。","zhCorrect":"4f70974949702d689b6f.mp3","enText":"The answer is A. A clay video the girl made. The girl made little clay dogs and moved them a tiny bit for each photo. She took about six hundred photos in two weeks, and the video is one minute long. The girl and the boy are talking about a clay video the girl made.","enAudio":"2c0e63a4dece9aa28f66.mp3","wrong":{"B":{"text":"B班級網站只是放影片的地方，是細節；原文也沒有說網站是新的。","audio":"7e33082298d38cb28ff9.mp3"},"C":{"text":"C女孩拍的是自己做的黏土狗，不是公園裡真的狗。","audio":"573ac43ce2e1dd1fd113.mp3"}}},{"id":"L085-Q15","type":"言談理解","point":"語境猜義","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號105 tall、110 old、108 close；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號26 thing、31 factory；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號48 black；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號71 top；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號117 there；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號33 year；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號71 ago；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U09｜九、閱讀與題組補充單字（總表未逐項標頁；U09 教材頁 pp.183～203）｜smokestack","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"Grandpa, what's that tall thing in this old photo?","audio":"a98fd88a6d7820768ef8.mp3","zh":"女孩：爺爺，這張舊照片裡那個高高的東西是什麼？"},{"speaker":"Grandpa","text":"That's the smokestack of the old paper factory. Black smoke came out of the top all day.","audio":"131d9c48537d780edf24.mp3","zh":"爺爺：那是舊造紙工廠的 smokestack（煙囪）。黑煙整天從最上面冒出來。"},{"speaker":"Girl","text":"Is it still there?","audio":"385df5f5646d0186e3e2.mp3","zh":"女孩：它還在嗎？"},{"speaker":"Grandpa","text":"No. The factory closed twenty years ago, and the air is much cleaner now.","audio":"785da339afed883856d2.mp3","zh":"爺爺：不在了。工廠二十年前就關了，現在空氣乾淨多了。"}],"question":{"text":"What does Grandpa mean by \"smokestack\"?","audio":"7d8eccfc4b5d21c72e13.mp3","zh":"爺爺說的 \"smokestack\" 是什麼意思？"},"options":{"A":{"text":"A tall pipe for smoke.","letterAudio":"93138ad65b3704914636.mp3","audio":"0f04d4babbeb4847b091.mp3","zh":"排煙的高管子。","letterEnd":0.537},"B":{"text":"A pile of old paper.","letterAudio":"609555d8760f27caf21b.mp3","audio":"a64e55a64cb2cd43bb91.mp3","zh":"一堆舊紙。","letterEnd":0.588},"C":{"text":"A worker at a factory.","letterAudio":"9756927a5f3791737934.mp3","audio":"8e16ccd7a873c1cb22cc.mp3","zh":"工廠的工人。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"爺爺說 smokestack 是照片裡那個高高的東西，黑煙整天從它的最上面冒出來，可知 smokestack 是讓煙排出去的高煙囪。","zhCorrect":"a7b68015a698725bb8dd.mp3","enText":"The answer is A. A tall pipe for smoke. The girl asks about the tall thing in the old photo. Grandpa says black smoke came out of the top of it all day. So when Grandpa says smokestack, he means a tall pipe for smoke.","enAudio":"c615562bd684ada3217b.mp3","wrong":{"B":{"text":"B由 paper factory 聯想到一堆紙，但爺爺說的是高高的、會冒煙的東西。","audio":"83489d5a81675f8ed137.mp3"},"C":{"text":"C由 factory 聯想到工廠工人，但女孩問的是照片裡那個高高的東西。","audio":"244f1fd6ef88f4b8ada6.mp3"}}},{"id":"L085-Q16","type":"言談理解","point":"說話者意見","unit":"U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號3 market；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號20 food；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號70 cheap、69 expensive；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號60 until；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號37 street；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號45 smell；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號92 sleep；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號44 love；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號63 noisy","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Boy","text":"There's a night market next to your apartment now. Isn't that great?","audio":"e7ea13518be3f075eef7.mp3","zh":"男孩：你家公寓旁邊現在有一個夜市了。那不是很棒嗎？"},{"speaker":"Girl","text":"The food is cheap and good, I guess. But it's so loud until midnight, and the whole street smells like stinky tofu. I can't sleep.","audio":"67848ffb31a530a093e6.mp3","zh":"女孩：東西是便宜又好吃啦。可是它吵到半夜，整條街都是臭豆腐的味道。我睡不著。"},{"speaker":"Boy","text":"Really? I thought you'd love it.","audio":"4d529e4a1638a94dd565.mp3","zh":"男孩：真的嗎？我以為你會很喜歡。"}],"question":{"text":"What does the girl think about the night market?","audio":"4de7a1fd3655151f9fb9.mp3","zh":"女孩覺得這個夜市怎麼樣？"},"options":{"A":{"text":"It is great for her family.","letterAudio":"93138ad65b3704914636.mp3","audio":"20dfab81b38bf5c37e38.mp3","zh":"對她家來說很棒。","letterEnd":0.537},"B":{"text":"It is too noisy for her.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b9b40b999b4454cd33d3.mp3","zh":"對她來說太吵了。","letterEnd":0.588},"C":{"text":"It is too expensive for her.","letterAudio":"9756927a5f3791737934.mp3","audio":"7ed38026465a065da80d.mp3","zh":"對她來說太貴了。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說夜市吵到半夜，整條街都是臭豆腐的味道，她睡不著，可見她覺得夜市對她來說太吵了。","zhCorrect":"420e80ce45477927fa03.mp3","enText":"The answer is B. It is too noisy for her. The girl says the food at the night market is cheap and good. But the night market is loud until midnight, and the girl can't sleep. So the girl thinks the night market is too noisy for her.","enAudio":"5f2d7d95a21992544413.mp3","wrong":{"A":{"text":"A覺得很棒的是男孩，女孩說的是夜市讓她睡不著。","audio":"4d13a57d31ccaedc82b6.mp3"},"C":{"text":"C女孩說那裡的東西便宜又好吃，沒有說太貴。","audio":"82e17214b5eb0f261b9d.mp3"}}},{"id":"L085-Q17","type":"言談理解","point":"明確訊息","unit":"U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號56 borrow、52 want；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family、9 brother、6 son；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號13 Saturday、32 month、15 week；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號89 clean；U02｜核心單字「介系詞」｜教材印刷頁 p.33｜核心編號118 before；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號1 season；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號75 usually；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號83 use、78 thank；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號51 paint；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號39 house、42 kitchen；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號34 fix","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Ben. This is Mrs. Huang from next door. Could I borrow your family's ladder this Saturday? There are a lot of leaves on my roof, and I want to clean them off before the rainy season. I usually use my brother's ladder. I used it to paint my house last month, but now he's in Tainan with it. My kitchen light is broken too, but my son will fix that next week. I'll come and get the ladder at nine. Thanks!","audio":"3be91bb5e280e1a83bfa.mp3","zh":"嗨，Ben。我是隔壁的黃太太。這個星期六我可以借你們家的梯子嗎？我的屋頂上有很多葉子，我想在雨季以前把它們清掉。我平常都用我兄弟的梯子。上個月我還用它油漆我的房子，可是他現在帶著梯子在臺南。我廚房的燈也壞了，不過我兒子下星期會修。我九點會過去拿梯子。謝謝！"}],"question":{"text":"Why does Mrs. Huang want to borrow the ladder?","audio":"ebce8cb0b5c902d7909a.mp3","zh":"黃太太為什麼想借梯子？"},"options":{"A":{"text":"To fix the light in her kitchen.","letterAudio":"93138ad65b3704914636.mp3","audio":"1669ea45bc194e504a93.mp3","zh":"為了修她廚房的燈。","letterEnd":0.537},"B":{"text":"To paint her house again.","letterAudio":"609555d8760f27caf21b.mp3","audio":"2649128a1807f7d4f489.mp3","zh":"為了再油漆一次她的房子。","letterEnd":0.588},"C":{"text":"To clean the leaves off her roof.","letterAudio":"9756927a5f3791737934.mp3","audio":"5de7ebc4de82057095b2.mp3","zh":"為了清掉屋頂上的葉子。","letterEnd":0.713}},"answer":"C","keyLines":[0],"evidence":"黃太太說「There are a lot of leaves on my roof, and I want to clean them off」，所以她要借梯子清掉屋頂上的葉子。","zhCorrect":"54e69e9bcf6293b3c3e1.mp3","enText":"The answer is C. To clean the leaves off her roof. Mrs. Huang wants to borrow the ladder because there are a lot of leaves on her roof. She painted her house last month, and her son will fix the kitchen light. So she wants the ladder to clean the leaves off her roof.","enAudio":"b9fed3e61fa4090c1da8.mp3","wrong":{"A":{"text":"A廚房的燈下星期由她兒子修，不是她借梯子的原因。","audio":"8f3010a24c83001407f1.mp3"},"B":{"text":"B油漆房子是上個月用兄弟的梯子做的事。","audio":"e78ab75f93906dc4a6d8.mp3"}}},{"id":"L085-Q18","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class、33 school、41 book；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號48 write、45 send、2 spring、31 trip；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號17 student；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號14 mountain；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號106 many；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號43 visit；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號57 play；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號19 basketball、16 game；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號112 together；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號29 cup；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號74 each other；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號32 month","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last year, our class wrote letters to students at a small school in the mountains of Taitung. They wrote back and told us they didn't have many books. So we collected three hundred books and sent them. This spring, they invited us to visit. We played basketball together, and they showed us how to make cups out of bamboo. Now we write to each other every month.","audio":"576da422ee3fd33bf24a.mp3","zh":"去年，我們班寫信給臺東山上一所很小的學校的學生。他們回信告訴我們，他們沒有很多書。所以我們收集了三百本書寄過去。今年春天，他們邀請我們去拜訪。我們一起打籃球，他們還教我們怎麼用竹子做杯子。現在我們每個月都互相寫信。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"A class trip to make bamboo cups.","letterAudio":"93138ad65b3704914636.mp3","audio":"5814f560fe489619e19b.mp3","zh":"去做竹杯的班級旅行。","letterEnd":0.537},"B":{"text":"Letters and books that connected two schools.","letterAudio":"609555d8760f27caf21b.mp3","audio":"a7ae45d665ded8835d23.mp3","zh":"讓兩所學校連結在一起的信和書。","letterEnd":0.588},"C":{"text":"A basketball game in Taitung.","letterAudio":"9756927a5f3791737934.mp3","audio":"4e1efa8ad5310606e5e4.mp3","zh":"在臺東的一場籃球比賽。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"說話者的班級寫信給臺東山上的學校，知道他們書不多就寄了三百本書，後來受邀去拜訪，現在每個月互相寫信。整段在談信和書讓兩所學校連結在一起。","zhCorrect":"a90c5110dc522dc4607a.mp3","enText":"The answer is B. Letters and books that connected two schools. The speaker's class wrote letters to students at a small school in Taitung. The class sent three hundred books, and later the class visited the school. Now the two schools write to each other every month. The talk is about letters and books that connected two schools.","enAudio":"97016ab9fdfae7febf70.mp3","wrong":{"A":{"text":"A做竹杯只是拜訪時的一件事，是細節。","audio":"b3576295a7a58d19e28f.mp3"},"C":{"text":"C一起打籃球也只是拜訪時的一件事，是細節。","audio":"6ed4bacb7c901d92e766.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L085/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
