<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>

n bring it tomorrow. Someone says sorry for forgetting to bring back your comic book. The best reply is, That's OK. You can bring it tomorrow. This reply accepts the apology.","enAudio":"970cfd34537ce633de9e.mp3","wrong":{"A":{"text":"A說自己兩年前看過那本漫畫書，只接著 comic book，沒有回應道歉。","audio":"ae36c2d402f8ced0d17d.mp3"},"B":{"text":"B說那本書是在書店買的、很便宜，只由書聯想，沒有回應道歉。","audio":"d50713d3047809dbf5b7.mp3"}}},{"id":"L059-Q08","type":"基本問答","point":"接受／拒絕","unit":"U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want、51 eat；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號11 noodle；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號56 finish；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號22 cook；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號1 time、18 day；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號31 lunch；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every","difficulty":"易","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"Do you want some of my fried noodles? I can't finish them.","audio":"57e92c316ed0e094c1e8.mp3","zh":"你要不要吃一些我的炒麵？我吃不完。"}],"question":null,"options":{"A":{"text":"Oh, my dad cooks fried noodles. They're great.","letterAudio":"93138ad65b3704914636.mp3","audio":"d322eb5c87b6c5e88dd9.mp3","zh":"噢，我爸爸會煮炒麵。很好吃。","letterEnd":0.537},"B":{"text":"Oh, yes, please. I didn't have time for lunch.","letterAudio":"609555d8760f27caf21b.mp3","audio":"95e226e40e20fced163d.mp3","zh":"噢，好啊，麻煩你了。我沒時間吃午餐。","letterEnd":0.588},"C":{"text":"I eat lunch at school every day.","letterAudio":"9756927a5f3791737934.mp3","audio":"ccf0082520d7c8422754.mp3","zh":"我每天在學校吃午餐。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"對方問自己要不要吃一些炒麵，說吃不完；B說好，麻煩了，自己沒時間吃午餐，是接受的說法。","zhCorrect":"7087917eb5250ca7e7e8.mp3","enText":"The answer is B. Oh, yes, please. I didn't have time for lunch. Someone offers you some fried noodles. The best reply is, Oh, yes, please. I didn't have time for lunch. This reply accepts the offer.","enAudio":"e3c8008e9192d5a4b3bd.mp3","wrong":{"A":{"text":"A說自己的爸爸會煮炒麵、很好 :"29365121c217f094fdbe.mp3","zh":"給女孩爸爸的一個大籃子。","letterEnd":0.588},"C":{"text":"A long bike ride to the uncle's house.","letterAudio":"9756927a5f3791737934.mp3","audio":"e7ab2a35442715417d0d.mp3","zh":"一趟騎到叔叔（舅舅）家的長途車程。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"女孩說星期日現在是她家的無車日，到哪裡都走路或騎腳踏車，連去市場也是，上星期還騎到叔叔（舅舅）家。整段在談女孩家星期日不開車的做法。","zhCorrect":"84199f3d1d8a3812eaaf.mp3","enText":"The answer is A. The girl's family's car-free Sundays. The girl says Sunday is her family's car-free day. Her family walks or rides bikes everywhere, even to the market. The boy and the girl are talking about the girl's family's car-free Sundays.","enAudio":"2ddb522c6b0beb6e78d1.mp3","wrong":{"B":{"text":"B爸爸在腳踏車上裝大籃子只是其中一個細節。","audio":"1d645a0a953c9b3dd3e3.mp3"},"C":{"text":"C騎到叔叔（舅舅）家只是上星期的一次出遊，是細節，不是整段主旨。","audio":"fb8022a7aa4cdf7c1b61.mp3"}}},{"id":"L059-Q10","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號79 welcome；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號31 trip、38 jacket、46 buy；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take、53 sell；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink、5 snack；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號108 close；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號37 boat；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號37 leave、46 move；U07｜核心單字「形容詞、副詞與其他詞類」｜教材印刷頁 p.136｜核心編號65 while；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay、49 tell；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號58 enjoy；U10｜九、題目、例句及閱讀補充片語「島嶼航線閱讀」｜教材印刷頁 p.219 sea bus","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good morning, passengers, and welcome to the sea bus to Green Island. The trip will take about fifty minutes. The shop on the first floor sells drinks and snacks, but it will close when the boat leaves. While the boat is moving, please stay in your seats. Your life jackets are under your seats. Put them on only when our staff tell you to. Thank you, and enjoy the trip.","audio":"d826022acb98b09dfc12.mp3","zh":"早安，各位乘客，歡迎搭乘前往綠島的交通船。航程大約五十分鐘。一樓的商店有賣飲料和點心，不過開船時就會關門。船行駛的時候，請坐在您的座位上。您的救生衣在座位下面。只有在我們的工作人員告訴您的時候才穿上。謝謝，祝您旅途愉快。"}],"question":{"text":"What should passengers do while the boat is moving?","audio":"60439d93514c731baaf6.mp3","zh":"船行駛時乘客應該做什麼？"},"options":{"A":{"text":"Buy drinks at the shop.","letterAudio":"93138ad65b3704914636.mp3","audio":"8c8009266f07371b9043.mp3","zh":"在商店買飲料。","letterEnd":0.537},"B":{"text":"Stay in their seats.","letterAudio":"609555d8760f27caf21b.mp3","audio":"1e67a63a9b6079871615.mp3","zh":"坐在他們的座位上。","letterEnd":0.588},"C":{"text":"Put on their life jackets.","letterAudio":"9756927a5f3791737934.mp3","audio":"b0a0d1ec775dabb5c83b.mp3","zh":"穿上他們的救生衣。","letterEnd":0.713}},"answer":"B","keyLines":[0],"evidence":"廣播說「While the boat is moving, please stay in your seats」，所以船行駛時乘客要坐在座位上。","zhCorrect":"28ec1efe8cb6e4c864a1.mp3","enText":"The answer is B. Stay in their seats. The shop will close when the boat leaves. While the boat is moving, passengers should stay in their seats. They put on their life jackets only when the staff tell them to.","enAudio":"cd02f21cf05df849cd30.mp3","wrong":{"A":{"text":"A一樓的商店在開船時就會關門，所以船行駛時不能去買飲料。","audio":"b935724eab00c28be6b7.mp3"},"C":{"text":"C救生衣在座位下面，只有工作人員說的時候才要穿上。","audio":"6262af31e9cb1601122c.mp3"}}},{"id":"L059-Q11","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new、98 good；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號38 place；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號17 soup；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great、105 next；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號1 meat；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號125 really；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號54 fresh；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號84 wait、81 open；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號38 hour；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號60 table；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號79 never、75 usually、82 then；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號1 time、3 afternoon；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號90 line；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號60 enough；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號20 food","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"You went to the new hot pot place on Main Street, right? How was it?","audio":"34b6ac8fcaed8941ba6b.mp3","zh":"女孩：你去過大街上那家新的火鍋店了，對吧？怎麼樣？"},{"speaker":"Boy","text":"The soup was great, and the meat was really fresh. But we waited an hour for a table.","audio":"c6dc553df7b41b003a70.mp3","zh":"男孩：湯很好喝，肉也很新鮮。不過我們等了一個小時才有位子。"},{"speaker":"Girl","text":"An hour? I'd never wait that long.","audio":"99e8e40992431a91b542.mp3","zh":"女孩：一個小時？我絕對不會等那麼久。"},{"speaker":"Boy","text":"Me neither, usually. Next time I'll go on a weekday afternoon. There's no line then.","audio":"62b500f7a93d3643592e.mp3","zh":"男孩：我通常也不會。下次我會平日下午去。那時候不用排隊。"}],"question":{"text":"What does the boy think about the hot pot place?","audio":"fc34c08873545835a3c1.mp3","zh":"男孩覺得那家火鍋店怎麼樣？"},"options":{"A":{"text":"It is not good enough to wait for.","letterAudio":"93138ad65b3704914636.mp3","audio":"ba6449796e2dd7e06d54.mp3","zh":"它沒有好到值得等。","letterEnd":0.537},"B":{"text":"It has food worth going back for.","letterAudio":"609555d8760f27caf21b.mp3","audio":"14e03b6dd86fe40a1cf6.mp3","zh":"它的食物值得再去吃。","letterEnd":0.588},"C":{"text":"It is only open on weekday afternoons.","letterAudio":"9756927a5f3791737934.mp3","audio":"d0b5bb21615c41e14ae9.mp3","zh":"它只在平日下午營業。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男孩說湯很好喝、肉很新鮮，雖然等了一個小時，還說下次要平日下午再去，可見他覺得那家店的食物值得再去吃。","zhCorrect":"683fafbaff9dac7e7789.mp3","enText":"The answer is B. It has food worth going back for. The boy says the soup was great and the meat was really fresh. He waited an hour for a table, but he will go again on a weekday afternoon. He thinks the food is worth going back for.","enAudio":"c2ef046e4355dd11a00b.mp3","wrong":{"A":{"text":"A說絕對不會等那麼久的是女孩；男孩雖然附和，但打算下次再去。","audio":"c1bdcfbce01d8b7f2f1f.mp3"},"C":{"text":"C男孩只說平日下午不用排隊，沒有說那家店只在平日下午營業。","audio":"9b51b03edba6f318554d.mp3"}}},{"id":"L059-Q12","type":"言談理解","point":"明確訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號20 club、52 think、19 lesson；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號52 join；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號107 full；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號84 meet；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號9 Tuesday；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號82 then","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Boy","text":"Which club did you join? The dance club?","audio":"1da77e82b0a27c6d085a.mp3","zh":"男孩：你參加了哪個社團？舞蹈社嗎？"},{"speaker":"Girl","text":"No, it was full. I'm in the photo club with Amy now.","audio":"804b505b885ae7816fe9.mp3","zh":"女孩：沒有，舞蹈社額滿了。我現在和 Amy 一起參加攝影社。"},{"speaker":"Boy","text":"Oh. I thought you wanted to join the cooking club.","audio":"07835b79523c2aa3be13.mp3","zh":"男孩：噢。我以為你想參加烹飪社。"},{"speaker":"Girl","text":"I did, but it meets on Tuesdays, and I have swimming lessons then.","audio":"08d55e284faf1bdd2d05.mp3","zh":"女孩：我是想啊，可是它星期二聚會，我那時候要上游泳課。"}],"question":{"text":"Which club is the girl in now?","audio":"75850dfe4a2dc9c2730c.mp3","zh":"女孩現在參加哪個社團？"},"options":{"A":{"text":"The cooking club.","letterAudio":"93138ad65b3704914636.mp3","audio":"c7202bdfef207349b199.mp3","zh":"烹飪社。","letterEnd":0.537},"B":{"text":"The dance club.","letterAudio":"609555d8760f27caf21b.mp3","audio":"63ed7cefb0dc5e318ac0.mp3","zh":"舞蹈社。","letterEnd":0.588},"C":{"text":"The photo club.","letterAudio":"9756927a5f3791737934.mp3","audio":"dc96a3648541cb4d303c.mp3","zh":"攝影社。","letterEnd":0.713}},"answer":"C","keyLines":[1],"evidence":"女孩說「I'm in the photo club with Amy now」，所以她現在參加的是攝影社。","zhCorrect":"6ec154c77c50732f7a1b.mp3","enText":"The answer is C. The photo club. The dance club was full. The girl wanted to join the cooking club, but it meets on Tuesdays, and she has swimming lessons then. She is in the photo club with Amy now.","enAudio":"b0d982af75e7b77740c0.mp3","wrong":{"A":{"text":"A女孩原本想參加烹飪社，但烹飪社星期二聚會，她那時要上游泳課。","audio":"6cf180640d102298b733.mp3"},"B":{"text":"B舞蹈社是男孩猜的，女孩說舞蹈社已經額滿了。","audio":"978d2dde8cbc8b406a50.mp3"}}},{"id":"L059-Q13","type":"言談理解","point":"情境／地點推論","unit":"U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號20 shoe；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號54 green；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號40 order；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號10 fries / French fries；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號9 restaurant","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Man","text":"What size shoes do you need?","audio":"0c0e8d1de6c42e05cd6c.mp3","zh":"男士：你們需要幾號的鞋？"},{"speaker":"Girl","text":"Twenty-four, please. And twenty-six for my brother.","audio":"2d0b48bc8ef7b41a90d4.mp3","zh":"女孩：二十四號，麻煩你。我弟弟（哥哥）要二十六號。"},{"speaker":"Man","text":"Here you go. You're on Lane 6. Try the green balls first. They're lighter.","audio":"2ae9ee8351a57d12987a.mp3","zh":"男士：給你們。你們在六號球道。先試試綠色的球。它們比較輕。"},{"speaker":"Girl","text":"Thanks. Can we order fries here?","audio":"a31fa38dbec5fce5825c.mp3","zh":"女孩：謝謝。我們可以在這裡點薯條嗎？"},{"speaker":"Man","text":"Yes, at the counter. We'll bring them to your lane.","audio":"f113d2b70948f33b2a5b.mp3","zh":"男士：可以，在櫃臺點。我們會把它們送到你們的球道。"}],"question":{"text":"Where are they most likely?","audio":"c29fc0a63955a6b6afe5.mp3","zh":"他們最有可能在哪裡？"},"options":{"A":{"text":"At a bowling center.","letterAudio":"93138ad65b3704914636.mp3","audio":"8b1b067cf05c5eec1c21.mp3","zh":"在保齡球館。","letterEnd":0.537},"B":{"text":"At a shoe store.","letterAudio":"609555d8760f27caf21b.mp3","audio":"7eb49dfc1fddaedca2de.mp3","zh":"在鞋店。","letterEnd":0.588},"C":{"text":"At a fast food restaurant.","letterAudio":"9756927a5f3791737934.mp3","audio":"6dc01f0f57f96b8c77cb.mp3","zh":"在速食店。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男士問鞋子尺寸、告訴女孩他們在六號球道、要她先試比較輕的綠色球，還說薯條會送到球道，可知他們在保齡球館。","zhCorrect":"3fa5bd42e743f6b037c7.mp3","enText":"The answer is A. At a bowling center. The man asks about shoe sizes and tells the girl they are on Lane 6. He tells her to try the lighter green balls first. They are most likely at a bowling center.","enAudio":"e8bb1bd55856a28433ec.mp3","wrong":{"B":{"text":"B男士雖然問鞋子尺寸，但接著說球道和球，不是在賣鞋。","audio":"4186c1f868cc2189cc57.mp3"},"C":{"text":"C女孩雖然要點薯條，但薯條是在櫃臺點、再送到球道，他們主要不是在速食店吃東西。","audio":"dc6f436d39839b47ed72.mp3"}}},{"id":"L059-Q14","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號72 umbrella；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start、7 rain、61 rainy；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號105 next；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號18 day；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號110 old、109 new；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get、56 borrow；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號45 sale；U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號28 member；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號17 student","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Girl","text":"Did you see the box of umbrellas by the school gate?","audio":"ee2bfda79a34b7bc05f8.mp3","zh":"女孩：你有看到校門口那一箱傘嗎？"},{"speaker":"Boy","text":"Yes. What is it for?","audio":"e4f01b704371a63d3dde.mp3","zh":"男孩：有。那是做什麼用的？"},{"speaker":"Girl","text":"If it starts to rain, you can take one and bring it back the next day.","audio":"4e0b6ec3197aac2ef193.mp3","zh":"女孩：如果開始下雨，你可以拿一把，隔天再帶回來。"},{"speaker":"Boy","text":"Where did all those umbrellas come from?","audio":"f2eaaec38d836b134687.mp3","zh":"男孩：那些傘都是從哪裡來的？"},{"speaker":"Girl","text":"The student council asked families for old ones. They got more than fifty.","audio":"4550e6d7b06c94bf5620.mp3","zh":"女孩：學生會向各家要舊傘。他們收到五十多把。"},{"speaker":"Boy","text":"Nice. I'll put my old one in, too.","audio":"92d1d1807ecf7df6243e.mp3","zh":"男孩：真好。我也要把我的舊傘放進去。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"Old umbrellas for sale near the school.","letterAudio":"93138ad65b3704914636.mp3","audio":"a66b704cba7d8c16e292.mp3","zh":"學校附近在賣的舊傘。","letterEnd":0.537},"B":{"text":"New members of the student council.","letterAudio":"609555d8760f27caf21b.mp3","audio":"80797f5299ca71ccce20.mp3","zh":"學生會的新成員。","letterEnd":0.588},"C":{"text":"Umbrellas students can borrow on rainy days.","letterAudio":"9756927a5f3791737934.mp3","audio":"0136e11aa152caf8affa.mp3","zh":"學生下雨天可以借的傘。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩說校門口有一箱傘，開始下雨時可以拿一把，隔天再帶回來；這些傘是學生會向各家要來的舊傘。整段在談學生下雨天可以借用的傘。","zhCorrect":"4481dfbebd74b712060c.mp3","enText":"The answer is C. Umbrellas students can borrow on rainy days. There is a box of umbrellas by the school gate. Students can take one when it starts to rain and bring it back the next day. The boy and the girl are talking about umbrellas students can borrow on rainy days.","enAudio":"e8a1954b55f1558971ba.mp3","wrong":{"A":{"text":"A傘是學生會向各家要來的舊傘，對話沒有說有人在賣傘。","audio":"09ef4d56b794a1e340b3.mp3"},"B":{"text":"B學生會只是收集舊傘的人，對話沒有談學生會的新成員。","audio":"6a04bc99e6c1f348260b.mp3"}}},{"id":"L059-Q15","type":"言談理解","point":"語境猜義","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號110 old、111 young；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號7 grandfather / grandpa；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號5 night；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號63 windy；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號40 fire；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號77 sometimes；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help、83 walk；U10｜九、題目、例句及閱讀補充片語「The Ban-Doh Culture：辦桌文化」｜教材印刷頁 p.220 torch","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"What's that long stick in this old photo?","audio":"7b2dea4a47dc3ba64861.mp3","zh":"女孩：這張舊照片裡那根長棍子是什麼？"},{"speaker":"Boy","text":"It's a torch. When my grandpa was young, his village had no street lights.","audio":"8d3e9ff0ae2347d48782.mp3","zh":"男孩：那是火把。我爺爺（外公）小時候，他的村子沒有路燈。"},{"speaker":"Girl","text":"So how did people get home at night?","audio":"d7520e8bb288a597b11d.mp3","zh":"女孩：那大家晚上怎麼回家？"},{"speaker":"Boy","text":"They lit a torch and carried it. But on windy nights, the fire sometimes went out.","audio":"33ed1891ecd97364616d.mp3","zh":"男孩：他們點燃火把拿著走。不過起風的晚上，火有時候會熄掉。"}],"question":{"text":"What does the boy mean by \"torch\"?","audio":"43aa519f690532e367d6.mp3","zh":"男孩說的 \"torch\" 是什麼意思？"},"options":{"A":{"text":"A lamp on the street.","letterAudio":"93138ad65b3704914636.mp3","audio":"53dcc5926d6ce484a700.mp3","zh":"街上的燈。","letterEnd":0.537},"B":{"text":"A stick to help old people walk.","letterAudio":"609555d8760f27caf21b.mp3","audio":"c2b72fc97fb4a3238599.mp3","zh":"幫助老人走路的棍子。","letterEnd":0.588},"C":{"text":"A stick with fire on it.","letterAudio":"9756927a5f3791737934.mp3","audio":"934ea41c61c81fa54b7f.mp3","zh":"上面有火的棍子。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說村子裡沒有路燈，晚上大家點燃 torch 拿著走回家，起風的晚上火有時會熄掉，所以 torch 是上面有火、用來照路的棍子，也就是火把。","zhCorrect":"4bc13ab8ca1b0b1cc86c.mp3","enText":"The answer is C. A stick with fire on it. The boy says his grandpa's village had no street lights. When people went home at night, they lit a torch and carried it, and on windy nights the fire sometimes went out. So when the boy says torch, he means a stick with fire on it.","enAudio":"87e84aaa4c62459e4227.mp3","wrong":{"A":{"text":"A男孩說村子裡沒有路燈，torch 是拿在手上的，不是街上的燈。","audio":"e89077ca4710ab55f284.mp3"},"B":{"text":"B torch 是點燃後拿著照路的，不是幫助老人走路的棍子。","audio":"eb393f6d2f5777c6c4e7.mp3"}}},{"id":"L059-Q16","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號1 cookie；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號93 look、83 use；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號113 beautiful、103 big；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號46 taste；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號28 glass；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water、14 sugar；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號122 maybe、124 too；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號105 next、97 great；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號1 time；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號62 sweet","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Boy","text":"My brother baked these cookies. Try one!","audio":"1170ed4ca91beaf20750.mp3","zh":"男孩：我哥哥（弟弟）烤了這些餅乾。吃一塊吧！"},{"speaker":"Girl","text":"Thanks. Wow, they look beautiful.","audio":"33656b9ebf775562530e.mp3","zh":"女孩：謝謝。哇，它們看起來好漂亮。"},{"speaker":"Boy","text":"And how do they taste?","audio":"47058cd112506c7aec75.mp3","zh":"男孩：那吃起來怎麼樣？"},{"speaker":"Girl","text":"Hmm... I'll need a big glass of water. Maybe your brother can use less sugar next time.","audio":"31c3022316a6a34f3993.mp3","zh":"女孩：嗯……我需要一大杯水。也許你哥哥（弟弟）下次可以少放一點糖。"}],"question":{"text":"What does the girl think about the cookies?","audio":"3db6a85adc451d1a6a51.mp3","zh":"女孩覺得那些餅乾怎麼樣？"},"options":{"A":{"text":"They are too sweet.","letterAudio":"93138ad65b3704914636.mp3","audio":"800f8b5a18e8c0448992.mp3","zh":"它們太甜了。","letterEnd":0.537},"B":{"text":"They taste great.","letterAudio":"609555d8760f27caf21b.mp3","audio":"40709bbdb092a23f8650.mp3","zh":"它們很好吃。","letterEnd":0.588},"C":{"text":"They don't look nice.","letterAudio":"9756927a5f3791737934.mp3","audio":"78d7ef50e951a6efb3ab.mp3","zh":"它們看起來不好看。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"女孩被問到味道時說她需要一大杯水，又說男孩的哥哥（弟弟）下次可以少放一點糖，可見她覺得餅乾太甜。","zhCorrect":"e69eedfc90681fc93a44.mp3","enText":"The answer is A. They are too sweet. The girl says the cookies look beautiful. When the boy asks about the taste, the girl says she will need a big glass of water, and maybe the boy's brother can use less sugar next time. She thinks the cookies are too sweet.","enAudio":"7c3e39fb17738012af64.mp3","wrong":{"B":{"text":"B女孩只稱讚餅乾看起來很漂亮，被問到味道時沒有說好吃，反而建議少放糖。","audio":"96b2c81aeb60232a82fb.mp3"},"C":{"text":"C女孩說餅乾看起來很漂亮，與這個選項相反。","audio":"7eef243e1973fd3e2e48.mp3"}}},{"id":"L059-Q17","type":"言談理解","point":"明確訊息","unit":"U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號48 tomorrow；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號54 practice；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號7 pool；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號89 clean；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start、55 own；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號61 ride；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號37 leave；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號56 forget；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Mia. This is Coach Lin. Tomorrow's swimming practice will be at the City Pool, not at the school pool, because the school pool is being cleaned. Please get there by six forty-five. Practice starts at seven. If you need a ride, our bus leaves the school gate at six fifteen. Don't forget to bring your own towel. See you tomorrow.","audio":"927ae6f1fe456b8a5f0f.mp3","zh":"嗨，Mia。我是林教練。明天的游泳練習會在市立游泳池，不在學校的游泳池，因為學校的游泳池正在清洗。請在六點四十五分前到。練習七點開始。如果你需要搭車，我們的車六點十五分從校門口出發。別忘了帶你自己的毛巾。明天見。"}],"question":{"text":"What time should Mia get to the City Pool?","audio":"831dbb03886d1b2bc83d.mp3","zh":"Mia 應該幾點到市立游泳池？"},"options":{"A":{"text":"Six fifteen.","letterAudio":"93138ad65b3704914636.mp3","audio":"3d148e2fddeeca8e50cb.mp3","zh":"六點十五分。","letterEnd":0.537},"B":{"text":"Six forty-five.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e8c8f68352d79b67f4e3.mp3","zh":"六點四十五分。","letterEnd":0.588},"C":{"text":"Seven o'clock.","letterAudio":"9756927a5f3791737934.mp3","audio":"75ee89a9a134fb069873.mp3","zh":"七點。","letterEnd":0.713}},"answer":"B","keyLines":[0],"evidence":"林教練說「Please get there by six forty-five」，所以 Mia 要在六點四十五分前到市立游泳池。","zhCorrect":"64500bc988f809ff54b5.mp3","enText":"The answer is B. Six forty-five. Coach Lin says Mia should get to the City Pool by six forty-five. Practice starts at seven, and the bus leaves the school gate at six fifteen. So Mia should get there by six forty-five.","enAudio":"e003f4c4a92db4877801.mp3","wrong":{"A":{"text":"A六點十五分是車子從校門口出發的時間，不是要到游泳池的時間。","audio":"35062463237f4a391974.mp3"},"C":{"text":"C七點是練習開始的時間，Mia 要在六點四十五分前就到。","audio":"5fed073e2758da7699c4.mp3"}}},{"id":"L059-Q18","type":"言談理解","point":"整體訊息","unit":"U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號5 winter、8 snow、38 jacket、46 buy、6 weather、31 trip、19 lesson、58 cold、35 gift；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family、4 parent(s)；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號95 go、90 see、87 check；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號64 warm；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號2 morning；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號55 wear；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號11 T-shirt、23 hat、19 coat；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號106 thin、104 small；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號71 top；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號61 below；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號10 hand、3 ear；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號43 hurt；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號44 stop；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號82 shake、85 give；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always；U02｜核心單字「介系詞」｜教材印刷頁 p.33｜核心編號118 before；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號26 way","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last winter, my family went to Hehuan Mountain to see snow. It was warm in Taichung that morning, so I only wore a T-shirt and a thin jacket. When we got to the top, it was below zero. My hands and ears hurt, and I couldn't stop shaking. My mom gave me her scarf, and my dad bought me a hat at a small shop. Now I always check the weather before a trip and pack a warm coat.","audio":"8ed56ead51fcb598ca95.mp3","zh":"去年冬天，我們全家去合歡山看雪。那天早上臺中很暖和，所以我只穿了一件T恤和一件薄外套。我們到山頂的時候，氣溫在零度以下。我的手和耳朵都好痛，而且我一直發抖停不下來。媽媽把她的圍巾給我，爸爸在一家小店幫我買了一頂帽子。現在我每次旅行前都會先查天氣，並帶一件保暖的外套。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"A lesson from a cold trip.","letterAudio":"93138ad65b3704914636.mp3","audio":"65db05fb68a2138de9e1.mp3","zh":"一趟很冷的旅行帶來的教訓。","letterEnd":0.537},"B":{"text":"The way to Hehuan Mountain.","letterAudio":"609555d8760f27caf21b.mp3","audio":"5efe9d006dfda1442a58.mp3","zh":"去合歡山的路。","letterEnd":0.588},"C":{"text":"A gift from the speaker's parents.","letterAudio":"9756927a5f3791737934.mp3","audio":"886b99d8b3b99bb2662f.mp3","zh":"說話者父母送的一份禮物。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"說話者去合歡山看雪時只穿了T恤和薄外套，到山頂冷得手和耳朵都痛、一直發抖；現在每次旅行前都會查天氣、帶保暖的外套。整段在說一趟很冷的旅行讓說話者學到的教訓。","zhCorrect":"07d445be528e9160da4c.mp3","enText":"The answer is A. A lesson from a cold trip. The speaker only wore a T-shirt and a thin jacket on a trip to Hehuan Mountain, and it was below zero at the top. Now the speaker always checks the weather before a trip. The talk is about a lesson from a cold trip.","enAudio":"b25653b0d7e79419359d.mp3","wrong":{"B":{"text":"B原文只說全家去合歡山看雪，沒有說怎麼去。","audio":"42c497ffbd4d2c9854e3.mp3"},"C":{"text":"C媽媽的圍巾和爸爸買的帽子只是旅行中的細節，不是整段主旨。","audio":"54b566a5b3c606ad8a09.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L059/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
