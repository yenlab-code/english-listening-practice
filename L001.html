<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #f5f7fb; color: #17233b;
      --line: #dce3ed; --muted: #53617a; --accent: #1757a6; --good: #26884d; --bad: #c76d22; --panel: #fff; --key: #fff1b8; }
    body { max-width: 820px; margin: 0 auto; padding: 24px 16px 56px; background: #f5f7fb; }
    h1 { margin: 6px 0 8px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
    h2 { margin: 6px 0 12px; }
    h3 { margin: 18px 0 8px; font-size: 1.05rem; }
    p { line-height: 1.65; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: 0 6px 22px #17233b0b; margin: 16px 0; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #eaf2ff; color: #1857a3; font-weight: 700; font-size: .88rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; cursor: pointer; border-radius: 11px; padding: 10px 16px; border: 1px solid #b8c6d9; background: white; color: #17233b; }
    button:hover:enabled { border-color: #2566b3; background: #f0f6ff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 700; }
    button.primary:hover:enabled { background: #0e468c; }
    select, input { font: inherit; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    .answers { display: flex; gap: 12px; margin: 18px 0; }
    .answers button { min-width: 88px; min-height: 70px; font-size: 1.7rem; font-weight: 700; }
    .answers button.chosen { outline: 3px solid var(--accent); }
    .status { font-weight: 650; min-height: 1.7em; }
    .feedback { border-left: 5px solid var(--good); background: #edf7f0; padding: 12px 16px; border-radius: 8px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--bad); background: #fff3e8; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 700; }
    .transcript { margin-top: 14px; }
    .transcript p { margin: 4px 0; padding: 3px 8px; border-radius: 6px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .9rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 700; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 8px; border-radius: 8px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .booklet { border: 1px dashed #b8c6d9; border-radius: 12px; padding: 10px 14px; margin: 10px 0 0; font-size: 1.1rem; }
    .booklet p { margin: 6px 0; }
    .report { font-size: .9rem; margin-top: 14px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .bar { height: 8px; background: #e4e9f1; border-radius: 4px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); }
    .notice { background: #fff8e6; border-left: 4px solid #d49b2c; padding: 10px 14px; border-radius: 7px; }
    .error { background: #fdecec; border-left: 4px solid #c23b3b; padding: 10px 14px; border-radius: 7px; }
    textarea { width: 100%; min-height: 160px; box-sizing: border-box; font: inherit; font-size: .9rem; }
    @media (max-width: 520px) { .answers button { min-width: 0; flex: 1; } }
  </style>
</head>
<body>
  <span class="badge" id="badge"></span>
  <h1 id="title"></h1>
  <p class="muted" id="intro"></p>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <p class="muted" id="progress"></p>
    <h2 id="heading"></h2>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <h2>成績單</h2>
    <p id="score"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="retryWrong" class="primary">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">複製給 Claude 的檢討提示</button>
    </div>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
  </section>

  <script id="bank-data" type="application/json">{"volume":"L001","number":1,"version":"v1.0","status":"已完成","sourceSha256":"7eb04a76e49cf2a518c6b927809f1f1562c24822b89a14e3f2bd22c0c4681033","pauses":{"after_number":800,"between_lines":450,"between_repeats":1200,"after_passage":1500,"between_options":700,"after_letter":350,"preview_options":5000},"common":{"correct":"79b48e1a03790c23ea4d.mp3","wrong":"2e8f1669196be0d39f41.mp3"},"questions":[{"id":"L001-Q01","type":"基本問答","point":"資訊詢問","unit":"U02｜文法與句型「What time 的問與答」｜教材印刷頁 p.36","difficulty":"易","numberAudio":"e617836b71646c589d22.mp3","passage":[{"speaker":null,"text":"What time does the art club start today?","audio":"8b1ac77215b93aacec15.mp3","zh":"美術社今天幾點開始？"}],"question":null,"options":{"A":{"text":"In the art room.","letterAudio":"93138ad65b3704914636.mp3","audio":"4b86ed7b0f627b21a3e8.mp3","zh":"在美術教室。"},"B":{"text":"At four thirty.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b37e4a724444022dac1c.mp3","zh":"四點半。"},"C":{"text":"On Friday.","letterAudio":"9756927a5f3791737934.mp3","audio":"fed545c8ffc553e5e074.mp3","zh":"在星期五。"}},"answer":"B","keyLines":[0],"evidence":"「What time」詢問時刻；「At four thirty」直接回答開始時間。","zhCorrect":"3f205595984adf79502e.mp3","enText":"The answer is B. At four thirty. The question asks for a time. At four thirty gives the club's starting time.","enAudio":"683b1a4585abeadc0b1f.mp3","wrong":{"A":{"text":"A回答地點，未回答時刻。","audio":"8600cdd8056f01020caf.mp3"},"C":{"text":"C回答星期，未回答當天的開始時刻。","audio":"ecd4cc68f9a05d63357c.mp3"}}},{"id":"L001-Q02","type":"基本問答","point":"邀請／提議","unit":"U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號19 basketball","difficulty":"易","numberAudio":"3d8f0b4ea5d7a3765f2f.mp3","passage":[{"speaker":null,"text":"Would you like to play basketball after school?","audio":"ddd109bb0b9e35758da0.mp3","zh":"放學後你想去打籃球嗎？"}],"question":null,"options":{"A":{"text":"Sure, I'd love to.","letterAudio":"93138ad65b3704914636.mp3","audio":"c61e6320d0a6044d4be5.mp3","zh":"當然，我很樂意。"},"B":{"text":"The ball is under my desk.","letterAudio":"609555d8760f27caf21b.mp3","audio":"c291507b0e595d9f7bd4.mp3","zh":"球在我的桌子底下。"},"C":{"text":"I played it yesterday.","letterAudio":"9756927a5f3791737934.mp3","audio":"b5d77bc0d27e037eaf4b.mp3","zh":"我昨天打過了。"}},"answer":"A","keyLines":[0],"evidence":"「Would you like to」發出邀請；A接受邀請。","zhCorrect":"8985c8d84a1ee7f52b35.mp3","enText":"The answer is A. Sure, I'd love to. The speaker is inviting someone to play basketball. This reply accepts the invitation.","enAudio":"42b136dbd46e2de660a1.mp3","wrong":{"B":{"text":"B只說球的位置，沒有回應是否參加。","audio":"8c9cdf5f644e6e89654f.mp3"},"C":{"text":"C說過去的活動，沒有回應這次邀請。","audio":"8f51ad59a4132c813e97.mp3"}}},{"id":"L001-Q03","type":"基本問答","point":"接受／拒絕","unit":"U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號3 sandwich","difficulty":"中","numberAudio":"88373118ad27e5f2cc40.mp3","passage":[{"speaker":null,"text":"No, thank you. I already had lunch, so I don't need a sandwich.","audio":"9c08dc6e8987fb8a3999.mp3","zh":"不用了，謝謝。我已經吃過午餐了，所以不需要三明治。"}],"question":null,"options":{"A":{"text":"Then I'll put the sandwich away.","letterAudio":"93138ad65b3704914636.mp3","audio":"e9f0fc0ce4be79491387.mp3","zh":"那我就把三明治收起來。"},"B":{"text":"The lunch break starts at noon.","letterAudio":"609555d8760f27caf21b.mp3","audio":"7886a395f6f3182760df.mp3","zh":"午休從中午開始。"},"C":{"text":"I'd like another sandwich, too.","letterAudio":"9756927a5f3791737934.mp3","audio":"b26d261afe51014d4dac.mp3","zh":"我也想再要一個三明治。"}},"answer":"A","keyLines":[0],"evidence":"「I don't need a sandwich」明確拒絕三明治；A接受拒絕並收起它。","zhCorrect":"3a4e600225ce17010547.mp3","enText":"The answer is A. Then I'll put the sandwich away. The speaker does not need a sandwich. This reply respects that answer and puts it away.","enAudio":"2e661b37b87589b82656.mp3","wrong":{"B":{"text":"B說午休時間，未回應拒絕。","audio":"8280ca6a171a9f0362ea.mp3"},"C":{"text":"C要求再給一份，與對方已拒絕的互動不相接。","audio":"43b86243f7d6436fd034.mp3"}}},{"id":"L001-Q04","type":"基本問答","point":"協助","unit":"U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask；核心單字「交通工具」｜p.152｜核心編號40 bus","difficulty":"易","numberAudio":"6b96c948428910ab2482.mp3","passage":[{"speaker":null,"text":"This bag is too heavy for me. Could you help me carry it to the bus?","audio":"274052844fb39d42c8d6.mp3","zh":"這個袋子對我來說太重了。你可以幫我把它搬到公車上嗎？"}],"question":null,"options":{"A":{"text":"I took the bus yesterday.","letterAudio":"93138ad65b3704914636.mp3","audio":"1df746b06a54f9a26413.mp3","zh":"我昨天搭了公車。"},"B":{"text":"I bought my bag yesterday.","letterAudio":"609555d8760f27caf21b.mp3","audio":"be364a20d02f87b3d344.mp3","zh":"我昨天買了我的袋子。"},"C":{"text":"Of course. Let me take one side.","letterAudio":"9756927a5f3791737934.mp3","audio":"bc19961a6c8e51bb71f8.mp3","zh":"當然。我來拿一邊。"}},"answer":"C","keyLines":[0],"evidence":"「Could you help me carry it」是請求搬行李；C提供具體協助。","zhCorrect":"c0deab8d2eca6e4f9c39.mp3","enText":"The answer is C. Of course. Let me take one side. The speaker asks for help carrying a heavy bag. This reply offers to help.","enAudio":"76f880a8ead6681d6649.mp3","wrong":{"A":{"text":"A只說自己昨天搭過公車，未回應搬行李請求。","audio":"2a4fc2899ff4f62543f1.mp3"},"B":{"text":"B談自己的包包，未提供協助。","audio":"88c1d317aadd52c9ed71.mp3"}}},{"id":"L001-Q05","type":"基本問答","point":"提醒／安撫／道歉","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry","difficulty":"易","numberAudio":"b75bc069020875a5ebc7.mp3","passage":[{"speaker":null,"text":"I'm sorry I spilled water on your notebook.","audio":"c8722f78f79fa6c9e335.mp3","zh":"對不起，我把水灑在你的筆記本上了。"}],"question":null,"options":{"A":{"text":"Please write your name on it.","letterAudio":"93138ad65b3704914636.mp3","audio":"80926164732defca3c21.mp3","zh":"請在上面寫你的名字。"},"B":{"text":"It's okay. Let's dry the pages together.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e617e3d3a3321d341950.mp3","zh":"沒關係。我們一起把紙頁弄乾吧。"},"C":{"text":"I drink water every morning.","letterAudio":"9756927a5f3791737934.mp3","audio":"ea8565142ad97f28a630.mp3","zh":"我每天早上都喝水。"}},"answer":"B","keyLines":[0],"evidence":"「I'm sorry」為道歉；B先安撫，再提出處理方式。","zhCorrect":"03c15351f186ffadf0ef.mp3","enText":"The answer is B. It's okay. Let's dry the pages together. The speaker apologizes for spilling water. This reply accepts the apology and helps dry the pages.","enAudio":"67158169b46e1410cbe1.mp3","wrong":{"A":{"text":"A要求寫名字，未處理打翻水或道歉。","audio":"b86447d29e959bc3554b.mp3"},"C":{"text":"C只談喝水習慣，與眼前事故無關。","audio":"a9317466d5d4a33d1a2b.mp3"}}},{"id":"L001-Q06","type":"基本問答","point":"感謝","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號78 thank","difficulty":"易","numberAudio":"b01412f85694bf7dd6b1.mp3","passage":[{"speaker":null,"text":"Thank you for lending me your raincoat this morning.","audio":"d648979e4b187de37450.mp3","zh":"謝謝你今天早上借我雨衣。"}],"question":null,"options":{"A":{"text":"You're welcome. I'm glad it kept you dry.","letterAudio":"93138ad65b3704914636.mp3","audio":"2be387234a5062ee6666.mp3","zh":"不客氣。很高興它讓你沒有淋濕。"},"B":{"text":"It may rain tomorrow morning.","letterAudio":"609555d8760f27caf21b.mp3","audio":"cc98eca61f04deac7604.mp3","zh":"明天早上可能會下雨。"},"C":{"text":"I left my raincoat at school.","letterAudio":"9756927a5f3791737934.mp3","audio":"5ac1ed3058b6fbf2d13f.mp3","zh":"我把雨衣留在學校了。"}},"answer":"A","keyLines":[0],"evidence":"「Thank you for lending me」是對已提供的幫助致謝；A自然回應感謝。","zhCorrect":"db6715eebf3d356b98dd.mp3","enText":"The answer is A. You're welcome. I'm glad it kept you dry. The speaker is thanking someone for lending a raincoat. This reply acknowledges the thanks.","enAudio":"d41372f8fc4d77325756.mp3","wrong":{"B":{"text":"B談明天天氣，未回應感謝。","audio":"3db726288be8b164e6f2.mp3"},"C":{"text":"C談自己雨衣目前的位置，沒有回應對方對今早借雨衣一事的感謝。","audio":"18f04f2118ad8d1dc723.mp3"}}},{"id":"L001-Q07","type":"基本問答","point":"祝賀／回應消息","unit":"U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號23 test；核心單字「動詞」｜p.223｜核心編號30 pass","difficulty":"易","numberAudio":"e0d26bc8f9a996557d6a.mp3","passage":[{"speaker":null,"text":"I passed the math test! I studied for it all week.","audio":"80d448b5b9badfec9356.mp3","zh":"我數學考試及格了！我整個星期都在準備。"}],"question":null,"options":{"A":{"text":"I haven't taken the test yet.","letterAudio":"93138ad65b3704914636.mp3","audio":"91a2030a8af15da34ab0.mp3","zh":"我還沒考那個考試。"},"B":{"text":"The test is on the teacher's desk.","letterAudio":"609555d8760f27caf21b.mp3","audio":"18b007bcd650f8298aba.mp3","zh":"考卷在老師的桌上。"},"C":{"text":"That's great! Your hard work paid off.","letterAudio":"9756927a5f3791737934.mp3","audio":"a9527ad25da5da7c21bc.mp3","zh":"太棒了！你的努力有了回報。"}},"answer":"C","keyLines":[0],"evidence":"「I passed the math test」是好消息；C祝賀並肯定努力。","zhCorrect":"d81342013b5fb0d3d234.mp3","enText":"The answer is C. That's great! Your hard work paid off. Passing the math test is good news. This reply congratulates the speaker and recognizes the effort.","enAudio":"0b7da67af2101c632947.mp3","wrong":{"A":{"text":"A轉談自己的考試階段，未回應對方的好消息。","audio":"eb071efc058ef9d9a0ba.mp3"},"B":{"text":"B只談試卷位置，未回應通過考試。","audio":"d3d462a4eb06b9d6d95f.mp3"}}},{"id":"L001-Q08","type":"基本問答","point":"非直接回應","unit":"U05｜核心單字「場所與自然環境」｜教材印刷頁 p.88｜核心編號5 bookstore","difficulty":"中","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"Are you coming to the bookstore with me now? I need a book for my report.","audio":"8dd10bedd55ed5458df9.mp3","zh":"你現在要跟我一起去書店嗎？我需要一本書來寫報告。"}],"question":null,"options":{"A":{"text":"The bookstore sells books and cards.","letterAudio":"93138ad65b3704914636.mp3","audio":"fac85171226eb3f35c6e.mp3","zh":"那家書店賣書和卡片。"},"B":{"text":"My report is due in an hour, and I'm still writing it.","letterAudio":"609555d8760f27caf21b.mp3","audio":"1c11b0af064074e900cf.mp3","zh":"我的報告一小時後就要交了，我還在寫。"},"C":{"text":"I bought a book there yesterday.","letterAudio":"9756927a5f3791737934.mp3","audio":"d65d359290b8ce3e1c71.mp3","zh":"我昨天在那裡買了一本書。"}},"answer":"B","keyLines":[0],"evidence":"「with me now」詢問是否現在同行；B表示報告一小時後就要交、仍在撰寫，含蓄說明無法立刻同行。","zhCorrect":"aa5cb2fe43cd40f89234.mp3","enText":"The answer is B. My report is due in an hour, and I'm still writing it. The question is whether the friend can go now. A report due in an hour means the friend is still busy.","enAudio":"4328614fde8081aea5ef.mp3","wrong":{"A":{"text":"A描述商店商品，未表示是否同行。","audio":"7f0d544c0dbb1c7e9e16.mp3"},"C":{"text":"C只說昨天在書店買書，沒有回答是否現在同行。","audio":"660410965c7723115108.mp3"}}},{"id":"L001-Q09","type":"言談理解","point":"明確訊息","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號12 Friday；文法與句型「What time 的問與答」｜p.36","difficulty":"中","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"Are we cleaning the classroom at four on Friday?","audio":"cec1ba40b03e7e1fd1ed.mp3","zh":"女孩：我們星期五四點要打掃教室嗎？"},{"speaker":"Boy","text":"That was the first plan. The teacher has a meeting at four, so we'll start at three thirty.","audio":"b109037fad2f1a65368d.mp3","zh":"男孩：原本是這樣計畫的。老師四點要開會，所以我們三點半開始。"},{"speaker":"Girl","text":"Okay. I'll be there at three thirty.","audio":"3dc9526a7b5e0ccd4956.mp3","zh":"女孩：好。我三點半會到。"}],"question":{"text":"When will they start cleaning the classroom?","audio":"159331639612f092ffaa.mp3","zh":"他們什麼時候開始打掃教室？"},"options":{"A":{"text":"At three thirty.","letterAudio":"93138ad65b3704914636.mp3","audio":"9c86ec1a681dca91f742.mp3","zh":"三點半。"},"B":{"text":"At four.","letterAudio":"609555d8760f27caf21b.mp3","audio":"15821ceb5eef505f3c7d.mp3","zh":"四點。"},"C":{"text":"After the meeting.","letterAudio":"9756927a5f3791737934.mp3","audio":"d0316876731e5ef14c45.mp3","zh":"會議結束後。"}},"answer":"A","keyLines":[1],"evidence":"「we'll start at three thirty」明示更新後的開始時間，女孩也複述確認。","zhCorrect":"63b4ce14f75d180edd3e.mp3","enText":"The answer is A. At three thirty. The first plan was four o'clock, but they changed the start time to three thirty.","enAudio":"167101b99d9994c6ced4.mp3","wrong":{"B":{"text":"B是原先計畫，已因老師四點開會而改變。","audio":"3595db78a7abb77cea90.mp3"},"C":{"text":"C把開會時間誤當清潔開始條件；對話明說三點半開始。","audio":"c287b36af7fe89f4860c.mp3"}}},{"id":"L001-Q10","type":"言談理解","point":"整體訊息","unit":"U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號1 cookie；文法與句型「How many / How much 的問答」｜pp.75～76","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":"Boy","text":"Should I buy cookies for our class party?","audio":"337d3afaf3a6f5e3b699.mp3","zh":"男孩：我該買餅乾帶去班上的派對嗎？"},{"speaker":"Girl","text":"Before you buy anything, ask how many students are coming. Also, one student can't eat eggs, so check whether the cookies have eggs.","audio":"4cc21e16b9ec0072fa8d.mp3","zh":"女孩：買任何東西之前，先問清楚有多少同學會來。還有，有一位同學不能吃蛋，所以要確認餅乾裡有沒有蛋。"},{"speaker":"Boy","text":"Good idea. I'll find out how many students are coming and check the cookie ingredients today.","audio":"3240efeb177aebdadb5a.mp3","zh":"男孩：好主意。我今天會問清楚有多少同學會來，並檢查餅乾的成分。"}],"question":{"text":"What is the girl mainly trying to do?","audio":"55a9a6c45b35eed38966.mp3","zh":"女孩主要想做什麼？"},"options":{"A":{"text":"Teach the boy how to make cookies.","letterAudio":"93138ad65b3704914636.mp3","audio":"f88e4264d31c9809e239.mp3","zh":"教男孩做餅乾。"},"B":{"text":"Tell the boy to cancel the party.","letterAudio":"609555d8760f27caf21b.mp3","audio":"fd856ae8d3c63db1aa09.mp3","zh":"叫男孩取消派對。"},"C":{"text":"Help the boy plan food for the party.","letterAudio":"9756927a5f3791737934.mp3","audio":"613366d72f4ba2641e67.mp3","zh":"幫男孩規劃派對的食物。"}},"answer":"C","keyLines":[],"evidence":"女孩要男孩先確認參加人數，並查看餅乾是否含蛋，目的是讓點心安排合適。","zhCorrect":"e21faaa956d20975dfff.mp3","enText":"The answer is C. Help the boy plan food for the party. The girl wants to check the number of students and whether the cookies contain eggs before planning the snacks.","enAudio":"b8a297e5940e0b7ac76b.mp3","wrong":{"A":{"text":"A只抓住cookies，對話沒有製作步驟。","audio":"083193a3210fbb1e9d67.mp3"},"B":{"text":"B誤判女孩的立場；她說的是購買前先確認，沒有取消聚會。","audio":"2201d3ff5a7ab9a40128.mp3"}}},{"id":"L001-Q11","type":"言談理解","point":"說話者意見","unit":"U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號34 fix；U08｜核心單字「交通工具」｜p.152｜核心編號34 bike","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"Did you go to the bike repair activity at school?","audio":"cd3a07e2aff0342b8a88.mp3","zh":"女孩：你有去學校的腳踏車修理活動嗎？"},{"speaker":"Boy","text":"Yes. I thought it would be boring, but I fixed my bike with some help. I want to go again next month.","audio":"cf22674410d9f9aba4ce.mp3","zh":"男孩：有。我本來以為會很無聊，但我在別人的幫忙下修好了我的腳踏車。我下個月還想再去。"},{"speaker":"Girl","text":"So it was better than you expected.","audio":"62ac273b651863d8fcf7.mp3","zh":"女孩：所以比你預期的還要好。"}],"question":{"text":"How does the boy feel about the activity now?","audio":"e1c08f330af35b3bacf5.mp3","zh":"男孩現在對這個活動有什麼感覺？"},"options":{"A":{"text":"He found it useful and wants to return.","letterAudio":"93138ad65b3704914636.mp3","audio":"c9e147f97c0a53992af5.mp3","zh":"他覺得很有用，而且想再去。"},"B":{"text":"He still thinks it was boring.","letterAudio":"609555d8760f27caf21b.mp3","audio":"903d955405846157b42a.mp3","zh":"他還是覺得很無聊。"},"C":{"text":"He is upset that nobody helped him.","letterAudio":"9756927a5f3791737934.mp3","audio":"ba3c4cf055078f534eee.mp3","zh":"他很不高興沒有人幫他。"}},"answer":"A","keyLines":[1],"evidence":"「I fixed my bike with some help. I want to go again」顯示活動有幫助且願意再參加。","zhCorrect":"d13b5797d40b1bae4fba.mp3","enText":"The answer is A. He found it useful and wants to return. The boy says the activity helped him fix his bike and that he wants to go again.","enAudio":"0b2784afbb21d2d0f7d4.mp3","wrong":{"B":{"text":"B是參加前的預期，不是現在的看法。","audio":"f08da7b1266cd3941758.mp3"},"C":{"text":"C與「with some help」相反。","audio":"13b5580de1852a40b5bb.mp3"}}},{"id":"L001-Q12","type":"言談理解","point":"明確訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號34 postcard、45 send","difficulty":"易","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Mother","text":"Please send this postcard to your grandma this afternoon.","audio":"5ca9965f81ae2db384a9.mp3","zh":"媽媽：請你今天下午把這張明信片寄給奶奶。"},{"speaker":"Son","text":"What about the one for Uncle Ben?","audio":"4dd6334f675b482572f4.mp3","zh":"兒子：那給班叔叔的那張呢？"},{"speaker":"Mother","text":"I sent Uncle Ben's postcard yesterday. This one is for Grandma May.","audio":"ba9752d4ecace5d6d3b3.mp3","zh":"媽媽：班叔叔的明信片我昨天寄了。這張是給梅奶奶的。"}],"question":{"text":"Who should the son send this postcard to?","audio":"2627300e4dc124369c2f.mp3","zh":"兒子應該把這張明信片寄給誰？"},"options":{"A":{"text":"Uncle Ben.","letterAudio":"93138ad65b3704914636.mp3","audio":"01a2c178ec3005c1f486.mp3","zh":"班叔叔。"},"B":{"text":"Grandma May.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b75eda99ab321e93f8b8.mp3","zh":"梅奶奶。"},"C":{"text":"The son's teacher.","letterAudio":"9756927a5f3791737934.mp3","audio":"669ce37cdcc98d45cde8.mp3","zh":"兒子的老師。"}},"answer":"B","keyLines":[2],"evidence":"「This one is for Grandma May」明確指定兒子下午要寄出的這張明信片的收件人。","zhCorrect":"939af38fa82a3f8271f9.mp3","enText":"The answer is B. Grandma May. The mother says this particular postcard is for Grandma May.","enAudio":"23e7e7c556561632cae7.mp3","wrong":{"A":{"text":"A的明信片昨天已寄出，屬事件階段混淆。","audio":"d9bc20a3ed892bcefa20.mp3"},"C":{"text":"C未在對話中被指定為收件人。","audio":"f6b97fc72accb6eddcdd.mp3"}}},{"id":"L001-Q13","type":"言談理解","point":"情境／地點推論","unit":"U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號36 library；U01｜片語「生活用語、動作與看／說的比較」｜教材印刷頁 pp.9～12｜check out（借書）","difficulty":"易","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Woman","text":"I'd like to take these two books home. Do I need a card?","audio":"a5466f8675d7b32b77d4.mp3","zh":"女士：我想把這兩本書帶回家。需要卡嗎？"},{"speaker":"Man","text":"Yes. Show me your library card, and I'll check them out for you. Please return them in two weeks.","audio":"4f614d166f4ee08bfc2c.mp3","zh":"男士：需要。請給我看你的借書證，我幫你辦理借書。請在兩週內歸還。"},{"speaker":"Woman","text":"Here it is. Thank you.","audio":"3bea3d921d175b4d84f5.mp3","zh":"女士：在這裡。謝謝。"}],"question":{"text":"Where are the speakers most likely talking?","audio":"4cf6ad6e00b77855f8b2.mp3","zh":"說話者最可能在哪裡交談？"},"options":{"A":{"text":"At a bookstore.","letterAudio":"93138ad65b3704914636.mp3","audio":"7767396168ec8f2643d2.mp3","zh":"在書店。"},"B":{"text":"At a school cafeteria.","letterAudio":"609555d8760f27caf21b.mp3","audio":"d2e9acab9584ad1521ee.mp3","zh":"在學校餐廳。"},"C":{"text":"At a library.","letterAudio":"9756927a5f3791737934.mp3","audio":"460167ba7cfdecce08e2.mp3","zh":"在圖書館。"}},"answer":"C","keyLines":[1],"evidence":"「library card」「check them out」「return them in two weeks」共同指向圖書館借閱。","zhCorrect":"e8a134d9e43efbf9f74e.mp3","enText":"The answer is C. At a library. A library card, checking out books, and returning them in two weeks point to a library.","enAudio":"dc97cf44751e111771d0.mp3","wrong":{"A":{"text":"A雖也有書，但購書不需借書證及兩週後歸還。","audio":"4e81f70a2dfee6113db0.mp3"},"B":{"text":"B沒有借閱書籍的服務線索。","audio":"e71a4d616d3f5090d196.mp3"}}},{"id":"L001-Q14","type":"言談理解","point":"整體訊息","unit":"U06｜核心單字｜教材印刷頁 p.117｜核心編號7 rain；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號121 safe","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Boy","text":"The path behind the gym is still wet from the rain. We should tell the younger students not to run there.","audio":"83d461e884f1d2af4fb1.mp3","zh":"男孩：體育館後面的小路因為下雨還是濕的。我們應該告訴低年級的同學不要在那裡跑。"},{"speaker":"Girl","text":"I'll ask the teacher to put up a sign. You can tell them before lunch.","audio":"5aead0df8e606d6fac1e.mp3","zh":"女孩：我會請老師貼一張告示。你可以在午餐前告訴他們。"},{"speaker":"Boy","text":"Good. Then more students will see the warning.","audio":"47590d182771e565805e.mp3","zh":"男孩：好。這樣會有更多同學看到警告。"}],"question":{"text":"What are the speakers trying to do?","audio":"54662e8791d94fa4d42e.mp3","zh":"說話者想做什麼？"},"options":{"A":{"text":"Keep students safe on a wet path.","letterAudio":"93138ad65b3704914636.mp3","audio":"2bff931b41e14077b80d.mp3","zh":"讓同學在濕滑的小路上保持安全。"},"B":{"text":"Plan a running game behind the gym.","letterAudio":"609555d8760f27caf21b.mp3","audio":"d3bdf3f31dc21a327b8e.mp3","zh":"規劃在體育館後面玩跑步遊戲。"},"C":{"text":"Find out when the rain will stop.","letterAudio":"9756927a5f3791737934.mp3","audio":"daa474e5c291c966d1a1.mp3","zh":"查出雨什麼時候會停。"}},"answer":"A","keyLines":[],"evidence":"兩人要提醒學生別在濕步道奔跑，並設置告示；共同目的是安全。","zhCorrect":"be09383e78962f7d559e.mp3","enText":"The answer is A. Keep students safe on a wet path. They want to warn students about the wet path and keep everyone safe.","enAudio":"43bb37df5d4644b9b5bd.mp3","wrong":{"B":{"text":"B把「run there」當活動計畫，實際是勸學生不要跑。","audio":"2d10bb2db2de6bdfdb17.mp3"},"C":{"text":"C只抓住rain，對話沒有討論天氣預報。","audio":"56ab727b24dd819178ad.mp3"}}},{"id":"L001-Q15","type":"言談理解","point":"說話者意見","unit":"U05｜核心單字「動詞」｜教材印刷頁 p.90｜核心編號55 drive；核心單字「場所與自然環境」｜p.88｜核心編號18 beach","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"This travel guide has beautiful pictures of the beach. Should we use it for our trip?","audio":"4282d2d4fa0b4a496161.mp3","zh":"女孩：這本旅遊指南有漂亮的海灘照片。我們旅行要用它嗎？"},{"speaker":"Boy","text":"The pictures are nice, but it only tells drivers where to go. We'll take the bus, so another guide may help us more.","audio":"1904627ea788bd7a5f43.mp3","zh":"男孩：照片很漂亮，但它只告訴開車的人怎麼走。我們要搭公車，所以別本指南可能對我們更有幫助。"},{"speaker":"Girl","text":"Let's look for one with bus directions.","audio":"e89d9a7991f4f4d8dc56.mp3","zh":"女孩：我們找一本有公車路線說明的吧。"}],"question":{"text":"What does the boy think of the guide?","audio":"5ed31a2486af98640311.mp3","zh":"男孩覺得這本指南怎麼樣？"},"options":{"A":{"text":"It is perfect for their bus trip.","letterAudio":"93138ad65b3704914636.mp3","audio":"eb09654b652f3845c6d5.mp3","zh":"它非常適合他們的公車旅行。"},"B":{"text":"It looks nice but is not useful enough for them.","letterAudio":"609555d8760f27caf21b.mp3","audio":"a3fd386f59c549e200fa.mp3","zh":"它看起來很好，但對他們不夠實用。"},"C":{"text":"Its pictures are poor, but its bus directions are clear.","letterAudio":"9756927a5f3791737934.mp3","audio":"dc3899949c8d91d4cca6.mp3","zh":"它的照片很差，但公車路線說明很清楚。"}},"answer":"B","keyLines":[1],"evidence":"「pictures are nice」為有限肯定；「only tells drivers」「We'll take the bus」表示不符合需求。","zhCorrect":"54c649e21369eb19613b.mp3","enText":"The answer is B. It looks nice but is not useful enough for them. The pictures are nice, but the guide gives directions for drivers. They need bus directions.","enAudio":"50203fc08e4141e5d18c.mp3","wrong":{"A":{"text":"A忽略男孩指出缺少公車資訊，將表面稱讚誤判為整體認同。","audio":"ab19df31269011f1a972.mp3"},"C":{"text":"C把圖片與交通資訊的評價顛倒。","audio":"cc16897f630a295ef145.mp3"}}},{"id":"L001-Q16","type":"言談理解","point":"語境猜義","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號11 Thursday；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號39 plan","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":null,"text":"Hi, everyone. This is Ms. Lee. Our first plan was to practice music on Thursday at four. The room is busy then, so we need to push back practice by one hour. Please come at five, not four. Thank you.","audio":"0d007a508cbc3a358708.mp3","zh":"大家好，我是李老師。我們原本計畫星期四四點練習音樂。那個時間教室有人使用，所以我們需要把練習延後一小時。請五點來，不是四點。謝謝。"}],"question":{"text":"What does “push back practice” mean in this message?","audio":"95e309d9c555bad5a10b.mp3","zh":"這則留言中的「push back practice」是什麼意思？"},"options":{"A":{"text":"Stop practicing for the whole week.","letterAudio":"93138ad65b3704914636.mp3","audio":"7807263500ae46443c9f.mp3","zh":"整個星期都停止練習。"},"B":{"text":"Move practice to an earlier time.","letterAudio":"609555d8760f27caf21b.mp3","audio":"596186002cb4ea9567a7.mp3","zh":"把練習改到比較早的時間。"},"C":{"text":"Move practice to a later time.","letterAudio":"9756927a5f3791737934.mp3","audio":"47bef5074bf60e276ad3.mp3","zh":"把練習改到比較晚的時間。"}},"answer":"C","keyLines":[0],"evidence":"「by one hour」「come at five, not four」給出原四點、改五點的完整線索，故為延後。","zhCorrect":"3ef7bb552e5c153045fb.mp3","enText":"The answer is C. Move practice to a later time. Practice moves from four to five, so push back means move it to a later time.","enAudio":"a846ce8a390d5517eff5.mp3","wrong":{"A":{"text":"A誤解成取消；留言仍要求五點到場。","audio":"5fe6ae9128dd885f787d.mp3"},"B":{"text":"B誤解時間方向；五點晚於四點。","audio":"6b33efc37893a12219fa.mp3"}}},{"id":"L001-Q17","type":"言談理解","point":"明確訊息","unit":"U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water；核心單字「容器與計量詞」｜p.71｜核心編號27 bottle","difficulty":"易","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Good morning, students. On Sports Day, free drinking water will be next to the school gate. Please bring your own bottle. At the water station, we can fill bottles, but not cups. You can get water before the first game and during lunch.","audio":"9ad4c7d5f6a5a90012c4.mp3","zh":"各位同學早安。運動會當天，免費飲用水會放在學校大門旁邊。請自備水壺。在飲水站，我們可以幫忙裝水壺，但不能裝杯子。你們可以在第一場比賽前和午餐時間取水。"}],"question":{"text":"What should students bring to get water?","audio":"d771f35314bce0909f81.mp3","zh":"學生要帶什麼來取水？"},"options":{"A":{"text":"Their own bottles.","letterAudio":"93138ad65b3704914636.mp3","audio":"b9e4026d9861e14eca57.mp3","zh":"自己的水壺。"},"B":{"text":"Their own cups.","letterAudio":"609555d8760f27caf21b.mp3","audio":"4904a1acadd2c9e13910.mp3","zh":"自己的杯子。"},"C":{"text":"Their lunch tickets.","letterAudio":"9756927a5f3791737934.mp3","audio":"485a93e08d1466a82882.mp3","zh":"他們的午餐券。"}},"answer":"A","keyLines":[0],"evidence":"「Please bring your own bottle」直接指定學生要帶水瓶。","zhCorrect":"dbad0a616a844bb20bfa.mp3","enText":"The answer is A. Their own bottles. The announcement says to bring your own bottle to get water.","enAudio":"c35fc079c084c6835d19.mp3","wrong":{"B":{"text":"B雖也是容器，但廣播明說水站只裝水瓶、不裝杯子。","audio":"0ffcea450495f394599f.mp3"},"C":{"text":"C與「during lunch」的時間線索混淆；沒有提午餐券。","audio":"2efcc1dc85e89d5549a4.mp3"}}},{"id":"L001-Q18","type":"言談理解","point":"整體訊息","unit":"U05｜核心單字「其他名詞」｜教材印刷頁 p.89｜核心編號30 plant；U10｜核心單字「蔬菜水果」｜教材印刷頁 p.204｜核心編號16 tomato；核心單字「其他名詞」｜pp.204～205｜核心編號33 garden","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last month, I put a tomato plant in a dark corner of our garden and gave it water every day. It did not grow well. My grandfather told me to move it into the sun and check the soil before giving it water. Now it has small green tomatoes. I learned to pay attention to what a plant needs instead of following the same rule every day.","audio":"f95d4b01578a0189e067.mp3","zh":"上個月，我把一株番茄種在我們花園陰暗的角落，而且每天澆水。它長得不好。爺爺叫我把它移到有陽光的地方，並在澆水前先檢查土壤。現在它已經長出小小的綠色番茄了。我學到要注意植物需要什麼，而不是每天都照同一個規則做。"}],"question":{"text":"What did the speaker learn from the experience?","audio":"aec7e28e794eeda23908.mp3","zh":"說話者從這次經驗中學到什麼？"},"options":{"A":{"text":"Tomato plants should always stay in dark corners.","letterAudio":"93138ad65b3704914636.mp3","audio":"2eb56ae276571f818a48.mp3","zh":"番茄植物應該一直放在陰暗的角落。"},"B":{"text":"Good care depends on a plant's needs.","letterAudio":"609555d8760f27caf21b.mp3","audio":"ad4e1e6c05fdcdf5c248.mp3","zh":"良好的照顧取決於植物的需要。"},"C":{"text":"Plants grow best when watered every day.","letterAudio":"9756927a5f3791737934.mp3","audio":"ea45988ddbf2db1f7b20.mp3","zh":"植物每天澆水長得最好。"}},"answer":"B","keyLines":[0],"evidence":"「pay attention to what a plant needs instead of following the same rule every day」直接概括經驗；移到陽光下並先檢查土壤是具體例子。","zhCorrect":"145e8e1758b21b44e008.mp3","enText":"The answer is B. Good care depends on a plant's needs. The speaker learned to pay attention to a plant's needs instead of following the same rule every day.","enAudio":"d337a408c725339fcc3e.mp3","wrong":{"A":{"text":"A是起初放置的失敗做法，並非學到的原則。","audio":"1f67453b8e685dab0243.mp3"},"C":{"text":"C是起初每日澆水的失敗做法，與先檢查土壤相反。","audio":"565863bec492c923bd24.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L001/";
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = BANK.status === '待 Live 試用' ? `${BANK.volume} · ${BANK.version} · 人工試用` : `${BANK.volume} · ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        abortClip = reject;
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        audio.onended = () => { abortClip = null; resolve(); };
        audio.onerror = () => { abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    function questionSteps(q) {
      const steps = [q.numberAudio, listenMode === 'exam' ? P.preview_options : P.after_number];
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(o.letterAudio, P.after_letter, o.audio, P.between_lines, o.letterAudio, P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion() {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      if (await run(questionSteps(q))) {
        $('replay').disabled = false;
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `${BANK.volume} · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion();
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '答對了！' : '答錯了。', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [o.letterAudio, P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `我剛完成國中會考英聽模擬第${BANK.number}回（${BANK.volume}，${BANK.version}，${session.listenMode === 'exam' ? '會考模式：選項用看的' : '磨耳朵模式：選項用聽的'}），首次作答 ${first.length} 題答對 ${first.length - wrong.length} 題。`,
        '請擔任我的英聽家教，用繁體中文（必要時搭配英文）幫我檢討：',
        '1. 先找出我錯題的共同錯誤模式（例如只抓到關鍵字、沒注意計畫改變、誤解說話者語氣）。',
        '2. 一次只討論一題：先問我當時聽到什麼、為什麼選那個答案，等我回答後再講解。',
        '3. 最後針對我的弱點出 3 題類似的聽力題（只給題目與選項，我作答後再公布答案與理由）。',
        '以下題目資料來自固定題庫，請不要更改原文與選項。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【${q.id}｜${q.type}｜考點：${q.point}｜出處：${q.unit}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我的答案：${a.picked}；正解：${q.answer}；本題重聽 ${a.replays} 次`);
        lines.push(`教師端說明：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(session, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。到 Claude 專案貼上即可開始檢討；也可以開語音模式讓 Claude 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
