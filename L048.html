<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>
  </section>

,"numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"Look! There's a baby bird on the ground under this tree.","audio":"288ae65998ea3c4f10f9.mp3","zh":"女孩：你看！這棵樹下的地上有一隻小鳥。"},{"speaker":"Boy","text":"I think it fell out of that nest up there.","audio":"184b0fcb09b8f3d1187f.mp3","zh":"男孩：我想牠是從上面那個鳥巢掉下來的。"},{"speaker":"Girl","text":"Should we take it home and give it some water?","audio":"bbb5ff544fe0c4b746f8.mp3","zh":"女孩：我們要把牠帶回家，給牠一點水嗎？"},{"speaker":"Boy","text":"No. Its mother will take care of it. Let's put it back in the nest. I can reach it from this wall.","audio":"eaa75eb24aacaa771613.mp3","zh":"男孩：不用。牠媽媽會照顧牠。我們把牠放回鳥巢吧。我可以從這面牆搆到。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"Taking a baby bird home as a pet.","letterAudio":"93138ad65b3704914636.mp3","audio":"7f7973d6ce5113792169.mp3","zh":"把一隻小鳥帶回家當寵物。","letterEnd":0.537},"B":{"text":"Looking for a mother bird in the tree.","letterAudio":"609555d8760f27caf21b.mp3","audio":"fa3adedb13cc4b4715ad.mp3","zh":"在樹上尋找鳥媽媽。","letterEnd":0.588},"C":{"text":"Putting a baby bird back in its nest.","letterAudio":"9756927a5f3791737934.mp3","audio":"e58b7d2957711ac4327c.mp3","zh":"把一隻小鳥放回牠的鳥巢。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩在樹下看到一隻小鳥，男孩覺得牠是從上面的鳥巢掉下來的；女孩問要不要帶回家，男孩說不用，鳥媽媽會照顧牠，提議把牠放回鳥巢，還說自己可以從牆上搆到。整段在談把小鳥放回鳥巢。","zhCorrect":"f33173bef46509e29685.mp3","enText":"The answer is C. Putting a baby bird back in its nest. The girl finds a baby bird under a tree. The boy thinks it fell out of the nest, and he wants to put it back so its mother can take care of it. They are talking about putting a baby bird back in its nest.","enAudio":"23b8b1f998a4d82bcb2a.mp3","wrong":{"A":{"text":"A帶小鳥回家是女孩的提議，男孩說不用。","audio":"3871d4d6ce442fccbf75.mp3"},"B":{"text":"B男孩說鳥媽媽會照顧小鳥，他們沒有要找鳥媽媽。","audio":"cb858abaac427df5a388.mp3"}}},{"id":"L048-Q10","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號2 morning、17 today、3 afternoon；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號6 weather、62 cloudy、57 start、7 rain、59 sunny、61 rainy；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號44 stop；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號62 late；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號50 tonight；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號48 tomorrow；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號63 hot；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號56 forget；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號72 umbrella","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good morning. Here is the weather for Taipei today. It will be cloudy this morning, and it will start to rain at about three this afternoon. The rain will stop late tonight. Tomorrow will be sunny and hot, and it will be about thirty-two degrees. If you go out this afternoon, don't forget your umbrella.","audio":"726c639a0322257ac07b.mp3","zh":"早安。以下是今天臺北的天氣。今天早上會是多雲，下午三點左右會開始下雨。雨會在今晚稍晚停。明天會是晴朗又炎熱的天氣，大約三十二度。如果你今天下午要出門，別忘了帶傘。"}],"question":{"text":"What will the weather be like tomorrow?","audio":"e304e6aeaed6fe765b41.mp3","zh":"明天的天氣會怎麼樣？"},"options":{"A":{"text":"Sunny and hot.","letterAudio":"93138ad65b3704914636.mp3","audio":"094e4f6419e44170690f.mp3","zh":"晴朗又炎熱。","letterEnd":0.537},"B":{"text":"Cloudy.","letterAudio":"609555d8760f27caf21b.mp3","audio":"bf3db75c76943814a9d6.mp3","zh":"多雲。","letterEnd":0.588},"C":{"text":"Rainy.","letterAudio":"9756927a5f3791737934.mp3","audio":"eebcbec7d8adffbd523e.mp3","zh":"下雨。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"廣播說「Tomorrow will be sunny and hot」，所以明天會是晴朗又炎熱的天氣。","zhCorrect":"b0f070721c73b3c8ba28.mp3","enText":"The answer is A. Sunny and hot. Today it will be cloudy in the morning and rainy in the afternoon. The rain will stop late tonight. Tomorrow will be sunny and hot.","enAudio":"bef13ee3193f75b4e252.mp3","wrong":{"B":{"text":"B多雲是今天早上的天氣。","audio":"2de80d0cb2f2dbd4025e.mp3"},"C":{"text":"C下雨是今天下午到今晚的天氣，雨會在今晚稍晚停。","audio":"5fd6c1b90eacd08dcc62.mp3"}}},{"id":"L048-Q11","type":"言談理解","point":"說話者意見","unit":"U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號31 trip、32 fun、52 think；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號51 price；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號44 dollar；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號17 student；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus；U09｜核心單字「名詞：自然、生物與一般概念」｜教材印刷頁 pp.183～203｜核心編號35 problem；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號100 some、98 free；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號58 pay、57 cost；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號64 much；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號30 museum；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號29 girl；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號59 far、57 away；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號24 money","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Boy","text":"Let's vote for the water park for our class trip. It'll be so much fun!","audio":"1eb5b55ffd0b15fe046d.mp3","zh":"男孩：我們投票選水上樂園當班級旅行的地點吧。一定會超好玩！"},{"speaker":"Girl","text":"Did you see the price? It's eight hundred dollars for each student.","audio":"b4d110f656868ac68d97.mp3","zh":"女孩：你看到價錢了嗎？每個學生要八百元。"},{"speaker":"Boy","text":"But it's only thirty minutes away by bus.","audio":"4ca868427b2cbed4f979.mp3","zh":"男孩：可是搭公車只要三十分鐘。"},{"speaker":"Girl","text":"That's not the problem. Some students can't pay that much. I'd like to go to the science museum. It's free for students.","audio":"416d500de9cad95081bc.mp3","zh":"女孩：問題不在那裡。有些同學付不起那麼多錢。我想去科學博物館。學生免費。"}],"question":{"text":"What does the girl think about going to the water park?","audio":"89f12fa72568baa31dd2.mp3","zh":"女孩覺得去水上樂園怎麼樣？"},"options":{"A":{"text":"It will be fun for everyone.","letterAudio":"93138ad65b3704914636.mp3","audio":"ef68c6122daed50376b9.mp3","zh":"每個人都會玩得很開心。","letterEnd":0.537},"B":{"text":"It is too far away from school.","letterAudio":"609555d8760f27caf21b.mp3","audio":"42fd9fe8c8728a393449.mp3","zh":"離學校太遠了。","letterEnd":0.588},"C":{"text":"It costs too much money.","letterAudio":"9756927a5f3791737934.mp3","audio":"57104f6e9ae20a86ad81.mp3","zh":"花太多錢了。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩提到水上樂園每個學生要八百元，說問題不在距離，而是有些同學付不起那麼多錢，還想改去學生免費的科學博物館，可見她覺得去水上樂園花太多錢。","zhCorrect":"5488fc8b9e1bdab8b5c2.mp3","enText":"The answer is C. It costs too much money. The boy wants to go to the water park, and it costs eight hundred dollars for each student. The girl says some students can't pay that much. She thinks it costs too much money.","enAudio":"bef725f1c8a21a7657c9.mp3","wrong":{"A":{"text":"A很好玩是男孩的看法，女孩沒有這樣說。","audio":"11785efeed7a6e5be3c9.mp3"},"B":{"text":"B男孩說搭公車只要三十分鐘，女孩也說距離不是問題。","audio":"8371f3c366a792d57a15.mp3"}}},{"id":"L048-Q12","type":"言談理解","point":"明確訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號46 buy；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new、110 old、104 small；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號16 game；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號47 save；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號24 money；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號102 all、104 lucky；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號33 year、15 week；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號20 shoe；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號28 boy；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Girl","text":"Are you going to buy that new video game? You saved money for it all year.","audio":"d23185df699cc87cc8c4.mp3","zh":"女孩：你要買那款新電玩嗎？你為了它存了一整年的錢。"},{"speaker":"Boy","text":"Not anymore. My brother gave me his old one last week.","audio":"242d35b324351e78960c.mp3","zh":"男孩：不買了。我哥哥上星期把他的舊電玩給了我。"},{"speaker":"Girl","text":"Lucky you! So what will you do with the money?","audio":"6e335861a1f5a0848ed2.mp3","zh":"女孩：你真幸運！那你要拿那些錢做什麼？"},{"speaker":"Boy","text":"I'll buy some running shoes. My mom said my old ones are too small.","audio":"058e3cd4fe48dabaf922.mp3","zh":"男孩：我要買一雙跑鞋。我媽媽說我的舊鞋太小了。"}],"question":{"text":"Why isn't the boy going to buy the video game?","audio":"7a373092056175a10d91.mp3","zh":"男孩為什麼不買那款電玩了？"},"options":{"A":{"text":"His mom told him not to.","letterAudio":"93138ad65b3704914636.mp3","audio":"700c38bee5f8442a9656.mp3","zh":"他媽媽叫他不要買。","letterEnd":0.537},"B":{"text":"His brother gave him one.","letterAudio":"609555d8760f27caf21b.mp3","audio":"4b174f90e7f0a2e5d029.mp3","zh":"他哥哥（弟弟）給了他一個。","letterEnd":0.588},"C":{"text":"He wants to save his money.","letterAudio":"9756927a5f3791737934.mp3","audio":"4c33922f4dcbf20368bf.mp3","zh":"他想把錢存起來。","letterEnd":0.713}},"answer":"B","keyLines":[1],"evidence":"女孩問他是不是要買那款新電玩，男孩說不買了，因為「My brother gave me his old one last week」，所以他不用買了。","zhCorrect":"60f3e53f0765c63c72e3.mp3","enText":"The answer is B. His brother gave him one. The boy doesn't need to buy the video game, because his brother gave him an old one last week. He will use the money to buy running shoes.","enAudio":"0bed58e88eebee0f5369.mp3","wrong":{"A":{"text":"A媽媽說的是他的舊鞋太小，沒有說不准買電玩。","audio":"f683789b1553dfc18a32.mp3"},"C":{"text":"C男孩要拿錢去買跑鞋，不是要把錢存起來。","audio":"435c31822b9152012454.mp3"}}},{"id":"L048-Q13","type":"言談理解","point":"情境／地點推論","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see；U11｜核心單字「健康與身體」｜教材印刷頁 p.222｜核心編號8 knee；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號51 fall、62 call；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號21 playground；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號84 during；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class、34 classroom；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號125 really；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號43 hurt、55 put；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號82 then；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號65 bed；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號16 teacher；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號49 worry；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號69 just；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號35 rest；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號116 here","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Woman","text":"Let me see your knee. Did you fall on the playground?","audio":"201e5378cd80fbfbbd4a.mp3","zh":"女士：讓我看看你的膝蓋。你是在操場跌倒的嗎？"},{"speaker":"Boy","text":"Yes, during PE class. It really hurts.","audio":"653c6df256930981ac62.mp3","zh":"男孩：對，在體育課的時候。真的很痛。"},{"speaker":"Woman","text":"I'll clean it and put a bandage on it. Then you can lie down on that bed for ten minutes.","audio":"f17489fff81bf94418eb.mp3","zh":"女士：我幫你把傷口清乾淨，再貼上繃帶。然後你可以在那張床上躺十分鐘。"},{"speaker":"Boy","text":"Should I tell my teacher?","audio":"6d42d1529598d7d9df5a.mp3","zh":"男孩：我應該告訴我的老師嗎？"},{"speaker":"Woman","text":"Don't worry. I'll call her. You just rest here.","audio":"dd7b8ddd1bc060ff65e9.mp3","zh":"女士：別擔心。我會打電話給她。你就在這裡休息。"}],"question":{"text":"Where are they most likely?","audio":"c29fc0a63955a6b6afe5.mp3","zh":"他們最有可能在哪裡？"},"options":{"A":{"text":"At the school health center.","letterAudio":"93138ad65b3704914636.mp3","audio":"78ae1ff7ebc0fa61e768.mp3","zh":"在學校的健康中心。","letterEnd":0.537},"B":{"text":"On the playground.","letterAudio":"609555d8760f27caf21b.mp3","audio":"3f59f5d0be17175c6266.mp3","zh":"在操場上。","letterEnd":0.588},"C":{"text":"In a classroom.","letterAudio":"9756927a5f3791737934.mp3","audio":"b45491576324261fcee9.mp3","zh":"在教室裡。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"女士看男孩的膝蓋、問他是不是在操場跌倒，說要幫他把傷口清乾淨、貼繃帶，讓他在床上躺十分鐘，還說會打電話給他的老師，可知他們在學校的健康中心。","zhCorrect":"857518634e64b4907050.mp3","enText":"The answer is A. At the school health center. The woman looks at the boy's knee. She will clean it and put a bandage on it. He can lie down on a bed and rest, and she will call his teacher. They are most likely at the school health center.","enAudio":"329b4419b486a6f01a19.mp3","wrong":{"B":{"text":"B男孩是在體育課時在操場跌倒，現在女士正在幫他處理傷口、讓他躺在床上休息，不是在操場。","audio":"c66b9abe48549dabb3cd.mp3"},"C":{"text":"C女士說會打電話給老師，要男孩在這裡休息，他們不在教室。","audio":"0d60fcc97823bf5bcbea.mp3"}}},{"id":"L048-Q14","type":"言談理解","point":"整體訊息","unit":"U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號75 birthday；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號13 Saturday；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號29 idea；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號86 hide；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號35 gift、48 write、46 buy；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號39 house；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號68 card；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號93 look、80 talk；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號24 cake；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Girl","text":"Max's birthday is on Saturday. Let's make a treasure hunt for him.","audio":"51889b0563761ea227e2.mp3","zh":"女孩：Max 的生日在星期六。我們來為他做一個尋寶遊戲吧。"},{"speaker":"Boy","text":"Great idea! We can hide ten small gifts around the house.","audio":"3ca06f8764a53b5c1f5e.mp3","zh":"男孩：好主意！我們可以在家裡各處藏十個小禮物。"},{"speaker":"Girl","text":"I'll write a clue on a card for each gift.","audio":"28d3bf9e8333cbc631c7.mp3","zh":"女孩：我會為每個禮物寫一張線索卡。"},{"speaker":"Boy","text":"And the last card can tell him to look in the fridge for his cake.","audio":"c1b0d6d32b3bd4c816ba.mp3","zh":"男孩：最後一張卡可以叫他去冰箱裡找他的蛋糕。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"Buying gifts for Max's birthday.","letterAudio":"93138ad65b3704914636.mp3","audio":"13dda4385b9001e40414.mp3","zh":"買 Max 的生日禮物。","letterEnd":0.537},"B":{"text":"Planning a treasure hunt for Max.","letterAudio":"609555d8760f27caf21b.mp3","audio":"906e6db9bcb2494fc6fe.mp3","zh":"為 Max 規劃尋寶遊戲。","letterEnd":0.588},"C":{"text":"Making a birthday cake for Max.","letterAudio":"9756927a5f3791737934.mp3","audio":"45948dab69ec91a349ac.mp3","zh":"為 Max 做生日蛋糕。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說 Max 星期六生日，提議為他做一個尋寶遊戲；男孩說可以在家裡藏十個小禮物；女孩說每個禮物都寫一張線索卡；男孩說最後一張卡可以叫 Max 去冰箱找蛋糕。整段在規劃為 Max 做的尋寶遊戲。","zhCorrect":"5a2c9f5a8e2f28839972.mp3","enText":"The answer is B. Planning a treasure hunt for Max. It's Max's birthday on Saturday. The boy says they can hide small gifts around the house, and the girl will write a clue for each gift. They are talking about planning a treasure hunt for Max.","enAudio":"3c62c2c9f2b7c7b6e2c7.mp3","wrong":{"A":{"text":"A他們談的是把小禮物藏在家裡，沒有談去買禮物。","audio":"c72a879699a27e6239c4.mp3"},"C":{"text":"C冰箱裡的蛋糕只是最後一張卡要 Max 去找的東西，他們沒有談做蛋糕。","audio":"d99a84e15c1d0cd8dbc0.mp3"}}},{"id":"L048-Q15","type":"言談理解","point":"語境猜義","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see、82 say、81 open；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號39 news；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號26 man、32 people、29 girl；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號2 morning、7 minute；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號125 really、123 very；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號45 happen、51 fall；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號63 hot、61 thirsty；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號72 everything；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor；U04｜核心單字「副詞、介系詞、連接詞與助動詞」｜教材印刷頁 p.73｜核心編號70 later；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號4 eye；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號100 some；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號44 mean；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號40 push；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號47 feel；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask；U11｜四、題目與閱讀補充字詞「The Fear of Spiders」｜教材印刷頁 pp.238～239 faint","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"Did you see the news? A man fainted on the MRT this morning.","audio":"55ade9cd4661e5d5cdd3.mp3","zh":"女孩：你看到新聞了嗎？今天早上有一位男士在捷運上昏倒了。"},{"speaker":"Boy","text":"Really? What happened?","audio":"e668a19ca83381e8bde8.mp3","zh":"男孩：真的嗎？發生了什麼事？"},{"speaker":"Girl","text":"It was very crowded and hot. He said everything went black, and he fell to the floor. A few minutes later, he opened his eyes, and people gave him some water.","audio":"43f16ad27f13a3d41972.mp3","zh":"女孩：車上很擠又很熱。他說他眼前一片黑，然後就倒在地板上。幾分鐘後，他睜開眼睛，大家給了他一些水。"},{"speaker":"Boy","text":"I'm glad he's OK.","audio":"8f115cc24de7bb979f5b.mp3","zh":"男孩：很高興他沒事。"}],"question":{"text":"What does the girl mean when she says the man \"fainted\"?","audio":"27bd6c95a91c712a6c2d.mp3","zh":"女孩說那位男士 \"fainted\" 是什麼意思？"},"options":{"A":{"text":"He was pushed by the crowd.","letterAudio":"93138ad65b3704914636.mp3","audio":"56efffa8184194d50dd9.mp3","zh":"他被人群推倒了。","letterEnd":0.537},"B":{"text":"He suddenly fell down and was not awake.","letterAudio":"609555d8760f27caf21b.mp3","audio":"23c2a67e344f7a5fd8d9.mp3","zh":"他突然倒下，失去了意識。","letterEnd":0.588},"C":{"text":"He felt thirsty and asked for water.","letterAudio":"9756927a5f3791737934.mp3","audio":"947659b19a558a34c939.mp3","zh":"他覺得口渴，跟人要了水。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說那位男士在捷運上 fainted，他說眼前一片黑，然後倒在地板上，幾分鐘後才睜開眼睛，可知 faint 是「昏倒」，也就是突然倒下、失去意識。","zhCorrect":"a0d51994d4ec3c109b92.mp3","enText":"The answer is B. He suddenly fell down and was not awake. The man said everything went black, and he fell to the floor. A few minutes later, he opened his eyes. So when the girl says the man fainted, she means he suddenly fell down and was not awake.","enAudio":"09cf1442ef2a9422e8a0.mp3","wrong":{"A":{"text":"A女孩只說車上很擠，沒有說他被人推倒。","audio":"b22080fc25efe39608d7.mp3"},"C":{"text":"C大家給他水是他睜開眼睛以後的事，他沒有說自己口渴、跟人要水。","audio":"1900c206cabb9674beac.mp3"}}},{"id":"L048-Q16","type":"言談理解","point":"說話者意見","unit":"U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號43 visit；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號49 relative、47 part；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號125 really、124 too；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about；U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號22 grade；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號12 aunt；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say、91 read；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號106 thin、98 good；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get、58 enjoy；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號42 comic book；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號28 boy；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號33 year","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Girl","text":"Do you like visiting your relatives at Chinese New Year?","audio":"4d46f763a9dd71afc5d2.mp3","zh":"女孩：你喜歡過年的時候去拜訪親戚嗎？"},{"speaker":"Boy","text":"Not really. Everyone asks about my grades, and my aunts always say I'm too thin.","audio":"6882b40257bef16404a6.mp3","zh":"男孩：不太喜歡。每個人都問我的成績，我的阿姨們總是說我太瘦。"},{"speaker":"Girl","text":"But you get lots of red envelopes!","audio":"0517784db9f1b9b30949.mp3","zh":"女孩：可是你會拿到很多紅包啊！"},{"speaker":"Boy","text":"That's the only good part. I'd still rather stay home and read comic books.","audio":"7713ea209ea675d95d5d.mp3","zh":"男孩：那是唯一的好處。我還是寧願待在家看漫畫。"}],"question":{"text":"What does the boy think about visiting his relatives at Chinese New Year?","audio":"d913229a7ff9206d5af0.mp3","zh":"男孩覺得過年拜訪親戚怎麼樣？"},"options":{"A":{"text":"He looks forward to it every year.","letterAudio":"93138ad65b3704914636.mp3","audio":"a851df368c95cf33824c.mp3","zh":"他每年都很期待。","letterEnd":0.537},"B":{"text":"He likes it because of the red envelopes.","letterAudio":"609555d8760f27caf21b.mp3","audio":"81680a9317fa07dc4139.mp3","zh":"他因為紅包而喜歡。","letterEnd":0.588},"C":{"text":"He doesn't really enjoy it.","letterAudio":"9756927a5f3791737934.mp3","audio":"7816d102032c528e5718.mp3","zh":"他不太喜歡。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩問他喜不喜歡過年拜訪親戚，男孩說不太喜歡，大家都問他的成績，阿姨（姑姑）們總說他太瘦；他說紅包是唯一的好處，還是寧願待在家看漫畫，可見他不太喜歡過年拜訪親戚。","zhCorrect":"89bcc216ce0850accd64.mp3","enText":"The answer is C. He doesn't really enjoy it. The boy doesn't really like visiting relatives, because everyone asks about his grades, and his aunts say he's too thin. The red envelopes are the only good part, and he would still rather stay home. He doesn't really enjoy it.","enAudio":"e2b539b25f4846c502e3.mp3","wrong":{"A":{"text":"A男孩說不太喜歡，還寧願待在家，並不期待。","audio":"9f5999d10e9b8dbbbeef.mp3"},"B":{"text":"B男孩說紅包是唯一的好處，他還是寧願待在家看漫畫，並不是因為紅包而喜歡拜訪親戚。","audio":"8ba546304150087cefc4.mp3"}}},{"id":"L048-Q17","type":"言談理解","point":"明確訊息","unit":"U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號50 cat；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號95 go；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home、38 place；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today、18 day、5 night、15 week、1 time、3 afternoon；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號12 leg；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號32 dinner；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號113 also；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號48 jump；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號71 high；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號101 any；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, this is Mr. Lin from Happy Pet Hospital. This message is for Jenny. Your cat, Momo, can go home today. She stayed with us for three days, and her leg is much better now. Please give her one pill after dinner every night for one week. Also, don't let her jump down from high places for two weeks. You can pick her up any time after three this afternoon.","audio":"ac0c38aa998f36afde9b.mp3","zh":"嗨，我是 Happy 寵物醫院的林先生。這則留言是給 Jenny 的。你的貓 Momo 今天可以回家了。牠在我們這裡住了三天，牠的腿現在好多了。請每天晚上晚餐後給牠吃一顆藥，吃一個星期。還有，兩個星期內不要讓牠從高的地方跳下來。今天下午三點以後，你隨時可以來接牠。"}],"question":{"text":"For how long does Momo need to take the pills?","audio":"8c511c5e9285fda42d10.mp3","zh":"Momo 需要吃藥吃多久？"},"options":{"A":{"text":"For one week.","letterAudio":"93138ad65b3704914636.mp3","audio":"858825d343fb540ce474.mp3","zh":"一個星期。","letterEnd":0.537},"B":{"text":"For two weeks.","letterAudio":"609555d8760f27caf21b.mp3","audio":"72173683c0683ec85122.mp3","zh":"兩個星期。","letterEnd":0.588},"C":{"text":"For three days.","letterAudio":"9756927a5f3791737934.mp3","audio":"64744b12b80a8b1146f6.mp3","zh":"三天。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"林先生說「Please give her one pill after dinner every night for one week」，所以 Momo 要吃一個星期的藥。","zhCorrect":"e97932b369e742f0b178.mp3","enText":"The answer is A. For one week. Momo stayed at the pet hospital for three days. She needs one pill every night for one week, and she should not jump down from high places for two weeks.","enAudio":"257db689578e09707831.mp3","wrong":{"B":{"text":"B兩個星期是不要讓 Momo 從高的地方跳下來的時間。","audio":"7ab94be52698009f23db.mp3"},"C":{"text":"C三天是 Momo 在寵物醫院住的時間。","audio":"ad145d34de3ea6325e8f.mp3"}}},{"id":"L048-Q18","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good、109 new；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號2 morning、17 today、18 day；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號54 show、57 need、52 want、56 borrow；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號83 use、84 wait、80 talk；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號36 library；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號17 student；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號68 card、60 table、59 name；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號49 red、54 green；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號82 then；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號41 book；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號13 back；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號17 button；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號58 pay","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Good morning, everyone. Today I'll show you how to use the new machine in our library. First, put your student card under the red light. Then put your books on the table one by one. The screen will show the name of each book and the day you need to bring it back. If you want a paper list, press the green button. That's it. Now you don't have to wait in line to borrow books.","audio":"add79d9b3ba1b430f548.mp3","zh":"大家早安。今天我要教大家怎麼使用我們圖書館的新機器。首先，把你的學生證放在紅燈下面。然後把你的書一本一本放在桌上。螢幕會顯示每一本書的書名，還有你要還書的日期。如果你想要一張紙本清單，就按綠色的按鈕。就這樣。現在你借書不用再排隊了。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"How to use a student card to pay for books.","letterAudio":"93138ad65b3704914636.mp3","audio":"b31ea2d8a0110d683251.mp3","zh":"怎麼用學生證付錢買書。","letterEnd":0.537},"B":{"text":"Why students have to wait in line.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e841119afc09ddfefbec.mp3","zh":"學生為什麼必須排隊。","letterEnd":0.588},"C":{"text":"How to borrow books with a new machine.","letterAudio":"9756927a5f3791737934.mp3","audio":"cfa4a4c2fa00c801fb94.mp3","zh":"怎麼用新機器借書。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"說話者說今天要教大家用圖書館的新機器：先把學生證放在紅燈下、再把書一本一本放在桌上、螢幕會顯示書名和還書日期、想要紙本清單就按綠色按鈕，現在借書不用再排隊了。整段在說明怎麼用新機器借書。","zhCorrect":"1c2fc114cedcf85fc534.mp3","enText":"The answer is C. How to borrow books with a new machine. The speaker shows how to use the new machine in the library. Put your student card under the red light, put your books on the table, and check the screen. The talk is about how to borrow books with a new machine.","enAudio":"275ceabfc90513ae2458.mp3","wrong":{"A":{"text":"A學生證是放在紅燈下面用來借書的，說話者沒有談付錢買書。","audio":"cc3dad5c6c5f9e924df6.mp3"},"B":{"text":"B說話者說有了新機器以後借書就不用再排隊，不是在說為什麼要排隊。","audio":"e0f053937d3d8e2e2280.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L048/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
