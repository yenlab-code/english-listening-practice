<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>
  </section>

9b.mp3","zh":"嗯，我晚餐後會遛我的狗。很好玩。","letterEnd":0.588},"C":{"text":"Oh, thanks for telling me. I'll stay away.","letterAudio":"9756927a5f3791737934.mp3","audio":"b2f6b07b6e4432f695cf.mp3","zh":"噢，謝謝你告訴我。我會離遠一點。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"對方提醒自己不要摸那隻狗，說牠會咬人；C道謝並說會離牠遠一點，是接受提醒的說法。","zhCorrect":"bd2d16128674b69ea54c.mp3","enText":"The answer is C. Oh, thanks for telling me. I'll stay away. Someone tells you not to touch that dog, because it sometimes bites people. The best reply is, Oh, thanks for telling me. I'll stay away. This reply accepts the warning.","enAudio":"369afc1ff53c30e11c05.mp3","wrong":{"A":{"text":"A說自己的狗是白色的、很小，只接著 dog，沒有回應對方的提醒。","audio":"e8e6a2e935a7592ca85e.mp3"},"B":{"text":"B說自己晚餐後遛狗、很好玩，只接著 dog，沒有回應對方的提醒。","audio":"8e77a197048ec7cb1c28.mp3"}}},{"id":"L090-Q08","type":"基本問答","point":"邀請／提議","unit":"U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號47 zoo；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號48 kid；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號52 lion、53 tiger；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號92 sleep、87 cry；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family、10 sister；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號48 afraid","difficulty":"中","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"The zoo has a sleepover night for kids next Saturday. Do you want to sign up with me?","audio":"78f38807ed0798a834f3.mp3","zh":"動物園下星期六有一個給小孩的過夜活動。你要不要跟我一起報名？"}],"question":null,"options":{"A":{"text":"Lions sleep for most of the day.","letterAudio":"93138ad65b3704914636.mp3","audio":"895f051a5b09d372313a.mp3","zh":"獅子一天大部分的時間都在睡覺。","letterEnd":0.537},"B":{"text":"I wish I could. My family is going to Tainan that weekend.","letterAudio":"609555d8760f27caf21b.mp3","audio":"0e71a0ad0dc53735e7b2.mp3","zh":"真希望我能去。我們家那個週末要去臺南。","letterEnd":0.588},"C":{"text":"My sister is afraid of tigers. She cried once.","letterAudio":"9756927a5f3791737934.mp3","audio":"f6f3daad2fd3b0a7139a.mp3","zh":"我姊姊（妹妹）怕老虎。她哭過一次。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"對方邀自己一起報名動物園的過夜活動；B說希望自己能去，但那個週末全家要去臺南，是婉拒邀請的說法。","zhCorrect":"56b4fc2fba4f22c00e76.mp3","enText":"The answer is B. I wish I could. My family is going to Tainan that weekend. Someone asks you to sign up for a sleepover night at the zoo next Saturday. The best reply is, I wish I could. My family is going to Tainan that weekend. This reply says no to the invitation and gives a reason.","enAudio":"059ca0a8f4d028fccb17.mp3","wrong":{"A":{"text":"A說獅子一天大部分時間都在睡覺，由 zoo 和 sleepover 聯想到動物睡覺，沒有回應邀請。","audio":"cfb81935ced04d46865d.mp3"},"C":{"text":"C說自己的姊姊（妹妹）怕老虎、哭過一次，由 zoo 聯想到老虎，沒有回應邀請。","audio":"3559bd89dc0dc0069671.mp3"}}},{"id":"L090-Q09","type":"言談理解","point":"明確訊息","unit":"U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號23 test；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號7 tooth；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號11 juice、8 water；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號73 turn；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號55 brown","difficulty":"易","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Boy","text":"What's your science fair project about?","audio":"49f3a0b8b9040ebf2007.mp3","zh":"男孩：你的科展題目是什麼？"},{"speaker":"Girl","text":"I'm testing which drinks are worst for our teeth. I put eggshells in cola, orange juice, and water for a week.","audio":"eef0c4a313877f222e32.mp3","zh":"女孩：我在測試哪些飲料對我們的牙齒最不好。我把蛋殼放進可樂、柳橙汁和水裡一個星期。"},{"speaker":"Boy","text":"Which one was the worst?","audio":"7c0087b8b1d18338e3dc.mp3","zh":"男孩：哪一個最糟？"},{"speaker":"Girl","text":"Cola. The eggshell in it turned soft and brown.","audio":"64f5ed77bb1c1ebfe346.mp3","zh":"女孩：可樂。泡在裡面的蛋殼變軟，還變成咖啡色。"}],"question":{"text":"Which drink was the worst for the eggshell?","audio":"df6e033766e23b6c4474.mp3","zh":"哪一種飲料對蛋殼最不好？"},"options":{"A":{"text":"The cola.","letterAudio":"93138ad65b3704914636.mp3","audio":"65add8762f72558796f6.mp3","zh":"可樂。","letterEnd":0.537},"B":{"text":"The orange juice.","letterAudio":"609555d8760f27caf21b.mp3","audio":"956c456c20cdf3662d86.mp3","zh":"柳橙汁。","letterEnd":0.588},"C":{"text":"The water.","letterAudio":"9756927a5f3791737934.mp3","audio":"519dd0358f682abc174a.mp3","zh":"水。","letterEnd":0.713}},"answer":"A","keyLines":[3],"evidence":"女孩說最糟的是可樂，「The eggshell in it turned soft and brown」，所以對蛋殼最不好的是可樂。","zhCorrect":"4c3d59bb320ca9aaae2d.mp3","enText":"The answer is A. The cola. The girl put eggshells in cola, orange juice, and water for a week. She says cola was the worst, because the eggshell in it turned soft and brown. So the worst drink was the cola.","enAudio":"dd582dacd4c0b594ab9d.mp3","wrong":{"B":{"text":"B柳橙汁是女孩用來比較的飲料之一，她沒有說柳橙汁最糟。","audio":"c45bd1bec9c855c35687.mp3"},"C":{"text":"C水也是女孩用來比較的飲料之一，她沒有說水最糟。","audio":"23abee21ca0d7eca6e23.mp3"}}},{"id":"L090-Q10","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號79 welcome、81 open、92 watch；U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號70 movie；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor、22 stair；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號108 close；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號98 free；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號42 airplane / plane；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號111 o'clock；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get、51 eat；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Hello, everyone, and welcome to the Children's Science Museum. Our 3D movie room on the third floor is closed today because the machine is broken. Instead, there is a free paper airplane class at two o'clock in Room B on the third floor. Please get a ticket at the desk next to the stairs. Our café on the first floor opens at three today. Have a great day!","audio":"a8b510d0f2f6317e81bf.mp3","zh":"大家好，歡迎來到兒童科學館。我們三樓的 3D 電影廳今天因為機器壞了而關閉。改成兩點在三樓的 B 教室有一堂免費的紙飛機課。請到樓梯旁的服務台拿票。我們一樓的咖啡廳今天三點才開。祝大家有美好的一天！"}],"question":{"text":"What can visitors do at two o'clock today?","audio":"d192f151200886120bc0.mp3","zh":"訪客今天兩點可以做什麼？"},"options":{"A":{"text":"Watch a 3D movie.","letterAudio":"93138ad65b3704914636.mp3","audio":"5b730b9ed98102e41a5e.mp3","zh":"看 3D 電影。","letterEnd":0.537},"B":{"text":"Make paper airplanes.","letterAudio":"609555d8760f27caf21b.mp3","audio":"2377ac7e7355be9b2ca2.mp3","zh":"做紙飛機。","letterEnd":0.588},"C":{"text":"Eat at the café.","letterAudio":"9756927a5f3791737934.mp3","audio":"3e12364e80dccfdb908c.mp3","zh":"在咖啡廳吃東西。","letterEnd":0.713}},"answer":"B","keyLines":[0],"evidence":"廣播說「there is a free paper airplane class at two o'clock in Room B」，所以訪客今天兩點可以去做紙飛機。","zhCorrect":"10d7f3e10ac211da821f.mp3","enText":"The answer is B. Make paper airplanes. The 3D movie room is closed today, because the machine is broken. Instead, there is a free paper airplane class at two o'clock in Room B. The café opens at three today. So visitors can make paper airplanes at two o'clock.","enAudio":"2072f0e68de23482fd74.mp3","wrong":{"A":{"text":"A三樓的 3D 電影廳今天因為機器壞了而關閉，不能看 3D 電影。","audio":"1accb4303471d069fcb3.mp3"},"C":{"text":"C一樓的咖啡廳今天三點才開，兩點還不能在咖啡廳吃東西。","audio":"20de9d16e0849ce6e5f5.mp3"}}},{"id":"L090-Q11","type":"言談理解","point":"說話者意見","unit":"U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號27 bottle；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號27 yesterday；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號65 heavy","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Boy","text":"Is that the water bottle that lights up?","audio":"db161a545bc84289ffee.mp3","zh":"男孩：那是會發光的水壺嗎？"},{"speaker":"Girl","text":"Yes. It flashes every hour to tell me to drink.","audio":"77a10de1d40a0cfce635.mp3","zh":"女孩：對。它每個小時閃一次，提醒我喝水。"},{"speaker":"Boy","text":"Cool. Does it help?","audio":"bb5eaee54415b523348d.mp3","zh":"男孩：酷。有用嗎？"},{"speaker":"Girl","text":"For the first week, it did. Now it flashes in class, and everyone looks at me. I turned the light off yesterday.","audio":"0b5ca31545a9cac5cad8.mp3","zh":"女孩：第一個星期有用。現在它在上課的時候閃，大家都看我。我昨天把燈關掉了。"}],"question":{"text":"What does the girl think about her water bottle now?","audio":"759b038d357ace42b984.mp3","zh":"女孩現在覺得她的水壺怎麼樣？"},"options":{"A":{"text":"It helps her drink more water.","letterAudio":"93138ad65b3704914636.mp3","audio":"26dff2c1316092c8afbc.mp3","zh":"它幫助她多喝水。","letterEnd":0.537},"B":{"text":"It bothers her more than it helps.","letterAudio":"609555d8760f27caf21b.mp3","audio":"ce44c52b1f1efb7caa83.mp3","zh":"它帶給她的困擾比幫助多。","letterEnd":0.588},"C":{"text":"It is too heavy for her to carry.","letterAudio":"9756927a5f3791737934.mp3","audio":"f2783b20f074b0dab10d.mp3","zh":"它太重了，她帶不動。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說水壺只有第一個星期有用，現在上課時會閃、大家都看她，她昨天就把燈關掉了，可見她現在覺得水壺帶來的困擾比幫助多。","zhCorrect":"613dc7ebf7b27e49be6b.mp3","enText":"The answer is B. It bothers her more than it helps. The girl's water bottle flashes every hour to tell her to drink. It helped for the first week. Now it flashes in class, and everyone looks at the girl. She turned the light off yesterday. So the girl thinks the bottle bothers her more than it helps.","enAudio":"9fa1be2ea5b203f97b36.mp3","wrong":{"A":{"text":"A女孩說只有第一個星期有幫助，現在已經把燈關掉了。","audio":"8f87401372b672f59301.mp3"},"C":{"text":"C女孩沒有說水壺很重。","audio":"4721740be3a1bf7c4e7b.mp3"}}},{"id":"L090-Q12","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號72 umbrella、73 turn；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號57 pink、49 red；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號83 use、82 say；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號10 sun、7 rain；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號123 very；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號23 doctor；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號88 both；U04｜核心單字「副詞、介系詞、連接詞與助動詞」｜教材印刷頁 p.73｜核心編號70 later","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Girl","text":"Is that your mom's umbrella? It's so pink!","audio":"1f5be2ecb28d59b01458.mp3","zh":"女孩：那是你媽媽的傘嗎？好粉紅喔！"},{"speaker":"Boy","text":"Yes, it's hers. I'm using it for the sun. My skin turns red very easily.","audio":"1e42317b0e2201d6a770.mp3","zh":"男孩：對，是她的。我用它來擋太陽。我的皮膚很容易曬紅。"},{"speaker":"Girl","text":"Doesn't sunscreen help?","audio":"1676055bd56b4c5de022.mp3","zh":"女孩：防曬乳沒有用嗎？"},{"speaker":"Boy","text":"I use that, too. The doctor says I need both.","audio":"26ca636fec3be70bddc9.mp3","zh":"男孩：我也有擦。醫生說兩樣我都需要。"}],"question":{"text":"Why is the boy using an umbrella today?","audio":"9da8500ea9252f8e5dce.mp3","zh":"男孩今天為什麼撐傘？"},"options":{"A":{"text":"To give it back to his mom.","letterAudio":"93138ad65b3704914636.mp3","audio":"fd45b798ef30bab9c0a7.mp3","zh":"為了把傘還給他媽媽。","letterEnd":0.537},"B":{"text":"Because it will rain later.","letterAudio":"609555d8760f27caf21b.mp3","audio":"6d0997fa3039a1c818be.mp3","zh":"因為等一下會下雨。","letterEnd":0.588},"C":{"text":"To keep the sun off his skin.","letterAudio":"9756927a5f3791737934.mp3","audio":"ceff57284e22f76e950b.mp3","zh":"為了不讓太陽曬到他的皮膚。","letterEnd":0.713}},"answer":"C","keyLines":[1],"evidence":"男孩說「I'm using it for the sun. My skin turns red very easily.」，所以他今天撐傘是為了不讓太陽曬到皮膚。","zhCorrect":"c5ff613751d9bca7c503.mp3","enText":"The answer is C. To keep the sun off his skin. The boy is using his mom's umbrella for the sun, because his skin turns red very easily. He uses sunscreen, too. So the boy is using the umbrella to keep the sun off his skin.","enAudio":"ed33a4051710a0ee6cd0.mp3","wrong":{"A":{"text":"A傘是男孩媽媽的，但男孩沒有說要把傘還給媽媽。","audio":"6c1cfd0cf59404ed4cb4.mp3"},"B":{"text":"B男孩說傘是用來擋太陽的，對話沒有說之後會下雨。","audio":"ab6785db8b4a7fb8b788.mp3"}}},{"id":"L090-Q13","type":"言談理解","point":"情境／地點推論","unit":"U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號67 chair；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號9 hair；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號93 ready；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號23 airport","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Man","text":"Please sit on this chair and look at the light.","audio":"263f906bad1e6adf1fd3.mp3","zh":"男士：請坐在這張椅子上，看著燈。"},{"speaker":"Girl","text":"Should I smile?","audio":"610a1300d3ddfd04dfee.mp3","zh":"女孩：我要笑嗎？"},{"speaker":"Man","text":"Just a little. It's for your passport. Now put your chin down a little. Let me fix your hair, too.","audio":"15dcb960c52e3e1953e5.mp3","zh":"男士：一點點就好。這是要用在你的護照上的。現在把下巴放低一點。我也幫你整理一下頭髮。"},{"speaker":"Girl","text":"OK. When can I get them?","audio":"e0a851d54f0a8fb2817d.mp3","zh":"女孩：好。我什麼時候可以拿？"},{"speaker":"Man","text":"They'll be ready in ten minutes.","audio":"f1f358b0b4e8aaf62f9f.mp3","zh":"男士：十分鐘後就好了。"}],"question":{"text":"Where are they most likely?","audio":"c29fc0a63955a6b6afe5.mp3","zh":"他們最有可能在哪裡？"},"options":{"A":{"text":"At a photo shop.","letterAudio":"93138ad65b3704914636.mp3","audio":"9c320e05c1c94cbc835e.mp3","zh":"在照相館。","letterEnd":0.537},"B":{"text":"At a hair salon.","letterAudio":"609555d8760f27caf21b.mp3","audio":"06577ef171cd489e9759.mp3","zh":"在髮廊。","letterEnd":0.588},"C":{"text":"At an airport.","letterAudio":"9756927a5f3791737934.mp3","audio":"db3e518494e965768818.mp3","zh":"在機場。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男士要女孩坐好、看著燈、只笑一點點，說是要用在護照上，十分鐘後就可以拿，可知他們最有可能在照相館拍證件照。","zhCorrect":"6509b6e8391994b919ef.mp3","enText":"The answer is A. At a photo shop. The man asks the girl to sit on a chair and look at the light. He says to smile just a little, because it's for her passport. The girl asks when she can get the photos for her passport, and the man says in ten minutes. So they are most likely at a photo shop.","enAudio":"f3e78352ea94aded595d.mp3","wrong":{"B":{"text":"B由 fix your hair 聯想到髮廊，但男士只是在拍照前幫女孩整理頭髮。","audio":"cb48aba14fada05662f0.mp3"},"C":{"text":"C由 passport 聯想到機場，但男士是在幫女孩拍護照要用的照片。","audio":"86ea948d47c1e39790c3.mp3"}}},{"id":"L090-Q14","type":"言談理解","point":"整體訊息","unit":"U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號41 book；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號36 library；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號56 borrow、59 get；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號48 kid；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Girl","text":"Is that a bus full of books?","audio":"ff49b03fcb03e0501452.mp3","zh":"女孩：那是一輛裝滿書的公車嗎？"},{"speaker":"Boy","text":"Yes, it's the book bus. It comes to our village every Tuesday, because the nearest library is an hour away.","audio":"696e78377084abd7dc05.mp3","zh":"男孩：對，那是書車。它每個星期二會來我們村子，因為最近的圖書館要一個小時。"},{"speaker":"Girl","text":"Can you borrow books from it?","audio":"38ff08bf2a11f5e2660b.mp3","zh":"女孩：你可以跟它借書嗎？"},{"speaker":"Boy","text":"Up to five. I return them the next Tuesday, and I get five new ones.","audio":"a20f18e7f8b10e06216d.mp3","zh":"男孩：最多五本。我下一個星期二還書，再借五本新的。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"A school bus for village kids.","letterAudio":"93138ad65b3704914636.mp3","audio":"098a956c0892e3c4c2a3.mp3","zh":"一輛載村子小孩的校車。","letterEnd":0.537},"B":{"text":"The library in the boy's town.","letterAudio":"609555d8760f27caf21b.mp3","audio":"42e3a400ace1a2dc1c3e.mp3","zh":"男孩鎮上的圖書館。","letterEnd":0.588},"C":{"text":"A bus that brings books to a village.","letterAudio":"9756927a5f3791737934.mp3","audio":"4553ccb8a70cc7f638fd.mp3","zh":"一輛把書載到村子的公車。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說那是書車，每個星期二來村子，因為最近的圖書館很遠，男孩說最多可以借五本。整段在談一輛把書載到村子的公車。","zhCorrect":"af1408ad9a6f5f230e4f.mp3","enText":"The answer is C. A bus that brings books to a village. The boy says the book bus comes to his village every Tuesday, because the nearest library is an hour away. The boy can borrow up to five books. The girl and the boy are talking about a bus that brings books to a village.","enAudio":"4168a5b576f4813e145f.mp3","wrong":{"A":{"text":"A由 bus 和 village 聯想到校車，但那輛公車是載書的書車。","audio":"e890bb962d98322ab296.mp3"},"B":{"text":"B男孩說最近的圖書館要一個小時，他們談的是來村子的書車，不是圖書館。","audio":"32050dfad511fc527736.mp3"}}},{"id":"L090-Q15","type":"言談理解","point":"語境猜義","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號31 trip、32 fun、7 rain、6 weather；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號10 sister；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號99 bad、120 quiet；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號39 side；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號26 thing；U06｜四、閱讀、註解與情境補充「情境題、創業故事與襪子種類」（教材頁118、120、125～單元末）｜positive","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"Was your trip to Kenting fun? I heard it rained every day.","audio":"382dbb181ac4d0702696.mp3","zh":"女孩：你去墾丁玩得開心嗎？我聽說每天都在下雨。"},{"speaker":"Boy","text":"It did, but my sister is always positive. When our beach day was cancelled, she said, \"Great! Now we can play cards and eat ice cream.\"","audio":"30c5141c55ca7873cd12.mp3","zh":"男孩：是啊，不過我姊姊（妹妹）總是很 positive（樂觀、正向）。我們去海灘那天的行程取消時，她說：「太好了！現在我們可以玩牌、吃冰淇淋。」"},{"speaker":"Girl","text":"I'd be angry.","audio":"14d957d3ee5b3c147359.mp3","zh":"女孩：換作是我會很生氣。"},{"speaker":"Boy","text":"Me too, at first. She made it fun for everyone.","audio":"8eb561ab788feb894683.mp3","zh":"男孩：我一開始也是。她讓大家都玩得很開心。"}],"question":{"text":"What does the boy mean by \"positive\"?","audio":"a793bbb49d3348fd9595.mp3","zh":"男孩說的 \"positive\" 是什麼意思？"},"options":{"A":{"text":"Always angry about bad weather.","letterAudio":"93138ad65b3704914636.mp3","audio":"ebfc6cae2621cf58efe9.mp3","zh":"總是因為天氣不好而生氣。","letterEnd":0.537},"B":{"text":"Always quiet and shy.","letterAudio":"609555d8760f27caf21b.mp3","audio":"56233c8e52b29e5e3dc4.mp3","zh":"總是很安靜又害羞。","letterEnd":0.588},"C":{"text":"Always seeing the good side of things.","letterAudio":"9756927a5f3791737934.mp3","audio":"7281ddfa75af05c85849.mp3","zh":"總是看事情好的一面。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說姊姊（妹妹）很 positive，海灘的行程取消時，她說太好了，可以玩牌、吃冰淇淋，還讓大家都玩得很開心，可知 positive 是凡事看好的一面，也就是樂觀、正向。","zhCorrect":"df191d3aeb3c5f4a2b10.mp3","enText":"The answer is C. Always seeing the good side of things. It rained every day on the boy's trip. When the beach day was cancelled, the boy's sister said, great, now we can play cards and eat ice cream. She made it fun for everyone. So when the boy says positive, he means always seeing the good side of things.","enAudio":"20d95acbc2417476abd6.mp3","wrong":{"A":{"text":"A生氣是女孩說她自己會有的反應，男孩的姊姊（妹妹）是說太好了。","audio":"95451f37337740bc17b0.mp3"},"B":{"text":"B男孩說姊姊（妹妹）讓大家都玩得很開心，原文沒有說她很安靜、害羞。","audio":"4fa2e22afc1ff64565d7.mp3"}}},{"id":"L090-Q16","type":"言談理解","point":"說話者意見","unit":"U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help、91 know；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號36 library、29 work；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號13 Saturday、16 weekend；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號41 book；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號48 find；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號79 never；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號56 borrow；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號113 also；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號47 choose；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good；U09｜九、閱讀與題組補充單字（總表未逐項標頁；U09 教材頁 pp.183～203）｜shelf / shelves","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Girl","text":"You help at the library on Saturdays now? Isn't it boring to put books back?","audio":"52594a64b7caee9d7020.mp3","zh":"女孩：你現在星期六都在圖書館幫忙？把書放回去不會很無聊嗎？"},{"speaker":"Boy","text":"Not for me. I find books I never knew about. Last week, I borrowed three of them.","audio":"3d2da50d0b2edd0a3fbb.mp3","zh":"男孩：對我來說不會。我會發現一些我以前不知道的書。上星期我借了其中三本。"},{"speaker":"Girl","text":"Really?","audio":"0b83c1e31ec5a89a2fca.mp3","zh":"女孩：真的嗎？"},{"speaker":"Boy","text":"Yes. The librarians also let me choose the books for the \"New This Month\" shelf.","audio":"984790af42be0f59c4f5.mp3","zh":"男孩：真的。圖書館員也讓我挑選「本月新書」架上的書。"}],"question":{"text":"What does the boy think about helping at the library?","audio":"32d763f86cde403aa9bb.mp3","zh":"男孩覺得在圖書館幫忙怎麼樣？"},"options":{"A":{"text":"It helps him find good books.","letterAudio":"93138ad65b3704914636.mp3","audio":"9fddb2fa2611b311c99e.mp3","zh":"它幫助他找到好書。","letterEnd":0.537},"B":{"text":"It is boring work for him.","letterAudio":"609555d8760f27caf21b.mp3","audio":"72fbeffd89d0922115a0.mp3","zh":"對他來說是無聊的工作。","letterEnd":0.588},"C":{"text":"It takes too much of his weekend.","letterAudio":"9756927a5f3791737934.mp3","audio":"d84bcee3ddd8cca4f022.mp3","zh":"它占用他太多週末時間。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男孩說把書放回去對他來說不無聊，他會發現以前不知道的書，上星期還借了三本，可見他覺得在圖書館幫忙讓他找到好書。","zhCorrect":"c63addc98c2d8dd02a9a.mp3","enText":"The answer is A. It helps him find good books. The girl asks if putting books back is boring. The boy says he finds books he never knew about, and last week he borrowed three of them. So the boy thinks helping at the library helps him find good books.","enAudio":"6344e9856a474e52ce06.mp3","wrong":{"B":{"text":"B無聊是女孩的猜測，男孩說「Not for me」。","audio":"a6d7df47e06225353804.mp3"},"C":{"text":"C男孩沒有說在圖書館幫忙占用太多週末時間。","audio":"1420c0999874905ab508.mp3"}}},{"id":"L090-Q17","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號32 car；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號38 hour；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hello, Mrs. Wu. This is Mr. Ho, the piano tuner. I'm sorry, but I can't come on Thursday morning. My car broke down. On Friday morning, I'll be at a school, so can I come on Friday afternoon at three instead? It will take about an hour. Please call me back and let me know. Thank you.","audio":"b64c0f2dfc16835eaf66.mp3","zh":"您好，吳太太。我是調音師何先生。很抱歉，我星期四早上不能過去。我的車壞了。星期五早上我會在一所學校，所以我可以改成星期五下午三點過去嗎？大約需要一個小時。請回電話告訴我。謝謝您。"}],"question":{"text":"When does Mr. Ho want to come now?","audio":"1a7aab0437b8273d1f3c.mp3","zh":"何先生現在想要什麼時候過來？"},"options":{"A":{"text":"On Friday morning.","letterAudio":"93138ad65b3704914636.mp3","audio":"e392c23ca0d34f06e2ab.mp3","zh":"星期五早上。","letterEnd":0.537},"B":{"text":"On Friday afternoon.","letterAudio":"609555d8760f27caf21b.mp3","audio":"8b3ad77884d8cc33ed22.mp3","zh":"星期五下午。","letterEnd":0.588},"C":{"text":"On Thursday morning.","letterAudio":"9756927a5f3791737934.mp3","audio":"278cc12958b1eceb2dca.mp3","zh":"星期四早上。","letterEnd":0.713}},"answer":"B","keyLines":[0],"evidence":"何先生說「can I come on Friday afternoon at three instead?」，所以他現在想改在星期五下午來。","zhCorrect":"4237ed178e85028f4eee.mp3","enText":"The answer is B. On Friday afternoon. Mr. Ho can't come on Thursday morning, because his car broke down. On Friday morning, he will be at a school. So he wants to come on Friday afternoon at three instead.","enAudio":"060c2ad36a39560d9a41.mp3","wrong":{"A":{"text":"A星期五早上何先生要在一所學校。","audio":"05ee3f65cf04a57ebfe1.mp3"},"C":{"text":"C星期四早上是原本的時間，何先生的車壞了，不能去。","audio":"aa5d7186793a2bac8bcb.mp3"}}},{"id":"L090-Q18","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號56 spend；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號30 plant、37 rice、26 way；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號20 farm；U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號76 mud；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號58 cold；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號71 deep；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號51 fall、57 lose；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號81 twice、79 never；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號16 clothes；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號73 turn；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號55 brown；U07｜核心單字「職業」｜教材印刷頁 p.134｜核心編號8 farmer；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號54 show、51 eat；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small、113 beautiful、98 good；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號38 hour、29 work；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號13 back；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號43 hurt；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號44 look；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號38 remember、37 leave；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號30 bowl；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號22 cook","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last June, my class spent a day planting rice at a farm in Yilan. The mud was cold and deep, and my feet kept getting stuck. I fell twice, and my clothes turned brown. The farmer showed us how to put each small plant into the mud in a straight line. After four hours, my back hurt, but our field looked beautiful. Now every time I eat rice, I remember how hard farmers work, and I never leave any rice in my bowl.","audio":"d387fb830e06dbd4e4ef.mp3","zh":"去年六月，我們班在宜蘭的一座農場插秧插了一整天。泥巴又冷又深，我的腳一直卡住。我跌倒了兩次，衣服都變成咖啡色。農夫教我們怎麼把每一株小秧苗排成一直線插進泥巴裡。四個小時後，我的背好痛，可是我們的田看起來好漂亮。現在每次我吃飯，都會想起農夫有多辛苦，我從來不會把飯留在碗裡。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"A day of hard work in a rice field.","letterAudio":"93138ad65b3704914636.mp3","audio":"0525b63e0414e4d66775.mp3","zh":"在稻田裡辛苦工作的一天。","letterEnd":0.537},"B":{"text":"A good way to cook rice at home.","letterAudio":"609555d8760f27caf21b.mp3","audio":"33e5fed519b1d2ed7743.mp3","zh":"在家煮飯的好方法。","letterEnd":0.588},"C":{"text":"A farmer who lost his field in Yilan.","letterAudio":"9756927a5f3791737934.mp3","audio":"e91cb4f9a4efe04bf84c.mp3","zh":"一位在宜蘭失去田地的農夫。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"說話者的班級在宜蘭的農場插秧一整天，泥巴又冷又深、跌倒兩次、背很痛，現在吃飯時會想起農夫有多辛苦。整段在談在稻田裡辛苦工作的一天。","zhCorrect":"864afdd1961a2b491941.mp3","enText":"The answer is A. A day of hard work in a rice field. The speaker's class spent a day planting rice at a farm in Yilan. The mud was cold and deep, the speaker fell twice, and after four hours, the speaker's back hurt. Now the speaker remembers how hard farmers work. The talk is about a day of hard work in a rice field.","enAudio":"1a49928dae28c3da4ab2.mp3","wrong":{"B":{"text":"B說話者談的是插秧和吃飯時的感受，沒有說怎麼煮飯。","audio":"322cdf242b44baf6fec1.mp3"},"C":{"text":"C由 farmer 和 field 聯想，但農夫是教他們插秧的人，原文沒有說農夫失去了田。","audio":"176da2ebb609bea6390a.mp3"}}}]}</script>

    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
