<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>

謝謝你的漫畫書。我已經讀兩次了。"}],"question":null,"options":{"A":{"text":"I read comic books on the bus.","letterAudio":"93138ad65b3704914636.mp3","audio":"f108b3a43526fa932177.mp3","zh":"我在公車上看漫畫書。","letterEnd":0.537},"B":{"text":"My sister loves books. She reads every night.","letterAudio":"609555d8760f27caf21b.mp3","audio":"bec260964a5dbc524a01.mp3","zh":"我姊姊（妹妹）很愛書。她每天晚上都看書。","letterEnd":0.588},"C":{"text":"I'm glad you like it. The ending is my favorite.","letterAudio":"9756927a5f3791737934.mp3","audio":"30f4955602911eb34aec.mp3","zh":"很高興你喜歡。結局是我最喜歡的部分。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"對方謝謝自己給他漫畫書，說已經讀了兩次；C說很高興對方喜歡，並說自己最喜歡結局，是回應道謝的說法。","zhCorrect":"759413815139cd3be738.mp3","enText":"The answer is C. I'm glad you like it. The ending is my favorite. Someone thanks you for the comic book, and they have read it twice already. The best reply is, I'm glad you like it. The ending is my favorite. This reply answers the thanks.","enAudio":"c4a191fb9df0c0b82f25.mp3","wrong":{"A":{"text":"A說自己在公車上看漫畫書，只接著 comic book，談自己，沒有回應道謝。","audio":"c89fe502c8567b26fa31.mp3"},"B":{"text":"B說自己的姊姊（妹妹）很愛書、每天晚上都看書，只由 book 聯想到看書，沒有回應道謝。","audio":"bac05641f6816b4703d4.mp3"}}},{"id":"L078-Q06","type":"基本問答","point":"協助","unit":"U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號91 read；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號43 map；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think、3 summer；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號1 station；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號45 like","difficulty":"易","numberAudio":"b01412f85694bf7dd6b1.mp3","passage":[{"speaker":null,"text":"Can you help me read this map? I think we're lost.","audio":"5badf463b376eeeb1ff3.mp3","zh":"你可以幫我看這張地圖嗎？我覺得我們迷路了。"}],"question":null,"options":{"A":{"text":"Sure. Let me see. We're here, near the station.","letterAudio":"93138ad65b3704914636.mp3","audio":"0a5c37f1dc5928873367.mp3","zh":"好啊。我看看。我們在這裡，車站附近。","letterEnd":0.537},"B":{"text":"I like maps. I have many.","letterAudio":"609555d8760f27caf21b.mp3","audio":"bd25b5b766b11f290586.mp3","zh":"我喜歡地圖。我有很多張。","letterEnd":0.588},"C":{"text":"Well, I got lost in Tainan last summer. It was scary.","letterAudio":"9756927a5f3791737934.mp3","audio":"0472897ef338a9c894c8.mp3","zh":"嗯，我去年夏天在臺南迷路過。那很可怕。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"對方請自己幫忙看地圖，說他們好像迷路了；A答應，看了地圖後說他們在車站附近，是幫忙的說法。","zhCorrect":"a58b70dc0b25b668b7ac.mp3","enText":"The answer is A. Sure. Let me see. We're here, near the station. Someone asks you to help read the map, because they think you are both lost. The best reply is, Sure. Let me see. We're here, near the station. This reply helps this person read the map.","enAudio":"d057d5a724c44a8b8308.mp3","wrong":{"B":{"text":"B說自己喜歡地圖、有很多張，只接著 map，沒有幫忙看地圖。","audio":"9ee5b5f12b2def0cc421.mp3"},"C":{"text":"C說自己去年夏天在臺南迷路、很可怕，只接著 lost，談自己，沒有幫忙看地圖。","audio":"172cb13f94f949df5cd5.mp3"}}},{"id":"L078-Q07","type":"基本問答","point":"邀請／提議","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號54 show、52 want；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號39 moon；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號50 tonight；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號64 bright；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號80 study；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see","difficulty":"易","numberAudio":"e0d26bc8f9a996557d6a.mp3","passage":[{"speaker":null,"text":"My brother is showing us the moon with his new telescope tonight. Want to come?","audio":"d335740f12ff2aa5a5e9.mp3","zh":"我哥哥（弟弟）今晚要用他的新望遠鏡讓我們看月亮。你要來嗎？"}],"question":null,"options":{"A":{"text":"The moon is so round and bright tonight.","letterAudio":"93138ad65b3704914636.mp3","audio":"bea6b0360b62376c93f5.mp3","zh":"今晚的月亮好圓好亮。","letterEnd":0.537},"B":{"text":"Oh, my brother is in high school. He studies a lot.","letterAudio":"609555d8760f27caf21b.mp3","audio":"6b97ae01d04fed898466.mp3","zh":"噢，我哥哥（弟弟）讀高中。他很用功。","letterEnd":0.588},"C":{"text":"Sure! I'd love to see the moon.","letterAudio":"9756927a5f3791737934.mp3","audio":"0a986cc3afd8e4c2b168.mp3","zh":"好啊！我很想看月亮。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"對方邀自己今晚來用他哥哥（弟弟）的新望遠鏡看月亮；C說好，很想看月亮，是接受邀請的說法。","zhCorrect":"e93d78e72c33e8c7938c.mp3","enText":"The answer is C. Sure! I'd love to see the moon. Someone's brother is showing them the moon with a new telescope tonight, and they ask you to come. The best reply is, Sure! I'd love to see the moon. This reply says yes to the invitation.","enAudio":"ece156f3215f56b8acd1.mp3","wrong":{"A":{"text":"A說今晚的月亮又圓又亮，只接著 moon 和 tonight，沒有回應邀請。","audio":"3427d508207eac61bd73.mp3"},"B":{"text":"B說自己的哥哥（弟弟）讀高中、很用功，只接著 brother，沒有回應邀請。","audio":"d6b71f8eec81184c895a.mp3"}}},{"id":"L078-Q08","type":"基本問答","point":"非直接回應","unit":"U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號49 dog；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號55 brown；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號91 know、92 sleep；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat、54 show；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號22 TV","difficulty":"中","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"Can your dog do any tricks?","audio":"15563afad0b5d356b649.mp3","zh":"你的狗會表演什麼把戲嗎？"}],"question":null,"options":{"A":{"text":"My dog is three. He's brown.","letterAudio":"93138ad65b3704914636.mp3","audio":"44ed44c2bb51a8374b00.mp3","zh":"我的狗三歲。牠是咖啡色的。","letterEnd":0.537},"B":{"text":"Well, he only knows how to eat and sleep.","letterAudio":"609555d8760f27caf21b.mp3","audio":"bc7cb0d3659ef0fc23c7.mp3","zh":"嗯，牠只會吃和睡。","letterEnd":0.588},"C":{"text":"Oh, I saw a dog show on TV last night.","letterAudio":"9756927a5f3791737934.mp3","audio":"c73716c81562ef71daa5.mp3","zh":"噢，我昨晚在電視上看了狗狗表演。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"B沒有直接說 No，但說狗只會吃和睡，可知牠不會表演任何把戲。","zhCorrect":"5618f17c4ffc33c520b7.mp3","enText":"The answer is B. Well, he only knows how to eat and sleep. Someone asks if your dog can do any tricks. The best reply is, Well, he only knows how to eat and sleep. This means your dog can't do any tricks.","enAudio":"36b187320f6124005f32.mp3","wrong":{"A":{"text":"A說自己的狗三歲、是咖啡色的，只接著 dog，沒有回答會不會把戲。","audio":"676a20397b6e14804537.mp3"},"C":{"text":"C說自己昨晚在電視上看了狗狗表演，只由 tricks 聯想到表演，談自己，沒有回答自己的狗會不會。","audio":"36f6e149a6a3c04c0e58.mp3"}}},{"id":"L078-Q09","type":"言談理解","point":"明確訊息","unit":"U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號1 cookie；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號2 morning；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號29 work；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now","difficulty":"中","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"Mom made twelve cookies this morning. Where are they all?","audio":"6c771784f65c2b5c2bca.mp3","zh":"女孩：媽媽今天早上做了十二塊餅乾。它們都到哪裡去了？"},{"speaker":"Boy","text":"I ate three after school. Sorry!","audio":"a3c44b9136c5e29fff1b.mp3","zh":"男孩：我放學後吃了三塊。對不起！"},{"speaker":"Girl","text":"And I saw Lily eat two. So there should be seven left.","audio":"415377b9009d81e497df.mp3","zh":"女孩：而且我看到 Lily 吃了兩塊。所以應該還剩七塊。"},{"speaker":"Boy","text":"No, Dad took two to work. So there are only five now.","audio":"30aece1077472012693d.mp3","zh":"男孩：不對，爸爸帶了兩塊去上班。所以現在只剩五塊。"}],"question":{"text":"How many cookies are left now?","audio":"e4b0b91e9a25b3c792e9.mp3","zh":"現在還剩幾塊餅乾？"},"options":{"A":{"text":"Five.","letterAudio":"93138ad65b3704914636.mp3","audio":"9bf64acb19a272c3420d.mp3","zh":"五塊。","letterEnd":0.537},"B":{"text":"Seven.","letterAudio":"609555d8760f27caf21b.mp3","audio":"1f7667cc1d12d5f4d537.mp3","zh":"七塊。","letterEnd":0.588},"C":{"text":"Twelve.","letterAudio":"9756927a5f3791737934.mp3","audio":"7c2fae31fe20b9200668.mp3","zh":"十二塊。","letterEnd":0.713}},"answer":"A","keyLines":[3],"evidence":"媽媽做了十二塊，男孩吃三塊、Lily 吃兩塊後女孩以為剩七塊；男孩說爸爸又帶了兩塊去上班，「there are only five now」，所以現在剩五塊。","zhCorrect":"78167bfd18d58f00e767.mp3","enText":"The answer is A. Five. Mom made twelve cookies. The boy ate three, and Lily ate two, so the girl thinks there are seven. But Dad took two to work. So there are only five cookies now.","enAudio":"3e6bb7ced47851809166.mp3","wrong":{"B":{"text":"B七塊是女孩還不知道爸爸帶走兩塊時算出來的數字。","audio":"dd66fcadddfafb62d4b1.mp3"},"C":{"text":"C十二塊是媽媽一開始做的數量。","audio":"9238ac44b1fa7b5e24ac.mp3"}}},{"id":"L078-Q10","type":"言談理解","point":"明確訊息","unit":"U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號34 train；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號105 next；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號44 stop；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號32 car；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號120 quiet；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號80 talk；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號57 play；U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號67 music；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號46 buy；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號48 find","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Welcome aboard. This train is going to Kaohsiung, and the next stop is Taichung. Car eight is our quiet car. In car eight, please do not talk on the phone or play music. You can buy drinks and lunch boxes from our cart. If you need help, please find our staff in car six. Thank you.","audio":"d400644b27a1e687a8de.mp3","zh":"歡迎搭乘。這班列車開往高雄，下一站是臺中。八號車廂是我們的安靜車廂。在八號車廂，請不要講電話或放音樂。您可以向我們的推車購買飲料和便當。如果需要幫忙，請到六號車廂找我們的服務人員。謝謝。"}],"question":{"text":"What should people not do in car eight?","audio":"cb46811c5a9af0c93cea.mp3","zh":"在八號車廂，大家不應該做什麼？"},"options":{"A":{"text":"Buy lunch boxes.","letterAudio":"93138ad65b3704914636.mp3","audio":"682f8c8ca11176574f3b.mp3","zh":"買便當。","letterEnd":0.537},"B":{"text":"Talk on the phone.","letterAudio":"609555d8760f27caf21b.mp3","audio":"d958280ea510df53f8dc.mp3","zh":"講電話。","letterEnd":0.588},"C":{"text":"Find the staff.","letterAudio":"9756927a5f3791737934.mp3","audio":"9ac5833a344cbb752a79.mp3","zh":"找服務人員。","letterEnd":0.713}},"answer":"B","keyLines":[0],"evidence":"廣播說「In car eight, please do not talk on the phone or play music」，所以在八號車廂不應該講電話。","zhCorrect":"2ca4ac4d1012d641dd8d.mp3","enText":"The answer is B. Talk on the phone. Car eight is the quiet car. In car eight, people should not talk on the phone or play music. People can buy lunch boxes from the cart, and the staff are in car six.","enAudio":"ca8ce551cb233af286db.mp3","wrong":{"A":{"text":"A廣播說可以向推車買便當，沒有說八號車廂不能買。","audio":"ec3587beea1e42cc6886.mp3"},"C":{"text":"C服務人員在六號車廂，需要幫忙可以去找他們，這不是八號車廂禁止的事。","audio":"c9ccbd097a7e0f1e481e.mp3"}}},{"id":"L078-Q11","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new、120 quiet、110 old；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號32 car；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號57 cost；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號55 drive、46 take、54 miss；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號89 must；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號44 love；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號38 hour；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號15 week；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號84 wait；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號1 station；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號63 noisy；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號70 cheap","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"Your dad's new electric car is so quiet!","audio":"dde99a89928e836df938.mp3","zh":"女孩：你爸爸的新電動車好安靜！"},{"speaker":"Boy","text":"Yes, and it doesn't cost much to drive.","audio":"f64b72c2a83f64c82097.mp3","zh":"男孩：對，而且開起來不太花錢。"},{"speaker":"Girl","text":"You must love it, then.","audio":"9a09b605e3e77b4d345f.mp3","zh":"女孩：那你一定很喜歡它。"},{"speaker":"Boy","text":"Not really. It takes five hours to charge. Last week, we waited an hour at a charging station on the way to Hualien. I miss our old car.","audio":"a956fa4b07d8aad75686.mp3","zh":"男孩：不太喜歡。它充電要五個小時。上星期在去花蓮的路上，我們在一個充電站等了一個小時。我很想念我們的舊車。"}],"question":{"text":"What does the boy think about the electric car?","audio":"8be140b4fa239e0aa57e.mp3","zh":"男孩覺得那輛電動車怎麼樣？"},"options":{"A":{"text":"He thinks it is too noisy.","letterAudio":"93138ad65b3704914636.mp3","audio":"7f36f79da9cde28916f4.mp3","zh":"他覺得它太吵了。","letterEnd":0.537},"B":{"text":"He likes their old car better.","letterAudio":"609555d8760f27caf21b.mp3","audio":"202e3e7dad208ec2de96.mp3","zh":"他比較喜歡他們的舊車。","letterEnd":0.588},"C":{"text":"He loves it because it is cheap.","letterAudio":"9756927a5f3791737934.mp3","audio":"70f43aaa781dcf51e48a.mp3","zh":"他很喜歡它，因為它很便宜。","letterEnd":0.713}},"answer":"B","keyLines":[3],"evidence":"女孩以為男孩一定很喜歡新的電動車，男孩說「Not really」，因為充電要很久，又說「I miss our old car」，可見他比較喜歡舊車。","zhCorrect":"96787ae054bb3309cb19.mp3","enText":"The answer is B. He likes their old car better. The electric car is quiet, and it doesn't cost much to drive. But it takes five hours to charge, and the family waited an hour at a charging station. The boy misses their old car. So the boy likes their old car better.","enAudio":"c0470b5ec0269ca727ba.mp3","wrong":{"A":{"text":"A女孩說電動車很安靜，不是很吵。","audio":"36a4465b1eba7cd76387.mp3"},"C":{"text":"C男孩雖然說開起來不太花錢，但女孩說他一定很喜歡時，他說「Not really」。","audio":"0c31e57abeb200bb3a3b.mp3"}}},{"id":"L078-Q12","type":"言談理解","point":"明確訊息","unit":"U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號20 team；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號43 hurt、48 jump、50 swim；U11｜核心單字「健康與身體」｜教材印刷頁 p.222｜核心編號8 knee；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號32 month、33 year、1 time、15 week；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號23 doctor；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say","difficulty":"易","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Girl","text":"Are you still on the basketball team?","audio":"3f8d2ffb67b0a08996c4.mp3","zh":"女孩：你還在籃球隊嗎？"},{"speaker":"Boy","text":"No. I hurt my knee last month, and the doctor said no more jumping for a year.","audio":"11fe273d50a8b0b3e0e6.mp3","zh":"男孩：沒有。我上個月傷了膝蓋，醫生說一年內都不能再跳了。"},{"speaker":"Girl","text":"That's too bad. So what do you do now? Tennis?","audio":"edf118bd82cb3839b93b.mp3","zh":"女孩：好可惜。那你現在做什麼？打網球嗎？"},{"speaker":"Boy","text":"Tennis is hard on my knee, too. I swim three times a week now.","audio":"5b036876b71259caec8e.mp3","zh":"男孩：網球對我的膝蓋也不好。我現在一星期游泳三次。"}],"question":{"text":"What sport does the boy do now?","audio":"15d4280784b774842ef5.mp3","zh":"男孩現在做什麼運動？"},"options":{"A":{"text":"Basketball.","letterAudio":"93138ad65b3704914636.mp3","audio":"831863415be4572555bb.mp3","zh":"籃球。","letterEnd":0.537},"B":{"text":"Tennis.","letterAudio":"609555d8760f27caf21b.mp3","audio":"9149c27c5640d7c32dc0.mp3","zh":"網球。","letterEnd":0.588},"C":{"text":"Swimming.","letterAudio":"9756927a5f3791737934.mp3","audio":"6dbdd4819e9ed8aa56a5.mp3","zh":"游泳。","letterEnd":0.713}},"answer":"C","keyLines":[3],"evidence":"男孩說「I swim three times a week now」，所以他現在的運動是游泳。","zhCorrect":"c84b10043dac1814cf41.mp3","enText":"The answer is C. Swimming. The boy hurt his knee, so he left the basketball team. Tennis is hard on his knee, too. Now the boy swims three times a week.","enAudio":"44b2985922f8cf5b9d68.mp3","wrong":{"A":{"text":"A男孩說他已經不在籃球隊了，因為膝蓋受傷。","audio":"db0ad11551dcf0fb966d.mp3"},"B":{"text":"B網球是女孩猜的，男孩說打網球對膝蓋也不好。","audio":"b705f2a1093ed99a8988.mp3"}}},{"id":"L078-Q13","type":"言談理解","point":"情境／地點推論","unit":"U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號73 turn；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號26 song；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號47 choose；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號44 number、35 class；U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號67 music；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號58 pay；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號38 place","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Boy","text":"It's my turn! Can you give me the microphone?","audio":"f429f30c5fdd7c4ee38d.mp3","zh":"男孩：輪到我了！你可以把麥克風給我嗎？"},{"speaker":"Girl","text":"Here. Which song did you choose?","audio":"65c49741552fbde3dee9.mp3","zh":"女孩：給你。你選了哪一首歌？"},{"speaker":"Boy","text":"Number fifteen. Can you turn the music up a little?","audio":"b3055105b8ecdce68a24.mp3","zh":"男孩：十五號。你可以把音樂開大聲一點嗎？"},{"speaker":"Girl","text":"OK. But we only have twenty minutes left. Then we have to pay at the front desk.","audio":"8502e76c92b894c5ca17.mp3","zh":"女孩：好。不過我們只剩二十分鐘了。然後我們要去前面的櫃臺付錢。"}],"question":{"text":"Where are they most likely?","audio":"c29fc0a63955a6b6afe5.mp3","zh":"他們最有可能在哪裡？"},"options":{"A":{"text":"At a karaoke place.","letterAudio":"93138ad65b3704914636.mp3","audio":"36b10cf7b408f41b8842.mp3","zh":"在 KTV（卡拉 OK）。","letterEnd":0.537},"B":{"text":"In a music class.","letterAudio":"609555d8760f27caf21b.mp3","audio":"f748468b4863f89a039c.mp3","zh":"在音樂課上。","letterEnd":0.588},"C":{"text":"At a concert hall.","letterAudio":"9756927a5f3791737934.mp3","audio":"baa7abd0f98837354b06.mp3","zh":"在音樂廳。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男孩說輪到他拿麥克風、選了十五號歌，女孩說只剩二十分鐘，之後要到前面櫃臺付錢，可知他們最有可能在 KTV（卡拉 OK）。","zhCorrect":"f514843cd896677ebb47.mp3","enText":"The answer is A. At a karaoke place. The boy says it's his turn with the microphone, and he chose song number fifteen. The girl says they have twenty minutes left, and then they have to pay at the front desk. So they are most likely at a karaoke place.","enAudio":"b7456bba3d1369144dfa.mp3","wrong":{"B":{"text":"B音樂課不會輪流選歌號碼，也不用按時間到櫃臺付錢。","audio":"bf91d56f7712b7e6b02b.mp3"},"C":{"text":"C在音樂廳是聽別人表演，不會輪到自己拿麥克風選歌。","audio":"2c1e75e208e8bde957f1.mp3"}}},{"id":"L078-Q14","type":"言談理解","point":"整體訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號54 learn、19 lesson；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class、44 number；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today、15 week；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號51 fall、62 call；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號40 push；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號5 middle、8 hospital；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號31 person；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號16 teacher；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號54 show；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號103 big；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號70 doll；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號44 useful；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號105 next","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Girl","text":"We learned first aid in health class today.","audio":"21dac03cd16785722d50.mp3","zh":"女孩：我們今天在健康課學了急救。"},{"speaker":"Boy","text":"First aid? What did you learn?","audio":"2820179731d330806930.mp3","zh":"男孩：急救？你們學了什麼？"},{"speaker":"Girl","text":"If someone falls down and doesn't wake up, we should call 119 first. Then we push hard on the middle of the person's chest. The teacher showed us on a big doll.","audio":"0ef5d0df12523ef71e3b.mp3","zh":"女孩：如果有人倒下、叫不醒，我們應該先打 119。然後用力壓那個人胸口的中間。老師用一個大娃娃示範給我們看。"},{"speaker":"Boy","text":"That sounds useful. I hope we learn it next week, too.","audio":"4959f3d5f488c9a13954.mp3","zh":"男孩：聽起來很有用。希望我們下星期也會學。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"A big doll in health class.","letterAudio":"93138ad65b3704914636.mp3","audio":"cd5a2b339820f5a26afd.mp3","zh":"健康課上的一個大娃娃。","letterEnd":0.537},"B":{"text":"The phone number of a hospital.","letterAudio":"609555d8760f27caf21b.mp3","audio":"d0bc626e39373dfb137e.mp3","zh":"一家醫院的電話號碼。","letterEnd":0.588},"C":{"text":"A first-aid lesson at school.","letterAudio":"9756927a5f3791737934.mp3","audio":"127a3649ce717aa0e43b.mp3","zh":"學校的一堂急救課。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩說今天在健康課學了急救，說明有人倒下叫不醒時要先打 119、再用力壓胸口，老師用大娃娃示範。整段在談學校的急救課。","zhCorrect":"a7f27773f32b15805988.mp3","enText":"The answer is C. A first-aid lesson at school. The girl learned first aid in health class. If someone falls down and doesn't wake up, call 119 first, and then push hard on the person's chest. The girl and the boy are talking about a first-aid lesson at school.","enAudio":"c0f2481461e550c893b0.mp3","wrong":{"A":{"text":"A大娃娃只是老師示範用的東西，是細節。","audio":"0965f5bfaca80801788c.mp3"},"B":{"text":"B 119 只是急救步驟中的第一步，對話沒有談醫院的電話號碼。","audio":"166d3de9fb17a4ee366a.mp3"}}},{"id":"L078-Q15","type":"言談理解","point":"語境猜義","unit":"U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號68 little；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號44 look；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號100 happy、109 new、111 young；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today、3 afternoon；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號112 together；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號58 build；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號57 play；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號36 toy；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號54 child；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號19 pet；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號46 friend；U11｜四、題目與閱讀補充字詞「Cat Cafe」｜教材印刷頁 p.237｜playmate","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"Your little brother looks so happy today.","audio":"f0daab39c75d6d05f4b4.mp3","zh":"女孩：你弟弟今天看起來好開心。"},{"speaker":"Boy","text":"Our new neighbors have a five-year-old girl. She's his new playmate.","audio":"830a5127568176e1fa5f.mp3","zh":"男孩：我們的新鄰居有一個五歲的女孩。她是他新的 playmate（玩伴）。"},{"speaker":"Girl","text":"What do they do together?","audio":"cd8b07fec2ce323d9647.mp3","zh":"女孩：他們一起做什麼？"},{"speaker":"Boy","text":"They build sandcastles in the park and play hide-and-seek every afternoon.","audio":"790afd900bc0c21ae991.mp3","zh":"男孩：他們每天下午在公園堆沙堡、玩捉迷藏。"}],"question":{"text":"What does the boy mean by \"playmate\"?","audio":"92458deaa92e9a02ff31.mp3","zh":"男孩說的 \"playmate\" 是什麼意思？"},"options":{"A":{"text":"A toy for young children.","letterAudio":"93138ad65b3704914636.mp3","audio":"0261ba5605add0f26e33.mp3","zh":"給小小孩的玩具。","letterEnd":0.537},"B":{"text":"A pet of the new neighbors.","letterAudio":"609555d8760f27caf21b.mp3","audio":"7bd73d513b483c4a720c.mp3","zh":"新鄰居的寵物。","letterEnd":0.588},"C":{"text":"A friend to play with.","letterAudio":"9756927a5f3791737934.mp3","audio":"b6c83a5b8a5511432dfe.mp3","zh":"一起玩的朋友。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說鄰居五歲的女孩是弟弟的 playmate，兩個人每天下午一起在公園堆沙堡、玩捉迷藏，可知 playmate 是一起玩的朋友。","zhCorrect":"a93ca857b9fb894952fe.mp3","enText":"The answer is C. A friend to play with. The new neighbors have a five-year-old girl. She and the boy's little brother build sandcastles and play hide-and-seek every afternoon. So when the boy says playmate, he means a friend to play with.","enAudio":"fdd1be044ff5d9324fb0.mp3","wrong":{"A":{"text":"A playmate 指的是鄰居的五歲女孩，是人，不是玩具。","audio":"17fed6d85dcd8154fd64.mp3"},"B":{"text":"B男孩說的是鄰居家五歲的女孩，不是鄰居的寵物。","audio":"0f6eb127e7c049a4c3a8.mp3"}}},{"id":"L078-Q16","type":"言談理解","point":"說話者意見","unit":"U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號39 house；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號47 teach、43 speak；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號26 song；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號22 cook；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號32 dinner；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號112 together；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號47 part；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Boy","text":"Is it hard having Yuki from Japan at your house?","audio":"3dd8cd743a0a472d6220.mp3","zh":"男孩：從日本來的 Yuki 住在你家，會不會很辛苦？"},{"speaker":"Girl","text":"Not at all. She taught me some Japanese songs, and we cook dinner together.","audio":"7d99a1b19b6ecc7a8042.mp3","zh":"女孩：一點也不會。她教我唱一些日文歌，我們還一起煮晚餐。"},{"speaker":"Boy","text":"But don't you have to speak English with her all day?","audio":"3ba14df22fae33933555.mp3","zh":"男孩：可是你不是整天都要跟她說英文嗎？"},{"speaker":"Girl","text":"Yes, and that's the best part. My English is much better now.","audio":"688488339f7f01ebcf85.mp3","zh":"女孩：對，那是最棒的部分。我的英文現在好多了。"}],"question":{"text":"What does the girl think about having Yuki at her house?","audio":"cd0cee5ec4304e3d9031.mp3","zh":"女孩覺得 Yuki 住在她家怎麼樣？"},"options":{"A":{"text":"She is glad that Yuki is there.","letterAudio":"93138ad65b3704914636.mp3","audio":"7d522fd7e5b37f5df703.mp3","zh":"她很高興 Yuki 在她家。","letterEnd":0.537},"B":{"text":"She wants Yuki to go back to Japan.","letterAudio":"609555d8760f27caf21b.mp3","audio":"4816b4b1defc18be2f27.mp3","zh":"她希望 Yuki 回日本。","letterEnd":0.588},"C":{"text":"She thinks speaking English is too hard.","letterAudio":"9756927a5f3791737934.mp3","audio":"75d6deb9da934351c25b.mp3","zh":"她覺得說英文太難了。","letterEnd":0.713}},"answer":"A","keyLines":[1,3],"evidence":"女孩說「Not at all」，Yuki 教她唱日文歌、一起煮晚餐，整天說英文是「the best part」，英文也進步了，可見她很高興 Yuki 住在她家。","zhCorrect":"32d238a34fa295a252d0.mp3","enText":"The answer is A. She is glad that Yuki is there. The girl says it is not hard at all. Yuki taught her some Japanese songs, and they cook dinner together. The girl says speaking English all day is the best part. So the girl is glad that Yuki is at her house.","enAudio":"cafcf7f267a9ca9e7dea.mp3","wrong":{"C":{"text":"C女孩說整天說英文是最棒的部分，沒有說太難。","audio":"163210a8bf721485e8ab.mp3"},"B":{"text":"B女孩說一點也不辛苦，沒有說想讓 Yuki 回日本。","audio":"aead7f4a46bf1104695d.mp3"}}},{"id":"L078-Q17","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號13 Saturday；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號20 food；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號72 everything；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號1 cookie","difficulty":"易","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Mia. This is Ms. Wang from Sunshine Cooking School. Your cooking class this Saturday will be in Room 5, not Room 3. The class is from two to four. Please bring an apron. You don't need to bring any food. We will have everything for you. You can take your cookies home after class. See you on Saturday!","audio":"67c0a65b8400f5782d23.mp3","zh":"嗨，Mia。我是 Sunshine 烹飪教室的王小姐。你這星期六的烹飪課會在五號教室，不是三號教室。課程從兩點到四點。請帶一件圍裙。你不需要帶任何食物。我們會幫你準備好所有東西。下課後你可以把你的餅乾帶回家。星期六見！"}],"question":{"text":"What should Mia bring to the class?","audio":"2df2f208f5de9de70048.mp3","zh":"Mia 應該帶什麼去上課？"},"options":{"A":{"text":"Some food.","letterAudio":"93138ad65b3704914636.mp3","audio":"21d4bd116f723466e991.mp3","zh":"一些食物。","letterEnd":0.537},"B":{"text":"An apron.","letterAudio":"609555d8760f27caf21b.mp3","audio":"aae77cb5f013cb2dbafe.mp3","zh":"一件圍裙。","letterEnd":0.588},"C":{"text":"A box for cookies.","letterAudio":"9756927a5f3791737934.mp3","audio":"93d441467ebe58665a58.mp3","zh":"一個裝餅乾的盒子。","letterEnd":0.713}},"answer":"B","keyLines":[0],"evidence":"王小姐說「Please bring an apron」，所以 Mia 要帶一件圍裙去上課。","zhCorrect":"4fe80bd6751955da69ad.mp3","enText":"The answer is B. An apron. The cooking class is in Room 5 this Saturday. Mia doesn't need to bring any food, because the school will have everything. Mia should bring an apron.","enAudio":"a88b65e3d4971ea92dc3.mp3","wrong":{"A":{"text":"A王小姐說「You don't need to bring any food」，教室會準備好所有東西。","audio":"2abfd3febd09dc535762.mp3"},"C":{"text":"C王小姐只說下課後可以把餅乾帶回家，沒有要 Mia 帶裝餅乾的盒子。","audio":"e260ed6d4f03f3b92e99.mp3"}}},{"id":"L078-Q18","type":"言談理解","point":"整體訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號3 summer、43 speak、31 trip；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號13 cousin；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號32 month、14 Sunday；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good、109 new、111 young；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號93 look、94 draw；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give、91 know；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號69 picture；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號26 thing；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號20 food；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號48 animal；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號38 place；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號62 call","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last summer, my cousin Amy from Canada stayed with us for a month. She was six and couldn't speak Chinese, and my English wasn't very good. At first, we just sat and looked at each other. Then I gave her some paper and crayons. We drew pictures to tell each other things, like food, animals, and places. By the end of the month, she knew twenty Chinese words, and I knew many new English words. Now we have a video call every Sunday.","audio":"b89f3859380c1b87150c.mp3","zh":"去年夏天，我從加拿大來的表妹（堂妹）Amy 來我們家住了一個月。她六歲，不會說中文，我的英文也不太好。一開始，我們只是坐著看著對方。後來我給她一些紙和蠟筆。我們畫圖告訴對方事情，像是食物、動物和地方。到了月底，她會二十個中文字，我也學會很多新的英文字。現在我們每個星期日都會視訊。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"Making friends with a young cousin.","letterAudio":"93138ad65b3704914636.mp3","audio":"253bd36b590812ba79db.mp3","zh":"和年紀小的表妹（堂妹）成為朋友。","letterEnd":0.537},"B":{"text":"Drawing pictures with crayons.","letterAudio":"609555d8760f27caf21b.mp3","audio":"ffddb8c62da954dea51c.mp3","zh":"用蠟筆畫圖。","letterEnd":0.588},"C":{"text":"Taking a trip to Canada last summer.","letterAudio":"9756927a5f3791737934.mp3","audio":"65a87f4d0c193a8f57a2.mp3","zh":"去年夏天去加拿大旅行。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"說話者說加拿大來的表妹（堂妹）不會說中文，自己的英文也不好，兩人用畫圖溝通，最後都學會對方的語言，現在每週視訊。整段在談說話者和年紀小的表妹（堂妹）成為朋友。","zhCorrect":"3d3f9931eee15dead0bc.mp3","enText":"The answer is A. Making friends with a young cousin. The speaker's cousin Amy came from Canada and stayed for a month. Amy couldn't speak Chinese, so they drew pictures to tell each other things. Now they have a video call every Sunday. The talk is about making friends with a young cousin.","enAudio":"e62b58a6cfc0b4325c42.mp3","wrong":{"B":{"text":"B用蠟筆畫圖只是兩人溝通的方法，是細節。","audio":"d928ab0820bf2b835ae3.mp3"},"C":{"text":"C是 Amy 從加拿大來說話者家，說話者沒有去加拿大旅行。","audio":"78ae7b91a3a2f1c584fb.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L078/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
