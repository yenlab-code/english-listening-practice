<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>

dio":"2a7ab9085d8619b28cec.mp3"},"C":{"text":"C說自己的隊伍星期六比賽、穿紅色的衣服，只接著 team，談自己，沒有回應對方的消息。","audio":"8f087f530ed40559029d.mp3"}}},{"id":"L070-Q08","type":"基本問答","point":"接受／拒絕","unit":"U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號44 stop、55 drive；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號16 teacher","difficulty":"易","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"You can have my seat. I'm getting off at the next stop.","audio":"ce7dd8f8cd6361af79b4.mp3","zh":"你可以坐我的位子。我下一站就要下車了。"}],"question":null,"options":{"A":{"text":"Oh, thank you. That's kind of you.","letterAudio":"93138ad65b3704914636.mp3","audio":"4b30534e6658e49bff18.mp3","zh":"噢，謝謝你。你人真好。","letterEnd":0.537},"B":{"text":"The bus is really crowded today.","letterAudio":"609555d8760f27caf21b.mp3","audio":"f6f0e8cc77e7829b1708.mp3","zh":"今天公車真的很擠。","letterEnd":0.588},"C":{"text":"My dad drives me to school. He's a teacher.","letterAudio":"9756927a5f3791737934.mp3","audio":"d2f36ac5f34514e1aee8.mp3","zh":"我爸爸開車送我上學。他是老師。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"對方要把位子讓給自己；A向對方道謝，說他人真好，是接受的說法。","zhCorrect":"47ee90351d519d9659ac.mp3","enText":"The answer is A. Oh, thank you. That's kind of you. Someone says you can have their seat, because they are getting off at the next stop. The best reply is, Oh, thank you. That's kind of you. This reply says yes to the offer.","enAudio":"c3b3f91ac787c85e2e23.mp3","wrong":{"B":{"text":"B說今天公車真的很擠，只由讓座聯想到車上很擠，沒有回答要不要坐。","audio":"67d2e784b5ce3308c0b4.mp3"},"C":{"text":"C說爸爸開車送自己上學、他是老師，只由搭車聯想到上學的方式，沒有回答要不要坐。","audio":"f6e680e9f7108345570d.mp3"}}},{"id":"L070-Q09","type":"言談理解","point":"明確訊息","unit":"U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號34 bicycle / bike；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號27 yesterday；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號61 ride；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號2 morning","difficulty":"中","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"Is your bike still at the repair shop?","audio":"7fd6ed343d04e5e22dc9.mp3","zh":"女孩：你的腳踏車還在修車店嗎？"},{"speaker":"Boy","text":"No, I got it back yesterday.","audio":"ec62e006fb6826c34f55.mp3","zh":"男孩：不在，我昨天把它牽回來了。"},{"speaker":"Girl","text":"So it's at home?","audio":"ca01cdfa887329032497.mp3","zh":"女孩：所以它在家裡？"},{"speaker":"Boy","text":"Not now. My brother rode it to school this morning, because his bike has a flat tire.","audio":"f10bac4894e152e0f224.mp3","zh":"男孩：現在不在。我哥哥（弟弟）今天早上把它騎去學校了，因為他的腳踏車輪胎沒氣了。"}],"question":{"text":"Where is the boy's bike now?","audio":"7e6e340331cf3852b152.mp3","zh":"男孩的腳踏車現在在哪裡？"},"options":{"A":{"text":"At the repair shop.","letterAudio":"93138ad65b3704914636.mp3","audio":"4c8cebe2e1e70ed3acbd.mp3","zh":"在修車店。","letterEnd":0.537},"B":{"text":"At the boy's home.","letterAudio":"609555d8760f27caf21b.mp3","audio":"1dc31ed7a75556d1f062.mp3","zh":"在男孩家。","letterEnd":0.588},"C":{"text":"At school.","letterAudio":"9756927a5f3791737934.mp3","audio":"9fc478202ec281bbb130.mp3","zh":"在學校。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說腳踏車現在不在家，他的哥哥（弟弟）今天早上把它騎去學校了，所以腳踏車現在在學校。","zhCorrect":"109aa6a6620a98e92d79.mp3","enText":"The answer is C. At school. The boy got his bike back from the repair shop yesterday. But this morning, the boy's brother rode it to school. So the bike is at school now.","enAudio":"caf2956d91b6aa2e5bc6.mp3","wrong":{"A":{"text":"A男孩說他昨天已經從修車店把腳踏車牽回來了。","audio":"b356cf6166aae25b1dbe.mp3"},"B":{"text":"B女孩以為在家，但男孩說現在不在家。","audio":"76b4d74176bf27da0fa7.mp3"}}},{"id":"L070-Q10","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號108 close；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號6 bread；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號12 milk、11 juice；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號21 fruit；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號4 area；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號89 clean；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號26 thing","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good evening, shoppers. Our store will close in thirty minutes, at ten o'clock. All the bread in our bakery is half price after nine. Milk and juice are buy one, get one free. The fruit area is now closed for cleaning. Please bring your things to the checkout before ten. Thank you.","audio":"6593c749696dfb07ad09.mp3","zh":"各位顧客晚安。本店將在三十分鐘後、十點打烊。我們麵包店的所有麵包九點以後半價。牛奶和果汁買一送一。水果區現在暫停開放進行清潔。請在十點前把您的東西拿到結帳櫃臺。謝謝。"}],"question":{"text":"What is half price tonight?","audio":"47a74028c3dadccd6ec5.mp3","zh":"今晚什麼東西半價？"},"options":{"A":{"text":"Bread.","letterAudio":"93138ad65b3704914636.mp3","audio":"453c069d9f59b4b4906c.mp3","zh":"麵包。","letterEnd":0.537},"B":{"text":"Fruit.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e80d3c37075532083beb.mp3","zh":"水果。","letterEnd":0.588},"C":{"text":"Milk.","letterAudio":"9756927a5f3791737934.mp3","audio":"e9f377cd93b0da8b5d5a.mp3","zh":"牛奶。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"廣播說「All the bread in our bakery is half price after nine」，所以今晚半價的是麵包。","zhCorrect":"919fa13bd5656f719606.mp3","enText":"The answer is A. Bread. All the bread in the bakery is half price after nine. Milk and juice are buy one, get one free, and the fruit area is closed. So bread is half price tonight.","enAudio":"9c7ae2b0a5ec97a883b2.mp3","wrong":{"B":{"text":"B水果區現在關閉打掃，廣播沒有說水果半價。","audio":"91bea8ac33bda27243bc.mp3"},"C":{"text":"C牛奶是買一送一，不是半價。","audio":"317ccbed816c2f312d0f.mp3"}}},{"id":"L070-Q11","type":"言談理解","point":"說話者意見","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號15 week、12 Friday；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class、45 classmate、34 classroom；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號31 lunch；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號91 know；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號54 fresh；U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號14 care；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號45 like；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號103 big；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號38 tree","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"From next week, our class will eat lunch outside on Fridays.","audio":"0dbad22db2b4bb6be010.mp3","zh":"女孩：從下星期開始，我們班星期五要在外面吃午餐。"},{"speaker":"Boy","text":"I know. I can't wait.","audio":"68d207879f9bf5d92d91.mp3","zh":"男孩：我知道。我等不及了。"},{"speaker":"Girl","text":"Me too. The fresh air will be so nice.","audio":"388a5b516019a583e450.mp3","zh":"女孩：我也是。新鮮的空氣會很舒服。"},{"speaker":"Boy","text":"I don't really care about the air. I just like eating under the big trees with all my classmates.","audio":"f7c9a8fe118bff2fdc81.mp3","zh":"男孩：我不太在意空氣。我只是喜歡和我們班所有同學一起在大樹下吃飯。"}],"question":{"text":"What does the boy think about eating lunch outside?","audio":"5546983bc8c1c92c4537.mp3","zh":"男孩覺得在外面吃午餐怎麼樣？"},"options":{"A":{"text":"He likes it because of his classmates.","letterAudio":"93138ad65b3704914636.mp3","audio":"e08d80bcc99edf2cda56.mp3","zh":"他喜歡，是因為他的同學。","letterEnd":0.537},"B":{"text":"He likes it because of the fresh air.","letterAudio":"609555d8760f27caf21b.mp3","audio":"c332a8c9646be44cd5c5.mp3","zh":"他喜歡，是因為新鮮的空氣。","letterEnd":0.588},"C":{"text":"He would rather eat in the classroom.","letterAudio":"9756927a5f3791737934.mp3","audio":"f2cca0b97e8d4a0fa15b.mp3","zh":"他寧可在教室吃。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男孩說他不太在意空氣，他只是喜歡和全班同學一起在大樹下吃飯，所以他喜歡在外面吃午餐是因為同學。","zhCorrect":"c0348bbd89b0b0aa17b8.mp3","enText":"The answer is A. He likes it because of his classmates. The girl likes the fresh air. But the boy doesn't really care about the air. He just likes eating under the big trees with all his classmates. So he likes eating lunch outside because of his classmates.","enAudio":"52a0c965234fea04b95e.mp3","wrong":{"B":{"text":"B新鮮空氣是女孩喜歡的理由，男孩說他不太在意空氣。","audio":"31f17acbb5a95601f1a4.mp3"},"C":{"text":"C男孩說他等不及了，並不想在教室吃。","audio":"79e9b56219c9373b17fb.mp3"}}},{"id":"L070-Q12","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號8 grandmother / grandma、7 grandfather / grandpa；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號32 dinner；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號58 cold；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號62 call；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號26 plate；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號60 table","difficulty":"易","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Mother","text":"Grandma, Grandpa, Uncle Joe, and Aunt Mary are coming for dinner, so we'll be eight.","audio":"4e361e8f7f4315623c30.mp3","zh":"媽媽：爺爺、奶奶、Joe 叔叔（舅舅）和 Mary 阿姨（嬸嬸）要來吃晚餐，所以我們會有八個人。"},{"speaker":"Boy","text":"Is Uncle Joe still coming? He has a cold.","audio":"d5569888a2bf748e6db2.mp3","zh":"男孩：Joe 叔叔（舅舅）還會來嗎？他感冒了。"},{"speaker":"Mother","text":"He called. He and Aunt Mary can't come.","audio":"c18d4964511285205893.mp3","zh":"媽媽：他打電話來了。他和 Mary 阿姨（嬸嬸）不能來。"},{"speaker":"Boy","text":"So we'll be six.","audio":"f37f4d3372e024b0a1ee.mp3","zh":"男孩：所以我們會有六個人。"},{"speaker":"Mother","text":"Right. Please put six plates on the table.","audio":"1e00becbac230020f29d.mp3","zh":"媽媽：對。請在桌上放六個盤子。"}],"question":{"text":"How many people will have dinner tonight?","audio":"18b2488ce31c90c8f376.mp3","zh":"今晚會有幾個人吃晚餐？"},"options":{"A":{"text":"Eight.","letterAudio":"93138ad65b3704914636.mp3","audio":"0156c05604b153bd5d56.mp3","zh":"八個。","letterEnd":0.537},"B":{"text":"Six.","letterAudio":"609555d8760f27caf21b.mp3","audio":"387becd5c8df88f98ffd.mp3","zh":"六個。","letterEnd":0.588},"C":{"text":"Four.","letterAudio":"9756927a5f3791737934.mp3","audio":"ae84fecd12abc9244150.mp3","zh":"四個。","letterEnd":0.713}},"answer":"B","keyLines":[3],"evidence":"媽媽說 Joe 叔叔（舅舅）和 Mary 阿姨（嬸嬸等）不能來，男孩說「So we'll be six」，媽媽也說對，請他放六個盤子，所以會有六個人吃晚餐。","zhCorrect":"e549544264cb79c9cad6.mp3","enText":"The answer is B. Six. At first, the family will be eight for dinner. But Uncle Joe called, and he and Aunt Mary can't come. So six people will have dinner, and the mother asks the boy to put six plates on the table.","enAudio":"1689365bf4daee45d711.mp3","wrong":{"A":{"text":"A八個人是兩位客人不能來之前的人數。","audio":"c4ac17db11a6cecc394a.mp3"},"C":{"text":"C四個人是原本要來吃晚餐的客人人數，不是一起吃晚餐的總人數。","audio":"ff340d772fb6e7c3cfe3.mp3"}}},{"id":"L070-Q13","type":"言談理解","point":"情境／地點推論","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry、105 tall；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號41 centimeter；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號32 bag；U02｜核心單字「介系詞」｜教材印刷頁 p.33｜核心編號118 before；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號55 fast；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號73 turn；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號5 middle；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Man","text":"Sorry, you need to be 120 centimeters tall to go on this ride.","audio":"4fd826e75c1d194e81f3.mp3","zh":"男士：抱歉，你要一百二十公分高才能玩這個遊樂設施。"},{"speaker":"Girl","text":"Oh no. I'm only 118.","audio":"1131094262571ff06830.mp3","zh":"女孩：噢，不。我只有一百一十八。"},{"speaker":"Man","text":"Then try the teacups over there. And please put your bag in the box before you get on.","audio":"cb3fe95666bbd6ea607c.mp3","zh":"男士：那試試那邊的咖啡杯。上去之前，請把你的包包放在箱子裡。"},{"speaker":"Girl","text":"Do the teacups go very fast?","audio":"b141a74ff191b62a8228.mp3","zh":"女孩：咖啡杯會轉得很快嗎？"},{"speaker":"Man","text":"Only if you turn the wheel in the middle.","audio":"72fe658da8ab6b7f39f7.mp3","zh":"男士：只有你轉中間的輪子才會。"}],"question":{"text":"Where are they most likely?","audio":"c29fc0a63955a6b6afe5.mp3","zh":"他們最有可能在哪裡？"},"options":{"A":{"text":"At a toy store.","letterAudio":"93138ad65b3704914636.mp3","audio":"ab0ab302b521991ae828.mp3","zh":"在玩具店。","letterEnd":0.537},"B":{"text":"At a doctor's office.","letterAudio":"609555d8760f27caf21b.mp3","audio":"222fef057dcbab364118.mp3","zh":"在診所。","letterEnd":0.588},"C":{"text":"At an amusement park.","letterAudio":"9756927a5f3791737934.mp3","audio":"667ded50cb77be29e857.mp3","zh":"在遊樂園。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男士說要一百二十公分高才能玩這個遊樂設施，要女孩改玩那邊的咖啡杯，上去前把包包放好，可知他們在遊樂園。","zhCorrect":"d1361820eef058f591ce.mp3","enText":"The answer is C. At an amusement park. The girl needs to be 120 centimeters tall to go on the ride, but she is only 118, so the man tells her to try the teacups. He also asks her to put her bag in the box before she gets on. They are most likely at an amusement park.","enAudio":"13892d979e4b80e2f19e.mp3","wrong":{"A":{"text":"A咖啡杯是可以坐上去、會轉的遊樂設施，不是店裡賣的玩具。","audio":"757c864be45c9b4a4cbe.mp3"},"B":{"text":"B量身高是為了決定能不能玩這個遊樂設施，不是在看醫生。","audio":"6633b72aac9fd4c9ab7f.mp3"}}},{"id":"L070-Q14","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see、92 watch；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號5 night、32 month、14 Sunday；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號22 cook；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號11 noodle；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start、48 write、54 learn；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號68 video；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號55 put；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號106 many；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號45 thousand、41 shop；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號116 favorite；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號18 dish；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Girl","text":"I saw your dad on the Internet last night! He was cooking beef noodles.","audio":"6778c76da1fc067cf0a8.mp3","zh":"女孩：我昨天晚上在網路上看到你爸爸！他在煮牛肉麵。"},{"speaker":"Boy","text":"Yes, he started making cooking videos last month. He puts one online every Sunday.","audio":"088a3dbc2a8ca0cb6cf7.mp3","zh":"男孩：對，他上個月開始拍做菜的影片。他每個星期日放一支到網路上。"},{"speaker":"Girl","text":"Do many people watch them?","audio":"576a4da381f6727f251d.mp3","zh":"女孩：很多人看嗎？"},{"speaker":"Boy","text":"About two thousand now. People write to him and ask how to cook their favorite dishes, so he makes videos about them.","audio":"04688e3ee787fd6458c0.mp3","zh":"男孩：現在大約兩千人。大家寫信給他，問他怎麼煮他們最喜歡的菜，所以他就拍那些菜的影片。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"A beef noodle shop in town.","letterAudio":"93138ad65b3704914636.mp3","audio":"8c9977d232e83146f349.mp3","zh":"鎮上一家牛肉麵店。","letterEnd":0.537},"B":{"text":"Cooking videos the boy's dad makes.","letterAudio":"609555d8760f27caf21b.mp3","audio":"3ad3842000a346dd6230.mp3","zh":"男孩爸爸拍的做菜影片。","letterEnd":0.588},"C":{"text":"Dishes the girl wants to learn.","letterAudio":"9756927a5f3791737934.mp3","audio":"431a20e1ce4a6c6e16bf.mp3","zh":"女孩想學的菜。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男孩說他爸爸上個月開始拍做菜影片，每個星期日放一支到網路上，現在大約兩千人看，還會依觀眾的要求拍影片。整段在談男孩爸爸拍的做菜影片。","zhCorrect":"6b015bf1fecf09d23e0c.mp3","enText":"The answer is B. Cooking videos the boy's dad makes. The boy's dad started making cooking videos last month, and he puts one online every Sunday. About two thousand people watch them now. The girl and the boy are talking about cooking videos the boy's dad makes.","enAudio":"1fb13ed04d6d01e811e4.mp3","wrong":{"A":{"text":"A牛肉麵是男孩爸爸在影片裡煮的菜，對話沒有提到牛肉麵店。","audio":"0d8b1cd5d2b3e2096432.mp3"},"C":{"text":"C寫信問怎麼做菜的是看影片的人，對話沒有說女孩想學哪些菜。","audio":"2ba4146e6cf2382fe47b.mp3"}}},{"id":"L070-Q15","type":"言談理解","point":"語境猜義","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號16 weekend；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號91 know；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號49 dog；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號11 hotel；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號3 summer；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small、103 big、108 close；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park；U07｜核心單字「形容詞、副詞與其他詞類」｜教材印刷頁 p.136｜核心編號60 even；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號65 bed；U04｜核心單字「食物：可數與不可數用法」｜教材印刷頁 p.71｜核心編號20 food；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U11｜四、題目與閱讀補充字詞「單題與畢業活動」｜教材印刷頁 pp.231～233 pet-friendly","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"My family is going to Kenting this weekend, but we don't know what to do with our dog.","audio":"4928df1abd51e035b1ee.mp3","zh":"女孩：我家這個週末要去墾丁，可是我們不知道狗要怎麼辦。"},{"speaker":"Boy","text":"Why not take her with you? Our hotel there last summer was pet-friendly.","audio":"abd5cbca2b0709fc26c9.mp3","zh":"男孩：何不帶牠一起去？我們去年夏天在那裡住的飯店是 pet-friendly（歡迎寵物）的。"},{"speaker":"Girl","text":"Really?","audio":"0b83c1e31ec5a89a2fca.mp3","zh":"女孩：真的嗎？"},{"speaker":"Boy","text":"Yes. Dogs could stay in the rooms, there was a small park for them, and they even had dog beds. Our dog Max is big, and he stayed with us. But there's no pet shop near it, so take her food.","audio":"0c210e206768a21d0e7d.mp3","zh":"男孩：對。狗可以待在房間裡，有一個給牠們的小公園，他們甚至還有狗床。我們的狗 Max 很大，牠也跟我們住在一起。不過那附近沒有寵物店，所以要帶牠的食物。"}],"question":{"text":"What does the boy mean by \"pet-friendly\"?","audio":"6c8ddaa0433a86412a56.mp3","zh":"男孩說的 \"pet-friendly\" 是什麼意思？"},"options":{"A":{"text":"Close to a pet shop.","letterAudio":"93138ad65b3704914636.mp3","audio":"14c045b85b6ead07ecf1.mp3","zh":"靠近寵物店。","letterEnd":0.537},"B":{"text":"Open to guests with pets.","letterAudio":"609555d8760f27caf21b.mp3","audio":"727bc57bfe4505841ac8.mp3","zh":"歡迎帶寵物的客人。","letterEnd":0.588},"C":{"text":"Only for small dogs.","letterAudio":"9756927a5f3791737934.mp3","audio":"4a503075b25d63833ed5.mp3","zh":"只給小型狗。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男孩說狗可以待在房間裡，有給狗的小公園，還有狗床，他們的大狗 Max 也跟他們住，所以 pet-friendly 是指歡迎客人帶寵物入住。","zhCorrect":"a50105edd84336d37245.mp3","enText":"The answer is B. Open to guests with pets. At the hotel, dogs could stay in the rooms, and there were dog beds and a small park for them. Even the boy's big dog could stay. So when the boy says pet-friendly, he means open to guests with pets.","enAudio":"9c378fd3c9215e37c1ce.mp3","wrong":{"A":{"text":"A男孩說那家飯店附近沒有寵物店，要女孩自己帶狗食。","audio":"4048dddd47b5e7115d13.mp3"},"C":{"text":"C男孩說他們的狗 Max 很大，也跟他們住在飯店裡。","audio":"a1cf8bc8041723c7cf30.mp3"}}},{"id":"L070-Q16","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號23 window；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great、104 lucky；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號14 mountain；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號10 sun；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號49 shine；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號66 desk；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號44 love、53 change","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Boy","text":"How's your new seat by the window?","audio":"fd0ad19a4b3129b8d3aa.mp3","zh":"男孩：你窗戶旁邊的新座位怎麼樣？"},{"speaker":"Girl","text":"The view is great. I can see the mountains.","audio":"b6fb463003b37a14d984.mp3","zh":"女孩：景色很棒。我可以看到山。"},{"speaker":"Boy","text":"Lucky you.","audio":"e7e37021d1e73bb7080b.mp3","zh":"男孩：你真幸運。"},{"speaker":"Girl","text":"Not really. The sun shines on my desk all afternoon, and I can't see the board well. I want to move back.","audio":"639d221847a7fe8595fe.mp3","zh":"女孩：其實不太是。整個下午太陽都照在我的桌子上，我看不清楚黑板。我想搬回去。"}],"question":{"text":"What does the girl think about her new seat?","audio":"9a250afd2d33a84f6196.mp3","zh":"女孩覺得她的新座位怎麼樣？"},"options":{"A":{"text":"She loves the view and the sun.","letterAudio":"93138ad65b3704914636.mp3","audio":"eea8d3339b6855dc8411.mp3","zh":"她喜愛那裡的景色和陽光。","letterEnd":0.537},"B":{"text":"She is lucky to sit there.","letterAudio":"609555d8760f27caf21b.mp3","audio":"63ba3c2e82e5069ff8f1.mp3","zh":"她很幸運能坐在那裡。","letterEnd":0.588},"C":{"text":"She would like to change it.","letterAudio":"9756927a5f3791737934.mp3","audio":"567cd79f60e2b2a8ee4f.mp3","zh":"她想要換座位。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩雖然說景色很棒，但又說整個下午太陽照在桌上、看不清楚黑板，想搬回去，可見她想換座位。","zhCorrect":"2fd4d695584574711c76.mp3","enText":"The answer is C. She would like to change it. The girl says the view is great. But the sun shines on her desk all afternoon, and she can't see the board well. She wants to move back, so she would like to change her seat.","enAudio":"7fbcff3a0b3cb13e53ca.mp3","wrong":{"A":{"text":"A女孩喜歡景色，但太陽照在桌上讓她看不清楚黑板，她並不喜歡。","audio":"02d558b910f9beb156bf.mp3"},"B":{"text":"B「幸運」是男孩說的話，女孩回答 Not really。","audio":"80b2791b6bf6732c28fb.mp3"}}},{"id":"L070-Q17","type":"言談理解","point":"明確訊息","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號13 Saturday；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class、33 school；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號89 clean、84 meet、85 give；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號1 station；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號24 glove；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號32 bag；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號56 forget；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Jason. It's Kevin. On Saturday, our class is going to clean the park. We're meeting at the train station at eight, not at school. Please bring gloves. You don't need to bring trash bags, because the town will give us some. And don't forget your water.","audio":"4bebf927ca131f63351a.mp3","zh":"嗨，Jason。我是 Kevin。星期六我們班要去打掃公園。我們八點在火車站集合，不是在學校。請帶手套。你不用帶垃圾袋，因為鎮上會給我們一些。還有，別忘了帶你的水。"}],"question":{"text":"Where will the class meet on Saturday?","audio":"ffa2a4cd4ae0afdac7f3.mp3","zh":"班上星期六會在哪裡集合？"},"options":{"A":{"text":"At the train station.","letterAudio":"93138ad65b3704914636.mp3","audio":"b355fe77d54d840a35ba.mp3","zh":"在火車站。","letterEnd":0.537},"B":{"text":"At school.","letterAudio":"609555d8760f27caf21b.mp3","audio":"9fc478202ec281bbb130.mp3","zh":"在學校。","letterEnd":0.588},"C":{"text":"At the park.","letterAudio":"9756927a5f3791737934.mp3","audio":"57232f032b5d8ecfedca.mp3","zh":"在公園。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"Kevin 說「We're meeting at the train station at eight, not at school」，所以班上星期六在火車站集合。","zhCorrect":"0c15c9f96af938f23672.mp3","enText":"The answer is A. At the train station. On Saturday, Jason's class is going to clean the park. Kevin says they are meeting at the train station at eight, not at school. So the class will meet at the train station.","enAudio":"49832708569aa1c99f4e.mp3","wrong":{"B":{"text":"B Kevin 特別說不是在學校集合。","audio":"569c2cca13fe178dde99.mp3"},"C":{"text":"C公園是他們要去打掃的地方，不是集合的地點。","audio":"b1403d127ea405c4536b.mp3"}}},{"id":"L070-Q18","type":"言談理解","point":"整體訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start；U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號22 grade；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class、33 school；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號30 plant；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small、105 tall、101 sad；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號38 tree；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號21 playground；U11｜核心單字「健康與身體」｜教材印刷頁 p.222｜核心編號8 knee；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號32 month、6 second、33 year；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號29 typhoon；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號35 break、51 grow；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號16 teacher；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號76 rule","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"When I started seventh grade, each class at my school planted a small tree near the playground. Our tree was only as tall as my knee. Every month, we watered it and measured it. In our second year, a typhoon broke one of its branches, and we were all sad. But it kept growing. Now we're in ninth grade, and it's taller than our teacher. Next month we'll graduate, but our tree will stay.","audio":"ce90a79440c7e1dd26e4.mp3","zh":"我剛升上七年級的時候，學校每一班都在操場附近種了一棵小樹。我們班的樹只到我的膝蓋那麼高。每個月，我們都幫它澆水、量它的高度。第二年，颱風把它的一根樹枝弄斷了，我們都很難過。可是它一直長大。現在我們九年級了，它比我們的老師還高。下個月我們就要畢業了，但我們的樹會留下來。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"A typhoon at the speaker's school.","letterAudio":"93138ad65b3704914636.mp3","audio":"f86b8a03a0dfc87b0f1f.mp3","zh":"說話者學校的一次颱風。","letterEnd":0.537},"B":{"text":"Rules for the school playground.","letterAudio":"609555d8760f27caf21b.mp3","audio":"a8101d8723c02824353e.mp3","zh":"學校操場的規定。","letterEnd":0.588},"C":{"text":"A tree the speaker's class planted.","letterAudio":"9756927a5f3791737934.mp3","audio":"276d3a07b5b343633b29.mp3","zh":"說話者班上種的一棵樹。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"說話者說七年級時班上種了一棵小樹，每個月澆水、量高度，颱風弄斷樹枝後它還是一直長，現在比老師還高。整段在談班上種的那棵樹。","zhCorrect":"66eeaf4af09e82552934.mp3","enText":"The answer is C. A tree the speaker's class planted. When the speaker started seventh grade, the speaker's class planted a small tree. The class watered it and measured it, and now it is taller than their teacher. The talk is about a tree the speaker's class planted.","enAudio":"3482e3203497bf32f84a.mp3","wrong":{"A":{"text":"A颱風只是樹長大過程中的一件事，是細節，不是主旨。","audio":"2cee9f6ce6833b8a20a0.mp3"},"B":{"text":"B樹種在操場附近，說話者沒有談操場的規定。","audio":"f64869c6ee049a9382df.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L070/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
