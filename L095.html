<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>

        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>
  </section>

8fc1f1d2b98cb.mp3","zh":"他去年春天和家人搬回臺南了。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"C沒有直接說 No，但說叔叔（舅舅）去年春天和家人搬回臺南了，可知他現在不住在日本。","zhCorrect":"29017ccd13788c6ad128.mp3","enText":"The answer is C. He moved back to Tainan with his family last spring. Someone asks if your uncle is still living in Japan. The best reply is, He moved back to Tainan with his family last spring. This means your uncle does not live in Japan now.","enAudio":"941d3b83eecd7235ecaf.mp3","wrong":{"A":{"text":"A說自己有一天想去日本、日本看起來很美，只接著 Japan，沒有回答叔叔（舅舅）是不是還住在日本。","audio":"5b7f3a593f7379e8f44f.mp3"},"B":{"text":"B說叔叔（舅舅）做的壽司很好吃，由 Japan 聯想到壽司，沒有回答叔叔（舅舅）是不是還住在日本。","audio":"528957c29534e8aec583.mp3"}}},{"id":"L095-Q08","type":"基本問答","point":"提醒／安撫／道歉","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U04｜核心單字「副詞、介系詞、連接詞與助動詞」｜教材印刷頁 p.73｜核心編號71 else；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號35 class；U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號75 birthday","difficulty":"易","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"I'm so sorry. I told Ken about your secret.","audio":"410495081a1e09535758.mp3","zh":"真的很對不起。我把你的秘密告訴 Ken 了。"}],"question":null,"options":{"A":{"text":"It's OK. Just don't tell anyone else.","letterAudio":"93138ad65b3704914636.mp3","audio":"43ff7f35ee72ca64ccf3.mp3","zh":"沒關係。只是別再告訴其他人了。","letterEnd":0.537},"B":{"text":"Ken is in my math class. He sits behind me.","letterAudio":"609555d8760f27caf21b.mp3","audio":"199edefb0c64f0db9343.mp3","zh":"Ken 和我上同一個數學班。他坐在我後面。","letterEnd":0.588},"C":{"text":"Ken's birthday is next week.","letterAudio":"9756927a5f3791737934.mp3","audio":"03fb100e931f9b2f2036.mp3","zh":"Ken 的生日在下星期。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"對方為了把自己的秘密告訴 Ken 而道歉；A說沒關係，只是別再告訴其他人，是接受道歉的說法。","zhCorrect":"bc3c9e245d3cf5230548.mp3","enText":"The answer is A. It's OK. Just don't tell anyone else. Someone says sorry for telling Ken your secret. The best reply is, It's OK. Just don't tell anyone else. This reply accepts the apology.","enAudio":"d5911455c407dd132b36.mp3","wrong":{"B":{"text":"B說 Ken 和自己上同一個數學班、坐在自己後面，只接著 Ken，沒有回應對方的道歉。","audio":"1311b519119c4f6e3699.mp3"},"C":{"text":"C說 Ken 的生日在下星期，只接著 Ken，沒有回應對方的道歉。","audio":"b97dfacff3c4a2b117a1.mp3"}}},{"id":"L095-Q09","type":"言談理解","point":"明確訊息","unit":"U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號31 lunch；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號62 late；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號61 monkey；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號32 bag；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號46 park；U10｜核心單字「蔬菜水果」｜教材印刷頁 p.204｜核心編號9 banana；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號28 drop、46 buy；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號3 sandwich；U08｜核心單字「地點與場所」｜教材印刷頁 p.151｜核心編號3 ground；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號11 noodle","difficulty":"易","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"Why are you eating lunch so late?","audio":"629984f38cfa91542f6d.mp3","zh":"女孩：你為什麼這麼晚才吃午餐？"},{"speaker":"Boy","text":"A monkey took my lunch bag at the park this morning.","audio":"f8b580c6aa9546a55e19.mp3","zh":"男孩：今天早上在公園，一隻猴子拿走了我的午餐袋。"},{"speaker":"Girl","text":"Really? Your whole lunch?","audio":"8c290641dbfc3392bd03.mp3","zh":"女孩：真的嗎？整份午餐都被拿走了？"},{"speaker":"Boy","text":"No, just the banana. But it dropped my sandwich on the ground, so I bought some noodles.","audio":"7579a2a96d6223045036.mp3","zh":"男孩：沒有，只拿走了香蕉。不過牠把我的三明治弄掉到地上，所以我買了一些麵。"}],"question":{"text":"What did the boy eat for lunch?","audio":"43eadbbb5bddb2c3dbcf.mp3","zh":"男孩午餐吃了什麼？"},"options":{"A":{"text":"A banana.","letterAudio":"93138ad65b3704914636.mp3","audio":"3704078a6b26448a859c.mp3","zh":"一根香蕉。","letterEnd":0.537},"B":{"text":"Some noodles.","letterAudio":"609555d8760f27caf21b.mp3","audio":"c46834b8b94b87bacca3.mp3","zh":"一些麵。","letterEnd":0.588},"C":{"text":"A sandwich.","letterAudio":"9756927a5f3791737934.mp3","audio":"5a5996552711d519de1a.mp3","zh":"一個三明治。","letterEnd":0.713}},"answer":"B","keyLines":[3],"evidence":"男孩說猴子把他的三明治弄掉到地上，「so I bought some noodles」，所以他午餐吃的是麵。","zhCorrect":"baef43d7d13ef7795d02.mp3","enText":"The answer is B. Some noodles. A monkey took the boy's banana and dropped his sandwich on the ground. So the boy bought some noodles and ate them for lunch.","enAudio":"c5313db3992e6610f437.mp3","wrong":{"A":{"text":"A香蕉被猴子拿走了，男孩沒有吃到。","audio":"d31e886271b3c645ec29.mp3"},"C":{"text":"C三明治被猴子弄掉到地上，所以男孩改買了麵。","audio":"dcd50b509f71509b729f.mp3"}}},{"id":"L095-Q10","type":"言談理解","point":"明確訊息","unit":"U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號61 ride、43 visit；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號71 top；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號85 about；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號1 station；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號47 zoo；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號81 open；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號23 window；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號32 bag；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號37 leave；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號111 o'clock；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號50 tonight；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號58 enjoy","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Welcome to the Green Mountain Cable Car. The ride to the top takes about twenty-five minutes. There are four stations. If you want to visit the zoo, please get off at the first station. The tea houses are at the third station. Please do not open the windows, and keep your bags on your laps. The last car leaves the top at nine o'clock tonight. Enjoy the view!","audio":"bd7f94bdd8cf6f4df056.mp3","zh":"歡迎搭乘綠山纜車。到山頂大約要二十五分鐘。一共有四站。如果您要去動物園，請在第一站下車。茶館在第三站。請不要打開窗戶，並把包包放在腿上。今晚最後一班車九點從山頂出發。請欣賞風景！"}],"question":{"text":"Where should people get off to visit the zoo?","audio":"11921e2df8e439183c10.mp3","zh":"要去動物園的人應該在哪裡下車？"},"options":{"A":{"text":"At the first station.","letterAudio":"93138ad65b3704914636.mp3","audio":"da08e4d8cbdc3a38ae73.mp3","zh":"在第一站。","letterEnd":0.537},"B":{"text":"At the third station.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b76109f8c33f279b25b9.mp3","zh":"在第三站。","letterEnd":0.588},"C":{"text":"At the top.","letterAudio":"9756927a5f3791737934.mp3","audio":"60895b68c0d987e013e6.mp3","zh":"在山頂。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"廣播說「If you want to visit the zoo, please get off at the first station」，所以要去動物園的人要在第一站下車。","zhCorrect":"a0fe48703ca47bf7318b.mp3","enText":"The answer is A. At the first station. The cable car has four stations. People who want to visit the zoo should get off at the first station. The tea houses are at the third station. So people should get off at the first station to visit the zoo.","enAudio":"9eaf34b6757ad818fef3.mp3","wrong":{"B":{"text":"B第三站是茶館所在的地方，不是動物園。","audio":"37d0837adaafa4e828ce.mp3"},"C":{"text":"C山頂是纜車的終點，最後一班車九點從山頂出發，不是去動物園要下車的地方。","audio":"54e2130cd5e8904478d0.mp3"}}},{"id":"L095-Q11","type":"言談理解","point":"說話者意見","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號28 guitar、26 song；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start、54 learn；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號15 week；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號43 sound","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Boy","text":"Is that a small guitar?","audio":"2232c4c993e9666a5eb7.mp3","zh":"男孩：那是一把小吉他嗎？"},{"speaker":"Girl","text":"It's a ukulele. I started learning it last month.","audio":"53cdee11734f75384552.mp3","zh":"女孩：那是烏克麗麗。我上個月開始學。"},{"speaker":"Boy","text":"Is it harder than the guitar?","audio":"c31c6a79332d2e2bf924.mp3","zh":"男孩：它比吉他難嗎？"},{"speaker":"Girl","text":"Not at all. It has only four strings, so it's much easier. I learned three songs in one week. My guitar sounds nicer, though.","audio":"2af22bbfb22a9ba35e13.mp3","zh":"女孩：一點也不。它只有四條弦，所以容易多了。我一個星期就學會了三首歌。不過我的吉他聲音比較好聽。"}],"question":{"text":"What does the girl think about the ukulele?","audio":"5c5bb1901c9179c225e1.mp3","zh":"女孩覺得烏克麗麗怎麼樣？"},"options":{"A":{"text":"It is easy to learn.","letterAudio":"93138ad65b3704914636.mp3","audio":"482aa01b4763c46cac19.mp3","zh":"很容易學。","letterEnd":0.537},"B":{"text":"It is harder than the guitar.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b9c6dfd875d0370e9fa5.mp3","zh":"比吉他難。","letterEnd":0.588},"C":{"text":"It sounds nicer than the guitar.","letterAudio":"9756927a5f3791737934.mp3","audio":"0ba8b63309501eb8e752.mp3","zh":"聲音比吉他好聽。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"女孩說烏克麗麗只有四條弦，所以容易多了，她一個星期就學會三首歌，可見她覺得烏克麗麗很容易學。","zhCorrect":"2268f99e3ef73ea79174.mp3","enText":"The answer is A. It is easy to learn. The boy asks if the ukulele is harder than the guitar, and the girl says not at all. The ukulele has only four strings, and the girl learned three songs in one week. So the girl thinks the ukulele is easy to learn.","enAudio":"e219ff4f2fc5c9e12aa0.mp3","wrong":{"B":{"text":"B男孩問烏克麗麗是不是比吉他難，女孩說一點也不。","audio":"ecf88ad9a46e2342de4e.mp3"},"C":{"text":"C女孩說的是她的吉他聲音比較好聽，與選項相反。","audio":"118629ce3cfe9894528d.mp3"}}},{"id":"L095-Q12","type":"言談理解","point":"明確訊息","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號12 aunt；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號46 friend","difficulty":"易","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Girl","text":"Why do you have a suitcase today?","audio":"36c3bd37e4c5e85a1c46.mp3","zh":"女孩：你今天為什麼帶著行李箱？"},{"speaker":"Boy","text":"I'm staying with my aunt in Hualien this week. My parents are going to a wedding.","audio":"d36cfffd2c8fc746702f.mp3","zh":"男孩：這星期我要住在花蓮的阿姨（姑姑）家。我爸媽要去參加一場婚禮。"},{"speaker":"Girl","text":"Oh, is the wedding in Hualien, too?","audio":"eafb1f1e334288fbba0c.mp3","zh":"女孩：噢，婚禮也在花蓮嗎？"},{"speaker":"Boy","text":"No, it's in Japan. My dad's best friend is getting married in Tokyo.","audio":"2dbdf8a6bb8a2b6a5a6b.mp3","zh":"男孩：不是，在日本。我爸爸最好的朋友要在東京結婚。"}],"question":{"text":"Where is the wedding?","audio":"01d58e500b2635a8102b.mp3","zh":"婚禮在哪裡？"},"options":{"A":{"text":"In Hualien.","letterAudio":"93138ad65b3704914636.mp3","audio":"081bab536efa7a0984c6.mp3","zh":"在花蓮。","letterEnd":0.537},"B":{"text":"At the boy's aunt's house.","letterAudio":"609555d8760f27caf21b.mp3","audio":"3323d3ef4d4bbcec4c4b.mp3","zh":"在男孩的阿姨（姑姑）家。","letterEnd":0.588},"C":{"text":"In Japan.","letterAudio":"9756927a5f3791737934.mp3","audio":"792c54eb543135b730fa.mp3","zh":"在日本。","letterEnd":0.713}},"answer":"C","keyLines":[3],"evidence":"女孩問婚禮是不是也在花蓮，男孩說「No, it's in Japan」，所以婚禮在日本。","zhCorrect":"fe2ec20603c9ea5e7729.mp3","enText":"The answer is C. In Japan. The boy is staying with his aunt in Hualien, because his parents are going to a wedding. The girl asks if the wedding is in Hualien, too, and the boy says no. The wedding is in Japan.","enAudio":"3783c4695a2dd21be436.mp3","wrong":{"A":{"text":"A花蓮是男孩這星期要去住的阿姨（姑姑）家所在的地方；女孩問婚禮是不是也在花蓮，男孩說不是。","audio":"b100f0d4013bd6d43121.mp3"},"B":{"text":"B阿姨（姑姑）家是男孩這星期要住的地方，婚禮不在那裡。","audio":"0005608ee446017162aa.mp3"}}},{"id":"L095-Q13","type":"言談理解","point":"情境推論","unit":"U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號10 hand；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light、31 star；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號71 top；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號45 hang、34 fix；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號49 red；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號60 pretty；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號38 tree；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號30 plant；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號93 ready；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號34 holiday","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Man","text":"Hand me the lights first. We'll put them on before anything else.","audio":"ed41168138bb54aa779e.mp3","zh":"男士：先把燈遞給我。我們要先把燈掛上去。"},{"speaker":"Girl","text":"OK. Can I put the star on the top now?","audio":"d8de6bf03d9d2d97a0ad.mp3","zh":"女孩：好。我現在可以把星星放到最上面了嗎？"},{"speaker":"Man","text":"Not yet. The star goes on last. Hang these red balls on the branches first.","audio":"09534c342ff350432d59.mp3","zh":"男士：還不行。星星最後才放。先把這些紅色的球掛在樹枝上。"},{"speaker":"Girl","text":"It looks so pretty! Let's turn on the lights.","audio":"9c341abc9f09d5d7d465.mp3","zh":"女孩：看起來好漂亮！我們把燈打開吧。"}],"question":{"text":"What are they most likely doing?","audio":"3717af6b451e504a17cf.mp3","zh":"他們最有可能在做什麼？"},"options":{"A":{"text":"Planting a tree in the yard.","letterAudio":"93138ad65b3704914636.mp3","audio":"e79202eac4a3a6b47800.mp3","zh":"在院子裡種一棵樹。","letterEnd":0.537},"B":{"text":"Getting a tree ready for a holiday.","letterAudio":"609555d8760f27caf21b.mp3","audio":"93331810e3ed1b55f111.mp3","zh":"為節日布置一棵樹。","letterEnd":0.588},"C":{"text":"Fixing the lights in the room.","letterAudio":"9756927a5f3791737934.mp3","audio":"29fd7bc6d90cd02139df.mp3","zh":"修房間裡的燈。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男士要先把燈掛上，星星最後放在最上面，還要女孩把紅色的球掛在樹枝上，女孩說看起來好漂亮，可知他們最有可能在為節日布置一棵樹。","zhCorrect":"96b5ef8ce6942fc2e078.mp3","enText":"The answer is B. Getting a tree ready for a holiday. The man asks the girl for the lights first, and he says the star goes on the top last. He tells the girl to hang red balls on the branches. So they are most likely getting a tree ready for a holiday.","enAudio":"4938d9be193296dd7355.mp3","wrong":{"A":{"text":"A由 branches 聯想到種樹，但他們是在樹枝上掛燈、掛球、放星星，不是種樹。","audio":"b577110d4a2f3fd52fde.mp3"},"C":{"text":"C由 lights 聯想到修燈，但燈是要掛到樹上的，原文沒有說燈壞了。","audio":"027edd5c4da287e352aa.mp3"}}},{"id":"L095-Q14","type":"言談理解","point":"整體訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號46 buy、48 write；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號29 cup；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號13 tea；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號46 take；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號58 pay；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號98 free；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號51 price；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號26 way；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Boy","text":"Why did you buy two cups of tea but take only one?","audio":"377369711a5895b97953.mp3","zh":"男孩：你為什麼買了兩杯茶，卻只拿一杯？"},{"speaker":"Girl","text":"The other one is for someone who can't pay. The shop writes it on that board.","audio":"92066f1c974e4f677acb.mp3","zh":"女孩：另一杯是給付不起錢的人的。店家會把它寫在那塊板子上。"},{"speaker":"Boy","text":"So anyone can come and get a free cup?","audio":"0d83c5a4357efe60a8ac.mp3","zh":"男孩：所以任何人都可以來拿一杯免費的？"},{"speaker":"Girl","text":"Yes. This week, people have paid for over fifty cups.","audio":"842e88411b531167be51.mp3","zh":"女孩：對。這星期，大家已經付了五十多杯。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"Free tea that the shop gives to everyone.","letterAudio":"93138ad65b3704914636.mp3","audio":"a17cc0ab5403583d8a2b.mp3","zh":"店家送給每個人的免費茶。","letterEnd":0.537},"B":{"text":"A board that shows the prices.","letterAudio":"609555d8760f27caf21b.mp3","audio":"e85b0b01eafc9eb6349b.mp3","zh":"寫著價錢的一塊板子。","letterEnd":0.588},"C":{"text":"A way to buy drinks for other people.","letterAudio":"9756927a5f3791737934.mp3","audio":"227dd40341e3450f7e98.mp3","zh":"一種幫別人買飲料的做法。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩買了兩杯茶，另一杯是給付不起錢的人，店家會寫在板子上，任何人都可以來拿一杯免費的，這星期大家已經付了五十多杯。整段在談一種幫別人買飲料的做法。","zhCorrect":"719061a136b90dda15ca.mp3","enText":"The answer is C. A way to buy drinks for other people. The girl bought two cups of tea, and the other cup is for someone who can't pay. Anyone can come and get a free cup, and people have paid for over fifty cups this week. The girl and the boy are talking about a way to buy drinks for other people.","enAudio":"c01d075afebd672cebbd.mp3","wrong":{"A":{"text":"A免費的茶是其他客人付錢買的，不是店家送給每個人的。","audio":"2de3b8a51990bedd53cb.mp3"},"B":{"text":"B由 board 聯想，但店家在板子上寫的是別人付錢留下的茶，原文沒有說上面寫價錢。","audio":"78a8d9e377a2ce0150fb.mp3"}}},{"id":"L095-Q15","type":"言談理解","point":"語境猜義","unit":"U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號43 sick；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號16 game；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號53 sell；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號65 busy；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號60 enough；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號67 without；U03｜二、教材旁欄片語、延伸字與重要搭配「身體部位與 hand 相關用語」｜教材印刷頁 p.50｜short-handed","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"Can you help at our class booth this afternoon? We're short-handed.","audio":"4a42bab21ea56fcbd264.mp3","zh":"女孩：你今天下午可以來我們班的攤位幫忙嗎？我們 short-handed（人手不足）。"},{"speaker":"Boy","text":"Why? I thought ten people signed up.","audio":"d770817221a5db98fc05.mp3","zh":"男孩：為什麼？我以為有十個人報名了。"},{"speaker":"Girl","text":"Three are sick, and five went to the basketball game. Only Amy and I are selling hot dogs now.","audio":"d0e060f96ccc1771d9f6.mp3","zh":"女孩：三個人生病，五個人去看籃球比賽了。現在只有 Amy 和我在賣熱狗。"},{"speaker":"Boy","text":"OK. I'll be there after lunch.","audio":"0b9010d7957246b79687.mp3","zh":"男孩：好。我午餐後就過去。"}],"question":{"text":"What does the girl mean by \"short-handed\"?","audio":"402ddcc9dae100a1e3bc.mp3","zh":"女孩說的 \"short-handed\" 是什麼意思？"},"options":{"A":{"text":"Too busy to eat lunch.","letterAudio":"93138ad65b3704914636.mp3","audio":"55596d7d2555df883f8b.mp3","zh":"忙得沒時間吃午餐。","letterEnd":0.537},"B":{"text":"Out of hot dogs to sell.","letterAudio":"609555d8760f27caf21b.mp3","audio":"1566877bfc72097bb2cc.mp3","zh":"沒有熱狗可以賣了。","letterEnd":0.588},"C":{"text":"Without enough people to help.","letterAudio":"9756927a5f3791737934.mp3","audio":"f41c49ac26c270b29afd.mp3","zh":"沒有足夠的人幫忙。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"女孩說報名的十個人裡，三個人生病、五個人去看籃球比賽，現在只有 Amy 和她在賣熱狗，可知 short-handed 是人手不夠。","zhCorrect":"672d9d03de9022433d60.mp3","enText":"The answer is C. Without enough people to help. Ten people signed up for the class booth. Three are sick, and five went to the basketball game, so only Amy and the girl are selling hot dogs. So when the girl says short-handed, she means without enough people to help.","enAudio":"fe9b8f252ddfccfe077d.mp3","wrong":{"A":{"text":"A由 lunch 聯想，但女孩說的是人手不夠，原文沒有說她忙得沒時間吃午餐；午餐是男孩說他之後會過去的時間。","audio":"afaf3568d8b718e3bb14.mp3"},"B":{"text":"B女孩說她們現在還在賣熱狗，不是熱狗賣完了。","audio":"5e3a6cc51631e409ec38.mp3"}}},{"id":"L095-Q16","type":"言談理解","point":"說話者意見","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號51 hear、32 fun；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號11 uncle；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號64 hard；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號12 leg；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號43 hurt；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號38 hour；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號36 keep；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號98 good；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號125 really；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號58 enjoy；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號66 easy","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Girl","text":"I heard you help at your uncle's breakfast shop on weekends. Isn't it hard?","audio":"4ae0f0df773771a24cde.mp3","zh":"女孩：我聽說你週末在你叔叔（舅舅）的早餐店幫忙。不會很辛苦嗎？"},{"speaker":"Boy","text":"Getting up at five is hard, and my legs hurt after four hours.","audio":"71f6c680ee3ef2e053bb.mp3","zh":"男孩：五點起床很辛苦，而且四個小時以後我的腿會痛。"},{"speaker":"Girl","text":"Then why do you keep doing it?","audio":"c183ee01ebd44c87ef87.mp3","zh":"女孩：那你為什麼還繼續做？"},{"speaker":"Boy","text":"I make the egg pancakes now, and people say they're good. I really enjoy that.","audio":"f0259739e1e214c29299.mp3","zh":"男孩：我現在負責做蛋餅，大家都說很好吃。我真的很喜歡那樣。"}],"question":{"text":"What does the boy think about working at the breakfast shop?","audio":"fca41f248ea2675da9f4.mp3","zh":"男孩覺得在早餐店幫忙怎麼樣？"},"options":{"A":{"text":"It is too hard to keep doing.","letterAudio":"93138ad65b3704914636.mp3","audio":"f862ff6fec1058374513.mp3","zh":"辛苦到做不下去。","letterEnd":0.537},"B":{"text":"It is tiring, but he enjoys it.","letterAudio":"609555d8760f27caf21b.mp3","audio":"cdd0fe0b7f0feee38984.mp3","zh":"很累，但他很喜歡。","letterEnd":0.588},"C":{"text":"It is easy and fun.","letterAudio":"9756927a5f3791737934.mp3","audio":"bf850adf81d7a350b422.mp3","zh":"很輕鬆又好玩。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男孩說五點起床很辛苦、四個小時後腿會痛，但他現在負責做蛋餅，大家說很好吃，他真的很喜歡，可見他覺得在早餐店幫忙很累，但他很喜歡。","zhCorrect":"9372cd02b0937cac92fc.mp3","enText":"The answer is B. It is tiring, but he enjoys it. The boy says getting up at five is hard, and his legs hurt after four hours. But the boy makes the egg pancakes now, and people say they are good. The boy really enjoys that. So the boy thinks the work is tiring, but he enjoys it.","enAudio":"a7253d80985f759caeba.mp3","wrong":{"A":{"text":"A男孩說很辛苦，但他還繼續做，而且很喜歡，不是辛苦到做不下去。","audio":"b1349625de2d86de0b58.mp3"},"C":{"text":"C男孩說五點起床很辛苦、四個小時後腿會痛，不是輕鬆的工作。","audio":"4a20783cfdce3896c9e2.mp3"}}},{"id":"L095-Q17","type":"言談理解","point":"明確訊息","unit":"U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號20 team；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號75 usually；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號44 dollar；U11｜核心單字「其他名詞與兼類詞」｜教材印刷頁 pp.222～223｜核心編號28 member；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號58 pay；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start、55 own；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號61 early；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號8 water","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Ben. This is Coach Wang from the Lions baseball team. Your new uniform is here. It's usually nine hundred dollars, but team members pay only six hundred. You can pay me at practice on Saturday. Practice starts at three, so please come ten minutes early and try it on. Also, please bring your own water. See you then!","audio":"7a5c0034853b95d501e5.mp3","zh":"嗨，Ben。我是獅子棒球隊的王教練。你的新制服到了。它平常是九百元，但是隊員只要付六百元。你可以在星期六練習時把錢給我。練習三點開始，所以請提早十分鐘到，試穿一下制服。另外，請自己帶水。到時候見！"}],"question":{"text":"How much does Ben need to pay for the uniform?","audio":"deeadc0f45f619be31ed.mp3","zh":"Ben 要為制服付多少錢？"},"options":{"A":{"text":"Six hundred dollars.","letterAudio":"93138ad65b3704914636.mp3","audio":"8bb31651ed351fd61b94.mp3","zh":"六百元。","letterEnd":0.537},"B":{"text":"Nine hundred dollars.","letterAudio":"609555d8760f27caf21b.mp3","audio":"6ff59150d2246160b466.mp3","zh":"九百元。","letterEnd":0.588},"C":{"text":"Three hundred dollars.","letterAudio":"9756927a5f3791737934.mp3","audio":"7fa9e4b6862bc52426a4.mp3","zh":"三百元。","letterEnd":0.713}},"answer":"A","keyLines":[0],"evidence":"王教練說制服平常是九百元，「but team members pay only six hundred」，所以 Ben 要付六百元。","zhCorrect":"ddbf98ad201469720bc3.mp3","enText":"The answer is A. Six hundred dollars. Coach Wang says the new uniform is usually nine hundred dollars, but team members pay only six hundred. So Ben needs to pay six hundred dollars.","enAudio":"3e6e1d90545cbdd24cad.mp3","wrong":{"B":{"text":"B九百元是制服平常的價錢，隊員只要付六百元。","audio":"8d79d34b8834a001512c.mp3"},"C":{"text":"C三是練習開始的時間三點，不是制服的價錢。","audio":"a4d7dc16862a866fd7f6.mp3"}}},{"id":"L095-Q18","type":"言談理解","point":"整體訊息","unit":"U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號44 stop、46 take；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor、17 button；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號125 really；U07｜核心單字「形容詞、副詞與其他詞類」｜教材印刷頁 p.136｜核心編號57 scared；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號40 push；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號49 red；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號49 sing；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號116 favorite；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號26 song；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號81 open；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號61 door；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last summer, I was alone in the elevator in our building when it suddenly stopped between the sixth and seventh floors. The lights went out, and I was really scared. I pushed the red button, and a man's voice said help was coming. To stay calm, I sang my favorite songs. After forty minutes, two firefighters opened the door and helped me out. Now I always take my phone with me, even when I just go downstairs.","audio":"2e64ed9c279592a0873b.mp3","zh":"去年夏天，我一個人在我們大樓的電梯裡，電梯突然停在六樓和七樓之間。燈熄了，我真的很害怕。我按了紅色的按鈕，一位男士的聲音說會有人來幫忙。為了保持冷靜，我唱了我最喜歡的歌。四十分鐘後，兩位消防員打開門，幫我出來。現在我總是帶著手機，就算只是下樓也一樣。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"The speaker's favorite songs.","letterAudio":"93138ad65b3704914636.mp3","audio":"fc97ed38594c19a055cc.mp3","zh":"說話者最喜歡的歌。","letterEnd":0.537},"B":{"text":"Forty minutes in a stopped elevator.","letterAudio":"609555d8760f27caf21b.mp3","audio":"513e74dbae96b05dc63a.mp3","zh":"在停住的電梯裡的四十分鐘。","letterEnd":0.588},"C":{"text":"A firefighter's job.","letterAudio":"9756927a5f3791737934.mp3","audio":"bff9f03f9b05ee3be2b9.mp3","zh":"消防員的工作。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"說話者一個人在電梯裡，電梯突然停在兩層樓之間、燈也熄了；說話者按了紅色按鈕，唱歌讓自己冷靜，四十分鐘後消防員打開門。整段在談被困在停住的電梯裡的經驗。","zhCorrect":"7d82c17a8e3aa813aeb1.mp3","enText":"The answer is B. Forty minutes in a stopped elevator. Last summer, the elevator stopped between two floors with the speaker inside. The speaker was scared and sang songs to stay calm. After forty minutes, two firefighters opened the door. The talk is about forty minutes in a stopped elevator.","enAudio":"325e04734407af7ab181.mp3","wrong":{"A":{"text":"A唱最喜歡的歌只是說話者讓自己冷靜的方法，不是整段的主旨。","audio":"b7ce8c446183f1d3f13f.mp3"},"C":{"text":"C消防員只是最後打開門、幫說話者出來，原文沒有談消防員的工作。","audio":"7da8afbbf4b67667686a.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L095/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
