<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>

dence":"B沒有直接說 No，但說現在看得到太陽，可知外面已經沒有在下雨了。","zhCorrect":"db499f5458757feb1aa8.mp3","enText":"The answer is B. Well, I can see the sun now. Someone asks if it is still raining outside. The best reply is, Well, I can see the sun now. This means the rain has stopped.","enAudio":"fbbdac7bedb7b553daaf.mp3","wrong":{"A":{"text":"A說自己不喜歡下雨天，只接著 rain，沒有回答現在有沒有在下雨。","audio":"6bc1ec6b8b60ca53b699.mp3"},"C":{"text":"C說自己的傘在車上、是紅色的，只由下雨聯想到傘，沒有回答現在有沒有在下雨。","audio":"41ff2cfb34d730b702e8.mp3"}}},{"id":"L069-Q06","type":"基本問答","point":"協助","unit":"U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號13 back；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號43 hurt、55 put；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號127 sure；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號43 bedroom；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號26 Japan、35 gift","difficulty":"易","numberAudio":"b01412f85694bf7dd6b1.mp3","passage":[{"speaker":null,"text":"Could you carry this box upstairs for me? My back hurts.","audio":"465dd5954fcb3183f6ae.mp3","zh":"你可以幫我把這個箱子搬上樓嗎？我的背好痛。"}],"question":null,"options":{"A":{"text":"Oh, sure. Where should I put it?","letterAudio":"93138ad65b3704914636.mp3","audio":"edc53c3b692f19c137e1.mp3","zh":"噢，好啊。我應該把它放在哪裡？","letterEnd":0.537},"B":{"text":"Oh, my bedroom is upstairs, too. It's small.","letterAudio":"609555d8760f27caf21b.mp3","audio":"2a0a214decb996dded1a.mp3","zh":"噢，我的臥室也在樓上。它很小。","letterEnd":0.588},"C":{"text":"The box is from Japan. It's a gift.","letterAudio":"9756927a5f3791737934.mp3","audio":"934b51ec655057ddfcff.mp3","zh":"這個箱子是從日本來的。它是一份禮物。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"對方背痛，請自己幫他把箱子搬上樓；A說好，並問要放在哪裡，是答應幫忙的說法。","zhCorrect":"8827f7a5edf428e2634d.mp3","enText":"The answer is A. Oh, sure. Where should I put it? Someone's back hurts, and they ask you to carry a box upstairs for them. The best reply is, Oh, sure. Where should I put it? This reply agrees to help.","enAudio":"ad76960bb09775a05ee7.mp3","wrong":{"B":{"text":"B說自己的臥室也在樓上、很小，只接著 upstairs，談自己，沒有答應幫忙。","audio":"c8f98f98080b123c2847.mp3"},"C":{"text":"C說箱子是從日本來的、是一份禮物，只接著 box，沒有答應幫忙。","audio":"cb8acbf895d8538094fd.mp3"}}},{"id":"L069-Q07","type":"基本問答","point":"感謝","unit":"U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號55 lend；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號74 always；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號48 write；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號50 blue、48 black；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號43 notebook；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號50 cat","difficulty":"易","numberAudio":"e0d26bc8f9a996557d6a.mp3","passage":[{"speaker":null,"text":"Thanks for lending me your notes. They really helped.","audio":"8ad147229bc0ea54e027.mp3","zh":"謝謝你借我你的筆記。它們真的很有幫助。"}],"question":null,"options":{"A":{"text":"I always write my notes in blue and black.","letterAudio":"93138ad65b3704914636.mp3","audio":"7295c686e365515288a9.mp3","zh":"我總是用藍色和黑色寫我的筆記。","letterEnd":0.537},"B":{"text":"No problem. I'm glad they helped.","letterAudio":"609555d8760f27caf21b.mp3","audio":"4564d06636599b42f3ac.mp3","zh":"不客氣。我很高興它們有幫助。","letterEnd":0.588},"C":{"text":"My notebook is new. It has a cat on it.","letterAudio":"9756927a5f3791737934.mp3","audio":"5202988bf9792a6d03d7.mp3","zh":"我的筆記本是新的。上面有一隻貓。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"對方謝謝自己借他筆記；B說不客氣，很高興筆記有幫助，是回應道謝的說法。","zhCorrect":"65a313bcd8fd8e3da67f.mp3","enText":"The answer is B. No problem. I'm glad they helped. Someone thanks you for lending them your notes. The best reply is, No problem. I'm glad they helped. This reply answers the thanks.","enAudio":"9d759f0ceb19a6cc9d1b.mp3","wrong":{"A":{"text":"A說自己總是用藍色和黑色寫筆記，只接著 notes，談自己寫筆記的習慣，沒有回應道謝。","audio":"266b5e9ccde1cdb89195.mp3"},"C":{"text":"C說自己的筆記本是新的、上面有一隻貓，只由 notes 聯想到筆記本，沒有回應道謝。","audio":"497e9880b7bb0f9e20b2.mp3"}}},{"id":"L069-Q08","type":"基本問答","point":"提醒／安撫／道歉","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號119 careful、109 new；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號69 wet；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號88 wash；U03｜核心單字「身體部位」｜教材印刷頁 p.50｜核心編號10 hand；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號89 clean、83 walk；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell","difficulty":"易","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"Be careful. The floor is wet.","audio":"1918b21d2ab254f36884.mp3","zh":"小心。地板是濕的。"}],"question":null,"options":{"A":{"text":"Oh, it's a new floor.","letterAudio":"93138ad65b3704914636.mp3","audio":"b0c747859d9980cd986e.mp3","zh":"噢，那是新的地板。","letterEnd":0.537},"B":{"text":"I washed my hands. They're clean.","letterAudio":"609555d8760f27caf21b.mp3","audio":"450a5e12ca429935591a.mp3","zh":"我洗了手。它們很乾淨。","letterEnd":0.588},"C":{"text":"Thanks for telling me. I'll walk slowly.","letterAudio":"9756927a5f3791737934.mp3","audio":"4e9a360bbb0dbce331b1.mp3","zh":"謝謝你告訴我。我會慢慢走。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"對方提醒自己小心，因為地板是濕的；C謝謝對方告訴自己，並說會慢慢走，是回應提醒的說法。","zhCorrect":"bc370e57fa286e182200.mp3","enText":"The answer is C. Thanks for telling me. I'll walk slowly. Someone tells you to be careful because the floor is wet. The best reply is, Thanks for telling me. I'll walk slowly. This reply answers the warning.","enAudio":"2da3e2f207804bdb46c6.mp3","wrong":{"A":{"text":"A說那是新的地板，只接著 floor，沒有回應提醒。","audio":"3aab16ebc8c81b645c0d.mp3"},"B":{"text":"B說自己洗了手、手很乾淨，只由 wet 聯想到洗手，沒有回應提醒。","audio":"0bd2754e5a70fc46d543.mp3"}}},{"id":"L069-Q09","type":"言談理解","point":"明確訊息","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號8 grandmother / grandma、6 son；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號41 feed、38 remember；U02｜核心單字「動物」｜教材印刷頁 pp.30～31｜核心編號51 fish；U07｜核心單字「形容詞、副詞與其他詞類」｜教材印刷頁 p.136｜核心編號65 while；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號26 Japan；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號43 visit、42 live、62 call；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號15 week；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號46 friend；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now","difficulty":"中","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Boy","text":"Mom, can Grandma feed my fish while we're in Japan?","audio":"88da5b7f91c05870e0ae.mp3","zh":"男孩：媽，我們在日本的時候，奶奶（外婆）可以幫我餵魚嗎？"},{"speaker":"Mother","text":"Grandma is coming with us, remember?","audio":"e0fad1815efe0b82e22e.mp3","zh":"媽媽：奶奶（外婆）要跟我們一起去，記得嗎？"},{"speaker":"Boy","text":"Oh, right. Then how about Mr. Lin next door?","audio":"73b88cae863b728ea8d5.mp3","zh":"男孩：噢，對。那隔壁的林先生呢？"},{"speaker":"Mother","text":"He's going to visit his son in Kaohsiung next week. Why don't you ask your friend Tim? He lives near us.","audio":"3f799df3962c33218f0c.mp3","zh":"媽媽：他下星期要去高雄看他兒子。你何不問問你的朋友 Tim？他住在我們附近。"},{"speaker":"Boy","text":"Good idea. I'll call him now.","audio":"2e1d9d8a12746f1a1aea.mp3","zh":"男孩：好主意。我現在就打電話給他。"}],"question":{"text":"Who will the boy ask to feed his fish?","audio":"bf176e35114a0c227b12.mp3","zh":"男孩會請誰幫他餵魚？"},"options":{"A":{"text":"His friend Tim.","letterAudio":"93138ad65b3704914636.mp3","audio":"cf63685a4582ad137d98.mp3","zh":"他的朋友 Tim。","letterEnd":0.537},"B":{"text":"His grandma.","letterAudio":"609555d8760f27caf21b.mp3","audio":"3fe6361b6e52fe7fd139.mp3","zh":"他的奶奶（外婆）。","letterEnd":0.588},"C":{"text":"Mr. Lin.","letterAudio":"9756927a5f3791737934.mp3","audio":"2b5efac150c706921983.mp3","zh":"林先生。","letterEnd":0.713}},"answer":"A","keyLines":[4],"evidence":"媽媽建議男孩問朋友 Tim，男孩說「Good idea. I'll call him now.」，所以他要請 Tim 幫忙餵魚。","zhCorrect":"ccc33a365f96e06d6b42.mp3","enText":"The answer is A. His friend Tim. Grandma is going to Japan with the family, and Mr. Lin is going to visit his son next week. The mother says the boy can ask his friend Tim, and the boy will call Tim now. So the boy will ask his friend Tim.","enAudio":"33050bc5d54716831f08.mp3","wrong":{"B":{"text":"B奶奶（外婆）要跟他們一起去日本，不能幫忙餵魚。","audio":"18e499612c73339f0d10.mp3"},"C":{"text":"C林先生下星期要去高雄看他兒子，也不能幫忙。","audio":"0b7cfeeb7de753733454.mp3"}}},{"id":"L069-Q10","type":"言談理解","point":"整體訊息","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號7 minute；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號44 stop；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號83 use；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號46 buy、31 trip；U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink、5 snack；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號37 leave；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號1 station；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號70 short；U03｜核心單字「介系詞、代名詞與助動詞」｜教材印刷頁 p.53｜核心編號84 during","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good afternoon, everyone. In ten minutes, our bus will stop at a rest area. We will stay there for fifteen minutes. You can use the restroom and buy drinks or snacks at the shop. Please take your phone and wallet with you, and be back on the bus by three fifteen. The bus will leave on time.","audio":"03a95004d3acb97205f8.mp3","zh":"大家午安。再過十分鐘，我們的巴士會停在休息站。我們會在那裡停留十五分鐘。你們可以上廁所，也可以在商店買飲料或點心。請帶著你們的手機和錢包，並在三點十五分前回到巴士上。巴士會準時出發。"}],"question":{"text":"What is the announcement mainly about?","audio":"39d1dc8ebce3ddfac73c.mp3","zh":"這則廣播主要是關於什麼？"},"options":{"A":{"text":"Drinks for sale on the bus.","letterAudio":"93138ad65b3704914636.mp3","audio":"3d0e12f3ef3d7696411e.mp3","zh":"巴士上販賣的飲料。","letterEnd":0.537},"B":{"text":"A new bus station in town.","letterAudio":"609555d8760f27caf21b.mp3","audio":"60ed0b54335405ff3154.mp3","zh":"鎮上一個新的公車站。","letterEnd":0.588},"C":{"text":"A short stop during the trip.","letterAudio":"9756927a5f3791737934.mp3","audio":"e7347591f3ac3f800ad9.mp3","zh":"旅途中的一次短暫停留。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"廣播說巴士再過十分鐘會停在休息站十五分鐘，大家可以上廁所、買東西，三點十五分前要回到車上。整段在說明旅途中短暫停留的安排。","zhCorrect":"9f3a16b7c7bf5e7629d7.mp3","enText":"The answer is C. A short stop during the trip. The bus will stop at a rest area for fifteen minutes. People can use the restroom and buy drinks, and they need to be back by three fifteen. The announcement is mainly about a short stop during the trip.","enAudio":"e9fb74b453bbbbe1980a.mp3","wrong":{"A":{"text":"A飲料是在休息站的商店買的，不是在巴士上賣的；而且買飲料只是細節。","audio":"d28472d84c5337037e02.mp3"},"B":{"text":"B巴士是停在休息站，廣播沒有提到鎮上新的公車站。","audio":"5322cdcc3bce313e7f81.mp3"}}},{"id":"L069-Q11","type":"言談理解","point":"說話者意見","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號83 walk；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school、46 friend；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號32 month、7 minute、1 time；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say、80 talk；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號14 exercise；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號59 far；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號55 fast；U07｜核心單字「形容詞、副詞與其他詞類」｜教材印刷頁 p.136｜核心編號60 even；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號47 feel；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號66 tired；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號47 part","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"You started walking to school this month, right?","audio":"ae67d498bc2bb56b11c9.mp3","zh":"女孩：你這個月開始走路上學了，對吧？"},{"speaker":"Boy","text":"Yes. My mom says I need more exercise.","audio":"e1a6a0d0cf69a38c477f.mp3","zh":"男孩：對。我媽媽說我需要多運動。"},{"speaker":"Girl","text":"Isn't it far?","audio":"c1f8aa2eb7da87811515.mp3","zh":"女孩：不會很遠嗎？"},{"speaker":"Boy","text":"It takes thirty minutes. I walk with my friends, and we talk all the way, so the time goes fast. I don't even feel tired.","audio":"1b6e23950e182d9be9f2.mp3","zh":"男孩：要走三十分鐘。我和我的朋友一起走，我們一路聊天，所以時間過得很快。我甚至不覺得累。"}],"question":{"text":"What does the boy think about walking to school?","audio":"bd48d3d2c2e5dafda4be.mp3","zh":"男孩覺得走路上學怎麼樣？"},"options":{"A":{"text":"It is too far for him to walk.","letterAudio":"93138ad65b3704914636.mp3","audio":"e4a23120b8ea1585428c.mp3","zh":"對他來說太遠，走不到。","letterEnd":0.537},"B":{"text":"It takes him too much time.","letterAudio":"609555d8760f27caf21b.mp3","audio":"6df1f37a3f880688fb8c.mp3","zh":"花他太多時間。","letterEnd":0.588},"C":{"text":"It is a nice part of his day.","letterAudio":"9756927a5f3791737934.mp3","audio":"407b16f246cc527256b0.mp3","zh":"是他一天當中很好的一段時間。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說他和朋友一起走、一路聊天，時間過得很快，他甚至不覺得累，可見他覺得走路上學是一天當中愉快的事。","zhCorrect":"3a21cdc2a1f10b989798.mp3","enText":"The answer is C. It is a nice part of his day. It takes the boy thirty minutes to walk to school. But he walks with his friends, they talk all the way, and he doesn't even feel tired. He thinks walking to school is a nice part of his day.","enAudio":"9167de8be92aed138807.mp3","wrong":{"A":{"text":"A遠是女孩的問題，男孩說他甚至不覺得累。","audio":"4a536ec79d13f7feb31e.mp3"},"B":{"text":"B男孩說要走三十分鐘，但他也說時間過得很快，並不覺得花太多時間。","audio":"c77a151b23c44294a6cf.mp3"}}},{"id":"L069-Q12","type":"言談理解","point":"明確訊息","unit":"U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號62 call；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號47 teach、19 lesson；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號10 Wednesday；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號60 until；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Mother","text":"Ms. Lin just called. She can't teach you at four this Wednesday. She wants to move your piano lesson to five.","audio":"cc2b94952829734e427c.mp3","zh":"媽媽：林老師剛剛打電話來。她這個星期三四點不能教你。她想把你的鋼琴課改到五點。"},{"speaker":"Girl","text":"Five? But I have badminton until five fifteen.","audio":"b15c0d24c85aabe115a9.mp3","zh":"女孩：五點？可是我羽毛球要練到五點十五分。"},{"speaker":"Mother","text":"I told her that. So she said six is OK, too.","audio":"fdf6fd04494d86293c96.mp3","zh":"媽媽：我告訴她了。所以她說六點也可以。"},{"speaker":"Girl","text":"Great. Six is better for me.","audio":"ec2660596242264a6f00.mp3","zh":"女孩：太好了。六點對我比較好。"}],"question":{"text":"What time will the girl's piano lesson start this Wednesday?","audio":"6adc254abd3911356a2b.mp3","zh":"女孩這個星期三的鋼琴課幾點開始？"},"options":{"A":{"text":"At four.","letterAudio":"93138ad65b3704914636.mp3","audio":"15821ceb5eef505f3c7d.mp3","zh":"四點。","letterEnd":0.537},"B":{"text":"At six.","letterAudio":"609555d8760f27caf21b.mp3","audio":"0945d9cdd7c614cf86f6.mp3","zh":"六點。","letterEnd":0.588},"C":{"text":"At five.","letterAudio":"9756927a5f3791737934.mp3","audio":"9f9153b304d39d6a4d5a.mp3","zh":"五點。","letterEnd":0.713}},"answer":"B","keyLines":[3],"evidence":"媽媽說林老師知道女孩羽毛球練到五點十五分後，說六點也可以，女孩說「Six is better for me」，所以鋼琴課會在六點開始。","zhCorrect":"782e59b83bbf944b2659.mp3","enText":"The answer is B. At six. Ms. Lin can't teach at four, and she wants to move the lesson to five. But the girl has badminton until five fifteen, so Ms. Lin says six is OK. The girl's piano lesson will start at six.","enAudio":"da14669937e9e47049cd.mp3","wrong":{"A":{"text":"A四點是原本上課的時間，林老師這個星期三四點不能上課。","audio":"76892e2bd80d2a3ef5ec.mp3"},"C":{"text":"C五點是林老師一開始想改的時間，但女孩五點十五分才練完羽毛球。","audio":"b0f34cf484172403fd03.mp3"}}},{"id":"L069-Q13","type":"言談理解","point":"情境／身分推論","unit":"U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號67 without；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號68 card、59 name；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號117 sorry；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號29 work；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號20 floor；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號48 write；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號54 show；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號55 wear；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號75 left；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號34 fix；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號16 teacher；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Man","text":"Excuse me. You can't go in without a visitor card.","audio":"16c8a147ca07900a2fbf.mp3","zh":"男士：不好意思。沒有訪客證不能進去。"},{"speaker":"Girl","text":"Oh, sorry. I'm here to see my mom. She works on the tenth floor.","audio":"af8908615d71090587a5.mp3","zh":"女孩：噢，抱歉。我是來找我媽媽的。她在十樓工作。"},{"speaker":"Man","text":"OK. Please write your name here and show me your student card.","audio":"519dade01d82dc92d9c0.mp3","zh":"男士：好。請在這裡寫上你的名字，並給我看你的學生證。"},{"speaker":"Girl","text":"Here you are.","audio":"f9e19982bfe54c02e37b.mp3","zh":"女孩：在這裡。"},{"speaker":"Man","text":"Thanks. Wear this card, and take the elevator on the left.","audio":"c9135cb42b82950bd1dc.mp3","zh":"男士：謝謝。戴上這張證，搭左邊的電梯。"}],"question":{"text":"Who is the man most likely?","audio":"f1e942c8f08e74db61cf.mp3","zh":"這位男士最有可能是誰？"},"options":{"A":{"text":"A guard at an office building.","letterAudio":"93138ad65b3704914636.mp3","audio":"392c190eee0dc66aadb0.mp3","zh":"辦公大樓的警衛。","letterEnd":0.537},"B":{"text":"A worker who fixes elevators.","letterAudio":"609555d8760f27caf21b.mp3","audio":"9c7a4153b108c720697a.mp3","zh":"修理電梯的工人。","letterEnd":0.588},"C":{"text":"A teacher at the girl's school.","letterAudio":"9756927a5f3791737934.mp3","audio":"d8b7dc44189f9e9204d7.mp3","zh":"女孩學校的老師。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男士說沒有訪客證不能進去，要女孩寫名字、出示學生證，再給她一張證、告訴她搭哪一部電梯，可知他是辦公大樓門口的警衛。","zhCorrect":"9da6ab029218bb18aba5.mp3","enText":"The answer is A. A guard at an office building. The man says the girl can't go in without a visitor card. He asks for her name and her student card, and then he tells her which elevator to take. He is most likely a guard at an office building.","enAudio":"32704546faa2aeafc250.mp3","wrong":{"B":{"text":"B男士只是告訴女孩搭左邊的電梯，對話沒有提到他修電梯。","audio":"a2830a70a1844e74a9e2.mp3"},"C":{"text":"C男士要看女孩的學生證，但女孩是來大樓找在十樓工作的媽媽，不是在學校。","audio":"8df295aaba1455ccc70f.mp3"}}},{"id":"L069-Q14","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號103 big；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號43 notebook、35 class；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號66 desk、69 picture；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號18 day、33 year；U01｜核心單字「職業」｜教材印刷頁 p.7｜核心編號17 student、16 teacher；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號48 write；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號21 page；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號79 anything；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號27 yesterday；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號16 game；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號94 draw；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號57 play、45 like；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號112 together","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Boy","text":"What's that big notebook on Ms. Chen's desk?","audio":"d8ccef6412e120556b6f.mp3","zh":"男孩：陳老師桌上那本大筆記本是什麼？"},{"speaker":"Girl","text":"It's our class diary. Every day, one student takes it home and writes a page about that day.","audio":"b01c1344fe8bda57a423.mp3","zh":"女孩：那是我們的班級日記。每天由一個學生把它帶回家，寫一頁關於那天的事。"},{"speaker":"Boy","text":"What do people write?","audio":"7264f56a2f1826b4a387.mp3","zh":"男孩：大家都寫些什麼？"},{"speaker":"Girl","text":"Anything. Yesterday Ken wrote about our basketball game, and he drew some pictures, too. At the end of the year, we'll each get a copy.","audio":"3d6c5dcecf166a1ba38d.mp3","zh":"女孩：什麼都可以。昨天 Ken 寫了我們的籃球比賽，他還畫了一些圖。學年結束的時候，我們每個人都會拿到一份影本。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"A basketball game Ken played in.","letterAudio":"93138ad65b3704914636.mp3","audio":"cba16da5882c4a6a5ab0.mp3","zh":"Ken 參加的一場籃球比賽。","letterEnd":0.537},"B":{"text":"A notebook the class writes in together.","letterAudio":"609555d8760f27caf21b.mp3","audio":"15976b5a80d6013f3e32.mp3","zh":"全班一起寫的一本筆記本。","letterEnd":0.588},"C":{"text":"A teacher who likes to draw pictures.","letterAudio":"9756927a5f3791737934.mp3","audio":"e77ade8fd6cd9932fab4.mp3","zh":"一位喜歡畫畫的老師。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說那本大筆記本是班級日記，每天由一個學生帶回家寫一頁，學年結束時每個人都會拿到一份。整段在談全班一起寫的筆記本。","zhCorrect":"9e3ff823a14a0bc58e26.mp3","enText":"The answer is B. A notebook the class writes in together. The big notebook is the class diary. Every day, one student takes it home and writes a page about that day. The girl and the boy are talking about a notebook the class writes in together.","enAudio":"408f070370aafef7cb40.mp3","wrong":{"A":{"text":"A籃球比賽只是 Ken 昨天寫的內容，是細節，不是主旨。","audio":"000c8aebec55722b6625.mp3"},"C":{"text":"C畫圖的是 Ken，對話沒有說陳老師喜歡畫畫。","audio":"83e0940869e84aa7523d.mp3"}}},{"id":"L069-Q15","type":"言談理解","point":"語境猜義","unit":"U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號13 cousin；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號11 hotel；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號40 home；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號113 beautiful、110 old、120 quiet；U10｜核心單字「其他名詞」｜教材印刷頁 pp.204～205｜核心編號37 light；U09｜核心單字「名詞：食物、餐具與度量」｜教材印刷頁 pp.183～203｜核心編號14 waiter；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號55 wear；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號51 white；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號24 glove；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號18 dish；U04｜核心單字「容器與計量詞」｜教材印刷頁 p.71｜核心編號26 plate；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號81 open；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號33 year；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號69 expensive；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號59 far；U09｜九、閱讀與題組補充單字（總表未逐項標頁；U09 教材頁 pp.183～203）｜fancy","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Boy","text":"How was your cousin's wedding?","audio":"94b0538ef6656326d8e0.mp3","zh":"男孩：你表哥（表姊等）的婚禮怎麼樣？"},{"speaker":"Girl","text":"Great! It was at a really fancy hotel near my home. There were beautiful lights everywhere, the waiters wore white gloves, and every dish came on a gold plate.","audio":"d52c832a9f311b270175.mp3","zh":"女孩：很棒！它在我家附近一家非常 fancy（高級）的飯店。到處都是漂亮的燈，服務生戴著白手套，每道菜都裝在金色的盤子上。"},{"speaker":"Boy","text":"Wow. Is it an old hotel?","audio":"716e9d9c01cfb113dc68.mp3","zh":"男孩：哇。那是一家老飯店嗎？"},{"speaker":"Girl","text":"No, it opened just last year.","audio":"6b5eeee3946d9ab43a47.mp3","zh":"女孩：不是，它去年才開。"}],"question":{"text":"What does the girl mean by \"fancy\"?","audio":"7fed70159ee16dce0e77.mp3","zh":"女孩說的 \"fancy\" 是什麼意思？"},"options":{"A":{"text":"Very old and quiet.","letterAudio":"93138ad65b3704914636.mp3","audio":"1083c93b0b0b1629ead6.mp3","zh":"非常老舊又安靜。","letterEnd":0.537},"B":{"text":"Very nice and expensive.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b6e447387627bfcb7ad0.mp3","zh":"非常好又昂貴。","letterEnd":0.588},"C":{"text":"Very far from her home.","letterAudio":"9756927a5f3791737934.mp3","audio":"a84a283bbdccaecc8ff1.mp3","zh":"離她家非常遠。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說那家飯店到處都是漂亮的燈、服務生戴白手套、每道菜都裝在金色的盤子上，所以 fancy 是指很高級、看起來很貴。","zhCorrect":"c43d24d2a1953b218cd0.mp3","enText":"The answer is B. Very nice and expensive. At the hotel, there were beautiful lights everywhere, the waiters wore white gloves, and every dish came on a gold plate. So when the girl says fancy, she means very nice and expensive.","enAudio":"68db4428ca4eb7f52d57.mp3","wrong":{"A":{"text":"A女孩說那家飯店去年才開，不是老飯店。","audio":"d969834fb3acc0974fd7.mp3"},"C":{"text":"C女孩說那家飯店在她家附近，不遠。","audio":"5131008e40b398f8d198.mp3"}}},{"id":"L069-Q16","type":"言談理解","point":"說話者意見","unit":"U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號52 join、57 play、44 love、54 practice；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號20 club、19 lesson；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號63 every；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say、80 talk；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號57 need；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號113 also；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號9 Tuesday；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號127 sure","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Girl","text":"Are you going to join the drama club? You were great in the class play.","audio":"62807eca076936a4e395.mp3","zh":"女孩：你要參加戲劇社嗎？你在班上的戲裡演得很好。"},{"speaker":"Boy","text":"Thanks. I love acting, but they practice every day after school.","audio":"4c9e4be04e74cb0cefec.mp3","zh":"男孩：謝謝。我很喜歡演戲，可是他們每天放學後都要練習。"},{"speaker":"Girl","text":"So you won't join?","audio":"b47b2775fc2c19cb12b8.mp3","zh":"女孩：所以你不參加了？"},{"speaker":"Boy","text":"I didn't say that. I need to talk to my parents first, because I also have swimming lessons on Tuesdays.","audio":"b78fd3179c91fef2d7c2.mp3","zh":"男孩：我沒那樣說。我得先跟我爸媽談一談，因為我星期二還有游泳課。"}],"question":{"text":"What does the boy think about joining the drama club?","audio":"74bee4a246468db955d6.mp3","zh":"男孩覺得參加戲劇社這件事怎麼樣？"},"options":{"A":{"text":"He is still not sure about it.","letterAudio":"93138ad65b3704914636.mp3","audio":"361d7ca2ae7c36c2e31a.mp3","zh":"他還不確定。","letterEnd":0.537},"B":{"text":"He can't wait to join the club.","letterAudio":"609555d8760f27caf21b.mp3","audio":"746f3f360857efdf2548.mp3","zh":"他等不及要參加。","letterEnd":0.588},"C":{"text":"He thinks acting is boring.","letterAudio":"9756927a5f3791737934.mp3","audio":"1536b99e94814d91de27.mp3","zh":"他覺得演戲很無聊。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男孩說他很喜歡演戲，但社團每天都要練習；女孩問他是不是不參加了，他說自己沒那樣說，要先和爸媽談，可見他還沒決定。","zhCorrect":"d4d19537929296e4ae37.mp3","enText":"The answer is A. He is still not sure about it. The boy loves acting, but the club practices every day after school. When the girl asks if he won't join, he says he didn't say that. He needs to talk to his parents first. He is still not sure about joining the drama club.","enAudio":"89dd826a51a377589a8e.mp3","wrong":{"B":{"text":"B男孩雖然喜歡演戲，但他還要先和爸媽談，並不是迫不及待要參加。","audio":"b709e3181ac108fbdbef.mp3"},"C":{"text":"C男孩說他很喜歡演戲，不是覺得演戲很無聊。","audio":"7e1991cfe9629cc35e33.mp3"}}},{"id":"L069-Q17","type":"言談理解","point":"明確訊息","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號40 order；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號81 open；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號14 Sunday、15 week；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號103 big；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號32 car；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號62 call","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hello, Mr. Wang. This is Ms. Chen from Happy Pet Shop. The bird cage you ordered is here. We're open from ten to eight on weekdays, but on Sundays we close at six. The cage is quite big, so you may want to come by car. If you can't come this week, just call us, and we'll keep it for you.","audio":"db6de39dff99c18bda94.mp3","zh":"哈囉，王先生。我是快樂寵物店的陳小姐。您訂的鳥籠到了。我們平日從十點開到八點，但是星期日六點關門。鳥籠相當大，所以您也許會想開車來。如果您這個星期不能來，打電話給我們就好，我們會幫您保留。"}],"question":{"text":"What time does the shop close on Sundays?","audio":"d189d194bff0fe82523d.mp3","zh":"這家店星期日幾點關門？"},"options":{"A":{"text":"At eight.","letterAudio":"93138ad65b3704914636.mp3","audio":"34835c877ffe29ea8065.mp3","zh":"八點。","letterEnd":0.537},"B":{"text":"At ten.","letterAudio":"609555d8760f27caf21b.mp3","audio":"c58074bf184abed427c6.mp3","zh":"十點。","letterEnd":0.588},"C":{"text":"At six.","letterAudio":"9756927a5f3791737934.mp3","audio":"0945d9cdd7c614cf86f6.mp3","zh":"六點。","letterEnd":0.713}},"answer":"C","keyLines":[0],"evidence":"陳小姐說「on Sundays we close at six」，所以寵物店星期日六點關門。","zhCorrect":"45d90f1b254919045de5.mp3","enText":"The answer is C. At six. Ms. Chen says the shop is open from ten to eight on weekdays. But on Sundays, the shop closes at six. So the shop closes at six on Sundays.","enAudio":"e774cda4aa9f857a84bf.mp3","wrong":{"A":{"text":"A八點是平日關門的時間。","audio":"ec7edea223092944d446.mp3"},"B":{"text":"B十點是平日開門的時間。","audio":"223ddeaf5efe5979433f.mp3"}}},{"id":"L069-Q18","type":"言談理解","point":"整體訊息","unit":"U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號60 last、65 dark；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號5 winter、58 cold、11 cloud、10 sun、31 trip；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號2 morning、18 day；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號90 see、82 say；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U01｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.9｜核心編號65 bed；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號104 small；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號34 train；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號14 mountain；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號36 sky；U01｜核心單字「顏色」｜教材印刷頁 p.8｜核心編號56 orange；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號26 thing；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號61 ride；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last winter, my family got up at three in the morning to see the sunrise on Alishan. It was cold and dark, and I wanted to stay in bed. We took a small train up the mountain with hundreds of people. At first, we only saw clouds. Then the sky turned orange, and the sun came up over the mountains. Everyone said, Wow, at the same time. It was the most beautiful thing I have ever seen.","audio":"107e90f48055fd1c422a.mp3","zh":"去年冬天，我們全家凌晨三點起床，要在阿里山看日出。天氣又冷又暗，我很想待在床上。我們和好幾百個人一起搭小火車上山。一開始，我們只看到雲。後來天空變成橘色，太陽從山的後面升起。大家同時說：「哇。」那是我看過最美的東西。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"A morning trip to see the sunrise.","letterAudio":"93138ad65b3704914636.mp3","audio":"5b203a18c7280e2eff0a.mp3","zh":"一次清晨去看日出的旅行。","letterEnd":0.537},"B":{"text":"A train ride with lots of people.","letterAudio":"609555d8760f27caf21b.mp3","audio":"4f94c342a321948af62a.mp3","zh":"和很多人一起搭的一趟火車。","letterEnd":0.588},"C":{"text":"A cold day at the speaker's school.","letterAudio":"9756927a5f3791737934.mp3","audio":"70f61c56f5df642f3cf2.mp3","zh":"說話者學校裡寒冷的一天。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"說話者說去年冬天全家一大早起床去阿里山看日出，搭小火車上山，看到太陽從山後升起，覺得那是看過最美的東西。整段在談一次清晨去看日出的旅行。","zhCorrect":"90132752fa00be1e96cd.mp3","enText":"The answer is A. A morning trip to see the sunrise. Last winter, the speaker's family got up at three in the morning and took a small train up Alishan. Then they saw the sun come up over the mountains. The talk is about a morning trip to see the sunrise.","enAudio":"63a7f47f8aa5e6d796b8.mp3","wrong":{"B":{"text":"B和好幾百個人一起搭小火車只是上山的過程，是細節，不是主旨。","audio":"ec87deaf5546e6dc6aab.mp3"},"C":{"text":"C說話者是和家人去阿里山，不是在學校；天氣冷也只是細節。","audio":"178e7825f147ead569d6.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L069/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
