<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英聽 MP3 練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ef; --ink: #4a3b36; --muted: #8a766d; --line: #f1e3d3; --panel: #ffffff;
      --peach: #ffb4a2; --peach-deep: #f08a74; --mint: #bfe6d6; --mint-deep: #3f9d78; --sky: #cfe6ff; --sky-deep: #5b8fd6;
      --butter: #ffe7a3; --lilac: #7a8cff; --good: #3f9d78; --bad: #e0724f; --key: #fff0b3; --accent: #f08a74;
      font-family: "Arial Rounded MT Bold", system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(#ffe2cf 1.2px, transparent 1.2px); background-size: 22px 22px; }
    h1 { margin: 2px 0 6px; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    h3 { margin: 22px 0 10px; font-size: 1.02rem; }
    p { line-height: 1.7; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 7px 0 #f6e6d6; margin: 18px 0; }
    .hero { display: flex; gap: 14px; align-items: center; }
    .hero .bear { width: 92px; height: 92px; }
    .hero .text { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--butter); font-weight: 700; font-size: .85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 2px solid var(--line);
      background: #fffdf9; color: var(--ink); transition: transform .1s, box-shadow .1s, border-color .1s; }
    button:hover:enabled { border-color: var(--peach); }
    button:active:enabled { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--peach-deep); border-color: var(--peach-deep); color: #fff; box-shadow: 0 4px 0 #d46e59; }
    button.primary:hover:enabled { border-color: var(--peach-deep); }
    button.primary:active:enabled { box-shadow: 0 1px 0 #d46e59; transform: translateY(3px); }
    select, input { font: inherit; }
    select { border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #fffdf9; color: var(--ink); }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .qhead .bear { width: 64px; height: 64px; }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f3e7da; display: block; }
    .dots i.right { background: var(--mint-deep); }
    .dots i.wrong { background: var(--bad); }
    .dots i.now { background: var(--butter); box-shadow: 0 0 0 3px #f5c95c inset; }
    .answers { display: flex; gap: 14px; margin: 18px 0; }
    .answers button { min-width: 92px; min-height: 76px; font-size: 1.9rem; font-weight: 800; border-radius: 24px; border-width: 3px; }
    .answers button[data-answer="A"] { background: #fff0ec; border-color: var(--peach); box-shadow: 0 5px 0 #f3c3b6; }
    .answers button[data-answer="B"] { background: #eefaf4; border-color: var(--mint); box-shadow: 0 5px 0 #b3dcca; }
    .answers button[data-answer="C"] { background: #eef5ff; border-color: var(--sky); box-shadow: 0 5px 0 #b6d3f3; }
    .answers button:active:enabled { transform: translateY(4px); box-shadow: none; }
    .answers button.chosen { outline: 4px solid var(--ink); outline-offset: 2px; }
    .status { font-weight: 700; min-height: 1.7em; margin: 10px 0 0; }
    .feedback { border: 3px solid var(--mint); background: #f1fbf6; padding: 12px 16px; border-radius: 20px; margin-top: 14px; }
    .feedback.wrong { border-color: var(--peach); background: #fff4f0; }
    .feedback p { margin: 6px 0; }
    .feedback .tag { font-weight: 800; }
    .transcript { margin-top: 16px; }
    .transcript p { margin: 5px 0; padding: 5px 8px; border-radius: 12px; }
    .transcript p.key { background: var(--key); }
    .transcript .spk { color: var(--muted); font-size: .88rem; margin-right: 6px; }
    .transcript .line { display: flex; gap: 8px; align-items: flex-start; }
    .transcript .line > div { flex: 1; }
    .transcript .zh { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .transcript.hide-zh .zh { display: none; }
    .transcript .opt.correct .en { color: var(--good); font-weight: 800; }
    .transcript .opt.picked .en { text-decoration: line-through; color: var(--bad); }
    .say { padding: 2px 9px; font-size: .95rem; line-height: 1.4; flex: none; }
    .transcript .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .transcript h3 { margin: 0; }
    .booklet { border: 3px dashed var(--line); border-radius: 18px; padding: 8px 16px; margin: 12px 0 0; font-size: 1.12rem; background: #fffdf9; }
    .booklet p { margin: 7px 0; }
    .report { font-size: .88rem; margin-top: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 2px dotted var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .88rem; }
    .bar { height: 10px; background: #f3e7da; border-radius: 999px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
    .error { background: #fff0ec; border: 2px solid var(--peach); padding: 10px 14px; border-radius: 14px; }
    textarea { width: 100%; min-height: 160px; font: inherit; font-size: .9rem; border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
    details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
    .home { display: inline-block; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; }
    .home:hover { border-color: var(--peach); }
    .past { background: #eefaf4; border: 2px solid var(--mint); border-radius: 16px; padding: 8px 14px; color: #2c7a5b; margin: 8px 0 0; }
    .namerow { margin-top: 10px; gap: 8px; }
    .namerow input { font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fffdf9; color: var(--ink); max-width: 16em; }
    .namerow input:focus { outline: none; border-color: var(--peach); }
    .scorebig { display: flex; align-items: center; gap: 16px; }
    .scorebig .bear { width: 96px; height: 96px; }
    .scorebig b { font-size: 2.6rem; line-height: 1; }
    .scorebig .stars { font-size: 1.6rem; letter-spacing: 2px; }
    /* bear moods */
    .bear .eyes-happy, .bear .mouth-happy, .bear .mouth-oops, .bear .drop, .bear .sparkle, .bear .notes { display: none; }
    .bear[data-mood="happy"] .eyes-normal, .bear[data-mood="happy"] .mouth-normal,
    .bear[data-mood="oops"] .mouth-normal { display: none; }
    .bear[data-mood="happy"] .eyes-happy, .bear[data-mood="happy"] .mouth-happy, .bear[data-mood="happy"] .sparkle,
    .bear[data-mood="oops"] .mouth-oops, .bear[data-mood="oops"] .drop, .bear[data-mood="listening"] .notes { display: inline; }
    .bear { flex: none; animation: bob 2.6s ease-in-out infinite; }
    .bear[data-mood="happy"] { animation: hop .6s ease-in-out 2; }
    .bear .notes text { animation: float 1.6s ease-in-out infinite; }
    .bear .notes text:nth-child(2) { animation-delay: .5s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg); } }
    @keyframes hop { 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .bear, .bear .notes text { animation: none !important; } }
    @media (max-width: 520px) {
      .answers button { min-width: 0; flex: 1; }
      .hero .bear { width: 72px; height: 72px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <template id="bearArt">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true" data-mood="idle">
      <g class="notes"><text x="96" y="24" font-size="17" fill="#f08a74">♪</text><text x="4" y="32" font-size="14" fill="#7a8cff">♫</text></g>
      <g class="sparkle"><text x="94" y="26" font-size="18">✨</text><text x="2" y="34" font-size="14">⭐</text></g>
      <circle cx="32" cy="36" r="13" fill="#d6a57c"/><circle cx="32" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="88" cy="36" r="13" fill="#d6a57c"/><circle cx="88" cy="36" r="7" fill="#f6d2b4"/>
      <circle cx="60" cy="66" r="40" fill="#e0b088"/>
      <path d="M22 62 C22 14, 98 14, 98 62" fill="none" stroke="#7a8cff" stroke-width="7" stroke-linecap="round"/>
      <rect x="11" y="52" width="17" height="28" rx="8" fill="#7a8cff"/><rect x="92" y="52" width="17" height="28" rx="8" fill="#7a8cff"/>
      <ellipse cx="60" cy="81" rx="18" ry="13" fill="#f8e0c8"/>
      <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#4a3b36"/>
      <path class="mouth-normal" d="M54 84 Q60 90 66 84" fill="none" stroke="#4a3b36" stroke-width="2.4" stroke-linecap="round"/>
      <path class="mouth-happy" d="M52 82 Q60 96 68 82 Z" fill="#c9555a" stroke="#4a3b36" stroke-width="2" stroke-linejoin="round"/>
      <ellipse class="mouth-oops" cx="60" cy="86" rx="3.4" ry="4" fill="#4a3b36"/>
      <g class="eyes-normal"><circle cx="45" cy="62" r="5" fill="#4a3b36"/><circle cx="46.6" cy="60.4" r="1.6" fill="#fff"/>
        <circle cx="75" cy="62" r="5" fill="#4a3b36"/><circle cx="76.6" cy="60.4" r="1.6" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4a3b36" stroke-width="3" stroke-linecap="round"><path d="M40 63 Q45 56 50 63"/><path d="M70 63 Q75 56 80 63"/></g>
      <path class="drop" d="M88 42 Q93 50 88 54 Q83 50 88 42 Z" fill="#9fd3ff" stroke="#5b8fd6" stroke-width="1.2"/>
      <ellipse cx="37" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/><ellipse cx="83" cy="76" rx="6" ry="3.6" fill="#ff9eaa" opacity=".75"/>
    </svg>
  </template>

  <a id="home" class="home" hidden>🏠 回到目錄</a>
  <header class="panel hero">
    <span class="bear-slot"></span>
    <div class="text">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
      <p class="muted" id="intro" style="margin:0"></p>
      <p class="past" id="past" hidden></p>
      <label class="namerow" id="nameRow" hidden>我的名字或座號 <input id="playerName" maxlength="20" placeholder="寫上名字，成績才認得出是你"></label>
    </div>
  </header>

  <div class="panel row">
    <label>模式 <select id="mode"><option value="exam" selected>會考模式（選項用看的）</option><option value="ear">磨耳朵模式（選項用聽的）</option></select></label>
    <button id="start" class="primary">開始</button>
    <button id="replay" disabled>重聽本題</button>
    <button id="pause" disabled>暫停</button>
    <label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select></label>
    <label>講解 <select id="lang"><option value="both" selected>中文＋英文</option><option value="zh">只有中文</option><option value="en">只有英文</option></select></label>
  </div>

  <main id="stage" class="panel" hidden>
    <div class="qhead">
      <span class="bear-slot"></span>
      <div>
        <p class="muted" id="progress" style="margin:0"></p>
        <h2 id="heading"></h2>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="booklet" id="booklet" hidden></div>
    <div class="answers" role="group" aria-label="作答選項">
      <button data-answer="A" disabled>A</button>
      <button data-answer="B" disabled>B</button>
      <button data-answer="C" disabled>C</button>
    </div>
    <div id="review" hidden>
      <div id="feedback" class="feedback"></div>
      <div class="row" style="margin-top:12px">
        <button id="replayKey">重聽關鍵句</button>
        <button id="replayPassage">重聽原文</button>
        <button id="replayFeedback">再聽一次講解</button>
        <button id="next" class="primary">下一題</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <p class="muted report">覺得這題有問題（例如答案不只一個、發音怪怪的）？記下題號 <b id="reportId"></b> 告訴老師。</p>
    </div>
  </main>

  <section id="finished" class="panel" hidden>
    <div class="scorebig">
      <span class="bear-slot"></span>
      <div>
        <h2>成績單</h2>
        <b id="scoreBig"></b> <span class="stars" id="stars"></span>
        <p class="muted" id="cheer" style="margin:4px 0 0"></p>
      </div>
    </div>
    <p id="score"></p>
    <p class="muted" id="saved"></p>
    <h3>各考點答對率</h3>
    <table><thead><tr><th>題型／考點</th><th>答對</th><th></th></tr></thead><tbody id="byPoint"></tbody></table>
    <h3>錯題與建議複習</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:16px">
      <button id="copyTeacher" class="primary">📋 複製成績（傳給老師）</button>
      <button id="retryWrong">只重練錯題</button>
      <button id="restart">整回重來</button>
      <button id="export">下載作答紀錄</button>
      <button id="copyPrompt">🤖 複製 AI 家教檢討提示（貼到 ChatGPT）</button>
    </div>
    <p class="past" style="margin-top:14px">📋 做完這一回，記得按上面的「複製成績（傳給老師）」，把成績貼給老師當作打卡。</p>
    <p class="muted" id="copyNote"></p>
    <details><summary>檢討提示內容</summary><textarea id="prompt" readonly></textarea></details>
    <h3>這一回的歷次紀錄（存在這台裝置）</h3>
    <table><thead><tr><th>完成時間</th><th>模式</th><th>首次答對</th><th>錯題重練</th></tr></thead><tbody id="history"></tbody></table>

t. Let's sit near the front of the bus. Someone asks if you want to sit with them on the bus for the class trip to a chocolate factory. The best reply is, I'd like that. Let's sit near the front of the bus. This reply accepts the invitation.","enAudio":"4fe8c90409e7a41451f7.mp3","wrong":{"B":{"text":"B說自己的爸爸喜歡巧克力、每天都吃，只接著 chocolate，沒有回應邀請。","audio":"ee8396c85cc63d2759ae.mp3"},"C":{"text":"C說車子八點開，只接著 bus，沒有回應邀請。","audio":"01c1bcbc015a033444ca.mp3"}}},{"id":"L093-Q07","type":"基本問答","point":"鼓勵／回應消息","unit":"U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號17 today；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號123 very；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號58 cold、5 winter、8 snow、48 write；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號97 great；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say","difficulty":"易","numberAudio":"e0d26bc8f9a996557d6a.mp3","passage":[{"speaker":null,"text":"I got a letter from my pen pal in Canada today!","audio":"7ea5a12fc20e5cbde613.mp3","zh":"我今天收到加拿大筆友寄來的信！"}],"question":null,"options":{"A":{"text":"Canada is very cold in winter. It snows a lot.","letterAudio":"93138ad65b3704914636.mp3","audio":"3378c60536e7933df3dd.mp3","zh":"加拿大冬天很冷。那裡常下雪。","letterEnd":0.537},"B":{"text":"That's great! What did your pen pal say?","letterAudio":"609555d8760f27caf21b.mp3","audio":"3db18cf19e9e74efa7f5.mp3","zh":"太好了！你的筆友說了什麼？","letterEnd":0.588},"C":{"text":"I don't write letters.","letterAudio":"9756927a5f3791737934.mp3","audio":"d4f2ddb09a9c8b773d19.mp3","zh":"我不寫信的。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"對方開心地說收到加拿大筆友的信；B說太好了，並問筆友寫了什麼，是回應好消息的說法。","zhCorrect":"fe5316eba4ac24b81984.mp3","enText":"The answer is B. That's great! What did your pen pal say? Someone got a letter from their pen pal in Canada today. The best reply is, That's great! What did your pen pal say? This reply shows you are happy for this person.","enAudio":"75ad6aa1ef2759ab4e2a.mp3","wrong":{"A":{"text":"A說加拿大冬天很冷、常下雪，只接著 Canada，沒有回應對方的消息。","audio":"3bad9164e05460117b91.mp3"},"C":{"text":"C說自己不寫信，只接著 letter，談自己的事，沒有回應對方的消息。","audio":"0c58e232f115b9c39e53.mp3"}}},{"id":"L093-Q08","type":"基本問答","point":"提醒／安撫／道歉","unit":"U04｜核心單字「食物：可數」｜教材印刷頁 p.70｜核心編號7 drink；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號12 milk；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號81 open；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號66 well；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號20 farm","difficulty":"易","numberAudio":"80a70fd62b642c907f0e.mp3","passage":[{"speaker":null,"text":"Don't drink that milk. It's been open for a week.","audio":"94ac28e2310e3ddf5ed5.mp3","zh":"不要喝那瓶牛奶。它已經開了一個星期了。"}],"question":null,"options":{"A":{"text":"Well, I drink milk every morning. It's good for me.","letterAudio":"93138ad65b3704914636.mp3","audio":"daafce2cb180057aa4a7.mp3","zh":"嗯，我每天早上都喝牛奶。牛奶對我的身體好。","letterEnd":0.537},"B":{"text":"This milk is from a farm in Taitung.","letterAudio":"609555d8760f27caf21b.mp3","audio":"c8e761ec952d2c89782c.mp3","zh":"這瓶牛奶來自臺東的一座農場。","letterEnd":0.588},"C":{"text":"Oh, thanks. I'll pour it out.","letterAudio":"9756927a5f3791737934.mp3","audio":"52a04c68a8a9b15726e1.mp3","zh":"噢，謝謝。我會把它倒掉。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"對方提醒自己那瓶牛奶已經開了一個星期，不要喝；C道謝並說會把它倒掉，是接受提醒的說法。","zhCorrect":"2a3a1824a3cf7b128aff.mp3","enText":"The answer is C. Oh, thanks. I'll pour it out. Someone tells you not to drink that milk, because it has been open for a week. The best reply is, Oh, thanks. I'll pour it out. This reply accepts the warning.","enAudio":"6401b2ab60e4aa75f3cb.mp3","wrong":{"A":{"text":"A說自己每天早上喝牛奶、對身體好，只接著 milk，沒有回應對方的提醒。","audio":"e9d4c8c0fed06749ae95.mp3"},"B":{"text":"B說這瓶牛奶來自臺東的農場，只接著 milk，沒有回應對方的提醒。","audio":"3bbbbc6732b1e95904ed.mp3"}}},{"id":"L093-Q09","type":"言談理解","point":"明確訊息","unit":"U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號81 report；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號57 play；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號19 basketball；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號7 rain；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號82 then；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號39 house；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號53 stay；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號51 eat","difficulty":"中","numberAudio":"afbe0cf3bd8e90e335d5.mp3","passage":[{"speaker":"Girl","text":"After school, let's do our science report first and then play basketball.","audio":"cbae6884bc9ee3ed39b5.mp3","zh":"女孩：放學後，我們先做自然科報告，再去打籃球吧。"},{"speaker":"Boy","text":"The weather report says it will rain at five. Let's play basketball first.","audio":"1eb480bd62748c45a8d3.mp3","zh":"男孩：氣象報告說五點會下雨。我們先打籃球吧。"},{"speaker":"Girl","text":"OK. Then we can do the report at my house. My dad is making curry for dinner, and you can stay.","audio":"17c7bb2af9a392950566.mp3","zh":"女孩：好。然後我們可以在我家做報告。我爸爸晚餐要做咖哩，你可以留下來吃。"}],"question":{"text":"What will they do first after school?","audio":"772ac9acead9adb6e39a.mp3","zh":"他們放學後會先做什麼？"},"options":{"A":{"text":"Play basketball.","letterAudio":"93138ad65b3704914636.mp3","audio":"316a23dc281ebabb0d3f.mp3","zh":"打籃球。","letterEnd":0.537},"B":{"text":"Do their science report.","letterAudio":"609555d8760f27caf21b.mp3","audio":"310ed0c93960dbeef8ba.mp3","zh":"做他們的自然科報告。","letterEnd":0.588},"C":{"text":"Eat curry at the girl's house.","letterAudio":"9756927a5f3791737934.mp3","audio":"2acb1315447cd88cb5af.mp3","zh":"在女孩家吃咖哩。","letterEnd":0.713}},"answer":"A","keyLines":[1],"evidence":"男孩說五點會下雨，提議「Let's play basketball first」，女孩說 OK，所以他們放學後會先打籃球。","zhCorrect":"262a3891a78dc0d1376c.mp3","enText":"The answer is A. Play basketball. The girl wanted to do the science report first. But the boy says it will rain at five, so he wants to play basketball first, and the girl says OK. After that, they will do the report at the girl's house. So they will play basketball first.","enAudio":"219a084469b9cc538194.mp3","wrong":{"B":{"text":"B先做報告是女孩原本的提議，後來她同意先打籃球，再去她家做報告。","audio":"10691f7def3352e8e06f.mp3"},"C":{"text":"C咖哩是女孩爸爸要做的晚餐，是做完報告以後的事。","audio":"af7f167c588d4bcc56c8.mp3"}}},{"id":"L093-Q10","type":"言談理解","point":"整體訊息","unit":"U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號96 have；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號56 borrow；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號41 book；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people、31 person、27 woman；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號67 each；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號69 interesting、31 trip；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號37 life；U07｜核心單字「職業」｜教材印刷頁 p.134｜核心編號8 farmer；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號61 sail、59 ask；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號12 world；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號41 story；U09｜核心單字「名詞：自然、生物與一般概念」｜教材印刷頁 pp.183～203｜核心編號34 question；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號98 free；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號49 tell","difficulty":"中","numberAudio":"d65d0cef90874a0a9664.mp3","passage":[{"speaker":null,"text":"Good afternoon, everyone. This Saturday from ten to four, the City Library will have a Human Library. At a Human Library, you don't borrow books. You borrow people! Each book is a person with an interesting life, like a firefighter, a farmer, and a woman who sailed around the world alone. You can sit with one person for twenty minutes, listen to the story, and ask questions. It's free, but please sign up at the front desk first.","audio":"6c1cef8c3bc9a6879354.mp3","zh":"大家午安。這個星期六十點到四點，市立圖書館要舉辦「真人圖書館」。在真人圖書館，你借的不是書。你借的是人！每一本「書」都是一個人生很有趣的人，像是一位消防員、一位農夫，還有一位獨自駕船環遊世界的女士。你可以和一個人坐二十分鐘，聽他的故事，並問問題。活動免費，不過請先到服務台報名。"}],"question":{"text":"What is the announcement mainly about?","audio":"39d1dc8ebce3ddfac73c.mp3","zh":"這段廣播主要在說什麼？"},"options":{"A":{"text":"New books about firefighters and farmers.","letterAudio":"93138ad65b3704914636.mp3","audio":"5f940421f5c2cdfa629c.mp3","zh":"關於消防員和農夫的新書。","letterEnd":0.537},"B":{"text":"A sailing trip around the world.","letterAudio":"609555d8760f27caf21b.mp3","audio":"709accf847893b1c7b85.mp3","zh":"一趟駕船環遊世界的旅行。","letterEnd":0.588},"C":{"text":"An event where people tell their life stories.","letterAudio":"9756927a5f3791737934.mp3","audio":"de970278f6acfdef6014.mp3","zh":"一個讓人們講述自己人生故事的活動。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"廣播說在真人圖書館借的不是書而是人，每個人都有有趣的人生，可以和他坐二十分鐘聽故事、問問題。整段在介紹一個讓人分享自己人生故事的活動。","zhCorrect":"f04ac8b0449e4361655f.mp3","enText":"The answer is C. An event where people tell their life stories. This Saturday, the City Library will have a Human Library. People don't borrow books there. They borrow people, like a firefighter, a farmer, and a woman who sailed around the world. People can listen to each person's story and ask questions. The announcement is about an event where people tell their life stories.","enAudio":"e53fa716c3e7a06464e5.mp3","wrong":{"A":{"text":"A由 firefighter 和 farmer 聯想到書，但廣播說借的不是書，消防員和農夫是來說故事的人。","audio":"f4f1445f501d37a330db.mp3"},"B":{"text":"B駕船環遊世界只是其中一位女士的經歷，不是整段廣播的主旨。","audio":"62c0599fd19f1100f62a.mp3"}}},{"id":"L093-Q11","type":"言談理解","point":"說話者意見","unit":"U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號51 hear、32 fun；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號9 brother；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號87 cry；U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號71 top；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號82 say、95 go；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too、129 again；U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號55 fast；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號48 kid；U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號1 time；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號48 tomorrow","difficulty":"中","numberAudio":"f1069488c9a68dd2293f.mp3","passage":[{"speaker":"Girl","text":"Have you tried the new slide at River Park? I heard it's thirty meters long!","audio":"ff79970da919ad9fa8c2.mp3","zh":"女孩：你玩過河濱公園新的溜滑梯了嗎？我聽說它有三十公尺長！"},{"speaker":"Boy","text":"Yes. My little brother cried at the top, and my mom said it was too fast for kids.","audio":"0e873f41c05a3ff541f1.mp3","zh":"男孩：玩過了。我弟弟在上面哭了，我媽媽說對小孩來說太快了。"},{"speaker":"Girl","text":"What about you?","audio":"2e47c8fca660a517cf35.mp3","zh":"女孩：那你呢？"},{"speaker":"Boy","text":"I went down five times. I'd go again tomorrow if I could.","audio":"f027ad7b464b6c8eff93.mp3","zh":"男孩：我溜了五次。如果可以的話，我明天還想再去。"}],"question":{"text":"What does the boy think about the new slide?","audio":"9c58d8fbce75c1546d43.mp3","zh":"男孩覺得新的溜滑梯怎麼樣？"},"options":{"A":{"text":"It is too fast for kids.","letterAudio":"93138ad65b3704914636.mp3","audio":"63f7d32bec8afcf9273a.mp3","zh":"對小孩來說太快了。","letterEnd":0.537},"B":{"text":"It is too scary to try.","letterAudio":"609555d8760f27caf21b.mp3","audio":"9ff4541a7f27f9fe6bb9.mp3","zh":"太可怕了，不敢玩。","letterEnd":0.588},"C":{"text":"It is a lot of fun.","letterAudio":"9756927a5f3791737934.mp3","audio":"a9826c0045be28e42aca.mp3","zh":"非常好玩。","letterEnd":0.713}},"answer":"C","keyLines":[],"evidence":"男孩說他溜了五次，如果可以的話明天還想再去，可見他覺得新的溜滑梯很好玩。","zhCorrect":"d1984989f873b4f1ef1d.mp3","enText":"The answer is C. It is a lot of fun. The boy's little brother cried at the top of the new slide, and the boy's mom said it was too fast for kids. But the boy went down five times, and he would go again tomorrow. So the boy thinks the new slide is a lot of fun.","enAudio":"96d4e3d13f6fefcd70b6.mp3","wrong":{"A":{"text":"A覺得對小孩來說太快的是男孩的媽媽，不是男孩。","audio":"0296222b60a2563c831c.mp3"},"B":{"text":"B在上面哭的是男孩的弟弟，男孩自己溜了五次。","audio":"015984d32f7a8f2de775.mp3"}}},{"id":"L093-Q12","type":"言談理解","point":"明確訊息","unit":"U03｜核心單字「形容詞」｜教材印刷頁 p.52｜核心編號61 early；U08｜核心單字「其他名詞」｜教材印刷頁 pp.152～153｜核心編號48 tomorrow；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號31 trip；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號53 sell、43 visit；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號30 breakfast；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號3 market；U11｜核心單字「形容詞與副詞」｜教材印刷頁 p.224｜核心編號43 sick；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make","difficulty":"中","numberAudio":"8378e1aa8e6767b5a658.mp3","passage":[{"speaker":"Boy","text":"You're going to bed at eight thirty? That's so early.","audio":"bb22a126fe86e17b99ef.mp3","zh":"男孩：你八點半就要睡了？好早喔。"},{"speaker":"Girl","text":"I have to get up at four tomorrow.","audio":"1b937568c1997894ae13.mp3","zh":"女孩：我明天四點要起床。"},{"speaker":"Boy","text":"Are you going on a trip?","audio":"97d6f2e29e56e4414a7a.mp3","zh":"男孩：你要去旅行嗎？"},{"speaker":"Girl","text":"No. My dad sells breakfast at the market, and his helper is sick this week. I'm going to help him make egg pancakes before school.","audio":"6ee413c42c1ebca9bf1e.mp3","zh":"女孩：不是。我爸爸在市場賣早餐，他的幫手這個星期生病了。我上學前要去幫他做蛋餅。"}],"question":{"text":"Why does the girl have to get up at four tomorrow?","audio":"ffab5c7a735b0a629a82.mp3","zh":"女孩明天為什麼要四點起床？"},"options":{"A":{"text":"To go on a trip.","letterAudio":"93138ad65b3704914636.mp3","audio":"7ec79eba0615e327f54f.mp3","zh":"去旅行。","letterEnd":0.537},"B":{"text":"To help her dad sell breakfast.","letterAudio":"609555d8760f27caf21b.mp3","audio":"b48055aaafc9019cffb3.mp3","zh":"幫她爸爸賣早餐。","letterEnd":0.588},"C":{"text":"To visit her dad's sick helper.","letterAudio":"9756927a5f3791737934.mp3","audio":"134fa4ca017647ebfba1.mp3","zh":"去探望她爸爸生病的幫手。","letterEnd":0.713}},"answer":"B","keyLines":[3],"evidence":"女孩說爸爸在市場賣早餐，他的幫手這星期生病了，「I'm going to help him make egg pancakes before school」，所以她四點起床是要幫爸爸賣早餐。","zhCorrect":"50e34ab74d5090dcc909.mp3","enText":"The answer is B. To help her dad sell breakfast. The girl has to get up at four tomorrow. She is not going on a trip. Her dad sells breakfast at the market, and his helper is sick this week. So the girl will help her dad make egg pancakes before school.","enAudio":"b6919c405b9a1fee31a9.mp3","wrong":{"A":{"text":"A男孩問她是不是要去旅行，女孩說不是。","audio":"ca1f6f556a0af7d6e51a.mp3"},"C":{"text":"C生病的是爸爸的幫手，女孩是要去代替幫手幫忙，沒有說要去探望他。","audio":"73b353f908f20fbc8b50.mp3"}}},{"id":"L093-Q13","type":"言談理解","point":"情境／身分推論","unit":"U10｜核心單字「形容詞、副詞與介系詞」｜教材印刷頁 p.206｜核心編號55 fast；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號55 try、34 fix；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號88 help；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號76 still；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號13 half、26 thing；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too、127 sure；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號39 truck；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號44 dollar；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號42 live；U07｜核心單字「職業」｜教材印刷頁 p.134｜核心編號10 driver","difficulty":"中","numberAudio":"de7a313795f35cb31de8.mp3","passage":[{"speaker":"Girl","text":"Thanks for coming so fast. My neighbor tried to help, but my key is still stuck in the lock.","audio":"cfcd5e83789d52057993.mp3","zh":"女孩：謝謝你這麼快就來。我的鄰居試著幫忙，可是我的鑰匙還卡在鎖裡。"},{"speaker":"Man","text":"Let me see. Half of the key broke off inside. I'll get it out with this tool.","audio":"47d15582c1cdccb2971a.mp3","zh":"男士：我看看。鑰匙有一半斷在裡面了。我用這個工具把它拿出來。"},{"speaker":"Girl","text":"Can you make me a new key, too?","audio":"75aac049d39268341985.mp3","zh":"女孩：你也可以幫我做一把新鑰匙嗎？"},{"speaker":"Man","text":"Sure. I can make one in my truck in ten minutes. That'll be three hundred dollars.","audio":"5646ba16514b7856ff22.mp3","zh":"男士：當然。我在我的卡車上十分鐘就能做好一把。這樣是三百元。"}],"question":{"text":"Who is the man most likely?","audio":"f1e942c8f08e74db61cf.mp3","zh":"這位男士最有可能是誰？"},"options":{"A":{"text":"A worker who fixes locks.","letterAudio":"93138ad65b3704914636.mp3","audio":"aae9b180fdc7e4585213.mp3","zh":"修鎖的工人。","letterEnd":0.537},"B":{"text":"A neighbor who lives next door.","letterAudio":"609555d8760f27caf21b.mp3","audio":"05e2132066d9d82a722e.mp3","zh":"住在隔壁的鄰居。","letterEnd":0.588},"C":{"text":"A driver who delivers things.","letterAudio":"9756927a5f3791737934.mp3","audio":"5e9b29e25918ed0cad29.mp3","zh":"送東西的司機。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"男士要把斷在鎖裡的半把鑰匙拿出來，還能在十分鐘內做一把新鑰匙、收三百元，可知他最有可能是修鎖的工人，也就是鎖匠。","zhCorrect":"f9041aede22eab860dcd.mp3","enText":"The answer is A. A worker who fixes locks. The girl's key is stuck in the lock. The man says half of the key broke off inside, and he will get it out with a tool. He can also make a new key in ten minutes for three hundred dollars. So the man is most likely a worker who fixes locks.","enAudio":"16cf3b034741fac15502.mp3","wrong":{"B":{"text":"B試著幫忙的是女孩的鄰居，女孩謝謝男士這麼快就來，男士不是那位鄰居。","audio":"97dc9a34c28cfaae32da.mp3"},"C":{"text":"C由 truck 聯想到送貨的司機，但男士是在卡車上做鑰匙，不是送貨。","audio":"f5ef4c140ddb76d2e644.mp3"}}},{"id":"L093-Q14","type":"言談理解","point":"整體訊息","unit":"U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號102 all；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號48 kid；U03｜核心單字「休閒與運動」｜教材印刷頁 pp.50～51｜核心編號21 dance、26 song；U02｜核心單字「其他名詞及相關用字」｜教材印刷頁 p.31｜核心編號67 music、71 party；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號55 wear；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號57 play、45 like；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號68 strange、32 fun、51 hear；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號46 pick；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號17 button；U01｜核心單字「人物」｜教材印刷頁 p.8｜核心編號32 people；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號42 live；U01｜核心單字「學校」｜教材印刷頁 p.8｜核心編號33 school；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號79 anything","difficulty":"中","numberAudio":"5c9e4ce8a9d5bdceeaa0.mp3","passage":[{"speaker":"Boy","text":"Why were all those kids dancing in the gym with no music?","audio":"9d83268baf5dd622b751.mp3","zh":"男孩：為什麼那些小孩在體育館裡跳舞，卻沒有音樂？"},{"speaker":"Girl","text":"There was music. It was a silent disco. Everyone wore headphones, and the music only played in them.","audio":"6d123f0c3eb072c7ccbe.mp3","zh":"女孩：有音樂啊。那是一場「無聲舞會」。每個人都戴著耳機，音樂只在耳機裡播放。"},{"speaker":"Boy","text":"Isn't that strange?","audio":"0dcad799219ec9fa4203.mp3","zh":"男孩：那不是很奇怪嗎？"},{"speaker":"Girl","text":"It's fun! You can pick from three songs with a button, and the people living near the school can't hear anything at night.","audio":"e719ae0e3c838259598a.mp3","zh":"女孩：很好玩！你可以按按鈕從三首歌裡選，而且住在學校附近的人晚上什麼都聽不到。"}],"question":{"text":"What are they mainly talking about?","audio":"8919dbaa052a52791fee.mp3","zh":"他們主要在談什麼？"},"options":{"A":{"text":"Songs that kids like to dance to.","letterAudio":"93138ad65b3704914636.mp3","audio":"2d7ecb43b127519e8985.mp3","zh":"小孩喜歡跟著跳舞的歌。","letterEnd":0.537},"B":{"text":"A dance party with headphones.","letterAudio":"609555d8760f27caf21b.mp3","audio":"6d125aed7544b3acbf66.mp3","zh":"一場戴著耳機的舞會。","letterEnd":0.588},"C":{"text":"Neighbors who don't like loud music.","letterAudio":"9756927a5f3791737934.mp3","audio":"0a47d896788ef0881489.mp3","zh":"不喜歡大聲音樂的鄰居。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"女孩說那是一場無聲舞會，每個人戴著耳機，音樂只在耳機裡播放，可以按按鈕選歌，住在附近的人也聽不到。整段在談一場戴耳機跳舞的舞會。","zhCorrect":"aba4357c77cf04f12559.mp3","enText":"The answer is B. A dance party with headphones. The kids were dancing in the gym, but the boy heard no music. The girl says it was a silent disco. Everyone wore headphones, and the music only played in them. The girl and the boy are talking about a dance party with headphones.","enAudio":"3838a6a98376a2b0a3c8.mp3","wrong":{"A":{"text":"A由 three songs 聯想到小孩喜歡的歌，但他們談的是戴耳機跳舞的活動，沒有說小孩喜歡哪些歌。","audio":"f9c7672cc208408691bb.mp3"},"C":{"text":"C由 people living near the school 聯想到鄰居，但女孩只說附近的人聽不到，沒有說他們不喜歡大聲的音樂。","audio":"d5b6063d6054174a386b.mp3"}}},{"id":"L093-Q15","type":"言談理解","point":"語境猜義","unit":"U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號45 send、31 trip；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號127 sure、123 very；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號29 camp；U05｜主單字表「場所與自然環境」｜教材印刷頁 p.88｜核心編號14 mountain；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號87 check；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號65 busy；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號33 homework；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號1 family；U11｜四、題目與閱讀補充字詞「網路使用問卷」｜教材印刷頁 p.236｜offline","difficulty":"中","numberAudio":"a7624bc4d04e927cc47c.mp3","passage":[{"speaker":"Girl","text":"Can I send you the photos from the class trip on Saturday?","audio":"d139c28cc45deeeb9dd2.mp3","zh":"女孩：我星期六可以把校外教學的照片傳給你嗎？"},{"speaker":"Boy","text":"Sure, but I'll be offline all weekend. We're camping in the mountains.","audio":"637fe722f7a964c97c13.mp3","zh":"男孩：可以啊，不過我整個週末都會 offline（離線）。我們要去山上露營。"},{"speaker":"Girl","text":"There's no Wi-Fi there?","audio":"d5d2810f780da59e51ff.mp3","zh":"女孩：那裡沒有無線網路嗎？"},{"speaker":"Boy","text":"No Wi-Fi, and my phone can't get a signal. I'll check my messages on Sunday night when we get home.","audio":"3820592ff8f7df5d67a3.mp3","zh":"男孩：沒有無線網路，我的手機也收不到訊號。我星期日晚上回到家的時候才會看訊息。"}],"question":{"text":"What does the boy mean by \"offline\"?","audio":"591ce52a7e932b996a55.mp3","zh":"男孩說的 \"offline\" 是什麼意思？"},"options":{"A":{"text":"Very busy with homework.","letterAudio":"93138ad65b3704914636.mp3","audio":"c5cfc6ed49ab5f2cbed5.mp3","zh":"忙著寫功課。","letterEnd":0.537},"B":{"text":"Not connected to the Internet.","letterAudio":"609555d8760f27caf21b.mp3","audio":"eca431c89c3f0f11e34d.mp3","zh":"沒有連上網路。","letterEnd":0.588},"C":{"text":"Away from his family.","letterAudio":"9756927a5f3791737934.mp3","audio":"43df4219b64bdb5732c3.mp3","zh":"離開家人。","letterEnd":0.713}},"answer":"B","keyLines":[],"evidence":"男孩說他整個週末都會 offline，因為要去山上露營，那裡沒有無線網路、手機也收不到訊號，要到星期日晚上回家才會看訊息。可知 offline 是沒有連上網路，也就是離線。","zhCorrect":"29c3c61dd37298b253eb.mp3","enText":"The answer is B. Not connected to the Internet. The boy will be camping in the mountains all weekend. There is no Wi-Fi there, and his phone can't get a signal. He will check his messages when he gets home. So when the boy says offline, he means not connected to the Internet.","enAudio":"8345d180b39908bd62e9.mp3","wrong":{"A":{"text":"A男孩沒有提到功課，他是因為去山上露營才沒辦法看訊息。","audio":"8bea112cb769cf3f79fa.mp3"},"C":{"text":"C原文沒有提到家人；男孩會 offline，是因為山上沒有無線網路、手機也收不到訊號，與是否和家人在一起無關。","audio":"23b847a54920113825e1.mp3"}}},{"id":"L093-Q16","type":"言談理解","point":"說話者意見","unit":"U03｜核心單字「動詞」｜教材印刷頁 p.51｜核心編號45 like；U01｜核心單字「形容詞」｜教材印刷頁 pp.10～11｜核心編號109 new；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號41 shop；U04｜核心單字「食物：一般視為不可數」｜教材印刷頁 p.70｜核心編號13 tea；U09｜核心單字「副詞、連接詞、介系詞、代名詞與形容詞」｜教材印刷頁 pp.183～203｜核心編號64 true；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號59 get；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號57 start、55 own；U09｜核心單字「連綴動詞與其他動詞」｜教材印刷頁 pp.183～203｜核心編號46 taste；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號128 now；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U04｜核心單字「形容詞與其他用法」｜教材印刷頁 p.72｜核心編號66 easy；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號88 wash、83 use；U10｜核心單字「動詞」｜教材印刷頁 p.205｜核心編號45 make","difficulty":"中","numberAudio":"e699ec0cba9220192738.mp3","passage":[{"speaker":"Boy","text":"Do you like the paper straws at the new tea shop? They're better for the ocean.","audio":"abfb84a3a6d2f38b550c.mp3","zh":"男孩：你喜歡那家新茶飲店的紙吸管嗎？紙吸管對海洋比較好。"},{"speaker":"Girl","text":"That's true. But after ten minutes, mine got soft and bent, and my milk tea started to taste like paper.","audio":"7030c54157bd3e1ef5cd.mp3","zh":"女孩：那是真的。可是十分鐘以後，我的吸管就變軟、彎掉了，我的奶茶也開始有紙的味道。"},{"speaker":"Boy","text":"So what do you do now?","audio":"b0a537c2d05eb270522e.mp3","zh":"男孩：那你現在怎麼辦？"},{"speaker":"Girl","text":"I bring my own metal straw. It's easy to wash.","audio":"ab1dc3bee8cd2fdc9f8c.mp3","zh":"女孩：我自己帶金屬吸管。它很好洗。"}],"question":{"text":"What does the girl think about the paper straws?","audio":"3b68e152e397f127b314.mp3","zh":"女孩覺得紙吸管怎麼樣？"},"options":{"A":{"text":"They are not nice to use.","letterAudio":"93138ad65b3704914636.mp3","audio":"820753c68bb0cccb6de0.mp3","zh":"它們不好用。","letterEnd":0.537},"B":{"text":"They are easy to wash.","letterAudio":"609555d8760f27caf21b.mp3","audio":"c1e8bc225bc5cc41e4a3.mp3","zh":"它們很好洗。","letterEnd":0.588},"C":{"text":"They make tea taste better.","letterAudio":"9756927a5f3791737934.mp3","audio":"23a1d1f2d9474d3a5a0c.mp3","zh":"它們讓茶更好喝。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"女孩說紙吸管十分鐘後就變軟、彎掉，奶茶還有紙的味道，現在她自己帶金屬吸管，可見她覺得紙吸管不好用。","zhCorrect":"3a021ac152930203394d.mp3","enText":"The answer is A. They are not nice to use. The boy says paper straws are better for the ocean. The girl says her paper straw got soft and bent after ten minutes, and her milk tea started to taste like paper. Now the girl brings her own metal straw. So the girl thinks the paper straws are not nice to use.","enAudio":"aae4753ac3407a909a6b.mp3","wrong":{"B":{"text":"B很好洗的是女孩自己帶的金屬吸管，不是紙吸管。","audio":"65f1a91dfa6bcb201b05.mp3"},"C":{"text":"C女孩說紙吸管讓奶茶有紙的味道，與「讓茶更好喝」相反。","audio":"58f6730ce7290d80e836.mp3"}}},{"id":"L093-Q17","type":"言談理解","point":"明確訊息","unit":"U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號59 ask、57 cost、55 wear；U05｜主單字表「動詞」｜教材印刷頁 p.90｜核心編號62 call；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號31 trip；U08｜核心單字「交通工具」｜教材印刷頁 p.152｜核心編號40 bus；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號37 leave；U01｜核心單字「介系詞與禮貌用語」｜教材印刷頁 p.11｜核心編號134 please；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號40 hundred、31 lunch；U04｜核心單字「其他名詞」｜教材印刷頁 pp.71～72｜核心編號44 dollar；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U05｜主單字表「其他名詞」｜教材印刷頁 p.89｜核心編號24 money；U11｜核心單字「動詞」｜教材印刷頁 p.223｜核心編號38 bring；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號100 some；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too；U07｜核心單字「其他名詞」｜教材印刷頁 pp.134～135｜核心編號16 clothes","difficulty":"中","numberAudio":"eaf86862f17dfecbff4c.mp3","passage":[{"speaker":null,"text":"Hi, Ben. This is Tony, our class leader. Ms. Wu asked me to call everyone about Friday's trip to the science park. The bus leaves at eight, so please be at school by seven forty. The trip costs three hundred dollars. Please give the money to me, not to Ms. Wu , by Wednesday. We'll have lunch at the café in the science park, so bring some money for that, too. And wear your P.E. clothes, not your school uniform. See you tomorrow!","audio":"2876b13a8eff7f1c1fd1.mp3","zh":"嗨，Ben。我是我們的班長 Tony。Ms. Wu 請我打電話通知每個人星期五去科學園區的校外教學。遊覽車八點出發，所以請在七點四十分以前到學校。校外教學要三百元。請在星期三以前把錢交給我，不是交給Ms. Wu。我們會在科學園區的咖啡廳吃午餐，所以也要帶一些錢買午餐。還有，請穿體育服，不要穿制服。明天見！"}],"question":{"text":"Who should Ben give the three hundred dollars to?","audio":"fa4f61c4087fa94f974e.mp3","zh":"Ben 應該把三百元交給誰？"},"options":{"A":{"text":"Ms. Wu.","letterAudio":"93138ad65b3704914636.mp3","audio":"341e471067897900dbe7.mp3","zh":"Ms. Wu。","letterEnd":0.537},"B":{"text":"The café in the science park.","letterAudio":"609555d8760f27caf21b.mp3","audio":"0c29db444f8e3381f115.mp3","zh":"科學園區的咖啡廳。","letterEnd":0.588},"C":{"text":"Tony.","letterAudio":"9756927a5f3791737934.mp3","audio":"83019bc48d3c576357a0.mp3","zh":"Tony。","letterEnd":0.713}},"answer":"C","keyLines":[0],"evidence":"Tony 說「Please give the money to me, not to Ms. Wu」，所以 Ben 應該把三百元交給 Tony。","zhCorrect":"602f770c1a3c81c2b958.mp3","enText":"The answer is C. Tony. Tony says the trip costs three hundred dollars. He asks Ben to give the money to him, not to Ms. Wu , by Wednesday. Lunch money is for the café. So Ben should give the three hundred dollars to Tony.","enAudio":"1c9fc538c2a6bc084db4.mp3","wrong":{"A":{"text":"A Tony 說錢要交給他，不是交給Ms. Wu。","audio":"9985ed7de3e0bbeaa40d.mp3"},"B":{"text":"B咖啡廳的錢是另外帶去買午餐的，不是校外教學的三百元。","audio":"fa11d7405d24f3e685c2.mp3"}}},{"id":"L093-Q18","type":"言談理解","point":"整體訊息","unit":"U02｜核心單字「時間、星期、月份與節日」｜教材印刷頁 pp.29～30｜核心編號5 night；U02｜核心單字「介系詞」｜教材印刷頁 p.33｜核心編號118 before；U01｜核心單字「家人與親屬」｜教材印刷頁 p.7｜核心編號13 cousin；U06｜核心單字｜教材印刷頁 pp.117～120｜核心編號52 think；U01｜核心單字「副詞與相關用字」｜教材印刷頁 p.11｜核心編號124 too、128 now；U04｜核心單字「動詞」｜教材印刷頁 p.72｜核心編號52 want；U03｜核心單字「其他名詞」｜教材印刷頁 p.51｜核心編號34 trouble、39 side、41 centimeter；U08｜核心單字「動詞」｜教材印刷頁 p.153｜核心編號64 cut、59 ask；U02｜核心單字「地方名稱」｜教材印刷頁 p.30｜核心編號44 bathroom；U08｜核心單字「形容詞、副詞、介系詞與代名詞」｜教材印刷頁 pp.153～154｜核心編號75 left；U02｜核心單字「形容詞與數量用語」｜教材印刷頁 p.32｜核心編號96 right；U03｜核心單字「副詞」｜教材印刷頁 p.53｜核心編號82 then、74 always；U02｜核心單字「副詞與相關用字」｜教材印刷頁 p.32｜核心編號114 only；U05｜主單字表「形容詞、副詞與代名詞」｜教材印刷頁 pp.90～91｜核心編號69 just；U07｜核心單字「動詞」｜教材印刷頁 pp.135～136｜核心編號47 laugh；U02｜核心單字「動詞」｜教材印刷頁 p.31｜核心編號85 give；U08｜核心單字「服飾與配件」｜教材印刷頁 pp.151～152｜核心編號23 hat；U01｜核心單字「動詞」｜教材印刷頁 pp.9～10｜核心編號95 go","difficulty":"中","numberAudio":"a59239c9b04974676db1.mp3","passage":[{"speaker":null,"text":"Last spring, the night before my cousin's wedding, I thought my bangs were too long. I didn't want to trouble my mom, so I cut them myself in the bathroom. First the left side was shorter, so I cut the right side. Then the right side was shorter. In the end, my bangs were only one centimeter long! I wanted to stay home, but my mom just laughed and gave me a hat. At the wedding, my cousin even asked me to take a photo with her. Now I always go to the hair salon.","audio":"7e1a7e1508d01f6119ff.mp3","zh":"去年春天，在我表姊（堂姊等）婚禮的前一晚，我覺得我的瀏海太長了。我不想麻煩我媽媽，所以就自己在浴室裡剪。一開始左邊比較短，所以我剪右邊。然後右邊又比較短了。最後，我的瀏海只剩一公分長！我想待在家裡，可是我媽媽只是笑了笑，給了我一頂帽子。在婚禮上，我表姊（堂姊等）甚至請我和她一起拍照。現在我都會去美髮店剪頭髮。"}],"question":{"text":"What is the speaker mainly talking about?","audio":"71dae5b7723fd5c946f5.mp3","zh":"說話者主要在談什麼？"},"options":{"A":{"text":"A haircut that went wrong.","letterAudio":"93138ad65b3704914636.mp3","audio":"26fa6de6e34897317b5f.mp3","zh":"一次剪壞的頭髮。","letterEnd":0.537},"B":{"text":"The speaker's cousin's wedding.","letterAudio":"609555d8760f27caf21b.mp3","audio":"3802ab6de2ef308c693d.mp3","zh":"說話者表姊（堂姊等）的婚禮。","letterEnd":0.588},"C":{"text":"A hat from the speaker's mom.","letterAudio":"9756927a5f3791737934.mp3","audio":"749ffa0d54f542b1b36e.mp3","zh":"說話者媽媽給的一頂帽子。","letterEnd":0.713}},"answer":"A","keyLines":[],"evidence":"說話者在表姊（堂姊等）婚禮前一晚自己剪瀏海，左右輪流剪，最後只剩一公分，媽媽給了一頂帽子，現在都去美髮店剪。整段在談一次剪壞的頭髮。","zhCorrect":"2fd7135f291f86d177ae.mp3","enText":"The answer is A. A haircut that went wrong. The night before the wedding of the speaker's cousin, the speaker cut the speaker's own bangs. First the left side was shorter, then the right side was shorter, and in the end the bangs were only one centimeter long. Now the speaker always goes to the hair salon. The talk is about a haircut that went wrong.","enAudio":"5f5f65a45ab2f5aab31e.mp3","wrong":{"B":{"text":"B婚禮只是這件事發生的時間，不是整段的主旨。","audio":"a3285205a78e5552c386.mp3"},"C":{"text":"C帽子是媽媽在瀏海剪壞以後給的，只是其中一個細節。","audio":"c20ab122e07f6b22de98.mp3"}}}]}</script>
  <script>
    'use strict';
    const BANK = JSON.parse(document.getElementById('bank-data').textContent);
    const AUDIO_BASE = "audio/L093/";
    const HOME = "./";
    const REPORT_URL = "https://script.google.com/macros/s/AKfycbx2tFuJpOCA37StHVMaVtLLYnt8T_GFauh9qK9xJeU6xCfhHd154W95X6hH_3ObQGuWwg/exec";  // teacher's Google Apps Script endpoint; null = reporting off
    const P = BANK.pauses;
    const $ = id => document.getElementById(id);
    const answerButtons = [...document.querySelectorAll('[data-answer]')];
    document.querySelectorAll('.bear-slot').forEach(slot => slot.replaceWith($('bearArt').content.cloneNode(true)));
    function setMood(mood) {
      document.querySelectorAll('.bear').forEach(bear => {
        bear.dataset.mood = mood;
        bear.style.animation = 'none'; void bear.getBoundingClientRect(); bear.style.animation = '';  // replay the hop
      });
    }
    function renderDots() {
      const dots = $('dots');
      dots.replaceChildren();
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      order.forEach((index, i) => {
        const dot = document.createElement('i');
        const done = record.find(a => a.id === BANK.questions[index].id);
        dot.className = done ? (done.correct ? 'right' : 'wrong') : (i === cursor ? 'now' : '');
        dots.appendChild(dot);
      });
    }
    const CANCEL = Symbol('cancel');
    const audio = new Audio();
    audio.preload = 'auto';

    let order = [], cursor = 0, session = null, mode = 'first';
    let token = 0, paused = false, accepting = false, abortClip = null;

    $('badge').textContent = '🎧 基本問答 8 題＋言談理解 10 題' + (BANK.status === '待 Live 試用' ? ' · 試用版' : '');
    $('badge').title = `${BANK.volume} ${BANK.version}`;
    $('title').textContent = `第${BANK.number}回英文聽力`;
    document.title = `第${BANK.number}回英文聽力｜MP3 練習`;

    const PREF_KEY = 'listening-player-prefs';
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { prefs = {}; }
    const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} };
    for (const id of ['mode', 'rate', 'lang']) {
      if (prefs[id]) $(id).value = prefs[id];
      $(id).addEventListener('change', () => { prefs[id] = $(id).value; savePrefs(); if (id === 'mode') describeMode(); });
    }
    let showZh = Boolean(prefs.showZh);
    let listenMode = $('mode').value;
    function describeMode() {
      $('intro').textContent = $('mode').value === 'exam'
        ? '會考模式：和真正的會考一樣，A／B／C 選項印在畫面上，先有幾秒讀選項，接著播題號、原文兩次、英文問題兩次（基本問答沒有），選項不唸出來。播完才可作答。'
        : '磨耳朵模式：選項不顯示，改成唸出來。每題播題號、原文兩次、英文問題兩次（基本問答沒有）、A／B／C 各兩次。播完才可作答。';
    }
    describeMode();

    // Completion records live in this browser only; the site's index page reads the same key.
    const RECORD_KEY = 'listening-records-v1';
    const NAME_KEY = 'listening-student-name';
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const loadRecords = () => { try { return JSON.parse(readStore(RECORD_KEY)) || {}; } catch { return {}; } };
    const modeName = m => m === 'exam' ? '會考模式' : '磨耳朵模式';
    const when = iso => new Date(iso).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    function saveRecord() {
      const all = loadRecords();
      const list = all[BANK.volume] || [];
      const record = {
        finishedAt: session.finishedAt, student: readStore(NAME_KEY) || '', version: BANK.version, mode: session.listenMode,
        correct: session.answers.filter(a => a.correct).length, total: session.answers.length,
        answers: session.answers.map(({ id, picked, correct, replays }) => ({ id, picked, correct, replays })),
        retry: session.retry.map(({ id, picked, correct }) => ({ id, picked, correct })),
      };
      const at = list.findIndex(r => r.finishedAt === record.finishedAt);
      if (at >= 0) list[at] = record; else list.push(record);
      all[BANK.volume] = list;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(all)); return true; } catch { return false; }
    }
    function showPast() {
      const list = loadRecords()[BANK.volume] || [];
      const last = list[list.length - 1];
      $('past').hidden = !last;
      if (last) $('past').textContent = `✅ 你已經完成過這一回 ${list.length} 次。上次：${when(last.finishedAt)}，${modeName(last.mode)}，首次答對 ${last.correct}／${last.total} 題。`;
      const body = $('history');
      body.replaceChildren();
      for (const r of [...list].reverse()) {
        const tr = document.createElement('tr');
        const retry = r.retry.length ? `${r.retry.filter(a => a.correct).length}／${r.retry.length}` : '—';
        for (const text of [when(r.finishedAt), modeName(r.mode), `${r.correct}／${r.total}`, retry]) {
          const td = document.createElement('td'); td.textContent = text; tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }
    if (HOME) { $('home').href = HOME; $('home').hidden = false; }
    $('playerName').value = readStore(NAME_KEY) || '';
    $('playerName').addEventListener('input', () => {
      try { localStorage.setItem(NAME_KEY, $('playerName').value.trim().slice(0, 20)); } catch {}
    });
    showPast();

    // Optional reporting to the teacher's Google Sheet. Unsent reports wait in an outbox and retry on the next visit.
    const OUTBOX_KEY = 'listening-outbox', DEVICE_KEY = 'listening-device-id';
    function deviceId() {
      let id = readStore(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 10); try { localStorage.setItem(DEVICE_KEY, id); } catch {} }
      return id;
    }
    const loadOutbox = () => { try { return JSON.parse(readStore(OUTBOX_KEY)) || []; } catch { return []; } };
    const saveOutbox = list => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} };
    async function flushOutbox() {
      if (!REPORT_URL) return true;
      const pending = loadOutbox();
      const left = [];
      for (const item of pending) {
        try { await fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) }); }
        catch { left.push(item); }
      }
      saveOutbox(left);
      return left.length === 0;
    }
    async function report() {
      if (!REPORT_URL) return null;
      const first = session.answers;
      saveOutbox([...loadOutbox(), {
        student: readStore(NAME_KEY) || '未署名', device: deviceId(), volume: BANK.volume, number: BANK.number,
        finishedAt: session.finishedAt, mode: modeName(session.listenMode), correct: first.filter(a => a.correct).length, total: first.length,
        wrong: first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2))).join('、'),
        replays: first.reduce((s, a) => s + a.replays, 0),
      }]);
      return flushOutbox();
    }
    flushOutbox();

    const current = () => BANK.questions[order[cursor]];
    const status = text => { $('status').textContent = text; };
    const setAnswers = on => { answerButtons.forEach(b => b.disabled = !on); accepting = on; };

    function stop() {
      token++;
      audio.pause();
      if (abortClip) { const a = abortClip; abortClip = null; a(CANCEL); }
    }
    function sleep(ms, t) {
      return new Promise((resolve, reject) => {
        let left = ms;
        const tick = () => {
          if (t !== token) return reject(CANCEL);
          if (!paused) left -= 50;
          if (left <= 0) return resolve();
          setTimeout(tick, 50);
        };
        tick();
      });
    }
    function clip(file, t, stopAt) {
      return new Promise((resolve, reject) => {
        if (t !== token) return reject(CANCEL);
        let timer = null;
        const clear = () => { clearTimeout(timer); audio.onplaying = audio.onpause = null; };
        abortClip = err => { clear(); reject(err); };
        audio.src = AUDIO_BASE + file;
        audio.playbackRate = Number($('rate').value);
        if (stopAt) {
          // Cut off the clip's trailing silence; re-armed after a pause/resume.
          const arm = () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              if (t !== token) return;
              if (audio.currentTime < stopAt - 0.03) return arm();
              clear(); abortClip = null; audio.pause(); resolve();
            }, Math.max(0, (stopAt - audio.currentTime) / audio.playbackRate * 1000));
          };
          audio.onplaying = arm;
          audio.onpause = () => clearTimeout(timer);
        }
        audio.onended = () => { clear(); abortClip = null; resolve(); };
        audio.onerror = () => { clear(); abortClip = null; reject(new Error(`找不到或無法播放音檔：${file}`)); };
        audio.play().catch(err => { if (!paused && t === token && err.name !== 'AbortError') { abortClip = null; reject(err); } });
      });
    }
    async function run(steps) {
      stop();
      const t = token;
      try {
        for (const step of steps) {
          if (typeof step === 'number') await sleep(step, t);
          else if (typeof step === 'function') step();
          else if (typeof step === 'object') await clip(step.file, t, step.until);
          else await clip(step, t);
        }
        return true;
      } catch (err) {
        if (err === CANCEL) return false;
        status('');
        $('status').innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.textContent = `${err.message}。請確認「音檔」資料夾與這個網頁放在原本的相對位置，不要單獨搬走網頁。`;
        $('status').appendChild(box);
        $('replay').disabled = false;
        return false;
      }
    }

    const letterStep = o => ({ file: o.letterAudio, until: o.letterEnd + 0.12 });
    function questionSteps(q, preview) {
      const steps = [];
      if (preview && listenMode === 'exam') {
        // Reading time comes before the question number, like turning to the item in the test booklet.
        for (let left = Math.ceil(P.preview_options / 1000); left > 0; left--) {
          steps.push(() => status(`先看一下 A／B／C 選項…${left}`), Math.min(1000, P.preview_options - (left - 1) * 1000));
        }
      }
      steps.push(() => status('播放中，請仔細聽。'), q.numberAudio, P.after_number);
      for (let round = 0; round < 2; round++) {
        q.passage.forEach((line, i) => { steps.push(line.audio); if (i < q.passage.length - 1) steps.push(P.between_lines); });
        steps.push(round === 0 ? P.between_repeats : P.after_passage);
      }
      if (q.question) steps.push(q.question.audio, P.between_repeats, q.question.audio, P.after_passage);
      if (listenMode === 'exam') return steps;
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        steps.push(letterStep(o), P.after_letter, o.audio, P.between_lines, letterStep(o), P.after_letter, o.audio, P.between_options);
      }
      return steps;
    }
    function feedbackSteps(q, picked) {
      const lang = $('lang').value, steps = [picked === q.answer ? BANK.common.correct : BANK.common.wrong, 400];
      if (lang !== 'en') {
        if (picked !== q.answer) steps.push(q.wrong[picked].audio, 500);
        steps.push(q.zhCorrect, 600);
      }
      if (lang !== 'zh') steps.push(q.enAudio);
      return steps;
    }

    async function playQuestion(preview = false) {
      const q = current();
      paused = false;
      $('pause').textContent = '暫停';
      $('pause').disabled = false;
      $('replay').disabled = true;
      setAnswers(false);
      status(listenMode === 'exam' ? '先看一下 A／B／C 選項，播放開始後仔細聽。' : '播放中，請仔細聽。');
      setMood('listening');
      if (await run(questionSteps(q, preview))) {
        $('replay').disabled = false;
        setMood('idle');
        setAnswers(true);
        status('請按 A、B 或 C（也可以用鍵盤）。');
      }
    }
    function showQuestion() {
      const q = current();
      $('stage').hidden = false;
      $('finished').hidden = true;
      $('review').hidden = true;
      answerButtons.forEach(b => b.classList.remove('chosen'));
      renderDots();
      const label = mode === 'retry' ? '錯題重練' : '首次作答';
      $('progress').textContent = `第 ${BANK.number} 回 · ${label} · 第 ${cursor + 1}／${order.length} 題`;
      $('heading').textContent = `Question ${Number(q.id.slice(-2))}`;
      const booklet = $('booklet');
      booklet.replaceChildren();
      booklet.hidden = listenMode !== 'exam';
      if (listenMode === 'exam') for (const letter of ['A', 'B', 'C']) {
        const p = document.createElement('p');
        p.textContent = `(${letter}) ${q.options[letter].text}`;
        booklet.appendChild(p);
      }
      playQuestion(true);
    }

    function renderReview(q, picked) {
      const right = picked === q.answer;
      const fb = $('feedback');
      fb.className = 'feedback' + (right ? '' : ' wrong');
      fb.replaceChildren();
      const add = (tag, text) => { const p = document.createElement('p'); if (tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag + ' '; p.appendChild(s); } p.appendChild(document.createTextNode(text)); fb.appendChild(p); };
      add(right ? '🎉 答對了！' : '💪 差一點點！', `正確答案是 ${q.answer}. ${q.options[q.answer].text}`);
      if (!right) add(`你選 ${picked}：`, q.wrong[picked].text);
      add('為什麼：', q.evidence);
      add('English:', q.enText);
      add('考點：', `${q.type}｜${q.point}｜${q.unit}`);

      const tr = $('transcript');
      tr.replaceChildren();
      tr.classList.toggle('hide-zh', !showZh);
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<h3>聽到的內容（黃底是關鍵句，按 🔊 單獨重播）</h3><label><input type="checkbox" id="zhToggle"> 顯示中文翻譯</label>';
      tr.appendChild(head);
      const zhToggle = head.querySelector('#zhToggle');
      zhToggle.checked = showZh;
      zhToggle.addEventListener('change', () => { showZh = zhToggle.checked; prefs.showZh = showZh; savePrefs(); tr.classList.toggle('hide-zh', !showZh); });
      const addLine = (className, prefix, en, zh, clips) => {
        const p = document.createElement('p');
        p.className = 'line ' + className;
        const say = document.createElement('button');
        say.className = 'say';
        say.textContent = '🔊';
        say.setAttribute('aria-label', '重播這一句');
        say.addEventListener('click', () => run(clips));
        const body = document.createElement('div');
        if (prefix) { const s = document.createElement('span'); s.className = 'spk'; s.textContent = prefix; body.appendChild(s); }
        const e = document.createElement('span'); e.className = 'en'; e.textContent = en; body.appendChild(e);
        if (zh) { const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh; body.appendChild(z); }
        p.append(say, body);
        tr.appendChild(p);
      };
      q.passage.forEach((line, i) => addLine(q.keyLines.includes(i) ? 'key' : '', line.speaker ? line.speaker + ':' : '', line.text, line.zh, [line.audio]));
      if (q.question) addLine('', 'Q:', q.question.text, q.question.zh, [q.question.audio]);
      for (const letter of ['A', 'B', 'C']) {
        const o = q.options[letter];
        const cls = 'opt' + (letter === q.answer ? ' correct' : '') + (letter === picked && !right ? ' picked' : '');
        addLine(cls, `${letter}.`, o.text, o.zh, [letterStep(o), P.after_letter, o.audio]);
      }
      $('reportId').textContent = q.id;
      $('replayKey').hidden = q.keyLines.length === 0;
      $('review').hidden = false;
    }

    async function answer(letter) {
      if (!accepting || paused) return;
      const q = current();
      setAnswers(false);
      $('replay').disabled = true;
      answerButtons.find(b => b.dataset.answer === letter).classList.add('chosen');
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      record.push({ id: q.id, picked: letter, answer: q.answer, correct: letter === q.answer, type: q.type, point: q.point, unit: q.unit,
        replays: session.replays[q.id] || 0, answeredAt: new Date().toISOString() });
      renderReview(q, letter);
      renderDots();
      setMood(letter === q.answer ? 'happy' : 'oops');
      status('講解播放中；聽完可以重聽關鍵句，或按「下一題」。');
      if (await run(feedbackSteps(q, letter))) status('講解結束。按「下一題」繼續。');
    }

    function next() {
      stop();
      if (cursor + 1 < order.length) { cursor++; showQuestion(); return; }
      finish();
    }

    function finish() {
      stop();
      $('stage').hidden = true;
      $('finished').hidden = false;
      $('pause').disabled = true;
      $('replay').disabled = true;
      const first = session.answers;
      const right = first.filter(a => a.correct).length;
      let text = `首次作答 ${first.length} 題，答對 ${right} 題（${Math.round(right / first.length * 100)}%）。`;
      if (session.retry.length) {
        const fixed = session.retry.filter(a => a.correct).length;
        text += ` 錯題重練 ${session.retry.length} 題，答對 ${fixed} 題。`;
      }
      $('score').textContent = text;
      $('scoreBig').textContent = `${right} / ${first.length}`;
      $('stars').textContent = right >= 16 ? '⭐⭐⭐' : right >= 12 ? '⭐⭐' : '⭐';
      $('cheer').textContent = right === first.length ? '全對！小熊幫你拍拍手 👏'
        : right >= 16 ? '好厲害！只差一點點就全對了！'
        : right >= 12 ? '做得不錯！看看下面的錯題，再練一次會更好。'
        : '辛苦了！先把錯題重練一遍，小熊陪你慢慢來 🐻';
      setMood(right >= 12 ? 'happy' : 'idle');
      const firstFinish = !session.finishedAt;
      if (firstFinish) session.finishedAt = new Date().toISOString();
      const name = readStore(NAME_KEY);
      $('saved').textContent = saveRecord()
        ? `📅 完成時間：${when(session.finishedAt)}${name ? `（${name}）` : ''}。紀錄已存在這台裝置${HOME ? '，回到目錄就看得到' : ''}。`
        : `📅 完成時間：${when(session.finishedAt)}。這個瀏覽器不允許儲存紀錄（例如無痕模式），請按「下載作答紀錄」保存。`;
      showPast();
      // The record still goes to the teacher's sheet, but the student sees no notice about it:
      // students are told to copy the summary themselves as their check-in.
      if (firstFinish && REPORT_URL) report();

      const groups = new Map();
      for (const a of first) {
        const key = `${a.type}｜${a.point}`;
        const g = groups.get(key) || { right: 0, total: 0 };
        g.total++; if (a.correct) g.right++;
        groups.set(key, g);
      }
      const body = $('byPoint');
      body.replaceChildren();
      [...groups.entries()].sort((x, y) => x[1].right / x[1].total - y[1].right / y[1].total).forEach(([key, g]) => {
        const tr = document.createElement('tr');
        const pct = Math.round(g.right / g.total * 100);
        tr.innerHTML = '<td></td><td></td><td><div class="bar"><span></span></div></td>';
        tr.children[0].textContent = key;
        tr.children[1].textContent = `${g.right}／${g.total}`;
        tr.querySelector('.bar span').style.width = pct + '%';
        if (pct < 100) tr.querySelector('.bar span').style.background = 'var(--bad)';
        body.appendChild(tr);
      });

      const wrong = first.filter(a => !a.correct);
      const list = $('wrongList');
      list.replaceChildren();
      if (!wrong.length) { list.textContent = '全對，沒有錯題！'; }
      else {
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>題號</th><th>你選／正解</th><th>考點</th><th>課本出處</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const a of wrong) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td></td><td></td><td></td><td></td>';
          tr.children[0].textContent = a.id.slice(-3);
          tr.children[1].textContent = `${a.picked} → ${a.answer}`;
          tr.children[2].textContent = a.point;
          tr.children[3].textContent = a.unit;
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        list.appendChild(table);
      }
      $('retryWrong').disabled = !wrong.length;
      $('prompt').value = claudePrompt();
    }

    function claudePrompt() {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct);
      const lines = [
        `你是我的國中會考英聽家教。我剛做完第${BANK.number}回（${session.listenMode === 'exam' ? '會考模式' : '磨耳朵模式'}），${first.length} 題答對 ${first.length - wrong.length} 題。請用繁體中文陪我檢討錯題：`,
        '1. 一次只講一題：先問我當時聽到什麼、為什麼這樣選，等我回答再解釋。',
        '2. 最後告訴我錯題的共同原因，並出 3 題類似的題目給我練習（我作答後再公布答案）。',
        '下面的原文與選項來自題庫，請照原樣使用，不要改寫。',
        '',
      ];
      if (!wrong.length) lines.push('這回全對。請改為挑 3 題難度較高的題目，考我能不能說出答題關鍵句，再出 3 題進階類似題。', '');
      for (const a of wrong) {
        const q = BANK.questions.find(x => x.id === a.id);
        lines.push(`【第 ${Number(q.id.slice(-2))} 題｜${q.type}｜${q.point}】`);
        lines.push('原文：' + q.passage.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text).join(' / '));
        if (q.question) lines.push('問題：' + q.question.text);
        lines.push('選項：' + ['A', 'B', 'C'].map(k => `${k}. ${q.options[k].text}`).join('  '));
        lines.push(`我選 ${a.picked}，正解是 ${q.answer}。`);
        lines.push(`解析：${q.evidence} ${q.wrong[a.picked].text}`);
        lines.push('');
      }
      const weak = [...new Set(wrong.map(a => a.point))];
      if (weak.length) lines.push('錯題考點：' + weak.join('、'));
      return lines.join('\n');
    }

    function begin(newOrder, newMode) {
      // An inline field, not prompt(): a blocked pop-up must never stop the quiz from starting.
      if (REPORT_URL && newMode === 'first' && !readStore(NAME_KEY)) $('nameRow').hidden = false;
      order = newOrder; cursor = 0; mode = newMode;
      listenMode = $('mode').value;
      if (newMode === 'first') session = { volume: BANK.volume, version: BANK.version, sourceSha256: BANK.sourceSha256, listenMode,
        startedAt: new Date().toISOString(), answers: [], retry: [], replays: {} };
      else session.retry = [];
      $('start').textContent = '重新開始';
      showQuestion();
    }

    $('start').addEventListener('click', () => {
      if (session && session.answers.length && !confirm('要從第 1 題重新開始嗎？尚未下載的作答紀錄會被取代。')) return;
      begin(BANK.questions.map((_, i) => i), 'first');
    });
    $('restart').addEventListener('click', () => $('start').click());
    $('retryWrong').addEventListener('click', () => {
      const ids = session.answers.filter(a => !a.correct).map(a => a.id);
      begin(BANK.questions.map((q, i) => ids.includes(q.id) ? i : -1).filter(i => i >= 0), 'retry');
    });
    $('replay').addEventListener('click', () => {
      if (!session || $('replay').disabled) return;
      const q = current();
      session.replays[q.id] = (session.replays[q.id] || 0) + 1;
      playQuestion();
    });
    $('pause').addEventListener('click', () => {
      if (!paused) { paused = true; audio.pause(); $('pause').textContent = '繼續'; status('已暫停。'); }
      else { paused = false; $('pause').textContent = '暫停'; if (abortClip) audio.play().catch(() => {}); status('繼續播放。'); }
    });
    $('replayKey').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.keyLines.forEach(i => steps.push(q.passage[i].audio, P.between_lines));
      status('重聽關鍵句。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayPassage').addEventListener('click', () => {
      const q = current();
      const steps = [];
      q.passage.forEach(line => steps.push(line.audio, P.between_lines));
      status('重聽原文（一次）。');
      run(steps).then(done => done && status('可以再聽一次，或按「下一題」。'));
    });
    $('replayFeedback').addEventListener('click', () => {
      const record = session[mode === 'retry' ? 'retry' : 'answers'];
      const last = record[record.length - 1];
      status('重播講解。');
      run(feedbackSteps(current(), last.picked)).then(done => done && status('講解結束。按「下一題」繼續。'));
    });
    $('next').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C'].includes(k)) answer(k);
    });
    answerButtons.forEach(b => b.addEventListener('click', () => answer(b.dataset.answer)));
    $('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ student: readStore(NAME_KEY) || '', ...session }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${BANK.volume}_作答紀錄_${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $('copyTeacher').addEventListener('click', async () => {
      const first = session.answers;
      const wrong = first.filter(a => !a.correct).map(a => 'Q' + Number(a.id.slice(-2)));
      const lines = [`🎧 ${readStore(NAME_KEY) || '未署名'}｜${when(session.finishedAt)}`,
        `第${BANK.number}回 ${first.length - wrong.length}/${first.length}（${modeName(session.listenMode)}）${wrong.length ? '錯：' + wrong.join('、') : '全對💯'}`];
      if (session.retry.length) lines.push(`錯題重練 ${session.retry.filter(a => a.correct).length}/${session.retry.length}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); $('copyNote').textContent = '已複製，貼到 LINE 傳給老師就好。'; }
      catch { $('copyNote').textContent = lines.join(' ／ '); }
    });
    $('copyPrompt').addEventListener('click', async () => {
      const text = $('prompt').value;
      try { await navigator.clipboard.writeText(text); $('copyNote').textContent = '已複製。打開 ChatGPT 貼上就可以開始檢討；也可以開語音模式，讓 ChatGPT 用說的講解。'; }
      catch { $('prompt').closest('details').open = true; $('prompt').select(); $('copyNote').textContent = '無法自動複製，請展開下方內容手動複製（Ctrl+C）。'; }
    });
  </script>
</body>
</html>
